<!doctype html>
<!--
  Google ile giriş testi (yalnızca geliştirme). Google'dan bir ID token alır ve
  onu nonce ile birlikte gösterir; API'ye isteği terminalden curl atar.
  Çalıştırma: tools/google-giris-testi/calistir.sh (http://localhost:3000)
  Token kısa ömürlüdür (yaklaşık 1 saat) ve yalnızca bu tek girişte geçerlidir;
  yine de kimseyle paylaşma.
-->
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tayfam giriş testi</title>
<style>
  body { font: 15px/1.5 system-ui, sans-serif; max-width: 760px; margin: 32px auto; padding: 0 16px; }
  textarea { width: 100%; height: 160px; font: 12px monospace; }
  code { background: #f2f2f2; padding: 2px 4px; }
</style>
<script src="https://accounts.google.com/gsi/client" async></script>
</head>
<body>
<h1>Tayfam giriş testi</h1>
<p>Google ile giriş yap; ardından aşağıdaki komutu terminalde çalıştır.</p>
<div id="g_id_onload_target"></div>
<div id="buton"></div>
<h2>curl komutu</h2>
<textarea id="komut" readonly placeholder="Girişten sonra burada görünecek"></textarea>
<script>
  const CLIENT_ID = '73439258394-uhd9m0b6mkc5k8eaoup6kgh57a49on4t.apps.googleusercontent.com';
  const API = 'https://api-dev.tayfam.app';
  // Her yüklemede yeni, tahmin edilemez bir nonce (ADR-0004).
  const nonce = Array.from(crypto.getRandomValues(new Uint8Array(24)), b => b.toString(16).padStart(2, '0')).join('');
  function girisYapildi(resp) {
    const body = JSON.stringify({provider: 'google', id_token: resp.credential, nonce, platform: 'android'});
    document.getElementById('komut').value =
      `curl -sS -X POST ${API}/v1/auth/sign-in -H 'Content-Type: application/json' -H 'X-Tayfam-Client: android' -d '${body}'`;
  }
  window.onload = () => {
    google.accounts.id.initialize({client_id: CLIENT_ID, nonce, callback: girisYapildi, auto_select: false});
    google.accounts.id.renderButton(document.getElementById('buton'), {theme: 'outline', size: 'large', locale: 'tr'});
  };
</script>
</body>
</html>
