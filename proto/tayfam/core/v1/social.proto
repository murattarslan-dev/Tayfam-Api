syntax = "proto3";

package tayfam.core.v1;

import "google/protobuf/timestamp.proto";
import "tayfam/core/v1/availability.proto";

// SocialService holds friendships and blocks (issue #71; data model v14
// "Arkadaşlık ve Davet (v11)", "Mesaj İsteği Modeli (v7)"; ADR-0009).
//
// Every method needs the caller's access token; the caller is always the
// verified token subject, and every list is the caller's own: nobody sees
// another user's friends, requests or blocks. user_id fields are UUID
// strings (ERROR_REASON_VALIDATION otherwise, also for the caller's own ID).
//
// A block in either direction makes the other user look unknown
// (ERROR_REASON_USER_NOT_FOUND), the same as a user who does not exist:
// nobody learns that they were blocked.
//
// Paging: page_size 0 means 50; values above 100 are treated as 100;
// negative values are ERROR_REASON_VALIDATION. page_token is opaque and only
// valid for the same method and request fields. An empty next_page_token
// means the last page.
service SocialService {
  // SendFriendRequest asks user_id to be the caller's friend. If that user's
  // request to the caller is already waiting, it is accepted instead
  // (FRIEND_STATE_FRIENDS). At most 20 requests per caller in 24 hours,
  // counted in the database; declined requests still count. Emits
  // friend.requested or friend.accepted (IDs only) for the notification.
  //
  // Errors: ERROR_REASON_USER_NOT_FOUND, ERROR_REASON_ALREADY_FRIENDS,
  // ERROR_REASON_FRIEND_REQUEST_PENDING, ERROR_REASON_FRIEND_REQUEST_LIMIT.
  rpc SendFriendRequest(SendFriendRequestRequest) returns (SendFriendRequestResponse);
  // AcceptFriendRequest accepts user_id's request waiting for the caller.
  // Emits friend.accepted.
  //
  // Errors: ERROR_REASON_FRIEND_REQUEST_NOT_FOUND.
  rpc AcceptFriendRequest(AcceptFriendRequestRequest) returns (AcceptFriendRequestResponse);
  // RemoveFriendship deletes whatever there is between the caller and
  // user_id: a friendship, the caller's request, or user_id's request
  // (declining it). Nobody is told. Removing nothing succeeds.
  rpc RemoveFriendship(RemoveFriendshipRequest) returns (RemoveFriendshipResponse);
  // ListFriends lists the caller's friends, highest friendship score first,
  // by user ID among equals (ADR-0030 §12). The score is in no field and not
  // in next_page_token; it counts only while both sides have profiling on.
  rpc ListFriends(ListFriendsRequest) returns (ListFriendsResponse);
  // ListFriendRequests lists requests waiting for the caller (INCOMING) or
  // sent by the caller (OUTGOING).
  rpc ListFriendRequests(ListFriendRequestsRequest) returns (ListFriendRequestsResponse);

  // BlockUser blocks user_id. The friendship or waiting request between the
  // two is deleted at once. Blocking again succeeds and changes nothing.
  //
  // Errors: ERROR_REASON_USER_NOT_FOUND (no such live user).
  rpc BlockUser(BlockUserRequest) returns (BlockUserResponse);
  // UnblockUser removes the caller's block. The friendship does not come
  // back. Removing a block that is not there succeeds.
  rpc UnblockUser(UnblockUserRequest) returns (UnblockUserResponse);
  // ListBlockedUsers lists the users the caller blocked. Who blocked the
  // caller is never listed.
  rpc ListBlockedUsers(ListBlockedUsersRequest) returns (ListBlockedUsersResponse);

  // GetRequestResolutions answers, for the caller as the recipient, how
  // friend requests, tayfa invitations and friend suggestions stand now
  // (issue #192, #208): chat asks it for one page of FRIEND_REQUEST,
  // TAYFA_INVITATION and FRIEND_SUGGESTION notifications with the caller's
  // own token. One answer per ref, in the same order;
  // 1–100 refs (ERROR_REASON_VALIDATION otherwise). Who withdrew is never
  // said.
  rpc GetRequestResolutions(GetRequestResolutionsRequest) returns (GetRequestResolutionsResponse);

  // Friend suggestions (issue #208, ADR-0030). A daily job suggests, at most
  // once a week, someone the caller attended at least three events with
  // and is not friends with. The friendship score behind it is never
  // returned by any method, nor how many events were shared.

  // ListFriendSuggestions lists the caller's open suggestions of the last
  // 30 days, newest first, at most 10. A suggestion leaves the list when
  // the two become friends or one sends a request, when either blocks or
  // reports the other, declines the other's request or ends a friendship
  // with them (these exclude the pair for good), when the suggested user
  // turns off profiling, turns on hide_from_suggestions or deletes their
  // account, or when the caller dismisses it. Empty while the caller's
  // profiling is off.
  rpc ListFriendSuggestions(ListFriendSuggestionsRequest) returns (ListFriendSuggestionsResponse);
  // DismissFriendSuggestion closes the caller's suggestion of user_id
  // ("Kapat"): the two are never suggested to each other again. Succeeds
  // when there is no such suggestion and changes nothing then.
  rpc DismissFriendSuggestion(DismissFriendSuggestionRequest) returns (DismissFriendSuggestionResponse);
  // GetSocialSettings returns the caller's profiling settings; defaults
  // when the caller never changed them.
  rpc GetSocialSettings(GetSocialSettingsRequest) returns (GetSocialSettingsResponse);
  // UpdateSocialSettings changes the fields that are set (at least one;
  // ERROR_REASON_VALIDATION otherwise). Turning profiling off deletes the
  // caller's friendship scores and withdraws the open suggestions to and
  // of the caller at once; turning hide_from_suggestions on withdraws the
  // open suggestions of the caller. Switching a setting off and on resets
  // neither the weekly limit nor who was already suggested.
  rpc UpdateSocialSettings(UpdateSocialSettingsRequest) returns (UpdateSocialSettingsResponse);
}

// FriendState is a friendship as the caller sees it.
enum FriendState {
  FRIEND_STATE_UNSPECIFIED = 0;
  FRIEND_STATE_FRIENDS = 1;
  // The other user's request waits for the caller.
  FRIEND_STATE_INCOMING = 2;
  // The caller's request waits for the other user.
  FRIEND_STATE_OUTGOING = 3;
}

enum RequestDirection {
  REQUEST_DIRECTION_UNSPECIFIED = 0;
  REQUEST_DIRECTION_INCOMING = 1;
  REQUEST_DIRECTION_OUTGOING = 2;
}

// Friend is another user in one of the caller's lists.
message Friend {
  string user_id = 1;
  string display_name = 2;
  // Upload ID (UUID); empty when there is none.
  string avatar_upload_id = 3;
  FriendState state = 4;
  google.protobuf.Timestamp request_time = 5;
  // Set when FRIEND_STATE_FRIENDS.
  google.protobuf.Timestamp accept_time = 6;
  // "Boşum" badge (issue #207, ADR-0029): the friend's nearest free day
  // within the next seven calendar days (today through today + 6, Europe/
  // Istanbul), without the note. Only in ListFriends, and only when there
  // is one; AvailabilityService.ListUserAvailability shows all 30 days.
  AvailabilityDay next_available = 7;
}

message BlockedUser {
  string user_id = 1;
  // Empty when the user deleted their account.
  string display_name = 2;
  string avatar_upload_id = 3;
  google.protobuf.Timestamp block_time = 4;
}

message SendFriendRequestRequest {
  string user_id = 1;
}

message SendFriendRequestResponse {
  // FRIEND_STATE_OUTGOING, or FRIEND_STATE_FRIENDS when the other user's
  // request was waiting.
  Friend friend = 1;
}

message AcceptFriendRequestRequest {
  // The user who sent the request.
  string user_id = 1;
}

message AcceptFriendRequestResponse {
  Friend friend = 1;
}

message RemoveFriendshipRequest {
  string user_id = 1;
}

message RemoveFriendshipResponse {}

message ListFriendsRequest {
  int32 page_size = 1;
  string page_token = 2;
}

message ListFriendsResponse {
  repeated Friend friends = 1;
  string next_page_token = 2;
}

message ListFriendRequestsRequest {
  // Required.
  RequestDirection direction = 1;
  int32 page_size = 2;
  string page_token = 3;
}

message ListFriendRequestsResponse {
  repeated Friend requests = 1;
  string next_page_token = 2;
}

message BlockUserRequest {
  string user_id = 1;
}

message BlockUserResponse {}

message UnblockUserRequest {
  string user_id = 1;
}

message UnblockUserResponse {}

message ListBlockedUsersRequest {
  int32 page_size = 1;
  string page_token = 2;
}

message ListBlockedUsersResponse {
  repeated BlockedUser users = 1;
  string next_page_token = 2;
}

enum RequestKind {
  REQUEST_KIND_UNSPECIFIED = 0;
  // ref id is the requester's user ID.
  REQUEST_KIND_FRIEND_REQUEST = 1;
  // ref id is the tayfa ID.
  REQUEST_KIND_TAYFA_INVITATION = 2;
  // ref id is the suggested user's ID (FRIEND_SUGGESTION notifications,
  // issue #208, ADR-0030). PENDING: still suggested; ACCEPTED: the two are
  // friends or a request is waiting; DECLINED: the caller dismissed it;
  // EXPIRED: withdrawn or no longer suggestible, for whatever reason (a
  // block by the other side is never told apart). The client does not
  // show a FRIEND_SUGGESTION notification that is not PENDING.
  REQUEST_KIND_FRIEND_SUGGESTION = 3;
}

enum RequestResolution {
  REQUEST_RESOLUTION_UNSPECIFIED = 0;
  // Waiting for the caller's answer.
  REQUEST_RESOLUTION_PENDING = 1;
  REQUEST_RESOLUTION_ACCEPTED = 2;
  // The caller declined it.
  REQUEST_RESOLUTION_DECLINED = 3;
  // The other side took it back.
  REQUEST_RESOLUTION_WITHDRAWN = 4;
  // Nothing is known any more (older than the records, or the other
  // account is gone).
  REQUEST_RESOLUTION_EXPIRED = 5;
}

message RequestRef {
  RequestKind kind = 1;
  string id = 2;
}

message GetRequestResolutionsRequest {
  repeated RequestRef refs = 1;
}

message GetRequestResolutionsResponse {
  // Same order as refs.
  repeated RequestResolution resolutions = 1;
}

// FriendSuggestion is someone suggested to the caller. It never carries the
// friendship score, the number of shared events or any other reason.
message FriendSuggestion {
  string user_id = 1;
  string display_name = 2;
  // Upload ID (UUID); empty when there is none.
  string avatar_upload_id = 3;
  google.protobuf.Timestamp suggest_time = 4;
}

message ListFriendSuggestionsRequest {}

message ListFriendSuggestionsResponse {
  repeated FriendSuggestion suggestions = 1;
}

message DismissFriendSuggestionRequest {
  string user_id = 1;
}

message DismissFriendSuggestionResponse {}

// SocialSettings are the caller's profiling settings (ADR-0030).
message SocialSettings {
  // "Profilleme": the friendship score is kept and suggestions are made.
  // Default true.
  bool profiling_enabled = 1;
  // "Beni önerme": the caller is never suggested to others. Default false.
  bool hide_from_suggestions = 2;
}

message GetSocialSettingsRequest {}

message GetSocialSettingsResponse {
  SocialSettings settings = 1;
}

message UpdateSocialSettingsRequest {
  optional bool profiling_enabled = 1;
  optional bool hide_from_suggestions = 2;
}

message UpdateSocialSettingsResponse {
  SocialSettings settings = 1;
}
