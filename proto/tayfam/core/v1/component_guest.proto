syntax = "proto3";

package tayfam.core.v1;

import "google/protobuf/timestamp.proto";
import "tayfam/core/v1/component.proto";

// GuestPlayerComponentService is the guest player (issue #252; ADR-0037
// §6): someone without a Tayfam account who plays at a scoreboard table or
// in a bracket under a nickname only. Guests belong to the event (at most
// 30) and are added through a scoreboard component whose `guests`
// parameter is on; the ref names that component. A guest sits at a player
// table (ScorePlayerInput.guest_id) and enters the event's participant
// draws (DrawEntry.guest_id), and so its bracket.
//
// Only gateway calls it with the user's access token. Authentication,
// scope and the errors every component shares are those of
// EventComponentService (component.proto).
//
// A guest has no profile, no contact and no statistic. Its nickname is
// cleared 30 days after the event's end, and at once when the one who
// added it deletes their account; the guest stays, with an empty nickname.
// Nicknames are never logged and never written to the audit record or to
// an outbox event.
//
// Errors of every method: ERROR_REASON_GUEST_PLAYERS_DISABLED (the
// component's `guests` parameter is off) besides those of every
// component.
service GuestPlayerComponentService {
  // ListGuestPlayers returns the event's guests. Open to every active
  // member, muted ones included.
  rpc ListGuestPlayers(ListGuestPlayersRequest) returns (ListGuestPlayersResponse);

  // AddGuestPlayer adds a guest: managers (the organizer, and moderators
  // and admins as for every event) and the referees assigned to the event,
  // to the component or to table_id, until the component freezes.
  //
  // Errors: ERROR_REASON_VALIDATION (nickname: empty, longer than 24
  // characters, control or format characters; table_id),
  // ERROR_REASON_SCORE_TABLE_NOT_FOUND (table_id is not a table of the
  // component), ERROR_REASON_PERMISSION_DENIED, ERROR_REASON_MUTED,
  // ERROR_REASON_EVENT_LIMIT (30 guests) and the errors of every component
  // change.
  rpc AddGuestPlayer(AddGuestPlayerRequest) returns (AddGuestPlayerResponse);

  // RemoveGuestPlayer removes a guest without a seat at a table and a
  // place in a draw. Managers only.
  //
  // Errors: ERROR_REASON_VALIDATION (guest_id),
  // ERROR_REASON_GUEST_PLAYER_NOT_FOUND, ERROR_REASON_GUEST_PLAYER_IN_USE,
  // ERROR_REASON_PERMISSION_DENIED, ERROR_REASON_MUTED and the errors of
  // every component change.
  rpc RemoveGuestPlayer(RemoveGuestPlayerRequest) returns (RemoveGuestPlayerResponse);
}

// GuestPlayer is one guest of the event.
message GuestPlayer {
  string id = 1;
  // Empty once cleared (30 days after the event's end, or when the one who
  // added it deleted their account): shown as a guest without a name.
  string nickname = 2;
  google.protobuf.Timestamp create_time = 3;
}

// GuestPlayers are the event's guests as the caller sees them.
message GuestPlayers {
  // In the order they were added.
  repeated GuestPlayer guests = 1;
  // The most guests of an event (30).
  int32 max_guests = 2;
  // The caller may add a guest now without naming a table (a manager, or a
  // referee of the event or the component); a table's referee adds with
  // its table_id.
  bool caller_can_add = 3;
  // The caller may remove a guest now (managers).
  bool caller_can_remove = 4;
}

message ListGuestPlayersRequest {
  ComponentRef ref = 1;
}

message ListGuestPlayersResponse {
  GuestPlayers guests = 1;
}

message AddGuestPlayerRequest {
  ComponentRef ref = 1;
  // 1–24 characters after trimming.
  string nickname = 2;
  // The scoreboard table the adding referee is assigned to; empty for the
  // organizer or a referee of the event or the component.
  string table_id = 3;
}

message AddGuestPlayerResponse {
  GuestPlayers guests = 1;
}

message RemoveGuestPlayerRequest {
  ComponentRef ref = 1;
  string guest_id = 2;
}

message RemoveGuestPlayerResponse {
  GuestPlayers guests = 1;
}
