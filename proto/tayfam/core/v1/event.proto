  string id = 1;
  string event_id = 2;
  // The member who added it.
  string uploader_id = 3;
  // The READY EVENT_PHOTO upload; links come from
  // MediaService.GetMediaUrls.
  string upload_id = 4;
  // Optional, 1–200 characters.
  string caption = 5;
  google.protobuf.Timestamp create_time = 6;
}

message AddEventPhotoRequest {
  string tayfa_id = 1;
  string event_id = 2;
  // Required: the caller's own READY EVENT_PHOTO upload opened for this
  // tayfa and not attached elsewhere.
  string upload_id = 3;
  // Optional, 1–200 characters after trimming; empty means none.
  string caption = 4;
  // Required. A UUID the client generates once per photo and reuses on
  // retry.
  string client_request_id = 5;
  // The uploader's acknowledgement that the people in the photo (for a
  // child, the guardian) agreed. Required true when the event's type has
  // album_notice (ADR-0037 §1); otherwise ignored. Not stored.
  bool consent_ack = 6;
}

