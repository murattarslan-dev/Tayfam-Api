syntax = "proto3";

package tayfam.core.v1;

// Reasons in google.rpc.ErrorInfo; listed here so clients share one source.
//
// Every core error that a client is expected to tell apart carries a
// google.rpc.ErrorInfo detail with domain "core.tayfam.app" and reason set to
// one of the ERROR_REASON_* names below. The gRPC status code of each reason
// is fixed and written next to it. Status messages are fixed strings: they
// never echo request values, tokens, codes or internal details.
//
// UNAUTHENTICATED (missing or invalid access token) comes from auth.Guard and
// carries no ErrorInfo. Any other code without an ErrorInfo is an internal
// error; its message says nothing about the cause.
//
// Non-members must not learn whether a tayfa exists: a caller who is not an
// active member of a tayfa gets ERROR_REASON_TAYFA_NOT_FOUND from every
// tayfa-scoped method, exactly as for an unknown or deleted tayfa.
enum ErrorReason {
  ERROR_REASON_UNSPECIFIED = 0;

  // INVALID_ARGUMENT. A request field failed validation (format, length,
  // range, unknown enum value, bad page token, bad update mask). ErrorInfo
  // metadata "field" holds the request field name (for example "name" or
  // "update_mask"); the rejected value is never included.
  ERROR_REASON_VALIDATION = 1;

  // NOT_FOUND. The tayfa does not exist, is deleted, or the caller is not an
  // active member of it (pending, invited, banned or no membership). These
  // cases are indistinguishable on purpose.
  ERROR_REASON_TAYFA_NOT_FOUND = 2;

  // PERMISSION_DENIED. The caller is an active member, but the permission
  // table (ADR-0004) does not allow this action for the caller's role.
  ERROR_REASON_PERMISSION_DENIED = 3;

  // PERMISSION_DENIED. The caller is muted in this tayfa and the action is
  // one the permission table denies to muted members (for example creating
  // an invite link).
  ERROR_REASON_MUTED = 4;

  // FAILED_PRECONDITION. The tayfa is read-only: suspended by the platform,
  // archived, or waiting for deletion. Reads still work; settings, module,
  // join code and membership changes are refused. CancelDeletion and
  // LeaveTayfa are the exceptions noted on those methods.
  ERROR_REASON_TAYFA_READ_ONLY = 5;

  // RESOURCE_EXHAUSTED. The caller has already created a tayfa in the last
  // 24 hours (one per user per day; the per-IP limit is in gateway).
  ERROR_REASON_TAYFA_CREATE_LIMIT = 6;

  // RESOURCE_EXHAUSTED. Too many join attempts by this user in a short time
  // (JoinByCode). Retrying later may succeed.
  ERROR_REASON_RATE_LIMITED = 7;

  // NOT_FOUND. The join code is malformed, unknown, rotated, or belongs to a
  // tayfa that is deleted, read-only or has banned the caller. These cases
  // are indistinguishable on purpose (code guessing must not reveal
  // anything).
  ERROR_REASON_INVALID_JOIN_CODE = 8;

  // NOT_FOUND. The invite token is malformed or unknown, or its tayfa is
  // deleted or read-only.
  ERROR_REASON_INVITE_INVALID = 9;
  // FAILED_PRECONDITION. The invite link's expiry time has passed.
  ERROR_REASON_INVITE_EXPIRED = 10;
  // FAILED_PRECONDITION. The invite link was revoked.
  ERROR_REASON_INVITE_REVOKED = 11;
  // FAILED_PRECONDITION. The invite link reached max_uses.
  ERROR_REASON_INVITE_EXHAUSTED = 12;
  // NOT_FOUND. RevokeInviteLink: no invite link with this ID in this tayfa
  // that the caller may see.
  ERROR_REASON_INVITE_NOT_FOUND = 13;

  // ALREADY_EXISTS. The caller is already an active member of the tayfa.
  ERROR_REASON_ALREADY_MEMBER = 14;
  // ALREADY_EXISTS. The caller already has a pending join request.
  ERROR_REASON_ALREADY_PENDING = 15;
  // PERMISSION_DENIED. The caller is banned from this tayfa (invite flows
  // only; JoinByCode returns ERROR_REASON_INVALID_JOIN_CODE instead).
  ERROR_REASON_BANNED = 16;

  // NOT_FOUND. The target user has no membership in the state the method
  // needs (for example ApproveMember on a user who is not pending).
  ERROR_REASON_MEMBER_NOT_FOUND = 17;
  // PERMISSION_DENIED. The role hierarchy forbids the action: the target's
  // role is not lower than the caller's, or the new role is not lower than
  // the caller's (ADR-0004). For content (announcements) the target is the
  // author's current role in the tayfa.
  ERROR_REASON_ROLE_HIERARCHY = 18;
  // FAILED_PRECONDITION. The change would leave the tayfa without an active
  // admin.
  ERROR_REASON_LAST_ADMIN = 19;

  // FAILED_PRECONDITION. RequestDeletion on a tayfa already waiting for
  // deletion.
  ERROR_REASON_DELETION_ALREADY_REQUESTED = 20;
  // FAILED_PRECONDITION. CancelDeletion on a tayfa with no pending deletion.
  ERROR_REASON_DELETION_NOT_REQUESTED = 21;

  // FAILED_PRECONDITION. The tayfa has turned off the module this method
  // belongs to (Module, SetModule). Every method of the module refuses,
  // reads included. Checked after membership: non-members still get
  // ERROR_REASON_TAYFA_NOT_FOUND.
  ERROR_REASON_MODULE_DISABLED = 22;

  // NOT_FOUND. AnnouncementService: no announcement with this ID in this
  // tayfa that the method can work on (unknown, in another tayfa, deleted,
  // or no longer restorable).
  ERROR_REASON_ANNOUNCEMENT_NOT_FOUND = 23;

  // Events (EventService, event.proto).

  // NOT_FOUND. No event with this ID in this tayfa, or it was deleted.
  ERROR_REASON_EVENT_NOT_FOUND = 30;
  // FAILED_PRECONDITION. The event is cancelled; it and its RSVPs no longer
  // change.
  ERROR_REASON_EVENT_CANCELLED = 31;
  // FAILED_PRECONDITION. The event has ended; it and its RSVPs no longer
  // change.
  ERROR_REASON_EVENT_ENDED = 32;
  // FAILED_PRECONDITION. The action needs the caller's GOING answer (adding
  // a convoy vehicle).
  ERROR_REASON_EVENT_NOT_GOING = 33;
  // NOT_FOUND. No camp item or convoy vehicle with this ID on this event
  // that the caller may remove.
  ERROR_REASON_EVENT_ITEM_NOT_FOUND = 34;
  // RESOURCE_EXHAUSTED. The event's list is full (200 camp items).
  ERROR_REASON_EVENT_LIMIT = 35;
  // FAILED_PRECONDITION. The method is for another event type (for example
  // AddCampItem on a convoy event).
  ERROR_REASON_EVENT_TYPE_MISMATCH = 36;
}
