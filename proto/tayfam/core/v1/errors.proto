syntax = "proto3";

package tayfam.core.v1;

// Reasons in google.rpc.ErrorInfo; listed here so clients share one source.
//
// Every core error that a client is expected to tell apart carries a
// google.rpc.ErrorInfo detail with domain "core.tayfam.app" and reason set to
// one of the ERROR_REASON_* names below. The gRPC status code of each reason
// is fixed and written next to it. Status messages are fixed strings: they
// never echo request values, tokens, codes or internal details.
//
// UNAUTHENTICATED (missing or invalid access token) comes from auth.Guard and
// carries no ErrorInfo. Any other code without an ErrorInfo is an internal
// error; its message says nothing about the cause.
//
// Non-members must not learn whether a tayfa exists: a caller who is not an
// active member of a tayfa gets ERROR_REASON_TAYFA_NOT_FOUND from every
// tayfa-scoped method, exactly as for an unknown or deleted tayfa.
enum ErrorReason {
  ERROR_REASON_UNSPECIFIED = 0;

  // INVALID_ARGUMENT. A request field failed validation (format, length,
  // range, unknown enum value, bad page token, bad update mask). ErrorInfo
  // metadata "field" holds the request field name (for example "name" or
  // "update_mask"); the rejected value is never included.
  ERROR_REASON_VALIDATION = 1;

  // NOT_FOUND. The tayfa does not exist, is deleted, or the caller is not an
  // active member of it (pending, invited, banned or no membership). These
  // cases are indistinguishable on purpose.
  ERROR_REASON_TAYFA_NOT_FOUND = 2;

  // PERMISSION_DENIED. The caller is an active member, but the permission
  // table (ADR-0004) does not allow this action for the caller's role.
  ERROR_REASON_PERMISSION_DENIED = 3;

  // PERMISSION_DENIED. The caller is muted in this tayfa and the action is
  // one the permission table denies to muted members (for example creating
  // an invite link).
  ERROR_REASON_MUTED = 4;

  // FAILED_PRECONDITION. The tayfa is read-only: suspended by the platform,
  // archived, or waiting for deletion. Reads still work; settings, module,
  // join code and membership changes are refused. CancelDeletion and
  // LeaveTayfa are the exceptions noted on those methods.
  ERROR_REASON_TAYFA_READ_ONLY = 5;

  // RESOURCE_EXHAUSTED. The caller has already created a tayfa in the last
  // 24 hours (one per user per day; the per-IP limit is in gateway).
  ERROR_REASON_TAYFA_CREATE_LIMIT = 6;

  // RESOURCE_EXHAUSTED. Too many join attempts by this user in a short time
  // (JoinByCode). Retrying later may succeed.
  ERROR_REASON_RATE_LIMITED = 7;

  // NOT_FOUND. The join code is malformed, unknown, rotated, or belongs to a
  // tayfa that is deleted, read-only or has banned the caller. These cases
  // are indistinguishable on purpose (code guessing must not reveal
  // anything).
  ERROR_REASON_INVALID_JOIN_CODE = 8;

  // NOT_FOUND. The invite token is malformed or unknown, or its tayfa is
  // deleted or read-only.
  ERROR_REASON_INVITE_INVALID = 9;
  // FAILED_PRECONDITION. The invite link's expiry time has passed.
  ERROR_REASON_INVITE_EXPIRED = 10;
  // FAILED_PRECONDITION. The invite link was revoked.
  ERROR_REASON_INVITE_REVOKED = 11;
  // FAILED_PRECONDITION. The invite link reached max_uses.
  ERROR_REASON_INVITE_EXHAUSTED = 12;
  // NOT_FOUND. RevokeInviteLink: no invite link with this ID in this tayfa
  // that the caller may see.
  ERROR_REASON_INVITE_NOT_FOUND = 13;

  // ALREADY_EXISTS. The caller is already an active member of the tayfa.
  ERROR_REASON_ALREADY_MEMBER = 14;
  // ALREADY_EXISTS. The caller already has a pending join request.
  ERROR_REASON_ALREADY_PENDING = 15;
  // PERMISSION_DENIED. The caller is banned from this tayfa (invite flows
  // only; JoinByCode returns ERROR_REASON_INVALID_JOIN_CODE instead).
  ERROR_REASON_BANNED = 16;

  // NOT_FOUND. The target user has no membership in the state the method
  // needs (for example ApproveMember on a user who is not pending).
  ERROR_REASON_MEMBER_NOT_FOUND = 17;
  // PERMISSION_DENIED. The role hierarchy forbids the action: the target's
  // role is not lower than the caller's, or the new role is not lower than
  // the caller's (ADR-0004). For content (announcements) the target is the
  // author's current role in the tayfa.
  ERROR_REASON_ROLE_HIERARCHY = 18;
  // FAILED_PRECONDITION. The change would leave the tayfa without an active
  // admin.
  ERROR_REASON_LAST_ADMIN = 19;

  // FAILED_PRECONDITION. RequestDeletion on a tayfa already waiting for
  // deletion.
  ERROR_REASON_DELETION_ALREADY_REQUESTED = 20;
  // FAILED_PRECONDITION. CancelDeletion on a tayfa with no pending deletion.
  ERROR_REASON_DELETION_NOT_REQUESTED = 21;

  // FAILED_PRECONDITION. The tayfa has turned off the module this method
  // belongs to (Module, SetModule). Every method of the module refuses,
  // reads included. Checked after membership: non-members still get
  // ERROR_REASON_TAYFA_NOT_FOUND.
  ERROR_REASON_MODULE_DISABLED = 22;

  // NOT_FOUND. AnnouncementService: no announcement with this ID in this
  // tayfa that the method can work on (unknown, in another tayfa, deleted,
  // or no longer restorable).
  ERROR_REASON_ANNOUNCEMENT_NOT_FOUND = 23;

  // Events (EventService, event.proto).

  // NOT_FOUND. No event with this ID in this tayfa, or it was deleted.
  ERROR_REASON_EVENT_NOT_FOUND = 30;
  // FAILED_PRECONDITION. The event is cancelled; it and its RSVPs no longer
  // change.
  ERROR_REASON_EVENT_CANCELLED = 31;
  // FAILED_PRECONDITION. The event has ended; it and its RSVPs no longer
  // change.
  ERROR_REASON_EVENT_ENDED = 32;
  // FAILED_PRECONDITION. The action needs the caller's GOING answer (adding
  // a convoy vehicle, checking in; online check-in also needs it given
  // before the start).
  ERROR_REASON_EVENT_NOT_GOING = 33;
  // NOT_FOUND. No camp item, convoy vehicle or fishing catch with this ID
  // on this event that the caller may remove.
  ERROR_REASON_EVENT_ITEM_NOT_FOUND = 34;
  // RESOURCE_EXHAUSTED. The event's list is full (200 camp items).
  ERROR_REASON_EVENT_LIMIT = 35;
  // FAILED_PRECONDITION. The method is for another event type (for example
  // AddCampItem on a convoy event).
  ERROR_REASON_EVENT_TYPE_MISMATCH = 36;

  // Attendance (EventService check-in, correction and fishing catches;
  // issue #50). None of these errors says anything about the location that
  // was sent.

  // FAILED_PRECONDITION. Outside the check-in window: from 30 minutes
  // before the start until the end.
  ERROR_REASON_CHECK_IN_CLOSED = 40;
  // FAILED_PRECONDITION. The sent location is farther than 300 m from the
  // meeting point. The attempt counts; the distance is not returned.
  ERROR_REASON_CHECK_IN_TOO_FAR = 41;
  // RESOURCE_EXHAUSTED. The caller used all five location attempts for this
  // event; the organizer can still add the attendance after the end.
  ERROR_REASON_CHECK_IN_ATTEMPTS_EXHAUSTED = 42;
  // FAILED_PRECONDITION. Outside the organizer's correction window: the
  // seven days after the end.
  ERROR_REASON_CORRECTION_CLOSED = 43;
  // FAILED_PRECONDITION. FinishHike without StartHike.
  ERROR_REASON_HIKE_NOT_STARTED = 44;
  // FAILED_PRECONDITION. The action needs the caller's verified attendance
  // (AddFishingCatch).
  ERROR_REASON_NOT_ATTENDED = 45;

  // Event series (issue #51).

  // NOT_FOUND. No event series with this ID in this tayfa.
  ERROR_REASON_EVENT_SERIES_NOT_FOUND = 50;
  // FAILED_PRECONDITION. The series was ended; it no longer changes.
  ERROR_REASON_EVENT_SERIES_ENDED = 51;

  // Q&A (QAService, qa.proto; issue #59).

  // NOT_FOUND. No visible question with this ID in this tayfa that the
  // method can work on (unknown, in another tayfa, deleted, or no longer
  // restorable).
  ERROR_REASON_QUESTION_NOT_FOUND = 60;
  // NOT_FOUND. The same for answers. An answer of a deleted question is not
  // found either.
  ERROR_REASON_ANSWER_NOT_FOUND = 61;
  // NOT_FOUND. No tag with this ID in this tayfa.
  ERROR_REASON_TAG_NOT_FOUND = 62;
  // FAILED_PRECONDITION. SetAnswerVote on the caller's own answer.
  ERROR_REASON_OWN_ANSWER_VOTE = 63;
  // RESOURCE_EXHAUSTED. The question names a new tag, but the tayfa already
  // has 200 tags; a moderator can remove unused ones.
  ERROR_REASON_TAG_LIMIT = 64;

  // Polls (PollService, poll.proto; issue #60).

  // NOT_FOUND. No poll with this ID in this tayfa, or it was deleted.
  ERROR_REASON_POLL_NOT_FOUND = 70;
  // FAILED_PRECONDITION. The poll is closed (early or past its close time);
  // votes no longer change.
  ERROR_REASON_POLL_CLOSED = 71;
  // FAILED_PRECONDITION. ListPollVoters on an anonymous poll: nobody, admins
  // included, sees who voted for what.
  ERROR_REASON_POLL_ANONYMOUS = 72;

  // Friendships, blocks and direct invitations (SocialService,
  // MembershipService; issue #71).

  // NOT_FOUND. No live user with this ID, or a block between the caller and
  // the user in either direction. The two are deliberately the same: nobody
  // learns that they were blocked.
  ERROR_REASON_USER_NOT_FOUND = 90;
  // RESOURCE_EXHAUSTED. The caller sent 20 friend requests in the last 24
  // hours. Declined requests still count.
  ERROR_REASON_FRIEND_REQUEST_LIMIT = 91;
  // NOT_FOUND. No friend request from this user waiting for the caller.
  ERROR_REASON_FRIEND_REQUEST_NOT_FOUND = 92;
  // ALREADY_EXISTS. The users are already friends.
  ERROR_REASON_ALREADY_FRIENDS = 93;
  // ALREADY_EXISTS. The caller's friend request waits for an answer.
  ERROR_REASON_FRIEND_REQUEST_PENDING = 94;
  // FAILED_PRECONDITION. Only friends can be invited directly.
  ERROR_REASON_NOT_FRIENDS = 95;
  // RESOURCE_EXHAUSTED. The caller sent 10 direct invitations in the last 24
  // hours, in any tayfa.
  ERROR_REASON_DIRECT_INVITE_LIMIT = 96;
  // NOT_FOUND. No unanswered direct invitation of this user in this tayfa.
  ERROR_REASON_INVITATION_NOT_FOUND = 97;
  // ALREADY_EXISTS. The user already has an unanswered invitation to this
  // tayfa.
  ERROR_REASON_ALREADY_INVITED = 98;
  // FAILED_PRECONDITION. The user cannot be invited into this tayfa (for
  // example banned, or a join request waits). Which reason is not said.
  ERROR_REASON_INVITE_NOT_ALLOWED = 99;
  // Reports and the tayfa moderation queue (ReportService, report.proto;
  // issue #76).

  // NOT_FOUND. No report with this ID that the caller may see: not theirs,
  // not in this tayfa's queue, or about the caller.
  ERROR_REASON_REPORT_NOT_FOUND = 100;
  // NOT_FOUND. The reported user or content does not exist in this tayfa or
  // the caller cannot see it. The cases are deliberately the same.
  ERROR_REASON_REPORT_TARGET_NOT_FOUND = 101;
  // RESOURCE_EXHAUSTED. The caller filed 20 reports in the last 24 hours.
  ERROR_REASON_REPORT_LIMIT = 102;
  // FAILED_PRECONDITION. The report is already resolved; resolutions do not
  // change.
  ERROR_REASON_REPORT_ALREADY_RESOLVED = 103;
  // FAILED_PRECONDITION. The resolution names an action that was not taken:
  // CONTENT_REMOVED while the content is still visible, MEMBER_SANCTIONED
  // while the reported member is neither muted nor banned.
  ERROR_REASON_REPORT_ACTION_MISSING = 104;
  // Platform panel (AdminService, issue #104).
  // PERMISSION_DENIED. A change needs a Google sign-in in the last 5
  // minutes; sign in to the panel again.
  ERROR_REASON_REAUTHENTICATION_REQUIRED = 110;
  // INVALID_ARGUMENT. A change without a reason of 10–1000 characters.
  ERROR_REASON_REASON_REQUIRED = 111;
  // FAILED_PRECONDITION. The decision does not fit the report (content
  // removal of a user, tayfa or direct message; tayfa suspension of a DM
  // report) or the report is not escalated to the platform.
  ERROR_REASON_DECISION_NOT_APPLICABLE = 112;
  // FAILED_PRECONDITION. The tayfa is already in the requested state
  // (suspended, not suspended, deleted).
  ERROR_REASON_TAYFA_STATE_CONFLICT = 113;
  // Media (MediaService, issue #135). None of them says whose an upload is.
  // NOT_FOUND. No upload with this ID that the caller owns (unknown,
  // another user's, deleted, or of another purpose or tayfa than the
  // content it is attached to).
  ERROR_REASON_UPLOAD_NOT_FOUND = 120;
  // FAILED_PRECONDITION. The upload is not READY (still being uploaded or
  // processed, or rejected); poll GetUpload.
  ERROR_REASON_UPLOAD_NOT_READY = 121;
  // FAILED_PRECONDITION. The upload is already attached to other content;
  // each upload is used once.
  ERROR_REASON_UPLOAD_IN_USE = 122;
  // FAILED_PRECONDITION. CompleteUpload found a variant not stored yet;
  // finish the PUTs and call again.
  ERROR_REASON_UPLOAD_NOT_RECEIVED = 123;
  // RESOURCE_EXHAUSTED. The caller opened the most uploads an hour allows.
  ERROR_REASON_UPLOAD_RATE_LIMITED = 124;
  // RESOURCE_EXHAUSTED. The caller's stored media would exceed the quota.
  ERROR_REASON_UPLOAD_QUOTA_EXCEEDED = 125;
}
