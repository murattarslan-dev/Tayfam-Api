syntax = "proto3";

package tayfam.core.v1;

import "google/protobuf/timestamp.proto";

// TayfaMaterialService is the tayfa's material library — materyal
// kütüphanesi (issue #261; ADR-0040 §3): study material of Eğitim tayfas.
// A material is a link (https only) or photos of the member's own notes (at
// most 3); no file or PDF is ever uploaded. Each carries a subject
// (required) and a topic (optional) from Tayfam's study tag list; only the
// keys are kept. Members add their own materials; the author edits and
// deletes them; a moderator removes anyone's (moderation).
//
// The server never opens a link: no preview, title or favicon is fetched
// (no SSRF surface, nothing leaks to the linked site). A link is parsed and
// normalized only: https, no user info, a host name (never an IP address),
// at most 500 characters. Its domain and every domain under it must not be
// on the platform's blocked domain list (ERROR_REASON_BLOCKED_LINK); a
// domain added to the list later hides the materials linking to it (they
// are not deleted).
//
// Only gateway calls it with the user's access token; the acting user is
// always the token's. Anyone but an ACTIVE member of the tayfa gets
// ERROR_REASON_TAYFA_NOT_FOUND; with the materials module off every method
// gets ERROR_REASON_MODULE_DISABLED. Writes on a read-only tayfa get
// ERROR_REASON_TAYFA_READ_ONLY. Titles and links are content: they are
// never logged or written to the audit record or an outbox event.
service TayfaMaterialService {
  // ListMaterials returns the tayfa's visible materials, the newest first;
  // kind, subject_key, topic_key and mine narrow it.
  //
  // Errors: ERROR_REASON_VALIDATION (tayfa_id, kind, subject_key,
  // topic_key, page_size, page_token).
  rpc ListMaterials(ListMaterialsRequest) returns (ListMaterialsResponse);

  // GetMaterial returns a visible material.
  //
  // Errors: ERROR_REASON_VALIDATION (tayfa_id, material_id),
  // ERROR_REASON_MATERIAL_NOT_FOUND.
  rpc GetMaterial(GetMaterialRequest) returns (GetMaterialResponse);

  // CreateMaterial adds a material of the caller's. A link needs url and
  // no photos; a note photo needs 1–3 photos and no url. A repeated
  // client_request_id returns the material it created.
  //
  // Errors: ERROR_REASON_VALIDATION (tayfa_id, kind, title, url,
  // photo_upload_ids, subject_key, topic_key, client_request_id),
  // ERROR_REASON_BLOCKED_LINK, ERROR_REASON_UPLOAD_NOT_FOUND,
  // ERROR_REASON_UPLOAD_NOT_READY, ERROR_REASON_UPLOAD_IN_USE,
  // ERROR_REASON_MATERIAL_LIMIT, ERROR_REASON_PERMISSION_DENIED,
  // ERROR_REASON_MUTED, ERROR_REASON_TAYFA_READ_ONLY.
  rpc CreateMaterial(CreateMaterialRequest) returns (CreateMaterialResponse);

  // UpdateMaterial replaces the title, the link or the photos, and the
  // tags of the caller's material; its kind does not change. Photos left
  // out are deleted. Tags left as they were may be retired ones.
  //
  // Errors: ERROR_REASON_VALIDATION (tayfa_id, material_id, title, url,
  // photo_upload_ids, subject_key, topic_key), ERROR_REASON_BLOCKED_LINK,
  // ERROR_REASON_MATERIAL_NOT_FOUND (not the caller's), the upload errors
  // of CreateMaterial, ERROR_REASON_PERMISSION_DENIED, ERROR_REASON_MUTED,
  // ERROR_REASON_TAYFA_READ_ONLY.
  rpc UpdateMaterial(UpdateMaterialRequest) returns (UpdateMaterialResponse);

  // DeleteMaterial deletes the caller's material (its photos are deleted
  // at once), or removes anyone's for a moderator (hidden; gone for good
  // after 30 days). There is no undo.
  //
  // Errors: ERROR_REASON_VALIDATION (tayfa_id, material_id),
  // ERROR_REASON_MATERIAL_NOT_FOUND, ERROR_REASON_PERMISSION_DENIED,
  // ERROR_REASON_TAYFA_READ_ONLY.
  rpc DeleteMaterial(DeleteMaterialRequest) returns (DeleteMaterialResponse);
}

enum MaterialKind {
  MATERIAL_KIND_UNSPECIFIED = 0;
  // An https link.
  MATERIAL_KIND_LINK = 1;
  // Photos of the member's own notes.
  MATERIAL_KIND_NOTE_PHOTO = 2;
}

message Material {
  string id = 1;
  MaterialKind kind = 2;
  // 1–80 characters, one line.
  string title = 3;
  // MATERIAL_KIND_LINK only: the link as the server normalized it (https,
  // at most 500 characters). The server never opened it.
  string url = 4;
  // MATERIAL_KIND_LINK only: the link's domain as the server parsed it
  // (lower case; an IDN in punycode). Shown with the link.
  string domain = 5;
  // MATERIAL_KIND_NOTE_PHOTO only: the author's photo uploads (purpose
  // material_note), in order; fewer than at first once the author's
  // account is deleted.
  repeated string photo_upload_ids = 6;
  // Tayfam's study tags (catalog study_tags): the subject, and the topic
  // (empty: none).
  string subject_key = 7;
  string topic_key = 8;
  // Empty once the author's account is deleted.
  string author_id = 9;
  google.protobuf.Timestamp create_time = 10;
  google.protobuf.Timestamp update_time = 11;
  // Whether the caller may edit it now (the author).
  bool caller_can_edit = 12;
  // Whether the caller may delete it now (the author, a moderator).
  bool caller_can_delete = 13;
}

message ListMaterialsRequest {
  string tayfa_id = 1;
  // Unspecified: every kind.
  MaterialKind kind = 2;
  // Empty: every subject (topic). A topic narrows within its subject.
  string subject_key = 3;
  string topic_key = 4;
  // Only the caller's materials.
  bool mine = 5;
  // 1–50; 0: 20.
  int32 page_size = 6;
  // From next_page_token; opaque.
  string page_token = 7;
}

message ListMaterialsResponse {
  repeated Material materials = 1;
  // Empty: no more.
  string next_page_token = 2;
  // Whether the caller may add a material now.
  bool caller_can_add = 3;
}

message GetMaterialRequest {
  string tayfa_id = 1;
  string material_id = 2;
}

message GetMaterialResponse {
  Material material = 1;
}

message CreateMaterialRequest {
  string tayfa_id = 1;
  MaterialKind kind = 2;
  string title = 3;
  // MATERIAL_KIND_LINK only: an https link of at most 500 characters.
  string url = 4;
  // MATERIAL_KIND_NOTE_PHOTO only: 1–3 of the caller's own READY
  // material_note uploads for this tayfa, in order.
  repeated string photo_upload_ids = 5;
  string subject_key = 6;
  // Optional: a topic under the subject.
  string topic_key = 7;
  // UUID made by the client; a retry returns the same material.
  string client_request_id = 8;
}

message CreateMaterialResponse {
  Material material = 1;
}

message UpdateMaterialRequest {
  string tayfa_id = 1;
  string material_id = 2;
  string title = 3;
  // A link's new link (required for a link, empty for note photos).
  string url = 4;
  // Note photos' photos (1–3; the ones kept and new ones), in order.
  repeated string photo_upload_ids = 5;
  string subject_key = 6;
  string topic_key = 7;
}

message UpdateMaterialResponse {
  Material material = 1;
}

message DeleteMaterialRequest {
  string tayfa_id = 1;
  string material_id = 2;
}

message DeleteMaterialResponse {}
