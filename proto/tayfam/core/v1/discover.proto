syntax = "proto3";

package tayfam.core.v1;

import "google/protobuf/timestamp.proto";
import "tayfam/core/v1/membership.proto";
import "tayfam/core/v1/tayfa.proto";

// DiscoverService is the first stage of Keşfet: events of tayfas opened to
// Keşfet that the caller's friends go to, and the safety net around it
// (issue #210, ADR-0033).
//
// Every method needs the caller's access token; the caller is always the
// verified token subject.
//
// Feature flag: core's DISCOVER_ENABLED (default off). While it is off,
// ListDiscoverFeed, JoinFromDiscover, the feedback methods,
// GetSafetyContact, SetSafetyContact and ListSafetyShares fail with
// ERROR_REASON_FEATURE_DISABLED before reading anything. GetTayfaDiscover
// and SetTayfaDiscover work regardless (the tayfa's admins may apply and
// the platform may review before Keşfet opens), and so do
// ClearSafetyContact and MarkReturned: a safety net that was set can
// always be closed.
//
// Keşfet gives facts, not trust: nothing here says "trusted", "verified"
// or "approved". The friendship score (ADR-0030) orders the feed but is
// never returned, not even as a position or a page token. No method
// returns or stores a device location; the feed returns no meeting point
// and no coordinates.
service DiscoverService {
  // ListDiscoverFeed lists at most 50 upcoming events (not ended, starting
  // within 30 days) of listable tayfas the caller is not in, where at least
  // one of the caller's friends is visible: an accepted friend, no block
  // either way, an active member of the tayfa, GOING to or attended the
  // event, and whose attendance history visibility is not PRIVATE. No
  // paging.
  //
  // Errors: ERROR_REASON_FEATURE_DISABLED.
  rpc ListDiscoverFeed(ListDiscoverFeedRequest) returns (ListDiscoverFeedResponse);

  // JoinFromDiscover asks to join a tayfa that is in the caller's feed
  // right now. The membership is always PENDING with JOIN_SOURCE_DISCOVER,
  // even in an open tayfa; the tayfa's staff approve it.
  //
  // Errors: ERROR_REASON_FEATURE_DISABLED, ERROR_REASON_TAYFA_NOT_FOUND
  // (not in the caller's feed, unknown, or the caller is banned there; all
  // the same), ERROR_REASON_ALREADY_MEMBER, ERROR_REASON_ALREADY_PENDING,
  // ERROR_REASON_RATE_LIMITED.
  rpc JoinFromDiscover(JoinFromDiscoverRequest) returns (JoinFromDiscoverResponse);

  // GetTayfaDiscover returns the tayfa's Keşfet state. Admin of the tayfa
  // (permission tayfa.discover_manage).
  //
  // Errors: ERROR_REASON_TAYFA_NOT_FOUND, ERROR_REASON_PERMISSION_DENIED.
  rpc GetTayfaDiscover(GetTayfaDiscoverRequest) returns (GetTayfaDiscoverResponse);

  // SetTayfaDiscover turns the admins' wish to be in Keşfet on or off.
  // Turning it on with no earlier decision, or after a rejection, puts the
  // tayfa in the platform's review queue (PENDING). Turning it off hides
  // the tayfa at once; it keeps a decision of the platform. Admin only.
  //
  // Errors: ERROR_REASON_TAYFA_NOT_FOUND, ERROR_REASON_PERMISSION_DENIED,
  // ERROR_REASON_TAYFA_READ_ONLY, ERROR_REASON_DISCOVER_TOO_FEW_MEMBERS
  // (turning on with fewer than five active members).
  rpc SetTayfaDiscover(SetTayfaDiscoverRequest) returns (SetTayfaDiscoverResponse);

  // GetEventFeedback returns the caller's own "Was everything all right?"
  // answer; UNSPECIFIED when there is none. The feedback methods also
  // accept a member who came from Keşfet within 30 days of their
  // membership ending (ADR-0033 §7).
  //
  // Errors: ERROR_REASON_FEATURE_DISABLED, ERROR_REASON_TAYFA_NOT_FOUND,
  // ERROR_REASON_EVENT_NOT_FOUND.
  rpc GetEventFeedback(GetEventFeedbackRequest) returns (GetEventFeedbackResponse);

  // SetEventFeedback writes the caller's answer, replacing an earlier one.
  // Only for an attendee (attendance ATTENDED) of an in-person event marked
  // discoverable, from its end until seven days after. A SERIOUS answer
  // takes the tayfa out of Keşfet until the platform reviews it; nobody in
  // the tayfa is told why.
  //
  // Errors: ERROR_REASON_FEATURE_DISABLED, ERROR_REASON_TAYFA_NOT_FOUND,
  // ERROR_REASON_EVENT_NOT_FOUND, ERROR_REASON_VALIDATION,
  // ERROR_REASON_NOT_ATTENDED, ERROR_REASON_FEEDBACK_CLOSED.
  rpc SetEventFeedback(SetEventFeedbackRequest) returns (SetEventFeedbackResponse);

  // GetSafetyContact returns the caller's safety contact for the event;
  // an empty contact when there is none.
  //
  // Errors: ERROR_REASON_FEATURE_DISABLED, ERROR_REASON_TAYFA_NOT_FOUND,
  // ERROR_REASON_EVENT_NOT_FOUND.
  rpc GetSafetyContact(GetSafetyContactRequest) returns (GetSafetyContactResponse);

  // SetSafetyContact chooses (or replaces) the friend who is alerted if the
  // caller does not mark "back" by the event's end plus grace_minutes. The
  // caller must have answered GOING to an in-person event that is not
  // cancelled and has not ended; the alert must not have gone out.
  //
  // Errors: ERROR_REASON_FEATURE_DISABLED, ERROR_REASON_TAYFA_NOT_FOUND,
  // ERROR_REASON_EVENT_NOT_FOUND, ERROR_REASON_VALIDATION,
  // ERROR_REASON_EVENT_NOT_GOING, ERROR_REASON_NOT_FRIENDS (also a block
  // either way, or an unknown user), ERROR_REASON_SAFETY_CONTACT_CLOSED.
  rpc SetSafetyContact(SetSafetyContactRequest) returns (SetSafetyContactResponse);

  // ClearSafetyContact removes the caller's safety contact; removing
  // nothing succeeds. Once the alert went out it cannot be removed. It
  // touches only the caller's own row of an event of the tayfa: no flag,
  // membership or module is required.
  //
  // Errors: ERROR_REASON_SAFETY_CONTACT_CLOSED.
  rpc ClearSafetyContact(ClearSafetyContactRequest) returns (ClearSafetyContactResponse);

  // MarkReturned records "I'm back": no alert goes out after it. Calling it
  // again keeps the first time. Like ClearSafetyContact it touches only
  // the caller's own row: no flag, membership or module is required.
  //
  // Errors: ERROR_REASON_SAFETY_CONTACT_NOT_FOUND.
  rpc MarkReturned(MarkReturnedRequest) returns (MarkReturnedResponse);

  // ListSafetyShares lists the events whose participants chose the caller
  // as safety contact: those that ended less than 24 hours ago or whose
  // alert went out in the last seven days, newest start first (at most
  // 50), and only while the share still holds: still friends, no block,
  // the participant an active member and GOING, the event and tayfa
  // neither removed nor suspended (after an alert, a checked-in
  // participant's share stays). Only the meeting point's name, never its
  // coordinates.
  //
  // Errors: ERROR_REASON_FEATURE_DISABLED.
  rpc ListSafetyShares(ListSafetySharesRequest) returns (ListSafetySharesResponse);
}

// DiscoverPerson is a friend shown on a feed item.
message DiscoverPerson {
  string user_id = 1;
  string display_name = 2;
  // Upload ID (UUID); empty when there is none.
  string avatar_upload_id = 3;
}

// DiscoverTayfa is what a feed item shows about the tayfa: metadata the
// platform reviewed and facts. Never a member list or a location.
message DiscoverTayfa {
  string tayfa_id = 1;
  string name = 2;
  string description = 3;
  string city = 4;
  // When the tayfa was founded.
  google.protobuf.Timestamp create_time = 5;
  // Events that ended at least seven days ago and were neither cancelled
  // nor deleted.
  int32 event_count = 6;
  // Verified attendances (ATTENDED) at those events.
  int32 attendance_count = 7;
}

// DiscoverEvent is an event as the feed shows it: no description, no
// meeting point, no coordinates (they are for members only).
message DiscoverEvent {
  string event_id = 1;
  EventType type = 2;
  string title = 3;
  google.protobuf.Timestamp start_time = 4;
  google.protobuf.Timestamp end_time = 5;
  string city = 6;
  string district = 7;
}

// DiscoverItem is one feed entry: "Ayşe and 2 friends are at this event".
message DiscoverItem {
  DiscoverEvent event = 1;
  DiscoverTayfa tayfa = 2;
  // At most three visible friends.
  repeated DiscoverPerson friends = 3;
  // All visible friends at the event (friends' size included).
  int32 friend_count = 4;
}

message ListDiscoverFeedRequest {}

message ListDiscoverFeedResponse {
  // Best first. The order comes from private signals; it is not a score.
  repeated DiscoverItem items = 1;
}

message JoinFromDiscoverRequest {
  string tayfa_id = 1;
}

message JoinFromDiscoverResponse {
  // Status PENDING.
  Membership membership = 1;
}

// TayfaDiscoverState is the tayfa's Keşfet state as its admins see it. It
// never says why the platform took a tayfa out.
enum TayfaDiscoverState {
  TAYFA_DISCOVER_STATE_UNSPECIFIED = 0;
  // The admins have not turned Keşfet on.
  TAYFA_DISCOVER_STATE_OFF = 1;
  // Waiting for the platform's review.
  TAYFA_DISCOVER_STATE_PENDING = 2;
  // On and reviewed: the tayfa's discoverable events can appear in Keşfet
  // while it has at least five active members.
  TAYFA_DISCOVER_STATE_LISTED = 3;
  // Taken out of Keşfet until the platform reviews it again.
  TAYFA_DISCOVER_STATE_UNDER_REVIEW = 4;
  // The platform declined it. Turning Keşfet off and on asks again.
  TAYFA_DISCOVER_STATE_REJECTED = 5;
}

message GetTayfaDiscoverRequest {
  string tayfa_id = 1;
}

message GetTayfaDiscoverResponse {
  TayfaDiscoverState state = 1;
  // The admins' wish (tayfas.visibility = listed).
  bool enabled = 2;
}

message SetTayfaDiscoverRequest {
  string tayfa_id = 1;
  bool enabled = 2;
}

message SetTayfaDiscoverResponse {
  TayfaDiscoverState state = 1;
  bool enabled = 2;
}

// FeedbackAnswer is the answer to "Was everything all right?". There is no
// free text.
enum FeedbackAnswer {
  FEEDBACK_ANSWER_UNSPECIFIED = 0;
  FEEDBACK_ANSWER_OK = 1;
  FEEDBACK_ANSWER_NOT_OK = 2;
  // Something serious happened: the tayfa leaves Keşfet until reviewed.
  FEEDBACK_ANSWER_SERIOUS = 3;
}

message GetEventFeedbackRequest {
  string tayfa_id = 1;
  string event_id = 2;
}

message GetEventFeedbackResponse {
  FeedbackAnswer answer = 1;
  google.protobuf.Timestamp update_time = 2;
}

message SetEventFeedbackRequest {
  string tayfa_id = 1;
  string event_id = 2;
  // Not UNSPECIFIED.
  FeedbackAnswer answer = 3;
}

message SetEventFeedbackResponse {
  FeedbackAnswer answer = 1;
  google.protobuf.Timestamp update_time = 2;
}

// SafetyContact is the caller's own safety contact for an event.
message SafetyContact {
  // Empty when none is chosen.
  DiscoverPerson contact = 1;
  // 15–1440.
  int32 grace_minutes = 2;
  // Unset until "I'm back".
  google.protobuf.Timestamp return_time = 3;
  // Unset until the alert went out.
  google.protobuf.Timestamp alert_time = 4;
}

message GetSafetyContactRequest {
  string tayfa_id = 1;
  string event_id = 2;
}

message GetSafetyContactResponse {
  SafetyContact safety_contact = 1;
}

message SetSafetyContactRequest {
  string tayfa_id = 1;
  string event_id = 2;
  // An accepted friend; not the caller.
  string contact_user_id = 3;
  // 0 means 60; otherwise 15–1440.
  int32 grace_minutes = 4;
}

message SetSafetyContactResponse {
  SafetyContact safety_contact = 1;
}

message ClearSafetyContactRequest {
  string tayfa_id = 1;
  string event_id = 2;
}

message ClearSafetyContactResponse {}

message MarkReturnedRequest {
  string tayfa_id = 1;
  string event_id = 2;
}

message MarkReturnedResponse {
  SafetyContact safety_contact = 1;
}

// SafetyShare is an event a participant shared with the caller as their
// safety contact. Only what the participant chose to share: no
// coordinates, no description, no other participants.
message SafetyShare {
  DiscoverPerson participant = 1;
  string tayfa_name = 2;
  string event_id = 3;
  string event_title = 4;
  google.protobuf.Timestamp start_time = 5;
  google.protobuf.Timestamp end_time = 6;
  // The meeting point's name only.
  string meeting_point_name = 7;
  string city = 8;
  string district = 9;
  int32 grace_minutes = 10;
  google.protobuf.Timestamp return_time = 11;
  google.protobuf.Timestamp alert_time = 12;
}

message ListSafetySharesRequest {}

message ListSafetySharesResponse {
  repeated SafetyShare shares = 1;
}
