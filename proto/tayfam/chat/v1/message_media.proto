syntax = "proto3";

package tayfam.chat.v1;

// MessageMediaService answers core's question when a user asks for the
// links of a photo or an attachment that belongs to a message (issue #205,
// ADR-0031). core owns the files and signs the links; chat owns channels,
// their audiences (ADR-0024) and conversations, so chat decides who may
// see a message.
//
// Authentication: the caller's access token, forwarded by core as it is
// (auth.ForwardToken; ADR-0004, ADR-0011). Service tokens are refused. The
// answer is about the caller only and holds no content.
service MessageMediaService {
  // FilterVisibleMessageMedia returns the upload IDs among items that the
  // caller may see, in request order:
  //   - CHANNEL: the message is in a channel the caller may read (the same
  //     rule as ChannelService.ListMessages: an active member of the tayfa
  //     who is in the channel's audience: members, staff, event or
  //     selected), it is not deleted and its photo_upload_id is upload_id.
  //   - DIRECT: the caller is a party of the message's conversation, the
  //     message is not deleted and its attachment_upload_id is upload_id.
  // Everything else is left out without a reason. 1 to 100 items
  // (ERROR_REASON_VALIDATION otherwise, field "items"). UNAVAILABLE without
  // ErrorInfo when core cannot answer about the tayfa.
  rpc FilterVisibleMessageMedia(FilterVisibleMessageMediaRequest) returns (FilterVisibleMessageMediaResponse);
}

// MessageMediaKind is where a message lives.
enum MessageMediaKind {
  MESSAGE_MEDIA_KIND_UNSPECIFIED = 0;
  // A channel message's photo.
  MESSAGE_MEDIA_KIND_CHANNEL = 1;
  // A direct message's encrypted attachment.
  MESSAGE_MEDIA_KIND_DIRECT = 2;
}

message MessageMediaItem {
  string upload_id = 1;
  // The message the upload is attached to (core's uploads.attached_id).
  string message_id = 2;
  MessageMediaKind kind = 3;
}

message FilterVisibleMessageMediaRequest {
  repeated MessageMediaItem items = 1;
}

message FilterVisibleMessageMediaResponse {
  repeated string visible_upload_ids = 1;
}

// MediaHolderService answers core's reconciliation job (issue #205,
// ADR-0031): core attaches a chat file before chat writes the message, so
// an attachment whose message was never written (chat rolled back, the
// client went away) must be undone. core asks which message, if any, now
// holds each file.
//
// Authentication: only a Kubernetes service token (ADR-0013) with audience
// chat.tayfam.internal from the tayfam-core ServiceAccount. User tokens are
// refused. The answer is IDs only.
service MediaHolderService {
  // FindMessageMediaHolders returns, for each upload that a channel message
  // (photo_upload_id) or a direct message (attachment_upload_id) of the
  // given kind holds, the message's ID; uploads no message holds are left
  // out. Deleted messages that still hold their file (a moderator's hiding)
  // count. 1 to 100 items (ERROR_REASON_VALIDATION otherwise, field
  // "items").
  rpc FindMessageMediaHolders(FindMessageMediaHoldersRequest) returns (FindMessageMediaHoldersResponse);
}

message MediaHolderQuery {
  string upload_id = 1;
  MessageMediaKind kind = 2;
}

message FindMessageMediaHoldersRequest {
  repeated MediaHolderQuery items = 1;
}

message MediaHolder {
  string upload_id = 1;
  string message_id = 2;
}

message FindMessageMediaHoldersResponse {
  repeated MediaHolder holders = 1;
}
