syntax = "proto3";

package tayfam.chat.v1;

import "google/protobuf/timestamp.proto";
import "tayfam/chat/v1/notification_types.proto";

// Event consumers of chat (ADR-0002, ADR-0009, issue #64). Both services are
// service-to-service APIs: no user can call them.
//
// Authentication: only a Kubernetes service token (ADR-0013) with audience
// chat.tayfam.internal is accepted, and only from the ServiceAccount named on
// each service. A user access token is refused (UNAUTHENTICATED); a service
// token from any other ServiceAccount is PERMISSION_DENIED.
//
// Every method is idempotent: the relay delivers at least once, so the same
// event may arrive more than once, and events may arrive out of order (two
// relays during a rolling update). Applying an event again leaves the same
// result. Errors: ERROR_REASON_VALIDATION for a malformed request; any other
// error is retried by the relay.

// UserEventService receives identity's user events from identity's outbox
// relay. Only the tayfam-identity ServiceAccount may call it.
service UserEventService {
  // ApplyUserEvent applies one user event.
  //
  // profile_updated updates chat's copy of the public profile
  // (user_profiles) unless a newer event, or the user's deletion, was
  // already applied.
  //
  // deleted removes the user's records from chat (notifications and
  // notification preferences; the user stays nowhere as a recipient or an
  // actor) and keeps the profile copy as a tombstone, so a late event
  // cannot bring it back.
  //
  // data_export_ready writes the data_export_ready notification for the
  // user (issue #144, ADR-0021), once per event; none for a deleted user.
  //
  // session_revoked, sanctioned and deleted also close the real-time
  // connections of the session (or of every session of the user), remove
  // its unused tickets and refuse new tickets for it until any access
  // token it may still hold has expired (ADR-0004, ADR-0009; issue #82).
  rpc ApplyUserEvent(ApplyUserEventRequest) returns (ApplyUserEventResponse);
}

message ApplyUserEventRequest {
  // Outbox event ID in identity (UUIDv7). Later events have greater IDs.
  string event_id = 1;
  // The user the event is about (UUID).
  string user_id = 2;
  google.protobuf.Timestamp occurred_at = 3;

  oneof event {
    UserProfileUpdated profile_updated = 10;
    UserDeleted deleted = 11;
    SessionRevoked session_revoked = 12;
    UserSanctioned sanctioned = 13;
    DataExportReady data_export_ready = 14;
  }
}

// UserProfileUpdated carries the public profile only: what other users see
// next to the user's content.
message UserProfileUpdated {
  // 1–40 characters.
  string display_name = 1;
  // Upload ID (UUID) of the avatar; empty when there is none.
  string avatar_upload_id = 2;
}

// UserDeleted carries nothing but the fact.
message UserDeleted {}

// SessionRevoked: the user signed out, closed the session from another
// device, or the session was revoked for refresh token reuse.
message SessionRevoked {
  // The revoked session (UUID), the sid claim of its access tokens.
  string session_id = 1;
}

// UserSanctioned: a platform sanction (suspension or ban) closed every
// session of the user (ADR-0004 "Platform yaptırımları"). Which sanction is
// not said.
message UserSanctioned {}

// DataExportReady: the user's data export can be downloaded.
message DataExportReady {
  // identity's data export request (UUID).
  string data_export_id = 1;
}

message ApplyUserEventResponse {}

// CoreEventService receives core's events from core's outbox relay. Only the
// tayfam-core ServiceAccount may call it.
//
// Following ADR-0009, core decides who is notified: it owns memberships and
// sends the recipients with each notification request. chat keeps no copy
// of memberships; it stores what it is told. Only these event types reach
// chat (an explicit list in core's relay): notification.requested,
// tayfa.purged, membership.changed and the tayfa state changes
// (tayfa.warned, tayfa.archived, tayfa.reactivated, tayfa.deleted,
// tayfa.deletion_requested, tayfa.deletion_cancelled).
service CoreEventService {
  // ApplyCoreEvent applies one core event.
  //
  // notification_requested writes one in-app notification per recipient,
  // at most once per event and recipient; a recipient whose account was
  // deleted is skipped. tayfa_purged removes the tayfa's notifications,
  // notification preferences and channels with their messages.
  //
  // membership_changed and tayfa_status_changed carry no state: chat drops
  // the channel permissions it keeps for a few seconds (the user's in the
  // tayfa, or everyone's in the tayfa) and asks core again (issue #81).
  rpc ApplyCoreEvent(ApplyCoreEventRequest) returns (ApplyCoreEventResponse);
}

message ApplyCoreEventRequest {
  // Outbox event ID in core (UUIDv7).
  string event_id = 1;
  // The tayfa the event belongs to (UUID). Empty only for a
  // notification_requested that is not about a tayfa (FRIEND_REQUEST,
  // FRIEND_ACCEPTED).
  string tayfa_id = 2;
  // The user who made the change (UUID); empty for the system (background
  // jobs, account deletion).
  string actor_id = 3;
  google.protobuf.Timestamp occurred_at = 4;

  oneof event {
    NotificationRequested notification_requested = 10;
    TayfaPurged tayfa_purged = 11;
    MembershipChanged membership_changed = 12;
    TayfaStatusChanged tayfa_status_changed = 13;
  }
}

// NotificationRequested is one notification for many recipients. It
// carries IDs and classification only, never content text: clients read
// the content from core with the target ID, and core checks access again.
message NotificationRequested {
  NotificationType type = 1;
  NotificationTargetType target_type = 2;
  string target_id = 3;
  // Users chosen by core, never the actor (UUIDs, 1–200; a large audience
  // comes as several events): active members for tayfa notifications, the
  // one person concerned for FRIEND_REQUEST, FRIEND_ACCEPTED and
  // TAYFA_INVITATION.
  repeated string recipient_ids = 4;
  // ANSWER_RECEIVED: the answered question.
  string question_id = 5;
  // HIKE_OVERDUE: the hiker who did not return.
  string subject_user_id = 6;
  // TAYFA_WARNED: why.
  TayfaWarningReason warning_reason = 7;
}

// The tayfa was deleted for good (30 days after its deletion).
message TayfaPurged {}

// MembershipChanged: a member's role, mute or status changed in the tayfa
// (joined, left, removed, banned …). Which change is not said.
message MembershipChanged {
  // The member (UUID).
  string user_id = 1;
}

// TayfaStatusChanged: the tayfa became read-only or writable again, or was
// deleted. Which change is not said.
message TayfaStatusChanged {}

message ApplyCoreEventResponse {}
