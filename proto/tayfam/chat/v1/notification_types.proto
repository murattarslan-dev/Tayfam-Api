syntax = "proto3";

package tayfam.chat.v1;

// Notification types (data model v14 "Senaryo Kuralları → Bildirimler",
// issue #64, and the background job notices of issue #66). Who receives
// each one is core's decision (ADR-0009).
enum NotificationType {
  NOTIFICATION_TYPE_UNSPECIFIED = 0;
  // A member created an event (target: EVENT); every active member.
  NOTIFICATION_TYPE_EVENT_CREATED = 1;
  // An event the recipient answered GOING, MAYBE or WAITLIST to changed
  // (target: EVENT).
  NOTIFICATION_TYPE_EVENT_UPDATED = 2;
  // Such an event was cancelled (target: EVENT).
  NOTIFICATION_TYPE_EVENT_CANCELLED = 3;
  // The recipient moved from the waitlist to GOING (target: EVENT).
  NOTIFICATION_TYPE_RSVP_PROMOTED = 4;
  // A new announcement (target: ANNOUNCEMENT); every active member.
  NOTIFICATION_TYPE_ANNOUNCEMENT = 5;
  // Someone answered the recipient's question (target: ANSWER;
  // question_id set).
  NOTIFICATION_TYPE_ANSWER_RECEIVED = 6;
  // Someone asked to join; for admins and moderators (target: MEMBERSHIP,
  // target_id is the user who asked).
  NOTIFICATION_TYPE_JOIN_REQUEST = 7;
  // The recipient's request to join was approved (target: TAYFA).
  NOTIFICATION_TYPE_JOIN_APPROVED = 8;
  // The tayfa will be deleted after the waiting period; for admins and
  // moderators (target: TAYFA).
  NOTIFICATION_TYPE_TAYFA_DELETION_REQUESTED = 9;
  // The tayfa will be archived in 7 days unless there is activity; for
  // admins and moderators (target: TAYFA; warning_reason set).
  NOTIFICATION_TYPE_TAYFA_WARNED = 10;
  // The tayfa was archived (read-only); for admins and moderators (target:
  // TAYFA).
  NOTIFICATION_TYPE_TAYFA_ARCHIVED = 11;
  // A hiker did not return in time; for the organizer and the admins and
  // moderators, never the hiker (target: EVENT; subject_user_id is the
  // hiker). Muting does not apply to it.
  NOTIFICATION_TYPE_HIKE_OVERDUE = 12;
  // Someone sent the recipient a friend request (target: USER, target_id is
  // the requester). Not about a tayfa: tayfa_id is empty (issue #71).
  NOTIFICATION_TYPE_FRIEND_REQUEST = 13;
  // The recipient's friend request was accepted (target: USER, target_id is
  // the new friend). Not about a tayfa.
  NOTIFICATION_TYPE_FRIEND_ACCEPTED = 14;
  // A friend invited the recipient into a tayfa (target: TAYFA). The
  // recipient is not a member yet; the client answers with core's
  // AcceptInvitation or DeclineInvitation.
  NOTIFICATION_TYPE_TAYFA_INVITATION = 15;
  // A report the recipient filed was resolved by the tayfa's moderators
  // (target: REPORT; issue #76). The actor is always empty: the reporter is
  // not told who handled it. The client reads the outcome from core's
  // GetMyReport.
  NOTIFICATION_TYPE_REPORT_RESOLVED = 16;
  // Someone sent the recipient a message request (target:
  // DM_CONVERSATION). Not about a tayfa. It says only that there is a new
  // request: no actor, no content (ADR-0005, v14).
  NOTIFICATION_TYPE_DM_REQUEST = 17;
  // A new direct message (target: DM_CONVERSATION). Not about a tayfa; no
  // actor, no content. At most one unread per conversation: further
  // messages add none until the conversation is read.
  NOTIFICATION_TYPE_DM_MESSAGE = 18;
  // The platform suspended the tayfa: it is read-only until the suspension
  // is lifted; for admins and moderators (target: TAYFA; issue #104). The
  // reason is shown to them in the tayfa's details, not in the notification.
  NOTIFICATION_TYPE_TAYFA_SUSPENDED = 19;
  // The platform lifted the tayfa's suspension; for admins and moderators
  // (target: TAYFA).
  NOTIFICATION_TYPE_TAYFA_UNSUSPENDED = 20;
}

enum NotificationTargetType {
  NOTIFICATION_TARGET_TYPE_UNSPECIFIED = 0;
  NOTIFICATION_TARGET_TYPE_TAYFA = 1;
  // target_id is a user ID: the membership of that user in the tayfa.
  NOTIFICATION_TARGET_TYPE_MEMBERSHIP = 2;
  NOTIFICATION_TARGET_TYPE_ANNOUNCEMENT = 3;
  NOTIFICATION_TARGET_TYPE_EVENT = 4;
  NOTIFICATION_TARGET_TYPE_ANSWER = 5;
  // target_id is a user ID: that user's profile.
  NOTIFICATION_TARGET_TYPE_USER = 6;
  // target_id is a report ID of the recipient (core's GetMyReport).
  NOTIFICATION_TARGET_TYPE_REPORT = 7;
  // target_id is a conversation ID of the recipient
  // (DirectMessageService.GetConversation).
  NOTIFICATION_TARGET_TYPE_DM_CONVERSATION = 8;
}

// Why an inactive tayfa was warned (core's cleanup job).
enum TayfaWarningReason {
  TAYFA_WARNING_REASON_UNSPECIFIED = 0;
  // No activity for 30 days.
  TAYFA_WARNING_REASON_INACTIVE = 1;
  // Fewer than three members after the first week.
  TAYFA_WARNING_REASON_FEW_MEMBERS = 2;
}
