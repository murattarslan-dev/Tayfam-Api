syntax = "proto3";

package tayfam.chat.v1;

// Notification types (data model v14 "Senaryo Kuralları → Bildirimler",
// issue #64, and the background job notices of issue #66). Who receives
// each one is core's decision (ADR-0009).
enum NotificationType {
  NOTIFICATION_TYPE_UNSPECIFIED = 0;
  // A member created an event (target: EVENT); every active member.
  NOTIFICATION_TYPE_EVENT_CREATED = 1;
  // An event the recipient answered GOING, MAYBE or WAITLIST to changed
  // (target: EVENT).
  NOTIFICATION_TYPE_EVENT_UPDATED = 2;
  // Such an event was cancelled (target: EVENT).
  NOTIFICATION_TYPE_EVENT_CANCELLED = 3;
  // The recipient moved from the waitlist to GOING (target: EVENT).
  NOTIFICATION_TYPE_RSVP_PROMOTED = 4;
  // A new announcement (target: ANNOUNCEMENT); every active member.
  NOTIFICATION_TYPE_ANNOUNCEMENT = 5;
  // Someone answered the recipient's question (target: ANSWER;
  // question_id set).
  NOTIFICATION_TYPE_ANSWER_RECEIVED = 6;
  // Someone asked to join; for admins and moderators (target: MEMBERSHIP,
  // target_id is the user who asked).
  NOTIFICATION_TYPE_JOIN_REQUEST = 7;
  // The recipient's request to join was approved (target: TAYFA).
  NOTIFICATION_TYPE_JOIN_APPROVED = 8;
  // The tayfa will be deleted after the waiting period; for admins and
  // moderators (target: TAYFA).
  NOTIFICATION_TYPE_TAYFA_DELETION_REQUESTED = 9;
  // The tayfa will be archived in 7 days unless there is activity; for
  // admins and moderators (target: TAYFA; warning_reason set).
  NOTIFICATION_TYPE_TAYFA_WARNED = 10;
  // The tayfa was archived (read-only); for admins and moderators (target:
  // TAYFA).
  NOTIFICATION_TYPE_TAYFA_ARCHIVED = 11;
  // A hiker did not return in time; for the organizer and the admins and
  // moderators, never the hiker (target: EVENT; subject_user_id is the
  // hiker). Muting does not apply to it.
  NOTIFICATION_TYPE_HIKE_OVERDUE = 12;
  // Someone sent the recipient a friend request (target: USER, target_id is
  // the requester). Not about a tayfa: tayfa_id is empty (issue #71).
  NOTIFICATION_TYPE_FRIEND_REQUEST = 13;
  // The recipient's friend request was accepted (target: USER, target_id is
  // the new friend). Not about a tayfa.
  NOTIFICATION_TYPE_FRIEND_ACCEPTED = 14;
  // A friend invited the recipient into a tayfa (target: TAYFA). The
  // recipient is not a member yet; the client answers with core's
  // AcceptInvitation or DeclineInvitation.
  NOTIFICATION_TYPE_TAYFA_INVITATION = 15;
  // A report the recipient filed was resolved by the tayfa's moderators
  // (target: REPORT; issue #76). The actor is always empty: the reporter is
  // not told who handled it. The client reads the outcome from core's
  // GetMyReport.
  NOTIFICATION_TYPE_REPORT_RESOLVED = 16;
  // Someone sent the recipient a message request (target:
  // DM_CONVERSATION). Not about a tayfa. It says only that there is a new
  // request: no actor, no content (ADR-0005, v14).
  NOTIFICATION_TYPE_DM_REQUEST = 17;
  // A new direct message (target: DM_CONVERSATION). Not about a tayfa; no
  // actor, no content. At most one unread per conversation: further
  // messages add none until the conversation is read.
  NOTIFICATION_TYPE_DM_MESSAGE = 18;
  // The platform suspended the tayfa: it is read-only until the suspension
  // is lifted; for admins and moderators (target: TAYFA; issue #104). The
  // reason is shown to them in the tayfa's details, not in the notification.
  NOTIFICATION_TYPE_TAYFA_SUSPENDED = 19;
  // The platform lifted the tayfa's suspension; for admins and moderators
  // (target: TAYFA).
  NOTIFICATION_TYPE_TAYFA_UNSUSPENDED = 20;
  // The recipient's KVKK data export is ready to download for 7 days
  // (target: DATA_EXPORT; issue #144, ADR-0021). identity asks for it; no
  // tayfa, no actor.
  NOTIFICATION_TYPE_DATA_EXPORT_READY = 21;
  // core suggests target_id as a friend: they attended at least three
  // events together lately (target: USER, target_id is the suggested user;
  // issue #208, ADR-0030). Not about a tayfa, no actor (the system). Never
  // carries why or the score. In-app only: no push is sent for it. The
  // client reads open suggestions from core's ListFriendSuggestions.
  NOTIFICATION_TYPE_FRIEND_SUGGESTION = 22;
  // The recipient is someone's safety contact for an event, and that person
  // did not mark "back" by the event's end plus their grace time (issue
  // #210, ADR-0033). Only the chosen contact gets it. Target: USER,
  // target_id is the participant. Not about a tayfa, no actor, no content,
  // no location; the client reads the shared event from core's
  // DiscoverService.ListSafetyShares. Muting does not apply; push is sent.
  NOTIFICATION_TYPE_SAFETY_ALERT = 23;
  // The organizer announced the winner of a celebration component of the
  // event (target: EVENT; issue #255, ADR-0025 §4). Goes to the tayfa's
  // active members but the announcer, once per celebration. Never names the
  // winner (a guest winner has no name to give); the client reads the
  // celebration from core's CelebrationComponentService. In-app only: no
  // push is sent for it.
  NOTIFICATION_TYPE_CELEBRATION = 24;
  // A badge was earned (issue #258, ADR-0039 §4). No actor; never names
  // the badge: the client reads badges from the profile or the tayfa. A
  // personal badge goes to its earner (target: USER, the earner; no
  // tayfa); a tayfa badge goes to the tayfa's admins and moderators
  // (target: TAYFA). In-app only: no push is sent for it.
  NOTIFICATION_TYPE_BADGE_EARNED = 25;
  // A now event started (issue #265, ADR-0038 §4; target: EVENT; the actor
  // is its organizer). A tayfa's now event goes to its active members but
  // the organizer and anyone blocked with the organizer either way, at
  // most 3 a day per tayfa; an instant now event goes to the friends the
  // organizer chose, who are invited directly (accepting the tayfa's
  // invitation joins). Never a title, type, place or name; the push holds
  // the push_now_started_title / _body keys only. Muted with the tayfa's
  // level NONE or with its NOTIFICATION_SCOPE_TYPE_TAYFA_NOW preference.
  NOTIFICATION_TYPE_NOW_STARTED = 26;
  // A library loan's return date passed (issue #270, ADR-0040 §1): one
  // reminder to the borrower (target: TAYFA, the loan's tayfa; no actor).
  // Never names the item, the owner or the date: the client reads the
  // caller's loans from TayfaLibraryService. In-app only: no push.
  NOTIFICATION_TYPE_LIBRARY_DUE = 27;
  // One side of a handed-over library loan left the tayfa (issue #270,
  // ADR-0040 §1): a warning to both the owner and the borrower, the one who
  // left included (target: TAYFA; no actor). The loan stays open for 30
  // days, then closes. Never names the item or the people. In-app only.
  NOTIFICATION_TYPE_LIBRARY_LOAN_ORPHANED = 28;
  // The library's loan steps (issue #321; ADR-0040 §1, revised 2026-11-23).
  // Each is about one item (target: LIBRARY_ITEM, the item's ID), names the
  // member who took the step as actor and goes to the other side only:
  // never to anyone blocked with the actor either way. Never names the
  // item or the people; the push holds the push_<type>_title / _body keys
  // and IDs only. Pushed, muted with the tayfa's preference; personal, so
  // level MENTIONS still pushes them.
  //
  // A member asked for the recipient's item and has the loan request
  // (actor: the borrower).
  NOTIFICATION_TYPE_LIBRARY_LOAN_REQUESTED = 29;
  // A member took a place in the queue of the recipient's item, which is
  // on loan or asked for (actor: the member waiting).
  NOTIFICATION_TYPE_LIBRARY_QUEUE_JOINED = 30;
  // The owner (actor) approved the recipient's loan request.
  NOTIFICATION_TYPE_LIBRARY_LOAN_APPROVED = 31;
  // The owner (actor) declined the recipient's loan request.
  NOTIFICATION_TYPE_LIBRARY_LOAN_DECLINED = 32;
  // The owner (actor) recorded handing the item over to the recipient.
  NOTIFICATION_TYPE_LIBRARY_LOAN_HANDED_OVER = 33;
  // The recipient's place in the queue of an item came: the loan before
  // ended and their loan request is now open, waiting for the owner
  // (issue #332; ADR-0040 §1, revised 2026-11-23). About the item (target:
  // LIBRARY_ITEM), without an actor: nobody took this step for them. Not
  // sent while the recipient and the item's owner have blocked each other
  // either way. Never names the item or the people; pushed with the
  // push_<type>_title / _body keys and IDs only, personal like the steps
  // above.
  NOTIFICATION_TYPE_LIBRARY_QUEUE_TURN = 34;
}

enum NotificationTargetType {
  NOTIFICATION_TARGET_TYPE_UNSPECIFIED = 0;
  NOTIFICATION_TARGET_TYPE_TAYFA = 1;
  // target_id is a user ID: the membership of that user in the tayfa.
  NOTIFICATION_TARGET_TYPE_MEMBERSHIP = 2;
  NOTIFICATION_TARGET_TYPE_ANNOUNCEMENT = 3;
  NOTIFICATION_TARGET_TYPE_EVENT = 4;
  NOTIFICATION_TARGET_TYPE_ANSWER = 5;
  // target_id is a user ID: that user's profile.
  NOTIFICATION_TARGET_TYPE_USER = 6;
  // target_id is a report ID of the recipient (core's GetMyReport).
  NOTIFICATION_TARGET_TYPE_REPORT = 7;
  // target_id is a conversation ID of the recipient
  // (DirectMessageService.GetConversation).
  NOTIFICATION_TARGET_TYPE_DM_CONVERSATION = 8;
  // target_id is a data export request of the recipient (identity's
  // DataExportService.GetDataExport).
  NOTIFICATION_TARGET_TYPE_DATA_EXPORT = 9;
  // target_id is a library item of the notification's tayfa
  // (TayfaLibraryService.GetLibraryItem; issue #321).
  NOTIFICATION_TARGET_TYPE_LIBRARY_ITEM = 10;
}

// Why an inactive tayfa was warned (core's cleanup job).
enum TayfaWarningReason {
  TAYFA_WARNING_REASON_UNSPECIFIED = 0;
  // No activity for 30 days.
  TAYFA_WARNING_REASON_INACTIVE = 1;
  // Fewer than three members after the first week.
  TAYFA_WARNING_REASON_FEW_MEMBERS = 2;
}
