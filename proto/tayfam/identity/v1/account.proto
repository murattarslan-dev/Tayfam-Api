syntax = "proto3";

package tayfam.identity.v1;

import "google/protobuf/timestamp.proto";
import "tayfam/identity/v1/auth.proto";

// AccountService holds the caller's own account settings that identity owns:
// the referral code and who sees the attendance history (data model v14
// "Arkadaşlık ve Davet (v11)", "Profil görünürlüğü"; issue #71), sessions,
// consents to new text versions and account deletion (issue #75).
//
// Every method needs a full access token: a registration-only token
// (aud=tayfam-registration) is refused with UNAUTHENTICATED. The caller
// always comes from the verified token. Errors use the ErrorReason values in
// auth.proto.
service AccountService {
  // GetAccount returns the caller's referral code and settings.
  rpc GetAccount(GetAccountRequest) returns (GetAccountResponse);
  // RotateReferralCode gives the caller a new referral code. The old code,
  // and every link that carries it, finds nobody from then on.
  rpc RotateReferralCode(RotateReferralCodeRequest) returns (RotateReferralCodeResponse);
  // FindUserByReferralCode returns the user behind a referral code: ID, name
  // and avatar only, never tayfas, history or friends. Every call counts
  // toward the caller's limit of 10 per hour, found or not
  // (ERROR_REASON_RATE_LIMITED); a code that finds nobody is
  // ERROR_REASON_REFERRAL_CODE_NOT_FOUND.
  rpc FindUserByReferralCode(FindUserByReferralCodeRequest) returns (FindUserByReferralCodeResponse);
  // SetActivityVisibility changes who sees the caller's attendance history.
  // core gets the new setting with the profile copy (user.profile_updated).
  rpc SetActivityVisibility(SetActivityVisibilityRequest) returns (SetActivityVisibilityResponse);

  // ListSessions returns the caller's open sessions, one per signed-in
  // device. No IP address and no token is returned. The session methods
  // refuse a token whose own session is ended (UNAUTHENTICATED), even before
  // the token expires.
  rpc ListSessions(ListSessionsRequest) returns (ListSessionsResponse);
  // RevokeSession ends one of the caller's sessions; its refresh token stops
  // working at once. An unknown session, an ended one or another user's is
  // ERROR_REASON_SESSION_NOT_FOUND.
  rpc RevokeSession(RevokeSessionRequest) returns (RevokeSessionResponse);
  // RevokeOtherSessions ends every session of the caller but the current one.
  rpc RevokeOtherSessions(RevokeOtherSessionsRequest) returns (RevokeOtherSessionsResponse);

  // GetConsents returns the current text versions and whether the caller
  // must accept them (Tokens.consent_required).
  rpc GetConsents(GetConsentsRequest) returns (GetConsentsResponse);
  // AcceptConsents records that the caller accepted the current versions.
  // Versions that are not the current ones are
  // ERROR_REASON_CONSENT_OUTDATED.
  rpc AcceptConsents(AcceptConsentsRequest) returns (AcceptConsentsResponse);

  // DeleteAccount deletes the caller's account (KVKK). The caller must have
  // signed in with the provider in the last 10 minutes: both the access
  // token and its session must be that recent, otherwise
  // ERROR_REASON_REAUTHENTICATION_REQUIRED. Personal data is cleared at once,
  // every session ends and core and chat are told (user.deleted). Signing in
  // with the same provider account later opens a new account.
  rpc DeleteAccount(DeleteAccountRequest) returns (DeleteAccountResponse);
}

// ActivityVisibility is who sees the user's attendance history.
enum ActivityVisibility {
  ACTIVITY_VISIBILITY_UNSPECIFIED = 0;
  // Nobody but the user.
  ACTIVITY_VISIBILITY_PRIVATE = 1;
  // Friends see all of it; members of a shared tayfa see it without the
  // last 14 days. The default.
  ACTIVITY_VISIBILITY_TAYFA = 2;
  // Friends see all of it; everyone else without the last 14 days.
  ACTIVITY_VISIBILITY_PUBLIC = 3;
}

message GetAccountRequest {}

message GetAccountResponse {
  // Such as "TYF-8K2M4Q"; the share link is tayfam.app/r/<code>.
  string referral_code = 1;
  ActivityVisibility activity_visibility = 2;
}

message RotateReferralCodeRequest {}

message RotateReferralCodeResponse {
  string referral_code = 1;
}

message FindUserByReferralCodeRequest {
  // With or without the "TYF-" prefix, in any case.
  string referral_code = 1;
}

message FindUserByReferralCodeResponse {
  string user_id = 1;
  string display_name = 2;
  // Upload ID (UUID) of the avatar; empty when there is none.
  string avatar_upload_id = 3;
}

message SetActivityVisibilityRequest {
  ActivityVisibility activity_visibility = 1;
}

message SetActivityVisibilityResponse {
  ActivityVisibility activity_visibility = 1;
}

message ListSessionsRequest {}

message Session {
  string session_id = 1;
  Platform platform = 2;
  google.protobuf.Timestamp create_time = 3;
  // Last token refresh of the session.
  google.protobuf.Timestamp last_seen_time = 4;
  // The session of the access token of this request.
  bool current = 5;
}

message ListSessionsResponse {
  // Most recently used first; at most 100.
  repeated Session sessions = 1;
}

message RevokeSessionRequest {
  string session_id = 1;
}

message RevokeSessionResponse {}

message RevokeOtherSessionsRequest {}

message RevokeOtherSessionsResponse {
  int32 revoked_count = 1;
}

message GetConsentsRequest {}

message GetConsentsResponse {
  string privacy_notice_version = 1;
  string terms_version = 2;
  bool consent_required = 3;
}

message AcceptConsentsRequest {
  // The versions the client showed; they must be the current ones.
  string privacy_notice_version = 1;
  string terms_version = 2;
}

message AcceptConsentsResponse {}

message DeleteAccountRequest {}

message DeleteAccountResponse {}
