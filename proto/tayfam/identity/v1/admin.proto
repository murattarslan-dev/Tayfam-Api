syntax = "proto3";

package tayfam.identity.v1;

import "google/protobuf/timestamp.proto";

// AdminAuthService is the access layer of the platform administration panel
// (ADR-0008, issue #104). Only gateway's admin router (admin.tayfam.app)
// calls it, after verifying the Cloudflare Access JWT of the request.
//
// Authentication: AdminSignIn is callable without a token; it is how the
// panel gets one. Every other method accepts only an admin token
// (typ admin+jwt, aud tayfam-admin); an app access token, a registration
// token or a service token is UNAUTHENTICATED. Admin tokens are accepted by
// no other service of identity.
//
// Errors carry a google.rpc.ErrorInfo detail with an ERROR_REASON_* name
// from auth.proto, domain "identity.tayfam.app".
service AdminAuthService {
  // AdminSignIn checks a Google ID token, matches its verified e-mail
  // address to the Cloudflare Access identity, checks platform_admins and
  // returns an admin token valid for 8 hours. The ID token must have been
  // issued in the last 5 minutes. Every refusal is UNAUTHENTICATED with
  // ERROR_REASON_INVALID_CREDENTIALS, whatever the cause. A successful
  // sign-in is written to the platform audit log.
  rpc AdminSignIn(AdminSignInRequest) returns (AdminSignInResponse);
  // GetAdmin returns the administrator of the admin token. It fails with
  // UNAUTHENTICATED once the user is no longer in platform_admins, so
  // removing the row ends open panel sessions.
  rpc GetAdmin(GetAdminRequest) returns (GetAdminResponse);
}

message AdminSignInRequest {
  // Google ID token. Never logged.
  string id_token = 1;
  // Nonce gateway generated for this attempt (kept in an HttpOnly cookie).
  string nonce = 2;
  // E-mail address from the Cloudflare Access JWT gateway verified on this
  // request. Never logged or stored.
  string access_email = 3;
}

message AdminSignInResponse {
  string user_id = 1;
  // Admin token. gateway puts it in an HttpOnly cookie on the admin host
  // only. Never logged.
  string admin_token = 2;
  google.protobuf.Timestamp expire_time = 3;
  // When Google signed the administrator in. Destructive actions need it
  // to be at most 5 minutes old.
  google.protobuf.Timestamp auth_time = 4;
}

message GetAdminRequest {}

message GetAdminResponse {
  string user_id = 1;
  string display_name = 2;
  google.protobuf.Timestamp auth_time = 3;
  google.protobuf.Timestamp expire_time = 4;
}

// AdminUserService is the panel's user management (issue #104 stage 2;
// Notion "Platform Yönetim Paneli → Kullanıcılar"). Every method accepts
// only an admin token, and identity checks platform_admins again on every
// call. It never returns a birth date, an IP address, a token or a device
// detail. Changes need a reason (10–1000 characters) and a Google sign-in
// in the last 5 minutes (PERMISSION_DENIED with
// ERROR_REASON_REAUTHENTICATION_REQUIRED otherwise) and are written to the
// platform audit log in the same transaction.
service AdminUserService {
  // SearchUsers finds users by display name (substring, case-insensitive),
  // referral code or e-mail address (exact, case-insensitive). At most 20.
  rpc SearchUsers(SearchUsersRequest) returns (SearchUsersResponse);
  // GetUser returns one user's account state. The tayfas the user is a
  // member of come from core (AdminService.ListUserTayfas).
  rpc GetUser(GetUserRequest) returns (GetUserResponse);
  // RevokeUserSessions ends every session of the user (session.revoked for
  // each).
  rpc RevokeUserSessions(RevokeUserSessionsRequest) returns (RevokeUserSessionsResponse);
  // SanctionUser suspends (until end_time) or bans the user platform-wide:
  // every session ends, sign-in and refresh are refused while it is active,
  // user.sanctioned goes to chat and, for a ban, user.banned to core, which
  // hides the user's content (it is not deleted, for the appeal).
  rpc SanctionUser(SanctionUserRequest) returns (SanctionUserResponse);
  // LiftSanction ends the user's active sanction; for a ban, user.unbanned
  // goes to core.
  rpc LiftSanction(LiftSanctionRequest) returns (LiftSanctionResponse);
  // GetUserStats returns the panel dashboard's user counts (issue #110).
  // Counts only: no user ID, name or other personal data.
  rpc GetUserStats(GetUserStatsRequest) returns (GetUserStatsResponse);
}

enum SanctionType {
  SANCTION_TYPE_UNSPECIFIED = 0;
  SANCTION_TYPE_SUSPEND = 1;
  SANCTION_TYPE_BAN = 2;
}

message SearchUsersRequest {
  // 2–100 characters.
  string query = 1;
}

message SearchUsersResponse {
  repeated AdminUserSummary users = 1;
}

message AdminUserSummary {
  string user_id = 1;
  string display_name = 2;
  string referral_code = 3;
  bool registered = 4;
  bool deleted = 5;
  SanctionType active_sanction = 6;
}

message GetUserRequest {
  string user_id = 1;
}

message GetUserResponse {
  AdminUserSummary user = 1;
  google.protobuf.Timestamp create_time = 2;
  int32 active_sessions = 3;
  // Set while a sanction is active.
  Sanction sanction = 4;
}

message Sanction {
  string sanction_id = 1;
  SanctionType type = 2;
  string reason = 3;
  google.protobuf.Timestamp start_time = 4;
  // Unset for a ban.
  google.protobuf.Timestamp end_time = 5;
}

message RevokeUserSessionsRequest {
  string user_id = 1;
  string reason = 2;
}

message RevokeUserSessionsResponse {
  int32 revoked = 1;
}

message SanctionUserRequest {
  string user_id = 1;
  SanctionType type = 2;
  string reason = 3;
  // Required for a suspension (1 hour to 1 year ahead); not allowed for a
  // ban.
  google.protobuf.Timestamp end_time = 4;
  // The platform report that led to it, if any (audit metadata only).
  string report_id = 5;
}

message SanctionUserResponse {
  Sanction sanction = 1;
}

message LiftSanctionRequest {
  string user_id = 1;
  string reason = 2;
}

message LiftSanctionResponse {}

message GetUserStatsRequest {}

message GetUserStatsResponse {
  // Registered accounts that are not deleted.
  int64 total_users = 1;
  // Of those, accounts with a session refreshed in the last 30 days that is
  // not revoked.
  int64 active_users = 2;
  // Accounts with an active platform sanction.
  int64 suspended_users = 3;
  int64 banned_users = 4;
  // Account deletions (KVKK erasure requests): the personal data is cleared
  // at once; the row is removed for good 30 days later by the retention
  // job. pending: deleted, not yet removed. overdue: pending for more than
  // 31 days, i.e. the retention job is behind. Data export requests are
  // not implemented yet.
  int64 deletions_pending = 5;
  int64 deletions_overdue = 6;
}

// AdminAuditService is the panel's view of the platform audit log
// (issue #110; Notion "Platform Yönetim Paneli → Denetim kaydı"). Only an
// admin token is accepted and identity checks platform_admins again on
// every call. It is a separate service from PlatformAuditService, which
// accepts only tayfam-core's service token: auth.Guard keeps admin and
// service methods in separate services.
service AdminAuditService {
  // ListPlatformAuditLogs lists audit entries newest first. Entries hold
  // the action, IDs and the written reason only; no e-mail address, message
  // text, location or token is ever written to the log (00006).
  rpc ListPlatformAuditLogs(ListPlatformAuditLogsRequest) returns (ListPlatformAuditLogsResponse);
}

message ListPlatformAuditLogsRequest {
  // 0 means 50; above 100 means 100; negative is ERROR_REASON_VALIDATION.
  int32 page_size = 1;
  // Opaque, from next_page_cursor of the same request; a cursor made for
  // other filters is ERROR_REASON_VALIDATION. (Not named page_token: the
  // panel contracts carry no field named token, TestPanelContractsCannotSee.)
  string page_cursor = 2;
  // Exact action, e.g. "tayfa.suspend". Optional.
  string action = 3;
  // user, tayfa, membership, report, moderation_term or subscription.
  // Optional.
  string target_type = 4;
  // An ID the entry concerns: its target, or the tayfa, user or report in
  // its metadata. Optional.
  string related_id = 5;
  // created_at >= start_time and < end_time. Optional.
  google.protobuf.Timestamp start_time = 6;
  google.protobuf.Timestamp end_time = 7;
}

message ListPlatformAuditLogsResponse {
  repeated PlatformAuditEntry entries = 1;
  // Empty on the last page.
  string next_page_cursor = 2;
}

message PlatformAuditEntry {
  string entry_id = 1;
  google.protobuf.Timestamp create_time = 2;
  // The platform administrator and their display name (empty once the
  // account is deleted).
  string actor_id = 3;
  string actor_display_name = 4;
  string action = 5;
  string target_type = 6;
  string target_id = 7;
  // The written reason. Shown on the panel only.
  string reason = 8;
  // IDs from the entry's metadata, if any.
  string tayfa_id = 9;
  string user_id = 10;
  string report_id = 11;
}

// PlatformAuditService receives core's platform panel actions for the
// platform audit log (issue #104 stage 2). core writes each action and its
// audit entry in one transaction to its outbox; the relay delivers it here
// at least once. Only a service token of tayfam-core (ADR-0013) is
// accepted. Recording is idempotent: the entry's ID is core's event ID.
service PlatformAuditService {
  rpc RecordPlatformAudit(RecordPlatformAuditRequest) returns (RecordPlatformAuditResponse);
}

message RecordPlatformAuditRequest {
  // core's outbox event ID (UUIDv7); the audit entry's ID.
  string event_id = 1;
  google.protobuf.Timestamp occur_time = 2;
  // The platform administrator.
  string actor_id = 3;
  // "<area>.<verb>", e.g. "tayfa.suspend".
  string action = 4;
  // user, tayfa, membership or report.
  string target_type = 5;
  string target_id = 6;
  string reason = 7;
  // The admin token's session; IDs only.
  string admin_session_id = 8;
  // The tayfa the action concerns, if any.
  string tayfa_id = 9;
  // The user the action concerns, if any (a member whose role changed, the
  // reported person).
  string user_id = 10;
  // The platform report the action decided, if any.
  string report_id = 11;
}

message RecordPlatformAuditResponse {}
