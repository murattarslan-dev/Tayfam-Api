syntax = "proto3";

package tayfam.identity.v1;

import "google/protobuf/timestamp.proto";

// AuthService signs users in with a provider ID token, rotates refresh
// tokens and ends sessions (ADR-0004). Only gateway calls it.
//
// SignIn and Refresh are callable without an access token: they are how a
// client gets one. Errors carry a google.rpc.ErrorInfo detail whose reason
// is one of the ERROR_REASON_* names below, domain "identity.tayfam.app".
service AuthService {
  rpc SignIn(SignInRequest) returns (SignInResponse);
  rpc Refresh(RefreshRequest) returns (RefreshResponse);
  // SignOut ends the caller's session (from the access token).
  rpc SignOut(SignOutRequest) returns (SignOutResponse);
}

enum Provider {
  PROVIDER_UNSPECIFIED = 0;
  PROVIDER_GOOGLE = 1;
  PROVIDER_APPLE = 2;
}

enum Platform {
  PLATFORM_UNSPECIFIED = 0;
  PLATFORM_ANDROID = 1;
  PLATFORM_IOS = 2;
  PLATFORM_WEB = 3;
}

// Reasons in google.rpc.ErrorInfo; listed here so clients share one source.
enum ErrorReason {
  ERROR_REASON_UNSPECIFIED = 0;
  // The provider token, nonce or platform was not accepted.
  ERROR_REASON_INVALID_CREDENTIALS = 1;
  ERROR_REASON_UNSUPPORTED_PROVIDER = 2;
  // Registration was refused because of the age limit (ADR-0012).
  ERROR_REASON_AGE_BLOCKED = 3;
  // The refresh token is unknown, used, expired or its session ended.
  ERROR_REASON_INVALID_REFRESH = 4;
  // The same refresh token was used twice at once; retry is pointless, the
  // other request got the new token.
  ERROR_REASON_REFRESH_CONFLICT = 5;
  // Registration (RegistrationService).
  ERROR_REASON_INVALID_BIRTH_DATE = 6;
  // The accepted document versions are not the current ones; fetch
  // requirements again and show the new texts.
  ERROR_REASON_CONSENT_OUTDATED = 7;
  ERROR_REASON_ALREADY_REGISTERED = 8;
  ERROR_REASON_INVALID_DISPLAY_NAME = 9;
  // Account (AccountService, issue #71).
  // RESOURCE_EXHAUSTED. More than 10 referral code lookups in the last hour.
  ERROR_REASON_RATE_LIMITED = 10;
  // NOT_FOUND. No registered user has this referral code: it is malformed,
  // unknown, or was replaced by a new one.
  ERROR_REASON_REFERRAL_CODE_NOT_FOUND = 11;
  // Account management (AccountService, issue #75).
  // PERMISSION_DENIED. Deleting the account needs a sign-in with the
  // provider in the last 10 minutes; sign in again and retry with the new
  // access token. A refreshed token is not enough.
  ERROR_REASON_REAUTHENTICATION_REQUIRED = 12;
  // NOT_FOUND. The caller has no open session with this ID; another
  // user's session gives the same answer.
  ERROR_REASON_SESSION_NOT_FOUND = 13;
  // Platform panel (issue #104).
  // PERMISSION_DENIED. Sign-in or refresh of an account under an active
  // platform suspension or ban.
  ERROR_REASON_ACCOUNT_SANCTIONED = 14;
  // INVALID_ARGUMENT. A panel change without a reason of 10–1000
  // characters.
  ERROR_REASON_REASON_REQUIRED = 15;
  // NOT_FOUND. No such user.
  ERROR_REASON_USER_NOT_FOUND = 16;
  // FAILED_PRECONDITION. The user already has an active sanction
  // (SanctionUser) or has none (LiftSanction).
  ERROR_REASON_SANCTION_CONFLICT = 17;
  // INVALID_ARGUMENT. Any other invalid field.
  ERROR_REASON_VALIDATION = 18;
  // Avatar (AccountService.SetAvatar, issue #135): core's answer about the
  // upload, under identity's own reasons. NOT_FOUND: no such AVATAR upload
  // of the caller.
  ERROR_REASON_UPLOAD_NOT_FOUND = 19;
  // FAILED_PRECONDITION. The upload is not processed (yet) or was rejected.
  ERROR_REASON_UPLOAD_NOT_READY = 20;
  // FAILED_PRECONDITION. The upload is attached to other content.
  ERROR_REASON_UPLOAD_IN_USE = 21;
  // KVKK data export (DataExportService, issue #144). NOT_FOUND: no such
  // request of the caller (another user's is the same).
  ERROR_REASON_DATA_EXPORT_NOT_FOUND = 22;
  // FAILED_PRECONDITION. Another request of the caller is being prepared.
  ERROR_REASON_DATA_EXPORT_IN_PROGRESS = 23;
  // RESOURCE_EXHAUSTED. One request in 30 days; failed ones do not count.
  ERROR_REASON_DATA_EXPORT_LIMIT = 24;
  // FAILED_PRECONDITION. The export is not ready (pending, processing or
  // failed).
  ERROR_REASON_DATA_EXPORT_NOT_READY = 25;
  // FAILED_PRECONDITION. The 7 days are over; the file is deleted.
  ERROR_REASON_DATA_EXPORT_EXPIRED = 26;
}

message SignInRequest {
  Provider provider = 1;
  // ID token from the provider SDK. Never logged.
  string id_token = 2;
  // Nonce the client passed to the provider SDK (ADR-0004).
  string nonce = 3;
  Platform platform = 4;
}

message SignInResponse {
  Tokens tokens = 1;
}

message RefreshRequest {
  // Never logged.
  string refresh_token = 1;
}

message RefreshResponse {
  Tokens tokens = 1;
}

message SignOutRequest {}

message SignOutResponse {}

message Tokens {
  string user_id = 1;
  string session_id = 2;
  string access_token = 3;
  google.protobuf.Timestamp access_expire_time = 4;
  string refresh_token = 5;
  google.protobuf.Timestamp refresh_expire_time = 6;
  // True until registration (birth date, consents) is complete. The access
  // token then only reaches registration methods (ADR-0012).
  bool registration_pending = 7;
  // True when the user is registered but has not accepted the current
  // version of the privacy notice or terms (data model v14 "Onay kaydı").
  // The client shows the new texts and calls AccountService.AcceptConsents.
  bool consent_required = 8;
}
