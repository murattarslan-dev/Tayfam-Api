# Yerel geliştirme ortamı (ADR-0006). Yalnızca gateway dışarı açılır.
#   make up        # her seferinde yeni bir imzalama anahtarı üretir
#   curl http://localhost:8080/v1/status

x-service: &service
  environment: &env
    TAYFAM_ENV: local
    LOG_LEVEL: debug
    AUTH_ISSUER: tayfam-identity
    AUTH_AUDIENCE: tayfam-api
  restart: unless-stopped

services:
  gateway:
    <<: *service
    build:
      context: .
      args: { SERVICE: gateway }
    environment:
      <<: *env
      IDENTITY_GRPC_ADDR: identity:9090
      CORE_GRPC_ADDR: core:9090
      CHAT_GRPC_ADDR: chat:9090
      # WebSocket (GET /v1/realtime) chat'in HTTP portuna aktarılır.
      CHAT_REALTIME_URL: http://chat:8080
      # Uygulamanın web geliştirme derlemesi (ADR-0017):
      # flutter run -d chrome --web-port 3000
      WEB_DEV_ORIGINS: http://localhost:3000
    ports:
      - "127.0.0.1:8080:8080"

  identity:
    <<: *service
    build:
      context: .
      args: { SERVICE: identity }
    environment:
      <<: *env
      AUTH_SIGNING_KEY: ${AUTH_SIGNING_KEY:?make up ile başlatın; anahtarı o üretir}
      IDENTITY_BIRTHDATE_KEYS: ${IDENTITY_BIRTHDATE_KEYS:?make up ile başlatın; anahtarı o üretir}
      DB_HOST: postgres
      DB_NAME: identity
      DB_USER: identity_app
      DB_PASSWORD: yerel
      DB_SSLMODE: disable
      GOOGLE_CLIENT_IDS: ${GOOGLE_CLIENT_IDS:-yerel-gelistirme.apps.googleusercontent.com}
      CONSENT_PRIVACY_NOTICE_VERSION: "2026-11-08"
      CONSENT_TERMS_VERSION: "2026-11-08"
    depends_on:
      identity-migrate: { condition: service_completed_successfully }

  identity-migrate:
    build:
      context: .
      args: { SERVICE: identity }
    command: ["migrate"]
    environment:
      DB_HOST: postgres
      DB_NAME: identity
      DB_USER: identity
      DB_PASSWORD: yerel
      DB_SSLMODE: disable
    depends_on:
      postgres: { condition: service_healthy }

  core:
    <<: *service
    build:
      context: .
      args: { SERVICE: core }
    environment:
      <<: *env
      IDENTITY_GRPC_ADDR: identity:9090
      DB_HOST: postgres
      DB_NAME: core
      DB_USER: core_app
      DB_PASSWORD: yerel
      DB_SSLMODE: disable
    depends_on:
      core-migrate: { condition: service_completed_successfully }

  core-migrate:
    build:
      context: .
      args: { SERVICE: core }
    command: ["migrate"]
    environment:
      DB_HOST: postgres
      DB_NAME: core
      DB_USER: core
      DB_PASSWORD: yerel
      DB_SSLMODE: disable
    depends_on:
      postgres: { condition: service_healthy }

  chat:
    <<: *service
    build:
      context: .
      args: { SERVICE: chat }
    environment:
      <<: *env
      IDENTITY_GRPC_ADDR: identity:9090
      CORE_GRPC_ADDR: core:9090
      # Kanal mesajı anahtarı; make up her seferinde yenisini üretir (eski
      # mesajlar okunamaz). Yoksa kanallar kapalıdır (UNAVAILABLE).
      CHAT_MESSAGE_KEYS: ${CHAT_MESSAGE_KEYS:-}
      DB_HOST: postgres
      DB_NAME: chat
      DB_USER: chat_app
      DB_PASSWORD: yerel
      DB_SSLMODE: disable
    depends_on:
      chat-migrate: { condition: service_completed_successfully }

  chat-migrate:
    build:
      context: .
      args: { SERVICE: chat }
    command: ["migrate"]
    environment:
      DB_HOST: postgres
      DB_NAME: chat
      DB_USER: chat
      DB_PASSWORD: yerel
      DB_SSLMODE: disable
    depends_on:
      postgres: { condition: service_healthy }

  # Yerel geliştirme ve store testleri için Postgres. Cluster'daki CNPG
  # image'ı tek başına başlatılamaz; aynı ana ve ara sürümdeki resmi image
  # kullanılır (PostGIS core'a geçince eklenir). identity, core ve chat
  # veritabanları ve kullanıcıları ilk açılışta oluşur
  # (scripts/postgres-init.sql). Yalnızca bu makineden erişilir.
  #   make test-db
  #   TEST_DATABASE_URL=postgres://postgres:yerel@127.0.0.1:5432/postgres?sslmode=disable make test
  # Parola yalnızca yerel, atılabilir bir veritabanı içindir.
  postgres:
    image: postgres:18.6-trixie
    environment:
      POSTGRES_PASSWORD: yerel
      POSTGRES_DB: identity
      POSTGRES_INITDB_ARGS: "--locale-provider=icu --icu-locale=tr-TR --locale=C.UTF-8"
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - ./scripts/postgres-init.sql:/docker-entrypoint-initdb.d/core.sql:ro
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 2s
      retries: 30
