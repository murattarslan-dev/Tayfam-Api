apiVersion: apps/v1
kind: Deployment
metadata:
  name: chat
  labels: { app.kubernetes.io/name: chat, app.kubernetes.io/part-of: tayfam }
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels: { app.kubernetes.io/name: chat }
  template:
    metadata:
      labels: { app.kubernetes.io/name: chat, app.kubernetes.io/part-of: tayfam }
    spec:
      # Kendi ServiceAccount'u (ADR-0013). Kubernetes API'sinde hiçbir RBAC
      # yetkisi yoktur; varsayılan token pod'a hiç bağlanmaz.
      serviceAccountName: tayfam-chat
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        # Projected token ve CA dosyaları bu grupla okunur (defaultMode 0440).
        fsGroup: 65532
        seccompProfile: { type: RuntimeDefault }
      # Migration'lar servis binary'sinin "migrate" alt komutuyla, servis
      # başlamadan önce çalışır; advisory lock aynı anda tek migration'ı
      # garanti eder (ADR-0006). Şemanın sahibi chat kullanıcısıyla bağlanan
      # tek container budur (ADR-0015).
      initContainers:
        - name: migrate
          image: ghcr.io/murattarslan-dev/tayfam-chat
          args: ["migrate"]
          envFrom:
            - configMapRef: { name: tayfam-env }
          env:
            - { name: DB_HOST, value: tayfam-pg-rw }
            - { name: DB_NAME, value: chat }
            - name: DB_USER
              valueFrom:
                secretKeyRef: { name: chat-db, key: username }
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef: { name: chat-db, key: password }
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { memory: 64Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
      containers:
        - name: chat
          image: ghcr.io/murattarslan-dev/tayfam-chat
          envFrom:
            - configMapRef: { name: tayfam-env }
          env:
            - { name: OPS_ADDR, value: ":8081" }
            - { name: GRPC_ADDR, value: ":9090" }
            # WebSocket (issue #82): yalnızca gateway'den (NetworkPolicy
            # chat-realtime). Origin taşıyan (tarayıcıdan gelen) istek
            # reddedilir (ADR-0017). Bağlantılar bellektedir; replicas 1
            # kalır (ADR-0005 "Ölçekleme").
            - { name: HTTP_ADDR, value: ":8080" }
            - { name: IDENTITY_GRPC_ADDR, value: "identity:9090" }
            # Sessize almada üyelik kontrolü: core GetMembership, kullanıcının
            # kendi token'ıyla (ADR-0009). Servis token'ı gerekmez.
            - { name: CORE_GRPC_ADDR, value: "core:9090" }
            # Servis token'ı doğrulaması (ADR-0013): identity'nin ve core'un
            # outbox relay'leri olay servislerini servis token'ıyla çağırır.
            # İzinli çağıranlar bu namespace'teki ServiceAccount'lardır.
            # Issuer tayfam-env'de.
            - name: SERVICE_NAMESPACE
              valueFrom:
                fieldRef: { fieldPath: metadata.namespace }
            - { name: SERVICE_TOKEN_JWKS_URL, value: "https://kubernetes.default.svc/openid/v1/jwks" }
            - { name: SERVICE_TOKEN_CA_FILE, value: /var/run/secrets/tayfam/kube-api/ca.crt }
            - { name: SERVICE_TOKEN_API_TOKEN_FILE, value: /var/run/secrets/tayfam/kube-api/token }
            # Ortama özel secret (deploy/apps/<ortam>/secrets, SOPS ile şifreli).
            # pg_hba chat kullanıcılarını yalnızca chat veritabanına, TLS ile alır.
            # Çalışma zamanı kullanıcısı chat_app (ADR-0015); sahip
            # (chat-db) yalnızca migrate initContainer'ındadır.
            - { name: DB_HOST, value: tayfam-pg-rw }
            - { name: DB_NAME, value: chat }
            - name: DB_USER
              valueFrom:
                secretKeyRef: { name: chat-app-db, key: username }
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef: { name: chat-app-db, key: password }
            # Kanal mesajı şifreleme anahtarı (issue #81, ADR-0005). Yalnızca
            # chat okur; doğum tarihi anahtarından ayrıdır. Üretim:
            # scripts/new-chat-message-key.sh <ortam>.
            - name: CHAT_MESSAGE_KEYS
              valueFrom:
                secretKeyRef: { name: chat-message-key, key: CHAT_MESSAGE_KEYS }
          ports:
            - { name: grpc, containerPort: 9090 }
            - { name: http, containerPort: 8080 }
            - { name: ops, containerPort: 8081 }
          livenessProbe:
            httpGet: { path: /livez, port: ops }
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /readyz, port: ops }
            periodSeconds: 5
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { memory: 128Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: kube-api, mountPath: /var/run/secrets/tayfam/kube-api, readOnly: true }
      volumes:
        # Cluster'ın açık anahtarlarını (JWKS) okumak için API sunucusunun CA'sı
        # ve audience'ı API sunucusu olan 10 dakikalık token. Bu token'la
        # ServiceAccount'un yapabildiği tek şey herkese açık keşif uçlarını
        # okumaktır (system:service-account-issuer-discovery); kubelet yeniler.
        - name: kube-api
          projected:
            defaultMode: 0440
            sources:
              - serviceAccountToken:
                  path: token
                  expirationSeconds: 600
              - configMap:
                  name: kube-root-ca.crt
                  items:
                    - { key: ca.crt, path: ca.crt }
---
# gRPC ve WebSocket (http) portları servis üzerinden açılır; ops portu (8081)
# sadece kubelet probe'ları içindir ve servis üzerinden yayınlanmaz.
apiVersion: v1
kind: Service
metadata:
  name: chat
  labels: { app.kubernetes.io/name: chat, app.kubernetes.io/part-of: tayfam }
spec:
  selector: { app.kubernetes.io/name: chat }
  ports:
    - { name: grpc, port: 9090, targetPort: grpc, appProtocol: grpc }
    - { name: http, port: 8080, targetPort: http }
---
# chat'in kimliği (ADR-0013). Rol bağlanmaz.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: tayfam-chat
  labels: { app.kubernetes.io/name: chat, app.kubernetes.io/part-of: tayfam }
automountServiceAccountToken: false
