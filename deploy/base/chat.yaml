apiVersion: apps/v1
kind: Deployment
metadata:
  name: chat
  labels: { app.kubernetes.io/name: chat, app.kubernetes.io/part-of: tayfam }
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels: { app.kubernetes.io/name: chat }
  template:
    metadata:
      labels: { app.kubernetes.io/name: chat, app.kubernetes.io/part-of: tayfam }
    spec:
      # Kendi ServiceAccount'u (ADR-0013); rol bağlanmaz, token bağlanmaz.
      serviceAccountName: tayfam-chat
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile: { type: RuntimeDefault }
      # Migration'lar servis binary'sinin "migrate" alt komutuyla, servis
      # başlamadan önce çalışır; advisory lock aynı anda tek migration'ı
      # garanti eder (ADR-0006).
      initContainers:
        - name: migrate
          image: ghcr.io/murattarslan-dev/tayfam-chat
          args: ["migrate"]
          envFrom:
            - configMapRef: { name: tayfam-env }
          env:
            - { name: DB_HOST, value: tayfam-pg-rw }
            - { name: DB_NAME, value: chat }
            - name: DB_USER
              valueFrom:
                secretKeyRef: { name: chat-db, key: username }
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef: { name: chat-db, key: password }
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { memory: 64Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
      containers:
        - name: chat
          image: ghcr.io/murattarslan-dev/tayfam-chat
          envFrom:
            - configMapRef: { name: tayfam-env }
          env:
            - { name: OPS_ADDR, value: ":8081" }
            - { name: GRPC_ADDR, value: ":9090" }
            - { name: IDENTITY_GRPC_ADDR, value: "identity:9090" }
            # Ortama özel secret (deploy/apps/<ortam>/secrets, SOPS ile şifreli).
            # pg_hba chat kullanıcısını yalnızca chat veritabanına, TLS ile alır.
            - { name: DB_HOST, value: tayfam-pg-rw }
            - { name: DB_NAME, value: chat }
            - name: DB_USER
              valueFrom:
                secretKeyRef: { name: chat-db, key: username }
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef: { name: chat-db, key: password }
          ports:
            - { name: grpc, containerPort: 9090 }
            - { name: ops, containerPort: 8081 }
          livenessProbe:
            httpGet: { path: /livez, port: ops }
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /readyz, port: ops }
            periodSeconds: 5
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { memory: 128Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
---
# Yalnızca gRPC portu servis üzerinden açılır; ops portu (8081) sadece
# kubelet probe'ları içindir ve servis üzerinden yayınlanmaz.
apiVersion: v1
kind: Service
metadata:
  name: chat
  labels: { app.kubernetes.io/name: chat, app.kubernetes.io/part-of: tayfam }
spec:
  selector: { app.kubernetes.io/name: chat }
  ports:
    - { name: grpc, port: 9090, targetPort: grpc, appProtocol: grpc }
---
# chat'in kimliği (ADR-0013). Rol bağlanmaz.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: tayfam-chat
  labels: { app.kubernetes.io/name: chat, app.kubernetes.io/part-of: tayfam }
automountServiceAccountToken: false
