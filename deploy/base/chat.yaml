apiVersion: apps/v1
kind: Deployment
metadata:
  name: chat
  labels: { app.kubernetes.io/name: chat, app.kubernetes.io/part-of: tayfam }
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels: { app.kubernetes.io/name: chat }
  template:
    metadata:
      labels: { app.kubernetes.io/name: chat, app.kubernetes.io/part-of: tayfam }
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: chat
          image: ghcr.io/murattarslan-dev/tayfam-chat
          envFrom:
            - configMapRef: { name: tayfam-env }
          env:
            - { name: OPS_ADDR, value: ":8081" }
            - { name: GRPC_ADDR, value: ":9090" }
          ports:
            - { name: grpc, containerPort: 9090 }
            - { name: ops, containerPort: 8081 }
          livenessProbe:
            httpGet: { path: /livez, port: ops }
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /readyz, port: ops }
            periodSeconds: 5
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { memory: 64Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
---
# Yalnızca gRPC portu servis üzerinden açılır; ops portu (8081) sadece
# kubelet probe'ları içindir ve servis üzerinden yayınlanmaz.
apiVersion: v1
kind: Service
metadata:
  name: chat
  labels: { app.kubernetes.io/name: chat, app.kubernetes.io/part-of: tayfam }
spec:
  selector: { app.kubernetes.io/name: chat }
  ports:
    - { name: grpc, port: 9090, targetPort: grpc, appProtocol: grpc }
