# Ortamın Postgres cluster'ı (ADR-0002, ADR-0006). Tek instance; içinde servis
# başına ayrı veritabanı ve iki kullanıcı (ADR-0015):
#   <servis>      veritabanının ve şemanın sahibi; yalnızca migrate
#                 initContainer'ı kullanır (secrets/<servis>-db)
#   <servis>_app  çalışma zamanı; tablolarda yalnızca migration'ların verdiği
#                 DML, DDL ve trigger yetkisi yok (secrets/<servis>-app-db)
# Uygulama container'ı sahip parolasını hiç görmez.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: tayfam-pg
spec:
  instances: 1
  # PostgreSQL 18 + PostGIS 3.7, digest ile sabit. Kaynak: cloudnative-pg/
  # postgis-containers, image-catalogs/postgis-standard-trixie.yaml.
  imageName: ghcr.io/cloudnative-pg/postgis:18.6-3.7.0-202611030856-standard-trixie@sha256:adb255e84c710de32b5c04fefdfe549336ced2775d7060a3a1973561f18cc7de
  # Postgres süper kullanıcısının ağ üzerinden parolası yok; yönetim yalnızca
  # pod içinden (kubectl cnpg psql) yapılır.
  enableSuperuserAccess: false
  bootstrap:
    initdb:
      database: identity
      owner: identity
      secret: { name: identity-db }
      encoding: UTF8
      localeProvider: icu
      icuLocale: tr-TR
      locale: C.UTF-8
      dataChecksums: true
  managed:
    roles:
      - name: core
        ensure: present
        login: true
        connectionLimit: 20
        passwordSecret: { name: core-db }
      - name: chat
        ensure: present
        login: true
        connectionLimit: 20
        passwordSecret: { name: chat-db }
      # Çalışma zamanı kullanıcıları. Yetkilerini CNPG değil, sahibin
      # çalıştırdığı migration'lar verir (db/<servis>/migrations, *_app_role).
      # Limit 20: yuvarlanan güncellemede iki pod'un havuzu (2 x 10).
      - name: identity_app
        ensure: present
        login: true
        inherit: false
        connectionLimit: 20
        passwordSecret: { name: identity-app-db }
      - name: core_app
        ensure: present
        login: true
        inherit: false
        connectionLimit: 20
        passwordSecret: { name: core-app-db }
      - name: chat_app
        ensure: present
        login: true
        inherit: false
        connectionLimit: 20
        passwordSecret: { name: chat-app-db }
  postgresql:
    parameters:
      # 4 GB'lık ev makinesine göre (ADR-0006); prod'da büyütülür.
      shared_buffers: 128MB
      effective_cache_size: 384MB
      work_mem: 4MB
      maintenance_work_mem: 32MB
      max_connections: "60"
      password_encryption: scram-sha-256
      # Sorgu metni (ve içindeki kişisel veri) log'a girmez (ADR-0008).
      log_statement: none
      log_min_duration_statement: "-1"
      log_min_error_statement: panic
    pg_hba:
      # Şifresiz bağlantı reddedilir; uygulama kullanıcıları yalnızca TLS ve
      # SCRAM ile, yalnızca kendi veritabanlarına bağlanır.
      - hostnossl all all all reject
      - hostssl identity identity all scram-sha-256
      - hostssl identity identity_app all scram-sha-256
      - hostssl core core all scram-sha-256
      - hostssl core core_app all scram-sha-256
      - hostssl chat chat all scram-sha-256
      - hostssl chat chat_app all scram-sha-256
      - host all all all reject
  storage:
    size: 5Gi
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { memory: 768Mi }
---
# core ve chat veritabanları template1'den oluşturulur. CNPG'nin initdb'si
# template1'i (ve identity'yi) ICU tr-TR + LC_COLLATE/LC_CTYPE C ile kurar;
# veritabanları da aynı ayarla istenir ki template1 ile uyumlu olsun ve yeni
# bir cluster'da elle template1 düzeltmesi gerekmesin (eski çözüm:
# docs/runbooks/flux-kurulumu.md, "Veritabanı oluşmuyor"). Sıralama ve harf
# dönüşümü ICU tr-TR ile yapılır; LC_COLLATE/LC_CTYPE C, identity ile aynıdır.
# Bu alanlar CNPG'de değiştirilemez; force, Flux'ın kaynağı silip yeniden
# oluşturmasını sağlar (veritabanı silinmez: databaseReclaimPolicy retain).
# (template: template0 burada yazılamaz: kustomize'ın image dönüştürücüsü
# spec.template'i pod şablonu sanıp hata veriyor.)
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: tayfam-pg-core
  annotations:
    kustomize.toolkit.fluxcd.io/force: Enabled
spec:
  cluster: { name: tayfam-pg }
  name: core
  owner: core
  ensure: present
  encoding: UTF8
  localeProvider: icu
  icuLocale: tr-TR
  locale: C
  # Konum sorguları (veri modeli v14) yalnızca core'da.
  extensions:
    - { name: postgis, ensure: present }
---
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: tayfam-pg-chat
  annotations:
    kustomize.toolkit.fluxcd.io/force: Enabled
spec:
  cluster: { name: tayfam-pg }
  name: chat
  owner: chat
  ensure: present
  encoding: UTF8
  localeProvider: icu
  icuLocale: tr-TR
  locale: C
