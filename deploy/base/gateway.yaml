apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  labels: { app.kubernetes.io/name: gateway, app.kubernetes.io/part-of: tayfam }
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels: { app.kubernetes.io/name: gateway }
  template:
    metadata:
      labels: { app.kubernetes.io/name: gateway, app.kubernetes.io/part-of: tayfam }
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: gateway
          image: ghcr.io/murattarslan-dev/tayfam-gateway
          envFrom:
            - configMapRef: { name: tayfam-env }
          env:
            - { name: HTTP_ADDR, value: ":8080" }
            - { name: OPS_ADDR, value: ":8081" }
            - { name: IDENTITY_GRPC_ADDR, value: "identity:9090" }
            - { name: CORE_GRPC_ADDR, value: "core:9090" }
            - { name: CHAT_GRPC_ADDR, value: "chat:9090" }
            # WebSocket (GET /v1/realtime) chat'in HTTP portuna olduğu gibi
            # aktarılır; bileti chat doğrular (ADR-0005).
            - { name: CHAT_REALTIME_URL, value: "http://chat:8080" }
          ports:
            - { name: http, containerPort: 8080 }
            - { name: ops, containerPort: 8081 }
          livenessProbe:
            httpGet: { path: /livez, port: ops }
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /readyz, port: ops }
            periodSeconds: 5
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { memory: 64Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  labels: { app.kubernetes.io/name: gateway, app.kubernetes.io/part-of: tayfam }
spec:
  selector: { app.kubernetes.io/name: gateway }
  ports:
    - { name: http, port: 8080, targetPort: http }
