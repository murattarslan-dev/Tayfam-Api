apiVersion: apps/v1
kind: Deployment
metadata:
  name: core
  labels: { app.kubernetes.io/name: core, app.kubernetes.io/part-of: tayfam }
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels: { app.kubernetes.io/name: core }
  template:
    metadata:
      labels: { app.kubernetes.io/name: core, app.kubernetes.io/part-of: tayfam }
    spec:
      # Kendi ServiceAccount'u (ADR-0013). Kubernetes API'sinde hiçbir RBAC
      # yetkisi yoktur; varsayılan token pod'a hiç bağlanmaz.
      serviceAccountName: tayfam-core
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        # Projected token ve CA dosyaları bu grupla okunur (defaultMode 0440).
        fsGroup: 65532
        seccompProfile: { type: RuntimeDefault }
      # Migration'lar servis binary'sinin "migrate" alt komutuyla, servis
      # başlamadan önce çalışır; advisory lock aynı anda tek migration'ı
      # garanti eder (ADR-0006).
      initContainers:
        - name: migrate
          image: ghcr.io/murattarslan-dev/tayfam-core
          args: ["migrate"]
          envFrom:
            - configMapRef: { name: tayfam-env }
          env:
            - { name: DB_HOST, value: tayfam-pg-rw }
            - { name: DB_NAME, value: core }
            - name: DB_USER
              valueFrom:
                secretKeyRef: { name: core-db, key: username }
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef: { name: core-db, key: password }
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { memory: 64Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
      containers:
        - name: core
          image: ghcr.io/murattarslan-dev/tayfam-core
          envFrom:
            - configMapRef: { name: tayfam-env }
          env:
            - { name: OPS_ADDR, value: ":8081" }
            - { name: GRPC_ADDR, value: ":9090" }
            - { name: IDENTITY_GRPC_ADDR, value: "identity:9090" }
            # Servis token'ı doğrulaması (ADR-0013): identity'nin outbox relay'i
            # UserEventService'i servis token'ıyla çağırır. İzinli çağıranlar
            # bu namespace'teki ServiceAccount'lardır. Issuer tayfam-env'de.
            - name: SERVICE_NAMESPACE
              valueFrom:
                fieldRef: { fieldPath: metadata.namespace }
            - { name: SERVICE_TOKEN_JWKS_URL, value: "https://kubernetes.default.svc/openid/v1/jwks" }
            - { name: SERVICE_TOKEN_CA_FILE, value: /var/run/secrets/tayfam/kube-api/ca.crt }
            - { name: SERVICE_TOKEN_API_TOKEN_FILE, value: /var/run/secrets/tayfam/kube-api/token }
            # Outbox relay → chat CoreEventService (issue #64). Token yalnızca
            # chat audience'ı için geçerli ve 10 dakikalık.
            - { name: CHAT_GRPC_ADDR, value: "chat:9090" }
            - { name: SERVICE_TOKEN_FILE_CHAT, value: /var/run/secrets/tayfam/chat/token }
            # Ortama özel secret (deploy/apps/<ortam>/secrets, SOPS ile şifreli).
            # pg_hba core kullanıcısını yalnızca core veritabanına, TLS ile alır.
            - { name: DB_HOST, value: tayfam-pg-rw }
            - { name: DB_NAME, value: core }
            - name: DB_USER
              valueFrom:
                secretKeyRef: { name: core-db, key: username }
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef: { name: core-db, key: password }
          ports:
            - { name: grpc, containerPort: 9090 }
            - { name: ops, containerPort: 8081 }
          livenessProbe:
            httpGet: { path: /livez, port: ops }
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /readyz, port: ops }
            periodSeconds: 5
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { memory: 128Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: kube-api, mountPath: /var/run/secrets/tayfam/kube-api, readOnly: true }
            - { name: chat-token, mountPath: /var/run/secrets/tayfam/chat, readOnly: true }
      volumes:
        # Cluster'ın açık anahtarlarını (JWKS) okumak için API sunucusunun CA'sı
        # ve audience'ı API sunucusu olan 10 dakikalık token. Bu token'la
        # ServiceAccount'un yapabildiği tek şey herkese açık keşif uçlarını
        # okumaktır (system:service-account-issuer-discovery); kubelet yeniler.
        - name: kube-api
          projected:
            defaultMode: 0440
            sources:
              - serviceAccountToken:
                  path: token
                  expirationSeconds: 600
              - configMap:
                  name: kube-root-ca.crt
                  items:
                    - { key: ca.crt, path: ca.crt }
        # chat'i çağırmak için servis token'ı: audience chat.tayfam.internal,
        # 10 dakika; kubelet süresi dolmadan yeniler. Başka hiçbir hedefte ve
        # Kubernetes API'sinde geçmez.
        - name: chat-token
          projected:
            defaultMode: 0440
            sources:
              - serviceAccountToken:
                  path: token
                  audience: chat.tayfam.internal
                  expirationSeconds: 600
---
# core'un kimliği (ADR-0013). Rol bağlanmaz.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: tayfam-core
  labels: { app.kubernetes.io/name: core, app.kubernetes.io/part-of: tayfam }
automountServiceAccountToken: false
---
# Yalnızca gRPC portu servis üzerinden açılır; ops portu (8081) sadece
# kubelet probe'ları içindir ve servis üzerinden yayınlanmaz.
apiVersion: v1
kind: Service
metadata:
  name: core
  labels: { app.kubernetes.io/name: core, app.kubernetes.io/part-of: tayfam }
spec:
  selector: { app.kubernetes.io/name: core }
  ports:
    - { name: grpc, port: 9090, targetPort: grpc, appProtocol: grpc }
