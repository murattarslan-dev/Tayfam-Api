# Cloudflare Tunnel bağlayıcısı (ADR-0006). Token, Flux'ın yönetmediği
# cloudflared-token secret'ından okunur (docs/runbooks/ev-cluster-kurulumu.md).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared
  labels: { app.kubernetes.io/name: cloudflared, app.kubernetes.io/part-of: tayfam }
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels: { app.kubernetes.io/name: cloudflared }
  template:
    metadata:
      labels: { app.kubernetes.io/name: cloudflared, app.kubernetes.io/part-of: tayfam }
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: cloudflared
          image: cloudflare/cloudflared:2026.10.7
          # Ev ağında QUIC (UDP 7844) engelli; HTTP/2 kullanılır.
          args: ["tunnel", "--no-autoupdate", "--protocol", "http2", "--metrics", "0.0.0.0:2000", "run"]
          env:
            - name: TUNNEL_TOKEN
              valueFrom:
                secretKeyRef: { name: cloudflared-token, key: token }
          ports:
            - { name: metrics, containerPort: 2000 }
          livenessProbe:
            httpGet: { path: /ready, port: metrics }
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { memory: 128Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
