# Yayına kadar VDS'i SSH'sız işletmek için (ADR-0006 revizyon 2026-11-12):
#   vds-cluster  deploy/clusters/vds'i repodan uygular: Flux kaynağı ve
#                Kustomization tanımları elle kubectl apply gerektirmez.
#                prune: false; bu nesne silinirse Flux'ın kendi tanımları
#                silinmesin.
# (vds-hostops, 2026-11-12'de işi bitince kaldırıldı: AppArmor sysctl'ı ve
#  telefon SSH anahtarı node'a yazıldı; Flux tayfam-hostops namespace'ini sildi.)
# Bu dosyadaki nesneler kustomize tarafından tayfam-prod namespace'ine konur;
# kaynak flux-system'deki OCIRepository'dir.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: vds-cluster
spec:
  interval: 10m
  retryInterval: 1m
  timeout: 3m
  sourceRef:
    kind: OCIRepository
    name: tayfam-deploy
    namespace: flux-system
  path: ./clusters/vds
  prune: false
  wait: false
