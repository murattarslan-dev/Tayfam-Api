apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# prod secret'ları (SOPS ile şifreli; Flux cluster içinde prod'un age
# anahtarıyla çözer). Bu dosyayı elle düzenleme: scripts/new-*.sh betikleri
# her yeni dosyadan sonra listeyi bu dizindeki *.sops.yaml dosyalarından
# yeniden yazar. Eksik secret: scripts/check-secret-refs.sh prod
resources:
  - chat-app-db.sops.yaml
  - chat-db.sops.yaml
  - chat-fcm.sops.yaml
  - chat-message-key.sops.yaml
  - cloudflared-token.sops.yaml
  - core-app-db.sops.yaml
  - core-db.sops.yaml
  - identity-app-db.sops.yaml
  - identity-birthdate-key.sops.yaml
  - identity-db.sops.yaml
  - identity-export-key.sops.yaml
  - identity-integrity.sops.yaml
  - identity-signing-key.sops.yaml
