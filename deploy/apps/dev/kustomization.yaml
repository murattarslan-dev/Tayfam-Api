apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# dev ortamı (ev cluster'ı). Image etiketlerini CI, main'e giren her commit'te
# commit SHA'sı ile değiştirip sonucu OCI artifact olarak yayınlar
# (.github/workflows/ci.yml, "deploy-dev" işi). Buradaki etiketler elle
# uygulama (kubectl apply -k) için başlangıç değeridir.
namespace: tayfam-dev

resources:
  - namespace.yaml
  - ../../base
  # SOPS ile şifreli; Flux uygularken cluster'daki age anahtarıyla çözer
  # (deploy/clusters/home, docs/runbooks/sops.md).
  - secrets/identity-signing-key.sops.yaml
  - secrets/identity-db.sops.yaml
  - secrets/core-db.sops.yaml
  - secrets/chat-db.sops.yaml
  - secrets/identity-app-db.sops.yaml
  - secrets/core-app-db.sops.yaml
  - secrets/chat-app-db.sops.yaml
  - secrets/identity-birthdate-key.sops.yaml
  - secrets/chat-message-key.sops.yaml

configMapGenerator:
  - name: tayfam-env
    literals:
      - TAYFAM_ENV=dev
      - LOG_LEVEL=debug
      - SHUTDOWN_DRAIN_DELAY=5s
      - AUTH_ISSUER=tayfam-identity
      - AUTH_AUDIENCE=tayfam-api
      # Servis token'larının issuer'ı (ADR-0013): k3s'in varsayılan
      # service-account-issuer değeri. Prod VPS'te kendi cluster'ının değeri.
      - SERVICE_TOKEN_ISSUER=https://kubernetes.default.svc.cluster.local
      # gateway: istekler yalnızca cloudflared'den gelir (NetworkPolicy), bu
      # yüzden Cloudflare'in istemci IP başlığına güvenilir.
      - TRUST_CF_CONNECTING_IP=true
      - CORS_ALLOWED_ORIGINS=https://tayfam.app
      # identity: Google OAuth client ID'leri (gizli değildir). Web client
      # ID'si mobilde de "server client ID" olarak kullanılır.
      - GOOGLE_CLIENT_IDS=73439258394-uhd9m0b6mkc5k8eaoup6kgh57a49on4t.apps.googleusercontent.com
      # Kayıtta onaylanan belgelerin sürümleri; metin değişince artar.
      - CONSENT_PRIVACY_NOTICE_VERSION=2026-11-08
      - CONSENT_TERMS_VERSION=2026-11-08
      # Yönetim paneli (ADR-0008, issue #104): Cloudflare Access uygulaması
      # "Tayfam Panel" (admin.tayfam.app). Gizli değildir; ikisi birlikte
      # verilmezse panel kurulmaz ve admin host'u 404 döner.
      - ADMIN_HOST=admin.tayfam.app
      - CF_ACCESS_TEAM_DOMAIN=murattarslan-dev.cloudflareaccess.com
      # AUD tag gizli değildir (her Access JWT'sinin aud alanında görünür);
      # gitleaks onu API anahtarı sanıyor.
      - CF_ACCESS_AUD=d008112c2504d19f293d7859a3d99bd0abfc9d51419f78893a0dee81c2324578 # gitleaks:allow
      - ADMIN_GOOGLE_CLIENT_ID=73439258394-uhd9m0b6mkc5k8eaoup6kgh57a49on4t.apps.googleusercontent.com

images:
  - name: ghcr.io/murattarslan-dev/tayfam-gateway
    newTag: fc15be968201cd5bc708978c9990c07d23e7c9c0
  - name: ghcr.io/murattarslan-dev/tayfam-identity
    newTag: fc15be968201cd5bc708978c9990c07d23e7c9c0
  - name: ghcr.io/murattarslan-dev/tayfam-core
    newTag: fc15be968201cd5bc708978c9990c07d23e7c9c0
  - name: ghcr.io/murattarslan-dev/tayfam-chat
    newTag: fc15be968201cd5bc708978c9990c07d23e7c9c0
