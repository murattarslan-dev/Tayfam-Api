# Cluster çapında altyapı (CloudNativePG operatörü ve CRD'leri). Kaynağı ve
# imza doğrulaması uygulamayla aynıdır: prod etiketli tayfam-deploy artifact'ı.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infra
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  timeout: 5m
  sourceRef:
    kind: OCIRepository
    name: tayfam-deploy
  path: ./infra
  # CRD'ler silinirse onlara bağlı bütün veritabanları da silinir; kaldırma
  # elle ve bilerek yapılır.
  prune: false
  wait: true
