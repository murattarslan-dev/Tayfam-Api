# Platform sahibinin telefonundaki (Termux) SSH açık anahtarını arslan
# kullanıcısına ekler (2026-11-12). Açık anahtar gizli değildir. İdempotent:
# satır zaten varsa dokunmaz; dosya sahibi ve izinleri korunur. Anahtarı
# kaldırmak için bu dosyayı silmek yetmez (Job geri almaz); satır sunucuda
# authorized_keys'ten silinir ya da ayrı bir Job yazılır.
apiVersion: batch/v1
kind: Job
metadata:
  name: ssh-key-telefon
  annotations:
    kustomize.toolkit.fluxcd.io/force: Enabled
spec:
  backoffLimit: 2
  template:
    spec:
      restartPolicy: Never
      nodeSelector:
        kubernetes.io/hostname: tayfam-prod
      automountServiceAccountToken: false
      containers:
        - name: ssh-key
          image: ghcr.io/cloudnative-pg/postgis:18.6-3.7.0-202611030856-standard-trixie@sha256:adb255e84c710de32b5c04fefdfe549336ced2775d7060a3a1973561f18cc7de
          command: ["/bin/bash", "-euc"]
          env:
            - name: PUBKEY
              value: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIHKp9fU3fwfeUl7w645orawA5kn7tbYfIuPcbyPquOMp tayfam-telefon"
          args:
            - |
              f=/host-ssh/authorized_keys
              test -f "$f"
              uid=$(stat -c %u "$f"); gid=$(stat -c %g "$f")
              if grep -qxF "$PUBKEY" "$f"; then
                echo "anahtar zaten var"
              else
                printf '%s\n' "$PUBKEY" >> "$f"
                echo "anahtar eklendi"
              fi
              chown "$uid:$gid" "$f"; chmod 600 "$f"
              echo "authorized_keys satır sayısı: $(wc -l < "$f")"
          securityContext:
            privileged: true
            runAsUser: 0
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { memory: 64Mi }
          volumeMounts:
            - { name: ssh, mountPath: /host-ssh }
      volumes:
        - name: ssh
          hostPath: { path: /home/arslan/.ssh, type: Directory }
