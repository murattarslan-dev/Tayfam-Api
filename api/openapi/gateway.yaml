  # --- Etkinlikler (core EventService) ---
  #
  # Ortak kurallar: tayfanın etkinlik modülü kapalıysa okumalar dahil her uç
  # `module-disabled` alır. Bu tayfada olmayan ya da silinmiş etkinlik
  # `event-not-found`. İptal edilmiş etkinlikteki değişiklik
  # `event-cancelled`, bitmiş etkinlikteki `event-ended` alır.
  #
  # Konum: koordinatlar (WGS 84 derece) yalnızca istek gövdesinde taşınır,
  # hiçbir zaman URL'de değil; gateway onları log'a, hata ayrıntısına ve
  # erişim log'una yazmaz (ADR-0008).

  /v1/tayfas/{tayfa_id}/events:
    parameters:
      - $ref: "#/components/parameters/TayfaID"
    get:
      operationId: listUpcomingEvents
      summary: Bitmemiş etkinlikler, başlangıç zamanına göre
      description: |
        Her etkin üyeye açıktır (susturulmuş üye de okur). İptal edilenler
        de listededir. Türe özel ayrıntılar (`convoy`, `camp`, …) listede
        dolmaz; tek etkinlik ucunu kullanın.
      parameters:
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/PageToken"
      responses:
        "200":
          description: Etkinlikler
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EventList" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
    post:
      operationId: createEvent
      summary: Etkinlik açar; açan kişi organizatördür
      description: |
        Moderatör ve yönetici; tayfada `members_can_create_events` açıksa
        her etkin üye. Aynı `client_request_id` ile tekrar gönderim ilk
        açılan etkinliği döndürür ve yeni etkinlik açmaz. `recurrence`
        verilirse etkinlik tekrarlayan bir serinin ilkidir; sunucu sonraki
        etkinlikleri sekiz hafta ileriye kadar kendisi açar.
      parameters:
        - $ref: "#/components/parameters/ClientHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EventCreateRequest" }
      responses:
        "201":
          description: Açılan etkinlik (ya da tekrar gönderimde ilk açılan)
          headers:
            Location:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Event" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }

  /v1/tayfas/{tayfa_id}/events/{event_id}:
    parameters:
      - $ref: "#/components/parameters/TayfaID"
      - $ref: "#/components/parameters/EventID"
    get:
      operationId: getEvent
      summary: Tek etkinlik, türe özel ayrıntılarıyla
      description: |
        Katılımcılara özel balık noktasında (`spot_visibility=participants`)
        katılmayan üye `meeting_point` ve `meeting_point_name` almaz. Konvoy
        plakaları yalnızca katılımcılara (`going`) ve organizatöre döner.
      responses:
        "200":
          description: Etkinlik
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Event" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
    patch:
      operationId: updateEvent
      summary: Etkinliği düzenler (organizatör, moderatör, yönetici)
      description: |
        Gövdede bulunan alanlar değişir; en az bir alan gerekir. Alanlar
        gruplar halinde değişir:
        - `starts_at` ve `ends_at` birlikte gönderilir.
        - Yer: `mode`, `meeting_point_name`, `meeting_point`, `city`,
          `district`, `online_url` birlikte değişir; bunlardan biri
          gönderilirse `mode` zorunludur ve gönderilmeyenler boşalır.
        - Türe özel ayrıntı (`convoy`, `camp`, …) tamamen değişir; araçlar
          ve kamp listesi korunur.

        Kapasiteyi artırmak bekleme listesindekileri sırayla `going` yapar.
        Seriye ait bir etkinlikte `apply_to_series` `false` (varsayılan) ise
        yalnızca bu etkinlik değişir ve seriden ayrılır (`series_override`);
        `true` ise serinin başlamamış, düzenlenmemiş bütün etkinliklerini ve
        ileride açılacakları değiştirir; seride zaman değişmez. Bitmiş seri
        `event-series-ended` alır.
      parameters:
        - $ref: "#/components/parameters/ClientHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EventUpdateRequest" }
      responses:
        "200":
          description: Güncel etkinlik
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Event" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }

  /v1/tayfas/{tayfa_id}/events/{event_id}/cancellation:
    parameters:
      - $ref: "#/components/parameters/TayfaID"
      - $ref: "#/components/parameters/EventID"
    post:
      operationId: cancelEvent
      summary: Etkinliği iptal eder (organizatör, moderatör, yönetici)
      description: |
        Etkinlik silinmez; üyeler onu iptal zamanı ve sebebiyle görmeye devam
        eder. Sonrasında katılım cevapları değişmez.
      parameters:
        - $ref: "#/components/parameters/ClientHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EventCancelRequest" }
      responses:
        "200":
          description: İptal edilen etkinlik
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Event" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }

  /v1/tayfas/{tayfa_id}/events/{event_id}/calendar:
    parameters:
      - $ref: "#/components/parameters/TayfaID"
      - $ref: "#/components/parameters/EventID"
    get:
      operationId: exportEventCalendar
      summary: Etkinliği takvime eklemek için iCalendar (.ics) dosyası
      description: |
        RFC 5545. `UID` etkinlik kimliğidir; dosya tekrar içe aktarılırsa
        takvim kaydı güncellenir, iptal edilmiş etkinlik `STATUS:CANCELLED`
        taşır. Zamanlar UTC'dir. Koordinat, katılımcı, organizatör ya da
        plaka içermez; çevrimiçi etkinliğin linkini içerebilir, bu yüzden
        yanıt önbelleğe alınmaz (`Cache-Control: private, no-store`). Hata
        yanıtları `application/problem+json`'dur.
      responses:
        "200":
          description: iCalendar dosyası
          headers:
            Content-Disposition:
              description: '`attachment; filename="tayfam-<event_id>.ics"`'
              schema: { type: string }
            Cache-Control:
              schema: { type: string, enum: ["private, no-store"] }
          content:
            text/calendar:
              schema: { type: string }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }

  /v1/tayfas/{tayfa_id}/events/{event_id}/rsvp:
    parameters:
      - $ref: "#/components/parameters/TayfaID"
      - $ref: "#/components/parameters/EventID"
    put:
      operationId: setEventRsvp
      summary: Etkinliğe katılım cevabınızı verir
      description: |
        Dolu etkinlikte `going` bekleme listesine (`waitlist`) düşer;
        yanıttaki `status` kaydedilen cevaptır. Bir `going` cevabı
        değişince bekleme listesinin en eskisi `going` olur. Aynı cevabı
        tekrar vermek bir şey değiştirmez; bekleme listesindeyken `going`
        sıranızı korur.
      parameters:
        - $ref: "#/components/parameters/ClientHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RsvpRequest" }
      responses:
        "200":
          description: Kaydedilen cevap
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Rsvp" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }

  /v1/tayfas/{tayfa_id}/events/{event_id}/attendees:
    parameters:
      - $ref: "#/components/parameters/TayfaID"
      - $ref: "#/components/parameters/EventID"
    get:
      operationId: listEventAttendees
      summary: Bir cevaptaki katılımcılar, eskiden yeniye
      description: |
        `status=waitlist` için sıra bekleme sırasıdır. `attendance`
        doğrulanmış katılımı gösterir.
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [going, maybe, not_going, waitlist]
            default: going
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/PageToken"
      responses:
        "200":
          description: Katılımcılar
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AttendeeList" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }

  /v1/tayfas/{tayfa_id}/events/{event_id}/attendees/{user_id}/attendance:
    parameters:
      - $ref: "#/components/parameters/TayfaID"
      - $ref: "#/components/parameters/EventID"
      - $ref: "#/components/parameters/UserID"
    put:
      operationId: confirmAttendance
      summary: Organizatör düzeltmesi — katılımı ekler
      description: |
        Organizatör kendi etkinliği için, moderatör ve yönetici her etkinlik
        için; iptal edilmemiş bir etkinliğin bitişinden sonraki yedi gün
        içinde (`correction-closed`). Kimse kendi katılımını düzeltemez
        (`permission-denied`). Kişi etkin üye olmalıdır (`member-not-found`).
        Her düzeltme denetim kaydına yazılır.
      parameters:
        - $ref: "#/components/parameters/ClientHeader"
      responses:
        "204": { description: Katılım eklendi }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
    delete:
      operationId: removeAttendance
      summary: Organizatör düzeltmesi — sahte katılımı kaldırır
      description: Ekleme ile aynı kurallar; kişinin katılım geçmişi kaydı silinir.
      parameters:
        - $ref: "#/components/parameters/ClientHeader"
      responses:
        "204": { description: Katılım kaldırıldı }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }

  /v1/tayfas/{tayfa_id}/events/{event_id}/check-in:
    parameters:
      - $ref: "#/components/parameters/TayfaID"
      - $ref: "#/components/parameters/EventID"
    post:
      operationId: checkInToEvent
      summary: Katılımınızı doğrular (konumla check-in ya da "Katıldım")
      description: |
        Pencere başlangıçtan 30 dakika önce açılır, bitişte kapanır
        (`check-in-closed`); `going` cevabı gerekir (`event-not-going`).

        Yüz yüze etkinlikte `location` zorunludur ve buluşma noktasına en
        fazla 300 m olmalıdır (`check-in-too-far`; uzaklık hiçbir yanıtta
        söylenmez). Etkinlik başına başarısızlar dahil en fazla beş deneme
        sayılır (`check-in-attempts-exhausted`, core). Ayrıca IP başına
        sınır vardır (`rate-limited`, gateway). Konum yalnızca uzaklık
        kontrolünde kullanılır: saklanmaz, log'a yazılmaz, geri dönmez.

        Çevrimiçi etkinlikte `location` gönderilmez; `going` cevabı
        başlangıçtan önce verilmiş olmalıdır.

        Başarılı check-in'den sonra tekrar denemek bir şey değiştirmez ve
        deneme saymaz. Susturulmuş üye de check-in yapabilir.
      parameters:
        - $ref: "#/components/parameters/ClientHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CheckInRequest" }
      responses:
        "200":
          description: Katılım doğrulandı
