      responses:
        "200":
          description: Biten seri ve iptal edilen etkinlik sayısı
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EventSeriesEnding" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }

  /v1/tayfa-joins:
    post:
      operationId: joinByCode
      summary: Katılım koduyla tayfaya katılır
      description: |
        Tayfa açık katılımlıysa üyelik hemen etkin olur, onaylıysa bekler.
        Bozuk, bilinmeyen, yenilenmiş kod ve banlı olduğunuz tayfa aynı
        cevabı alır (`invalid-join-code`). IP başına (gateway) ve kullanıcı
        başına (core) deneme sınırı vardır.
      parameters:
        - $ref: "#/components/parameters/ClientHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/JoinByCodeRequest" }
      responses:
        "201":
          description: Üyelik (etkin ya da bekleyen)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Membership" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }

  /v1/invite-previews:
