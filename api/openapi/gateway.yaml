      responses:
        "204": { description: Silindi }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }

  /v1/users/{user_id}/availability:
    parameters:
      - $ref: "#/components/parameters/UserID"
    get:
      operationId: listUserAvailability
      summary: Bir arkadaşınızın boş günleri (bugünden itibaren)
      description: |
        Yalnızca kabul edilmiş arkadaşlar görür. Arkadaş değilseniz, istek
        bekliyorsa, iki yönden biri engellediyse ya da kullanıcı yoksa cevap
        aynıdır (`user-not-found`). Kendi kimliğinizle kendi günleriniz döner.
      responses:
        "200":
          description: Boş günler, eskiden yeniye
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AvailabilityDayList" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
