  # --- Profil (core ProfileService, #71) ---

  /v1/users/{user_id}/profile:
    parameters:
      - $ref: "#/components/parameters/UserID"
    get:
      operationId: getUserProfile
      summary: Bir kullanıcının profili (ad, avatar, ortak tayfalar)
      description: |
        Ad ve avatar, ortak tayfanız ya da arkadaşlığınız olmasa da her
        kullanıcı için döner; bildirimlerdeki `actor_id` ve `target_id`
        (ör. `friend_request`, `tayfa_invitation`) kişinin adı bu uçtan
        alınır. Bildirimler isim taşımaz.
        Ortak tayfalar yalnızca ikinizin de etkin üyesi olduğu tayfalardır.
        Engel varsa (iki yönden biri) ya da hesap silinmişse `user-not-found`,
        var olmayan kullanıcıyla aynı cevap.

        **Tanıtım alanları** (`interests`, `about`, `occupation`, `team`,
        `languages`, `social_accounts`; issue #186) kişinin
        `about_visibility` ayarına göre döner: `friends_and_mutual`
        arkadaşlara ve ortak tayfa üyelerine, `friends` yalnızca
        arkadaşlara, `none` kimseye. `social_accounts` ayar ne olursa olsun
        yalnızca arkadaşlara döner. Boş ya da reddedilmiş alan yoktur;
        hangisinin reddedildiği gösterilmez. Kendi profilinizde hepsini
        görürsünüz.

        **Doğum günü** (`birthday`, issue #185) yalnızca arkadaşlara ve
        kişinin ayarına göre döner (`Account.birthday_visibility`): `birthday`
        gün ve ay, `full` ayrıca yıl ve yaş, `hidden` hiçbir şey. Kendi
        profilinizde her zaman tam tarihi ve yaşı görürsünüz. Alan o an
        alınamazsa profil onsuz döner.
      responses:
        "200":
          description: Profil
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserProfile" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }

  /v1/users/{user_id}/activity:
    parameters:
      - $ref: "#/components/parameters/UserID"
    get:
      operationId: listUserActivity
      summary: Kullanıcının katılım geçmişi, görünürlük ayarına göre
      description: |
        Arkadaşlar tümünü görür; ortak tayfa üyeleri (`tayfa`, `public`) ve
        diğerleri (`public`) son 14 günü göremez; `private` yalnızca kişinin
        kendisine görünür. Görmeye yetkiniz yoksa liste boş döner. Tayfa,
        etkinlik ve süre yalnızca o tayfanın etkin üyelerine doludur.
      parameters:
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/PageToken"
      responses:
        "200":
          description: Kayıtlar, yeniden eskiye
          content:
