  # --- Etkinlik türü kataloğu (core CatalogService, #237, ADR-0025, ADR-0037) ---
  # Tür veridir: ad, ikon, ilgi alanları, alanlar, bileşenler ve parametreleri
  # katalogdan gelir; istemci etkinliği tanıma göre çizer. Katalog herkese
  # aynıdır ama açık uç değildir: erişim token'ı ister.

  /v1/catalog:
    get:
      operationId: getCatalog
      summary: İlgi alanları ve aktif etkinlik türlerinin güncel tanımları
      description: |
        `ETag` başlığı kataloğun sürümüdür (`"<catalog_version>"`). İstemci
        elindeki sürümü `If-None-Match` ile gönderir; katalog değişmediyse
        yanıt gövdesiz **304**'tür (aynı `ETag` ile). Katalog her
        değiştiğinde `catalog_version` artar.

        İlgi alanlarının hepsi döner (emekliye ayrılanlar `status: retired`
        ile: eski tayfalar ve profiller onları göstermeye devam eder).
        Türlerden yalnızca aktif olanlar, güncel sürümleriyle döner; eski bir
        etkinliğin tür sürümü için
        `GET /v1/catalog/event-types/{key}/versions/{version}`.

        `labels` platform sahibinin yazdığı içeriktir (dil → metin; `tr` her
        zaman vardır) ve düz metin olarak gösterilir. `icon` istemcinin sabit
        ikon setinden bir anahtardır; bilinmeyen anahtar için ilgi alanının
        ikonu, o da yoksa genel ikon gösterilir.

        `study_tags` Eğitim modüllerinin ders ve konu etiket listesidir
        (`CatalogStudyTag`); emekliye ayrılanlar dahil hepsi döner.

        `badges` rozet tanımlarıdır (`CatalogBadge`, #258, ADR-0039);
        kazanılmış rozetin adı ve ikonu buradan okunduğu için emekliye
        ayrılanlar dahil hepsi döner.
      parameters:
        - name: If-None-Match
          in: header
          required: false
          description: Elinizdeki kataloğun `ETag` değeri (`"7"`).
          schema: { type: string, maxLength: 128 }
      responses:
        "200":
          description: Katalog
          headers:
            ETag:
              description: 'Kataloğun sürümü, tırnak içinde: `"7"`'
              schema: { type: string }
            Cache-Control:
              description: "`private, no-cache`"
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Catalog" }
        "401": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }

  /v1/catalog/event-types/{key}/versions/{version}:
    parameters:
      - $ref: "#/components/parameters/CatalogTypeKey"
      - $ref: "#/components/parameters/CatalogTypeVersion"
    get:
      operationId: getCatalogEventTypeVersion
      summary: Bir etkinlik türünün bir sürümü
      description: |
        Etkinlik oluşturulduğu andaki tür sürümüne bağlıdır (`type`,
        `type_version`) ve o tanımla gösterilir. Güncel katalogda olmayan
        sürüm (tür sonradan değişti ya da emekliye ayrıldı) buradan alınır.
        Bir tür sürümü hiç değişmez; istemci oturum boyunca bellekte
        tutabilir. Bilinmeyen tür ya da sürüm `catalog-type-not-found`.
      responses:
        "200":
          description: Tür sürümü
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CatalogEventType" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }

  # --- Keşfet (core DiscoverService, #210, ADR-0033; herkese açık: #227, ADR-0035) ---
  # Sunucu bayrağı DISCOVER_ENABLED kapalıyken (varsayılan) akış, Keşfet'ten
  # katılım ve geri bildirim uçları hiçbir şey okumadan 404
  # `feature-disabled` döner; istemci girişleri gizler. Tayfanın Keşfet
  # ayarı (`/v1/tayfas/{tayfa_id}/discover`) bayraktan bağımsız çalışır.
  # Güvenlik kişisi ayrı bayraktır (SAFETY_CONTACT_ENABLED, varsayılan açık):
  # kapalıyken seçme, okuma ve paylaşımlar `feature-disabled`; "Döndüm" ve
  # kaldırma her zaman çalışır.
  # Keşfet güven vermez, bilgi verir: "onaylı" ya da "güvenilir" alanı
  # yoktur, yalnızca olgular döner.

  /v1/discover/events:
    get:
      operationId: listDiscoverFeed
      summary: Keşfet'e açık tayfaların etkinlikleri, gidecek arkadaşlarınızla (en fazla 50; sayfalanmaz)
      description: |
        Bitmemiş ve 30 gün içinde başlayan, organizatörün "halka açık yerde
        buluşur" diye işaretlediği (`discoverable`) yüz yüze etkinlikler;
        yalnızca Keşfet'e açık ve platform incelemesinden geçmiş, en az 5
        aktif üyeli tayfalardan ve üyesi olmadığınız tayfalardan.

        Keşfet herkese açıktır (ADR-0035): arkadaş gerekmez. Etkinlikte
        **görünür arkadaşınız** yoksa `friends` boş, `friend_count` 0 döner.
        Görünür arkadaş: kabul edilmiş arkadaş, iki yönden engel yok,
        tayfanın aktif üyesi, etkinliğe `going` demiş ya da katılımı
        doğrulanmış, katılım geçmişi görünürlüğü `private` değil ve
        "Keşfet'te arkadaşlarım görebilsin" ayarı açık. `friend_count`
        yalnızca görünür arkadaşları sayar. Tayfanın herhangi bir aktif
        üyesiyle aranızda (iki yönden) engel varsa tayfanın etkinlikleri
        listelenmez.

        Sıra: görünür arkadaşı olan öğeler önce (gizli sinyaller, sonra
        arkadaş sayısı); diğerleri başlangıç zamanına ve kimliğe göre.
        Arkadaşlık puanı profillemesi kapalı kişide kullanılmaz; puan ya da
        sıra numarası dönmez.
        Açıklama, buluşma noktası ve koordinat dönmez; tayfaya katılınca
        mevcut uçlardan okunur.
      responses:
        "200":
          description: Akış, en iyi önce
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DiscoverFeed" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }

  /v1/discover/tayfas/{tayfa_id}/join:
    parameters:
      - $ref: "#/components/parameters/TayfaID"
    post:
      operationId: joinFromDiscover
      summary: Keşfet'te gördüğünüz bir tayfaya katılım isteği (her zaman onay bekler)
      description: |
        Tayfanın Keşfet'te size görünen bir etkinliği yoksa (tayfanın bir
        aktif üyesiyle aranızda engel varsa ya da orada banlıysanız da)
        cevap `tayfa-not-found`'dur. Arkadaş gerekmez (ADR-0035). İstek,
        tayfa açık katılımlı olsa da yöneticilerin onayına düşer ve onlara
        "Keşfet'ten" etiketiyle görünür; yöneticilere yaşınız ya da "18 yaş
        altı" gibi bir işaret gösterilmez. Saatte en fazla 10 deneme.
      parameters:
        - $ref: "#/components/parameters/ClientHeader"
      responses:
        "201":
          description: Bekleyen üyelik
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Membership" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }

  /v1/tayfas/{tayfa_id}/discover:
    parameters:
      - $ref: "#/components/parameters/TayfaID"
    get:
      operationId: getTayfaDiscover
      summary: Tayfanın Keşfet durumu (yönetici)
      responses:
        "200":
          description: Durum
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TayfaDiscover" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
    put:
      operationId: setTayfaDiscover
      summary: Tayfayı Keşfet'e açar ya da kapatır (yönetici)
      description: |
        Açmak en az 5 aktif üye ister (`discover-too-few-members`) ve
        tayfayı platformun meta veri incelemesine gönderir (`pending`).
        Kapatmak tayfayı hemen gizler. Platform tayfayı Keşfet'ten
        çıkardıysa durum `under_review`'dur; neden söylenmez. Reddedilmiş
        bir tayfayı yeniden açmak yeniden incelemeye gönderir. Ad, açıklama,
        il ya da ilçe değişirse tayfa yeniden incelemeye düşer.
      parameters:
        - $ref: "#/components/parameters/ClientHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TayfaDiscoverInput" }
      responses:
        "200":
          description: Yeni durum
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TayfaDiscover" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }

  /v1/tayfas/{tayfa_id}/events/{event_id}/feedback:
    parameters:
      - $ref: "#/components/parameters/TayfaID"
      - $ref: "#/components/parameters/EventID"
    get:
      operationId: getEventFeedback
      summary: '"Her şey yolunda mıydı?" cevabınız'
      description: |
        Cevap yoksa `answer` yoktur. Geri bildirim uçları, tayfaya Keşfet'ten
        gelip üyeliği son 30 günde biten kişiye de açıktır (yalnızca
        katıldığı etkinlik için).
      responses:
        "200":
          description: Cevabınız
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EventFeedback" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
    put:
      operationId: setEventFeedback
      summary: '"Her şey yolunda mıydı?" cevabını verir ya da değiştirir'
      description: |
        Yalnızca katılımı doğrulanmış (`not-attended`) katılımcı, "halka açık
        yerde buluşur" işaretli yüz yüze etkinlikte, bitişten bitiş + 7 güne
        kadar (`feedback-closed`). Serbest metin yoktur; anlatmak için şikâyet
        akışını kullanın. Cevabı yalnızca siz görürsünüz; `serious` tayfayı
        inceleme bitene kadar Keşfet'ten çıkarır ve tayfaya nedeni söylenmez.
      parameters:
        - $ref: "#/components/parameters/ClientHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EventFeedbackInput" }
      responses:
        "200":
          description: Kaydedilen cevap
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EventFeedback" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }

  /v1/tayfas/{tayfa_id}/events/{event_id}/safety-contact:
    parameters:
      - $ref: "#/components/parameters/TayfaID"
      - $ref: "#/components/parameters/EventID"
    get:
      operationId: getSafetyContact
      summary: Bu etkinlik için güvenlik kişiniz
      description: |
        Seçilmemişse `contact` yoktur. Seçilmiş bir kaydınız varsa sunucu
        bayrağı (`SAFETY_CONTACT_ENABLED`) kapalıyken, tayfadan ayrıldıktan
        sonra ya da etkinlik modülü kapalıyken de döner, böylece "Döndüm"
        her zaman gösterilebilir; yalnızca kendi kaydınızı döndürür. Kaydınız
        yokken bayrak kapalıysa 404 `feature-disabled` (yeni kayıt
        oluşturulamaz).
      responses:
        "200":
          description: Güvenlik kişisi
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SafetyContact" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
    put:
      operationId: setSafetyContact
      summary: Güvenlik kişisi seçer ya da değiştirir
      description: |
        Etkinliğe `going` demiş olmalısınız (`event-not-going`); etkinlik yüz
        yüze, iptal edilmemiş ve bitmemiş olmalı, alarm gitmemiş olmalı
        (`safety-contact-closed`). Kişi kabul edilmiş arkadaşınız olmalı
        (`not-friends`). Bitiş + `grace_minutes` geçtiğinde "Döndüm"
        işaretlenmemişse yalnızca bu kişiye `safety_alert` bildirimi gider.
        Kişi yalnızca sizi, etkinliğin başlangıç ve bitiş saatini, toleransı
        ve "döndü / dönmedi / alarm gitti" durumunu görür
        (`GET /v1/me/safety-shares`); tayfa, etkinlik başlığı ve yer görmez.
        Seçildiğinde kişiye bildirim gitmez. Keşfet'ten bağımsızdır (sunucu
        bayrağı `SAFETY_CONTACT_ENABLED`, varsayılan açık); bütün yüz yüze
        etkinliklerde çalışır.
      parameters:
        - $ref: "#/components/parameters/ClientHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SafetyContactInput" }
      responses:
        "200":
          description: Güvenlik kişisi
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SafetyContact" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
    delete:
      operationId: clearSafetyContact
      summary: Güvenlik kişisini kaldırır
      description: |
        Kaldırılacak bir şey yoksa da başarılıdır. Alarm gittikten sonra
        kaldırılamaz (`safety-contact-closed`). Keşfet kapalıyken, tayfadan
        ayrıldıktan sonra ya da etkinlik modülü kapalıyken de çalışır;
        yalnızca kendi kaydınıza dokunur.
      parameters:
        - $ref: "#/components/parameters/ClientHeader"
      responses:
        "204": { description: Kaldırıldı }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }

  /v1/tayfas/{tayfa_id}/events/{event_id}/safety-contact/return:
    parameters:
      - $ref: "#/components/parameters/TayfaID"
      - $ref: "#/components/parameters/EventID"
    post:
      operationId: markReturned
      summary: '"Döndüm": güvenlik alarmını durdurur'
      description: |
        Güvenlik kişisi seçilmemişse `safety-contact-not-found`. Tekrar
        çağrı ilk zamanı korur. Keşfet kapalıyken, susturulmuşken, tayfadan
        ayrıldıktan sonra ya da etkinlik modülü kapalıyken de çalışır;
        yalnızca kendi kaydınıza dokunur.
      parameters:
        - $ref: "#/components/parameters/ClientHeader"
      responses:
        "200":
          description: Güvenlik kişisi
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SafetyContact" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }

  /v1/me/safety-shares:
    get:
      operationId: listSafetyShares
      summary: Sizi güvenlik kişisi seçenlerin etkinlikleri
      description: |
        Bitişinden 24 saat geçmemiş ya da alarmı son 7 günde gitmiş
        etkinlikler, en yeni başlangıç önce (en fazla 50). Paylaşım yalnızca
        hâlâ geçerliyse görünür: arkadaşlık sürüyor, engel yok, katılımcı
        tayfanın aktif üyesi ve `going`; etkinlik ve tayfa silinmemiş, iptal
        edilmemiş ya da askıda değil (alarm gittiyse ve katılımcı check-in
        yaptıysa kalır). Yalnızca en az bilgi: kim, saat aralığı
        (başlangıç, bitiş, tolerans) ve durum. Tayfa, etkinlik başlığı,
        buluşma yeri, il/ilçe ve koordinat yoktur.
      responses:
        "200":
          description: Paylaşımlar
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SafetyShareList" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }

  # --- Doğrudan tayfa daveti (core MembershipService, #71) ---

  /v1/tayfas/{tayfa_id}/invitations:
    parameters:
      - $ref: "#/components/parameters/TayfaID"
    get:
      operationId: listInvitations
      summary: Tayfanın cevaplanmamış doğrudan davetleri, yeniden eskiye (yönetici)
      parameters:
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/PageToken"
      responses:
        "200":
          description: Davetler
          content:
            application/json:
