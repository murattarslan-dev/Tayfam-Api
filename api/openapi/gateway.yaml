  # --- Etkinlik bileşenleri: derece / sıralama (`ranking`; core RankingComponentService, #253, ADR-0025 §4, §5, ADR-0037 §3) ---
  # Katılımcıların bir süreye ya da sıraya göre dizilişi. Tanımda `source`
  # (aynı türdeki kişisel bir ölçümün anahtarı) varsa derece ölçümün
  # kaydedilmiş değerlerinden hesaplanır, ayrı giriş yoktur; yazan uçlar
  # `ranking-from-measure` alır. `source` yoksa `metric` (`duration`: saniye,
  # en çok iki basamak; `rank`: tam sayı sıra) ile organizatör, moderatör,
  # yönetici ve organizatörün atadığı hakemler katılımcı başına elle girer:
  # etkinlik başladıktan (`ranking-not-started`) bitişten 7 gün sonrasına
  # kadar (`component-frozen`). Yön `direction` (`asc`, `desc`); verilmezse
  # elle girilen derece artan, ölçümden hesaplanan azalan. Eşit değerler
  # aynı sırayı paylaşır, sonraki sıra atlanır (1, 1, 3); sıra saklanmaz.
  # Değerler log'a yazılmaz. Yazan her uç dereceyi güncel haliyle döner.

  /v1/tayfas/{tayfa_id}/events/{event_id}/components/{component_key}/ranking:
    parameters:
      - $ref: "#/components/parameters/TayfaID"
      - $ref: "#/components/parameters/EventID"
      - $ref: "#/components/parameters/ComponentKey"
    get:
      operationId: getEventRanking
      summary: Etkinliğin derecesi
      description: |
        Her etkin üyeye açıktır (susturulmuş üye de okur); iptal edilmiş ve
        donmuş etkinlikte de okunur. Hassas ölçümden (`sensitive`) hesaplanan
        derece, ölçümün bütün değerlerini görebilenler (ölçümü organizatör
        giriyorsa organizatör, moderatör, yönetici) dışında gizlidir
        (`hidden`). Kaynak ölçüm kapalıysa (`measure_enabled: false`) derece
        boştur. Bileşen uçlarının ortak kuralları geçerlidir
        (`component-not-found`, `component-disabled`).
      responses:
        "200":
          description: Derece
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EventRanking" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }

  /v1/tayfas/{tayfa_id}/events/{event_id}/components/{component_key}/ranking/entries/{user_id}:
    parameters:
      - $ref: "#/components/parameters/TayfaID"
      - $ref: "#/components/parameters/EventID"
      - $ref: "#/components/parameters/ComponentKey"
      - $ref: "#/components/parameters/UserID"
    put:
      operationId: setEventRankingEntry
      summary: Bir katılımcının derecesini elle yazar (organizatör, moderatör, yönetici, hakem)
      description: |
        Süre sıfırdan büyük, en çok 1000000 saniye ve iki basamağa
        yuvarlanır; sıra 1–10000 arası tam sayıdır (dışı `invalid-request`).
        `going` cevabı vermemiş ve katılımı doğrulanmamış kişi
        `ranking-not-participant`. Aynı değeri yeniden yazmak bir şey
        değiştirmez. Ölçümden hesaplanan derecede `ranking-from-measure`.
      parameters:
        - $ref: "#/components/parameters/ClientHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EventRankingValueRequest" }
      responses:
        "200":
          description: Derece, güncel haliyle
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EventRanking" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
    delete:
      operationId: removeEventRankingEntry
      summary: Bir katılımcının elle girilmiş derecesini kaldırır
      description: |
        Değeri yazabilen kaldırır (başlangıç ve katılım denetimi olmadan).
        Olmayan değeri kaldırmak hata değildir. Ölçümden hesaplanan derecede
        `ranking-from-measure`.
      parameters:
        - $ref: "#/components/parameters/ClientHeader"
      responses:
        "200":
          description: Derece, güncel haliyle
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EventRanking" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }

  # --- Etkinlik bileşenleri: kutlama (`celebration`; core CelebrationComponentService, #255, ADR-0025 §4, §5) ---
  # Etkinliğin kazanan ekranı ve tayfaya kazananın ilan edildiği bildirimi.
  # Tanımda `source` (aynı türdeki yazboz, eşleşme ağacı ya da derece
  # bileşeninin anahtarı) varsa kazananlar her okumada kaynağın kaydedilmiş
  # sonucundan hesaplanır: biten her masanın kazananları, sonuçlanan eşleşme
  # ağacının şampiyonları, derecenin birinci sırası; ayrı kayıt yoktur ve
  # kaynaktaki düzeltme hemen görünür. `source` yoksa organizatör ilan
  # ederken etkinliğin katılımcılarından 1–10 kazanan seçer. Kazanan kişi,
  # takım ya da misafir oyuncu olabilir. Hassas ölçümden hesaplanan derecenin
  # ve hassas katılımlı türlerin kutlamasında kimse kazananı görmez
  # (`hidden`). İlk ilan tayfanın ilan eden dışındaki etkin üyelerine
  # uygulama içi `celebration` bildirimi gönderir (push yok; bildirim
  # kazananı adlandırmaz).

  /v1/tayfas/{tayfa_id}/events/{event_id}/components/{component_key}/celebration:
    parameters:
      - $ref: "#/components/parameters/TayfaID"
      - $ref: "#/components/parameters/EventID"
      - $ref: "#/components/parameters/ComponentKey"
    get:
      operationId: getEventCelebration
      summary: Etkinliğin kutlaması
      description: |
        Her etkin üyeye açıktır (susturulmuş üye de okur); iptal edilmiş ve
        donmuş etkinlikte de okunur. Kaynak henüz sonuçlanmadıysa ya da
        kapalıysa `winners` boştur. Bileşen uçlarının ortak kuralları
        geçerlidir (`component-not-found`, `component-disabled`).
      responses:
        "200":
          description: Kutlama
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EventCelebration" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
    put:
      operationId: announceEventCelebration
      summary: Kazananı ilan eder (organizatör, moderatör, yönetici)
      description: |
        Etkinlik başladıktan (`celebration-not-started`) bitişten 7 gün
        sonrasına kadar (`component-frozen`). Kaynaklı kutlamada gövde boş
        nesnedir (`winner_ids` verilirse `invalid-request`) ve kaynağın
        kazananı yoksa `celebration-no-winner`. Kaynaksız kutlamada
        `winner_ids` 1–10 farklı kişidir; `going` cevabı vermemiş ve katılımı
        doğrulanmamış kişi `celebration-not-participant`. İlk ilan bildirim
        gönderir; yeniden ilan yalnızca elle seçilen kazananları değiştirir,
        bildirim göndermez.
      parameters:
        - $ref: "#/components/parameters/ClientHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EventCelebrationRequest" }
      responses:
        "200":
          description: Kutlama, güncel haliyle
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EventCelebration" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }

  # --- Etkinlik bileşenleri: soru toplama (`questions`; core QuestionsComponentService, #256, ADR-0025 §4, §5) ---
  # Söyleşide canlı soru: katılımcılar soru sorar ve oy verir, organizatör
