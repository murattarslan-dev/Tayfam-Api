  # --- Şikâyetler ve tayfa moderasyon kuyruğu (core ReportService, issue #76) ---
  /v1/tayfas/{tayfa_id}/reports:
    parameters:
      - $ref: "#/components/parameters/TayfaID"
    post:
      operationId: createReport
      summary: Tayfada bir üyeyi, tayfanın kendisini ya da bir içeriği şikâyet eder
      description: |
        Her etkin üye, susturulmuş olsa da, şikâyet edebilir. Hedef, sizin o
        tayfada görebildiğiniz bir şey olmalıdır: başka bir etkin üye,
        tayfanın kendisi (`target_id` = `tayfa_id`) ya da modülü açık,
        görünür bir içerik. Diğer her durumda `report-target-not-found`
        döner (hangi sebeple olduğu söylenmez). Kendinizi ya da kendi
        içeriğinizi şikâyet edemezsiniz (`invalid-request`).

        Aynı hedefi ikinci kez şikâyet etmek yeni kayıt açmaz; ilk şikâyetiniz
        `200` ile döner. Yeni şikâyet `201` döner. 24 saatte en fazla 20
        şikâyet (`report-limit`).

        Şikâyet edenin kimliği şikâyet edilen kişiye hiçbir zaman gösterilmez;
        tayfanın moderatörlerine ve yöneticilerine de gösterilmez. Tayfanın
        kendisi ve `staff_conduct` şikâyetleri yalnızca platforma gider.
        Birebir mesaj (`dm_message`) şikâyeti bir tayfaya ait olmadığı için
        bu uçta değil, `POST /v1/me/reports` ile yapılır (burada
        `invalid-request`). Kanal mesajları henüz şikâyet edilemez.
      parameters:
        - $ref: "#/components/parameters/ClientHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReportCreateRequest" }
      responses:
        "200":
          description: Bu hedefe daha önce yaptığınız şikâyet
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MyReport" }
        "201":
          description: Yeni şikâyet
          headers:
            Location:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MyReport" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
    get:
      operationId: listTayfaReports
      summary: Tayfanın moderasyon kuyruğu (moderatör, yönetici)
      description: |
        `status=open` (varsayılan): önce `priority: minor_involved` ve
        `reason: child_safety` şikâyetler, sonra eskiden yeniye. `status=resolved`: son çözülen
        önce. Platforma özel şikâyetler ve sizin hakkınızdaki şikâyetler
        listelenmez. Şikâyet edenin kimliği yoktur. Tarafların yaşı ve doğum
        tarihi gösterilmez; yalnızca öncelik (ADR-0012, 2026-11-09 kararı).
        Susturulmuş moderatör de okur.
      parameters:
        - name: status
          in: query
          required: false
          schema: { type: string, enum: [open, resolved], default: open }
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/PageToken"
      responses:
        "200":
          description: Şikâyetler
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ModerationReportList" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }

  /v1/tayfas/{tayfa_id}/reports/{report_id}/resolution:
    parameters:
      - $ref: "#/components/parameters/TayfaID"
      - $ref: "#/components/parameters/ReportID"
    post:
      operationId: resolveReport
      summary: Kuyruktaki açık bir şikâyeti çözer (moderatör, yönetici)
      description: |
        Susturulmuşken yapılamaz (`muted`). Şikâyet edilen kişinin mevcut
        rolü sizinkinden düşük olmalıdır (`role-hierarchy`). Çözüm, ilgili
        içeriğin ya da üyeliğin kendi uçlarıyla önceden yapılmış işleme
        bağlanır:
        - `content_removed`: içerik artık görünmüyor (silinmiş; etkinlikte
          iptal de sayılır). Üye ve tayfa şikâyetinde kullanılamaz.
        - `member_sanctioned`: şikâyet edilen kişi şu anda susturulmuş ya da
          banlı.
        - `dismissed`: işlem yok.
        İşlem yapılmamışsa `report-action-missing`; çözülmüş şikâyette
        `report-already-resolved` döner. Şikâyet eden kişi hâlâ etkin üyeyse
        aktörsüz `report_resolved` bildirimi alır.
      parameters:
        - $ref: "#/components/parameters/ClientHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReportResolveRequest" }
      responses:
        "200":
          description: Çözülen şikâyet
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ModerationReport" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }

  # --- dosyalar (#135, ADR-0007, ADR-0020) ---
  #
  # Görüntüyü istemci işler: fotoğrafı okur (HEIC dahil), EXIF/GPS/XMP ve
  # diğer metadata'yı siler, yönü piksellere uygular ve iki varyant kodlar
  # (preview: en uzun kenar ≤ 400 px, full: ≤ 1600 px; JPEG ya da WebP).
  # Dosyalar sunucularımızdan geçmez: istemci yükleme ister, her varyantı
  # dönen imzalı linke (R2) PUT eder ve tamamlar; sunucu pikselleri çözmeden
  # başlıkları denetler. Hazır dosya içeriğe bağlanır (avatar, kapak, av
  # fotoğrafı) ve linkleri `POST /v1/media/urls` ile alınır. Hiçbir uç
  # istemciden URL ya da depolama anahtarı kabul etmez; kimlik yalnızca
  # `upload_id`'dir. R2 yapılandırılmamışsa bu uçlar 503 `unavailable` döner.
  # İmzalı linkler taşıyıcı sırlardır: log'a yazılmaz, paylaşılmaz.

  /v1/uploads:
    post:
      operationId: createUpload
      summary: Dosya yüklemesi açar ve her varyant için imzalı PUT linki döner
      description: |
        `variants`'ta tam bir `preview` ve bir `full`. Her link 5 dakika
        geçerlidir ve yalnızca o varyantın nesnesi, türü ve boyutu içindir:
        `headers`'taki `Content-Type` ve `Content-Length` aynen
        gönderilmelidir; başka tür ya da boyutla R2 isteği reddeder. Anahtarı
        sunucu belirler. Kapak ve av fotoğrafında `tayfa_id` zorunludur
        (aktif üye olunmalı, tayfa salt okunur olmamalı); avatarda verilmez.
        Aynı `client_request_id` ile tekrar, kayıt `pending` iken aynı
        yüklemeyi yeni linklerle döner. Sınırlar: kullanıcı başına saatte 30
        yükleme (`upload-rate-limited`) ve 500 MiB toplam
        (`upload-quota-exceeded`; iki varyantın boyutları birlikte).
      parameters:
        - $ref: "#/components/parameters/ClientHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UploadCreateRequest" }
      responses:
        "201":
          description: Yükleme açıldı
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UploadCreated" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }

  /v1/uploads/{upload_id}:
    parameters:
      - $ref: "#/components/parameters/UploadID"
    get:
      operationId: getUpload
      summary: Kendi yüklemenizin durumu (hazırsa linkleriyle)
      description: Başkasının yüklemesi `upload-not-found` döner.
      responses:
        "200":
          description: Yükleme
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UploadView" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }

  /v1/uploads/{upload_id}/complete:
    parameters:
      - $ref: "#/components/parameters/UploadID"
    post:
      operationId: completeUpload
      summary: PUT'ların bittiğini bildirir; sunucu denetler (ready ya da rejected)
      description: |
        Gövde full varyantın ölçüleridir. Sunucu aynı çağrıda, pikselleri
        çözmeden, her varyant için denetler: saklanan boyut bildirilenle
        aynı; ilk baytlar bildirilen türde JPEG ya da WebP; başlıktaki ölçü
        full için bildirilenle aynı ve en uzun kenar ≤ 1600, preview için en
        uzun kenar ≤ 400 ve en-boy oranı full ile en çok ±1 px farkla aynı;
        EXIF (GPS dahil), XMP, IPTC yok (WebP'de EXIF/XMP parçası ya da
        bayrağı yok). Geçen varyantlar istemcinin yazamadığı yere
        kopyalanır. Bir varyant henüz yoksa `upload-not-received` (409):
        PUT'u bitirip link geçerliyken tekrar çağırın. Depoya ulaşılamazsa
        503 ve yükleme `pending` kalır. Yükleme `pending` değilse tekrar
        çağrı onu değiştirmeden döner.
      parameters:
        - $ref: "#/components/parameters/ClientHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UploadCompleteRequest" }
      responses:
        "200":
          description: Yükleme (`ready` ya da `rejected`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UploadView" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }

  /v1/media/urls:
    post:
      operationId: getMediaUrls
      summary: Dosyaların 1 saat geçerli imzalı indirme linkleri
      description: |
        Yanıtlardaki `*_upload_id` alanlarını (avatar, kapak, av fotoğrafı)
        toplu çözer; istemci linkleri süreleri dolana kadar önbellekte
        tutar. Görülemeyen dosya nedeni söylenmeden atlanır (bilinmeyen,
        hazır olmayan, silinmiş ve yetkisiz aynıdır). Kurallar: kendi
        dosyanız her zaman; avatar oturum açmış herkese (iki taraftan biri
        engellediyse ya da hesap silindiyse kimseye); tayfa kapağı aktif
        üyelere; etkinlik kapağı ve av fotoğrafı etkinliği görebilen aktif
        üyelere. 1–100 farklı kimlik; sıra korunur.
      parameters:
        - $ref: "#/components/parameters/ClientHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MediaUrlsRequest" }
      responses:
        "200":
          description: Görülebilen dosyaların linkleri
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MediaUrlsList" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }

  /v1/me/avatar:
    put:
      operationId: putAvatar
      summary: Hazır avatar yüklemenizi avatarınız yapar
      description: |
        `purpose: avatar` ile açılıp `ready` olmuş kendi yüklemeniz. identity
        yüklemeyi core'a sizin token'ınızla doğrulatır: başkasının, hazır
        olmayan ya da başka amaçlı yükleme `upload-not-found` /
        `upload-not-ready` / `upload-in-use` döner. Eski avatar silinir.
        Diğer kullanıcılar yeni avatarı kısa süre sonra görür (profil
        kopyaları olayla güncellenir).
      parameters:
        - $ref: "#/components/parameters/ClientHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AvatarRequest" }
      responses:
        "200":
          description: Avatar
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AvatarView" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
    delete:
      operationId: deleteAvatar
      summary: Avatarı kaldırır (dosya silinir)
      parameters:
        - $ref: "#/components/parameters/ClientHeader"
      responses:
        "204": { description: Kaldırıldı }
        "401": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }

  /v1/me/data-exports:
    post:
      operationId: createDataExport
      summary: KVKK veri dışa aktarma talebi açar (30 günde bir)
      description: |
        Verilerinizin bir kopyasını hazırlar (KVKK md. 11; ADR-0021).
        Toplama hemen, **sizin erişim token'ınızla** başlar: talepten hemen
        önce token'ı yenileyin; süresi bir dakikadan az kalmışsa `401` döner,
        yenileyip tekrar deneyin. Yanıt `202` ve `pending` ya da
        `processing` durumudur; hazır olunca `data_export_ready` bildirimi
        gelir. Durumu `GET /v1/me/data-exports/{data_export_id}` ile de
        yoklayabilirsiniz.

        30 günde bir talep açılabilir (`429 data-export-limit`); başarısız
        talepler sayılmaz. Aynı anda tek talep (`409 data-export-in-progress`).
        Bir sonraki talep zamanı ve süren talep `GET /v1/me/data-exports`
        yanıtındadır. Aynı `client_request_id` ile tekrar aynı talebi döner.

        İçerik: profil (doğum tarihi dahil), giriş kimlikleri, cihazlar,
        onaylar, üyelikler, katılımlar, yazdığınız içerikler (duyuru,
        etkinlik, soru, cevap, kanal mesajları, av kayıtları), kendi anket
        oylarınız (gizli anket dahil), arkadaşlıklar, engellemeler,
        şikâyetleriniz ve yüklediğiniz dosyaların listesi. Birebir mesajlar
        girmez (uçtan uca şifreli; uygulama cihazda dışa aktarır). Dosyaların
        kendisi girmez; kendi dosyalarınızı `POST /v1/media/urls` ile
        indirebilirsiniz. Alanlar: `docs/data-export-format.md`.

        Depolama veya anahtar yapılandırılmamışsa `503 unavailable`.
      parameters:
        - $ref: "#/components/parameters/ClientHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DataExportRequest" }
      responses:
        "202":
          description: Talep açıldı ya da tekrar gönderimde mevcut talep
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DataExport" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
    get:
      operationId: listDataExports
      summary: Son 30 günün dışa aktarma talepleri, yeniden eskiye
      parameters:
        - $ref: "#/components/parameters/ClientHeader"
      responses:
        "200":
          description: Talepleriniz
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DataExportList" }
        "401": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }

  /v1/me/data-exports/{data_export_id}:
    get:
      operationId: getDataExport
      summary: Bir dışa aktarma talebiniz
      description: Başkasının talebi `404 data-export-not-found` döner.
      parameters:
        - $ref: "#/components/parameters/ClientHeader"
        - $ref: "#/components/parameters/DataExportID"
      responses:
        "200":
          description: Talep
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DataExport" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }

  /v1/me/data-exports/{data_export_id}/download:
    post:
      operationId: downloadDataExport
      summary: Hazır dışa aktarmanın indirme linki ve anahtarı
      description: |
        Son 10 dakika içinde sağlayıcıyla (Google/Apple) giriş yapılmış
        olmalıdır (hesap silmedeki kural); yenilenmiş token yetmez, değilse
        `403 reauthentication-required`. Link 5 dakika geçerlidir; dosya
        şifrelidir ve `key` ile cihazda çözülür (`format: aes-256-gcm-v1`):
        bayt 0 = `0x01`, bayt 1–12 nonce, kalanı AES-256-GCM şifreli metin
        ve sondaki 16 baytlık etiket; ek veri (AAD) `tayfam/data-export/v1/`
        ve talep kimliğinin 16 baytı. Çözülen içerik bir zip'tir. Link ve
        anahtar saklanmaz, log'a yazılmaz; yanıt önbelleğe alınmaz.
        Hazır değilse `409 data-export-not-ready`, 7 gün dolduysa
        `410 data-export-expired`.
      parameters:
        - $ref: "#/components/parameters/ClientHeader"
        - $ref: "#/components/parameters/DataExportID"
      responses:
        "200":
          description: Link ve anahtar
          headers:
            Cache-Control:
              schema: { type: string, enum: [no-store] }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DataExportDownload" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "410": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }

  /v1/me/reports:
    get:
      operationId: listMyReports
      summary: Yaptığınız şikâyetler, yeniden eskiye
      parameters:
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/PageToken"
      responses:
        "200":
          description: Şikâyetleriniz
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MyReportList" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
    post:
      operationId: createDirectMessageReport
      summary: Bir birebir mesajı şikâyet eder (yalnızca platforma gider)
      description: |
        Tayfaya ait olmayan şikâyetler için; şimdilik yalnızca
        `target_type: dm_message`. `target_id` mesajın kimliğidir. Mesajın
        konuşmasının tarafı olmalısınız (reddettiğiniz istek dahil; silinmiş
        mesaj da olur); kendi mesajınız, bilinmeyen mesaj ve göndereni
        hesabını silmiş mesaj `report-target-not-found`.

        `evidence_text` zorunludur (1–2000 karakter): mesajın metnini kendi
        cihazınızdan bilinçli olarak paylaşırsınız; sunucu mesaj içeriğini
        şikâyete kendisi eklemez (uçtan uca şifreleme aşamasında göremeyecek).
        Bu metin yalnızca platform tarafından okunur, size de geri dönmez.

        Şikâyet hiçbir tayfanın moderasyon kuyruğuna düşmez; oluşturulduğu
        anda platforma gider. Öncelik kuralı aynıdır (sizden ya da
        göndericiden biri 18 yaş altıysa öne geçer; yaş gösterilmez).
        `staff_conduct` geçerli değildir. Aynı mesajı ikinci kez şikâyet
        etmek ilk şikâyetinizi `200` ile döndürür; 24 saatte en fazla 20
        şikâyet (`report-limit`, tüm şikâyetlerle birlikte).
      parameters:
        - $ref: "#/components/parameters/ClientHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReportCreateRequest" }
      responses:
        "200":
          description: Bu mesaja daha önce yaptığınız şikâyet
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MyReport" }
        "201":
          description: Yeni şikâyet
          headers:
            Location:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MyReport" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }

  /v1/me/reports/{report_id}:
    parameters:
      - $ref: "#/components/parameters/ReportID"
    get:
      operationId: getMyReport
      summary: Yaptığınız bir şikâyet
      description: |
        `report_resolved` bildiriminin hedefidir. Tayfadan ayrılmış olsanız da
        döner. Başkasının şikâyeti `report-not-found` döner.
      responses:
        "200":
          description: Şikâyet
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MyReport" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }

  /v1/realtime:
    get:
      operationId: connectRealtime
      summary: WebSocket bağlantısını açar
      description: |
        WebSocket el sıkışması (`Upgrade: websocket`), kullanıcının erişim
        token'ıyla (ADR-0014): mobil istemci `Authorization: Bearer` başlığı
        koyar. Token URL'de taşınmaz; çerez kimlik yerine geçmez. Token
        geçerliyse `101 Switching Protocols` döner. Bağlantı chat servisinde
        çalışır; gateway token'ı doğrulayıp chat'e iletir, chat yeniden
        doğrular.

        **Token ömrü:** Bağlantı en geç erişim token'ının süresi dolunca
        **4003 `token_expired`** ile kapanır (`ready.data.expires_at`).
        İstemci token'ı yeniler (`POST /v1/auth/refresh`) ve yeniden
        bağlanır, kaçırdıklarını REST ile çeker.

        **Origin:** Yalnızca mobil uygulamalar bağlanır (ADR-0017). `Origin`
        başlığı taşıyan (tarayıcıdan gelen) her istek, kaynağı ne olursa
        olsun `forbidden-origin` (403) alır; web geliştirme derlemesi
        WebSocket kurmaz.

        **Çerçeveler:** Yalnızca metin çerçevesi, JSON:
        `{ "type": "...", "id": "...", "data": { ... } }`. Bir çerçeve en
        fazla 64 KB'tır; büyüğü bağlantıyı 1009 ile kapatır, ikili çerçeve
        1003 ile. İstemcinin gönderdiği `id` (en fazla 64 karakter) cevapta
        aynen döner.

        İstemci çerçeveleri:
        - `subscribe` `{tayfa_id, channel_id}` → `subscribed`. Yetki her
          abonelikte core'a sorulur (REST ile aynı kural): üye olunmayan
          tayfa `tayfa_not_found`; görülemeyen kanal (staff kanalı dahil)
          `channel_not_found`. Bağlantı başına en fazla 100 abonelik
          (`too_many_subscriptions`).
        - `unsubscribe` `{tayfa_id, channel_id}` → `unsubscribed`
          (`reason: requested`).
        - `send` `{tayfa_id, channel_id, body, client_request_id}` → `sent`
          (mesaj). REST'teki `POST …/messages` ile aynı fonksiyondan geçer:
          susturma (`muted`), yavaş mod (`slow_mode`,
          `data.retry_after_seconds`), arşiv (`channel_archived`), salt
          okunur tayfa (`tayfa_read_only`), yetki (`permission_denied`),
          boyut (`invalid_request`, `data.field: body`). Aynı
          `client_request_id` ile tekrar gönderim ilk mesajı döner.
        - `dm.send` `{recipient_user_id, body, client_request_id}` →
          `dm.sent` (birebir mesaj ve `conversation_status`: `active`,
          `request_sent`, `request_received`). REST'teki
          `POST /v1/direct-messages` ile aynı fonksiyondan geçer; abonelik
          gerekmez. Hatalar: `direct_message_not_allowed`,
          `message_request_pending`, `message_request_limit`,
          `rate_limited`, `invalid_request` (`data.field`), `unavailable`.
          `e2e_required` (taraflardan birinin E2E cihazı var; zarflı
          gönderim REST'tedir).
          `send` ve `dm.send`, REST ile ortak mesaj hız sınırına tabidir
          (kullanıcı başına dakikada 30, patlama 10): aşılınca o çerçeveye
          `rate_limited` hatası döner, bağlantı açık kalır.
        - `dm.envelope_ack` `{envelope_ids}` (1–100) → `dm.envelope_acked`.
          Bu bağlantının cihazına (oturumuna) ait teslim alınmış zarfları
          siler (`POST /v1/me/e2e/envelopes/ack` ile aynı). Cihaz yoksa
          `e2e_device_not_registered`.

        Sunucu çerçeveleri:
        - `ready`: bağlantı hazır; `data.heartbeat_seconds` ping aralığı,
          `data.expires_at` bağlantının en geç kapanacağı an.
        - `message.created`, `message.restored`: abone olunan kanalda yeni
          ya da geri alınan mesaj `{id, tayfa_id, channel_id,
          author_user_id, body, created_at}`; gönderenin kendi bağlantısına
          da gelir (istemci `id` ile tekilleştirir).
        - `message.deleted`: `{tayfa_id, channel_id, message_id}`.
        - `unsubscribed`: sunucunun kestiği abonelik; `data.reason`:
          `access_lost` (tayfadan ayrılma, ban, rol düşmesi sonrası staff
          kanalı, kanalın staff yapılması, tayfanın silinmesi) veya
          `recheck_failed` (izin yeniden denetlenemedi; tekrar abone
          olunabilir).
        - `notification`: yeni bildirim `{type, tayfa_id, target_type,
          target_id}`; içerik yok, liste REST'ten çekilir.
        - `dm.message_created`: birebir mesaj `{id, conversation_id,
          sender_user_id, body, encryption, created_at}`; konuşmanın iki
          tarafının tüm bağlantılarına gider (gönderenin diğer cihazları
          dahil). `encryption: e2e` ise `body` boştur; içerik cihaza
          `dm.envelope` ile gelir.
        - `dm.envelope`: yalnızca hedef cihazın (oturumun) bağlantılarına
          giden uçtan uca zarf `{id, message_id, conversation_id,
          sender_user_id, sender_device_id, sender_device_number, type
          (whisper|prekey), content (base64), created_at}`. Teslim en az bir
          kezdir: istemci `id` ile tekilleştirir, sakladıktan sonra
          `dm.envelope_ack` gönderir. Bu çerçeve 64 KB'ı aşabilir.
        - `e2e.prekeys_low`: cihazın tek kullanımlık ön anahtarları azaldı
          `{ec, kyber}`; `POST /v1/me/e2e/device/prekeys` ile yükleyin.
        - `e2e.link_answered`: cihazın eşleştirme isteği cevaplandı
          `{link_request_id}`.
        - `e2e.history_key_shared`: cihaz için yeni geçmiş anahtarı
          paylaşımı var (`GET /v1/me/e2e/history-key-shares`).
        - `dm.message_deleted`: `{conversation_id, message_id}`.
        - `dm.conversation_accepted`: mesaj isteği kabul edildi
          `{conversation_id}`. Reddedilen istek gönderene bildirilmez.
        - `dm.read`: karşı tarafın okundu işareti `{conversation_id,
          user_id, last_read_message_id}`; yalnızca aktif konuşmada.
        - `error`: `data.code`: `invalid_frame`, `invalid_request`
          (`data.field`), `unsupported_type`, `rate_limited` (kullanıcı
          başına dakikada 60, en fazla 20'lik ani gönderim; sürdüren
          bağlantı 1008 ile kapanır), `busy`, `unavailable`, `internal` ve
          yukarıdaki yetki kodları.

        WebSocket yalnızca canlı iletim içindir: yeniden bağlanan istemci
        kaçırdıklarını REST ile, son gördüğü kimlikten itibaren çeker.

        **Canlılık:** Sunucu 30 saniyede bir ping gönderir; 10 saniye içinde
        pong gelmezse bağlantıyı kapatır. Okunmayan çerçeveler birikirse
        bağlantı 4002 `slow_consumer` ile kapanır.

        **Kapatma kodları:** 1001 sunucu kapanıyor (yeniden bağlan), 4001
        oturum kapatıldı, hesap askıya alındı veya silindi (yeniden giriş
        gerekir), 4002 yavaş istemci, 4003 token süresi doldu (token'ı
        yenile, yeniden bağlan).

        Kullanıcı başına en fazla 5 açık bağlantı vardır (`rate-limited`).

        **İstemci sürümü:** Mobil istemci el sıkışmasında
        `X-Tayfam-Client-Version` gönderir; eski sürüm bağlantı açılmadan
        `client-outdated` (426) alır.
      parameters:
        - $ref: "#/components/parameters/ClientVersionHeader"
      responses:
        "101": { description: WebSocket bağlantısı açıldı }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "426": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }

components:
  securitySchemes:
    bearer: { type: http, scheme: bearer, bearerFormat: JWT }

  parameters:
    DataExportID:
      name: data_export_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    UploadID:
      name: upload_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    ClientHeader:
      name: X-Tayfam-Client
      in: header
      required: true
      description: |
        İstemcinin adı; durum değiştiren her istekte zorunlu (ADR-0004,
        ADR-0017). `web` yalnızca prod dışında (yerel web geliştirme
        derlemesi) kabul edilir.
      schema: { type: string, enum: [android, ios, web] }
    ClientVersionHeader:
      name: X-Tayfam-Client-Version
      in: header
      required: false
      description: |
        İstemcinin platformu ve sürümü, `<platform>/<sürüm>` (ADR-0016).
        Her işlemde kabul edilir; `GET /v1/status` ve
        `GET /v1/client-config` dışında platformun en düşük sürümünün
        altındaki istek `client-outdated` (426) alır. Başlık yoksa istek
        kabul edilir. `web` platformu yalnızca prod dışında geçerlidir;
        prod'da `invalid-client-version` (400).
      schema:
        type: string
        maxLength: 80
        pattern: '^(android|ios|web)/(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$'
        examples: [android/1.4.2]
    TayfaID:
      name: tayfa_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    UserID:
      name: user_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    EventID:
      name: event_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    SeriesID:
      name: series_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    AnnouncementID:
      name: announcement_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    PollID:
      name: poll_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    OptionID:
      name: option_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    QuestionID:
      name: question_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    AnswerID:
      name: answer_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    TagID:
      name: tag_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    ReportID:
      name: report_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    NotificationID:
      name: notification_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    ChannelID:
      name: channel_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    MessageID:
      name: message_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    ConversationID:
      name: conversation_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    LinkRequestID:
      name: link_request_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    SessionID:
      name: session_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    PageSize:
      name: page_size
      in: query
      required: false
      schema: { type: integer, minimum: 0, maximum: 100, default: 0 }
    PageToken:
      name: page_token
      in: query
      required: false
      description: Önceki yanıtın `next_page_token` değeri; opak.
      schema: { type: string, maxLength: 1024 }

  responses:
    Problem:
      description: |
        Hata. `type` değeri `https://tayfam.app/problems/<kod>` biçimindedir;
        kodların tam listesi `x-problem-types` altındadır.
      x-problem-types:
        # Genel
        - invalid-request
        - missing-client-header
        # İstemci sürümü (#114, ADR-0016): 426 ve 400
        - client-outdated
        - invalid-client-version
        - unauthenticated
        - not-found
        - rate-limited
        - unavailable
        - internal
        # identity
        - invalid-credentials
        - unsupported-provider
        - age-blocked
        - account-sanctioned
        # Platform paneli (issue #104; panel sözleşmesi api/openapi/admin.yaml)
        - reason-required
        - sanction-conflict
        - decision-not-applicable
        - tayfa-state-conflict
        - invalid-refresh
        - refresh-conflict
        - invalid-birth-date
        - consent-outdated
        - already-registered
        - invalid-display-name
        # core: tayfa ve yetki
        - tayfa-not-found
        - permission-denied
        - muted
        - tayfa-read-only
        - tayfa-create-limit
        - deletion-already-requested
        - deletion-not-requested
        # core: katılım ve davet
        - invalid-join-code
        - invite-invalid
        - invite-expired
        - invite-revoked
        - invite-exhausted
        - invite-not-found
        - already-member
        - already-pending
        - banned
        # core: üye yönetimi
        - member-not-found
        - role-hierarchy
        - last-admin
        # core: modüller ve duyurular
        - module-disabled
        - announcement-not-found
        # core: etkinlikler
        - event-not-found
        - event-cancelled
        - event-ended
        - event-not-going
        - event-item-not-found
        - event-limit
        - event-type-mismatch
        # core: katılım doğrulama, av günlüğü
        - check-in-closed
        - check-in-too-far
        - check-in-attempts-exhausted
        - correction-closed
        - hike-not-started
        - not-attended
        # core: tekrarlayan etkinlik (#51)
        - event-series-not-found
        - event-series-ended
        # core: soru-cevap (#59)
        - question-not-found
        - answer-not-found
        - tag-not-found
        - own-answer-vote
        - tag-limit
        # core: anketler (#60)
        - poll-not-found
        - poll-closed
        - poll-anonymous
        # core: arkadaşlık, engelleme, doğrudan davet (#71)
        - user-not-found
        - friend-request-limit
        - friend-request-not-found
        - already-friends
        - friend-request-pending
        - not-friends
        - direct-invite-limit
        - invitation-not-found
        - already-invited
        - invite-not-allowed
        # core: şikâyetler ve moderasyon kuyruğu (#76)
        - report-not-found
        - report-target-not-found
        - report-limit
        - report-already-resolved
        - report-action-missing
        # core: dosyalar (#135, ADR-0007, ADR-0020)
        - upload-not-found
        - upload-not-ready
        - upload-in-use
        - upload-not-received
        - upload-rate-limited
        - upload-quota-exceeded
        # identity: hesap ve referans kodu (#71; rate-limited yukarıda)
        - referral-code-not-found
        # identity: hesap yönetimi (#75)
        - reauthentication-required
        - session-not-found
        # identity: veri dışa aktarma (#144)
        - data-export-not-found
        - data-export-in-progress
        - data-export-limit
        - data-export-not-ready
        - data-export-expired
        # chat: bildirimler (#64)
        - notification-not-found
        # chat: kanallar (#81)
        - channel-not-found
        - message-not-found
        - channel-archived
        - channel-name-taken
        - slow-mode
        # chat: gerçek zamanlı bağlantı (#82)
        - forbidden-origin
        # chat: birebir mesajlar (#95)
        - conversation-not-found
        - direct-message-not-allowed
        - message-request-pending
        - message-request-limit
        - message-request-not-found
        # chat: uçtan uca şifreleme (#127, ADR-0018)
        - e2e-device-not-registered
        - e2e-device-already-registered
        - e2e-device-limit
        - e2e-devices-changed
        - e2e-recipient-unavailable
        - e2e-required
        - e2e-not-paired
        - e2e-already-paired
        - e2e-paired-device-exists
        - e2e-history-key-stale
        - e2e-link-request-not-found
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }

  schemas:
    Problem:
      type: object
      required: [type, title, status]
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
        request_id: { type: string }

    Status:
      type: object
      required: [status, version, services, checked_at]
      properties:
        status: { type: string, enum: [ok, degraded] }
        version: { type: string }
        services:
          type: object
          additionalProperties: { type: string, enum: [ok, unavailable] }
        checked_at: { type: string, format: date-time }

    ClientConfig:
      type: object
      required: [platforms]
      properties:
        platforms:
          type: object
          required: [android, ios]
          properties:
            android: { $ref: "#/components/schemas/PlatformVersions" }
            ios: { $ref: "#/components/schemas/PlatformVersions" }
            web:
              $ref: "#/components/schemas/PlatformVersions"
              description: Yalnızca prod dışında; web geliştirme derlemesi (ADR-0017).

    PlatformVersions:
      type: object
      description: Yapılandırılmamış alan yoktur.
      properties:
        min_supported_version:
          type: string
          description: Bunun altındaki sürümler `client-outdated` alır.
          examples: ["1.2.0"]
        latest_version:
          type: string
          description: Mağazadaki en son sürüm; yalnızca bilgi.
          examples: ["1.5.0"]

    SignInRequest:
      type: object
      required: [provider, id_token, nonce, platform]
      additionalProperties: false
      properties:
        provider: { type: string, enum: [google] }
        id_token: { type: string, maxLength: 8192 }
        nonce: { type: string, minLength: 16, maxLength: 256 }
        platform:
          type: string
          enum: [android, ios, web]
          description: "`web` yalnızca prod dışında (ADR-0017)."

    RefreshRequest:
      type: object
      required: [refresh_token]
      additionalProperties: false
      properties:
        refresh_token: { type: string, maxLength: 64 }

    Session:
      type: object
      required: [user_id, session_id, access_token, access_expires_at, refresh_token, refresh_expires_at, registration_pending]
      properties:
        user_id: { type: string, format: uuid }
        session_id: { type: string, format: uuid }
        access_token: { type: string }
        access_expires_at: { type: string, format: date-time }
        refresh_token: { type: string }
        refresh_expires_at: { type: string, format: date-time }
        registration_pending: { type: boolean }
        consent_required:
          type: boolean
          description: |
            Kayıtlı kullanıcı aydınlatma metninin veya kullanım koşullarının
            güncel sürümünü onaylamamış. İstemci `/v1/me/consents` ile
            yeni metinleri gösterip onay alır.

    RegistrationRequirements:
      type: object
      required: [privacy_notice_version, terms_version, minimum_age]
      properties:
        privacy_notice_version: { type: string }
        terms_version: { type: string }
        minimum_age: { type: integer }

    DeviceSession:
      type: object
      required: [session_id, platform, created_at, last_seen_at, current]
      properties:
        session_id: { type: string, format: uuid }
        platform: { type: string, enum: [android, ios, web, unknown] }
        created_at: { type: string, format: date-time }
        last_seen_at:
          type: string
          format: date-time
          description: Oturumun son token yenilemesi.
        current: { type: boolean, description: Bu isteğin oturumu. }

    DeviceSessionList:
      type: object
      required: [sessions]
      properties:
        sessions:
          type: array
          items: { $ref: "#/components/schemas/DeviceSession" }

    RevokedSessions:
      type: object
      required: [revoked_count]
      properties:
        revoked_count: { type: integer, minimum: 0 }

    ConsentStatus:
      type: object
      required: [privacy_notice_version, terms_version, consent_required]
      properties:
        privacy_notice_version: { type: string }
        terms_version: { type: string }
        consent_required: { type: boolean }

    ConsentRequest:
      type: object
      required: [privacy_notice_version, terms_version]
      additionalProperties: false
      properties:
        privacy_notice_version: { type: string, maxLength: 32 }
        terms_version: { type: string, maxLength: 32 }

    RegistrationRequest:
      type: object
      required: [birth_date, accepted_privacy_notice_version, accepted_terms_version]
      additionalProperties: false
      properties:
        birth_date: { type: string, format: date }
        display_name: { type: string, minLength: 1, maxLength: 40 }
        accepted_privacy_notice_version: { type: string, maxLength: 32 }
        accepted_terms_version: { type: string, maxLength: 32 }
        referral_code:
          type: string
          maxLength: 32
          description: |
            İsteğe bağlı; uygulamaya getiren kişinin referans kodu (Android'de
            mağaza referansı, iOS'ta elle). Bir kez kaydedilir; kimseyi
            bulmayan kod hata vermeden yok sayılır.

    # --- core ---

    EventType:
      type: string
      description: Tayfanın ilgi alanları etkinlik türleriyle aynı değerleri kullanır.
      enum: [convoy, camp, hike, fishing, gaming, sports, general]
    JoinPolicy:
      type: string
      description: "`approval`: yeni üyeler onay bekler. `open`: hemen etkin olur."
      enum: [approval, open]
    Module:
      type: string
      enum: [announcements, events, qa, polls]
    Role:
      type: string
      enum: [member, moderator, admin]

    TayfaCreateRequest:
      type: object
      required: [name, client_request_id]
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 3
          maxLength: 50
          description: Baştaki ve sondaki boşluklar atıldıktan sonra 3–50 karakter.
        description: { type: string, maxLength: 500 }
        interests:
          type: array
          maxItems: 7
          uniqueItems: true
          items: { $ref: "#/components/schemas/EventType" }
        join_policy:
          allOf: [{ $ref: "#/components/schemas/JoinPolicy" }]
          default: approval
        client_request_id:
          type: string
          format: uuid
          description: İstemcinin her açma denemesi için bir kez ürettiği, tekrar gönderimde aynen kullandığı UUID.

    TayfaUpdateRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        cover_upload_id:
          type: string
          description: |
            Kendi hazır `cover` yüklemeniz (bu tayfa için açılmış); `""` kapağı
            kaldırır. Eski kapak silinir. Yönetici yetkisi gerekir.
        name: { type: string, minLength: 3, maxLength: 50 }
        description: { type: string, maxLength: 500 }
        interests:
          type: array
          maxItems: 7
          uniqueItems: true
          items: { $ref: "#/components/schemas/EventType" }
        join_policy: { $ref: "#/components/schemas/JoinPolicy" }
        members_can_create_events:
          type: boolean
          description: "`true`: her etkin üye etkinlik açabilir. `false`: yalnızca moderatör ve yönetici."

    Tayfa:
      type: object
      required: [id, name, description, interests, join_policy, modules, status, member_count, members_can_create_events, created_at, updated_at]
      properties:
        cover_upload_id: { type: string, format: uuid, description: "Kapak; linkleri `POST /v1/media/urls`." }
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string }
        interests:
          type: array
          items: { $ref: "#/components/schemas/EventType" }
        join_policy: { $ref: "#/components/schemas/JoinPolicy" }
        modules:
          type: object
          description: Her modülün açık olup olmadığı.
          properties:
            announcements: { type: boolean }
            events: { type: boolean }
            qa: { type: boolean }
            polls: { type: boolean }
        status:
          type: string
          description: "`warned`: hareketsiz, 7 gün sonra arşivlenir. `archived`: salt okunur."
          enum: [active, warned, archived]
        suspended_at:
          type: string
          format: date-time
          description: Platform tayfayı askıya aldıysa (salt okunur). Sebep dönmez.
        deletion_at:
          type: string
          format: date-time
          description: Silme bekliyorsa tayfanın silineceği zaman (salt okunur).
        member_count: { type: integer }
        members_can_create_events:
          type: boolean
          description: |
            `true` ise her etkin üye etkinlik açabilir; `false` (varsayılan)
            ise yalnızca moderatör ve yönetici. Organizatör kendi etkinliğini
            her zaman yönetir.
        join_code:
          type: string
          description: Yalnızca yöneticiye döner.
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    TayfaView:
      type: object
      required: [tayfa, caller_role]
      properties:
        tayfa: { $ref: "#/components/schemas/Tayfa" }
        caller_role: { $ref: "#/components/schemas/Role" }

    MyTayfa:
      type: object
      required: [tayfa_id, name, role, status]
      properties:
        tayfa_id: { type: string, format: uuid }
        name: { type: string }
        role: { $ref: "#/components/schemas/Role" }
        status: { type: string, enum: [active, pending] }
        tayfa:
          allOf: [{ $ref: "#/components/schemas/Tayfa" }]
          description: Yalnızca etkin üyelikte.

    MyTayfaList:
      type: object
      required: [tayfas]
      properties:
        tayfas:
          type: array
          items: { $ref: "#/components/schemas/MyTayfa" }
        next_page_token: { type: string }

    ModuleUpdate:
      type: object
      required: [enabled]
      additionalProperties: false
      properties:
        enabled: { type: boolean }

    JoinCode:
      type: object
      required: [join_code]
      properties:
        join_code:
          type: string
          description: 8 karakter, `[2-9A-HJ-NP-Z]`.

    Deletion:
      type: object
      required: [deletion_at]
      properties:
        deletion_at: { type: string, format: date-time }

    Membership:
      type: object
      required: [tayfa_id, user_id, role, status]
      properties:
        tayfa_id: { type: string, format: uuid }
        user_id: { type: string, format: uuid }
        role: { $ref: "#/components/schemas/Role" }
        status: { type: string, enum: [invited, pending, active, banned] }
        joined_at:
          type: string
          format: date-time
          description: Üyelik etkin olduğunda.
        muted_until:
          type: string
          format: date-time
          description: Susturma bitişi; yalnızca üyenin kendisine, moderatöre ve yöneticiye döner.

    MemberList:
      type: object
      required: [members]
      properties:
        members:
          type: array
          items: { $ref: "#/components/schemas/Membership" }
        next_page_token: { type: string }

    RoleUpdate:
      type: object
      required: [role]
      additionalProperties: false
      properties:
        role: { $ref: "#/components/schemas/Role" }

    MuteRequest:
      type: object
      required: [muted_until]
      additionalProperties: false
      properties:
        muted_until:
          type: string
          format: date-time
          description: Şimdiden sonra, en fazla 30 gün ileri.

    JoinRequest:
      type: object
      required: [user_id, requested_at, source]
      properties:
        user_id: { type: string, format: uuid }
        requested_at: { type: string, format: date-time }
        source: { type: string, enum: [invite_link, direct_invite, code, discover] }
        inviter_user_id:
          type: string
          format: uuid
          description: Davet eden ya da linki açan kişi; kodla katılımda yok.
        invite_id:
          type: string
          format: uuid
          description: Kullanılan davet linki; yalnızca `source=invite_link`.

    JoinRequestList:
      type: object
      required: [join_requests]
      properties:
        join_requests:
          type: array
          items: { $ref: "#/components/schemas/JoinRequest" }
        next_page_token: { type: string }

    InviteCreateRequest:
      type: object
      required: [ttl_seconds, max_uses]
      additionalProperties: false
      properties:
        ttl_seconds:
          type: integer
          minimum: 3600
          maximum: 2592000
          description: Linkin geçerlilik süresi; 1 saat ile 30 gün arası.
        max_uses: { type: integer, minimum: 1, maximum: 100 }

    Invite:
      type: object
      required: [id, tayfa_id, created_by_user_id, created_at, expires_at, max_uses, use_count]
      description: Davet linki. Token ya da özeti hiçbir zaman dönmez.
      properties:
        id: { type: string, format: uuid }
        tayfa_id: { type: string, format: uuid }
        created_by_user_id: { type: string, format: uuid }
        created_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
        max_uses: { type: integer }
        use_count: { type: integer }
        revoked_at: { type: string, format: date-time }

    CreatedInvite:
      type: object
      required: [invite, token]
      properties:
        invite: { $ref: "#/components/schemas/Invite" }
        token:
          type: string
          description: Linkin gizli kısmı (43 karakter base64url). Yalnızca burada, bir kez döner.

    InviteList:
      type: object
      required: [invites]
      properties:
        invites:
          type: array
          items: { $ref: "#/components/schemas/Invite" }

    JoinByCodeRequest:
      type: object
      required: [code]
      additionalProperties: false
      properties:
        code:
          type: string
          maxLength: 32
          description: Katılım kodu; büyük/küçük harf duyarsız.

    InviteTokenRequest:
      type: object
      required: [token]
      additionalProperties: false
      properties:
        token: { type: string, maxLength: 64 }

    InvitePreview:
      type: object
      required: [tayfa_id, name, member_count, already_member]
      description: Linki bilen herkesin görebileceği dar görünüm.
      properties:
        tayfa_id: { type: string, format: uuid }
        name: { type: string }
        member_count: { type: integer }
        already_member:
          type: boolean
          description: Zaten etkin üyeyseniz ya da bekleyen isteğiniz varsa.

    Announcement:
      type: object
      required: [id, tayfa_id, title, body, pinned, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        tayfa_id: { type: string, format: uuid }
        author_user_id:
          type: string
          format: uuid
          description: Yazarın hesabı silindiyse yoktur ("Silinmiş kullanıcı").
        title: { type: string }
        body: { type: string }
        pinned: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at:
          type: string
          format: date-time
          description: Her düzenleme, sabitleme ve geri almada değişir.

    AnnouncementList:
      type: object
      required: [announcements]
      properties:
        announcements:
          type: array
          items: { $ref: "#/components/schemas/Announcement" }
        next_page_token: { type: string }

    AnnouncementCreateRequest:
      type: object
      required: [title, client_request_id]
      additionalProperties: false
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 120
          description: Baştaki ve sondaki boşluklar atıldıktan sonra 1–120 karakter, tek satır.
        body:
          type: string
          maxLength: 5000
          description: En fazla 5000 karakter; satır sonu olabilir.
        client_request_id:
          type: string
          format: uuid
          description: İstemcinin her yayınlama denemesi için bir kez ürettiği, tekrar gönderimde aynen kullandığı UUID.

    AnnouncementUpdateRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        title: { type: string, minLength: 1, maxLength: 120 }
        body: { type: string, maxLength: 5000 }

    # --- Soru-cevap ---

    Tag:
      type: object
      required: [id, name]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, description: İlk yazıldığı haliyle 1–30 karakter. }
        question_count:
          type: integer
          description: Yalnızca etiket listesinde; etiketi taşıyan görünen soru sayısı.

    TagList:
      type: object
      required: [tags]
      properties:
        tags:
          type: array
          items: { $ref: "#/components/schemas/Tag" }

    Question:
      type: object
      required: [id, tayfa_id, title, body, tags, answer_count, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        tayfa_id: { type: string, format: uuid }
        author_user_id:
          type: string
          format: uuid
          description: Yazarın hesabı silindiyse yoktur ("Silinmiş kullanıcı").
        title: { type: string }
        body: { type: string }
        tags:
          type: array
          items: { $ref: "#/components/schemas/Tag" }
        answer_count: { type: integer, description: Görünen cevap sayısı. }
        created_at: { type: string, format: date-time }
        updated_at:
          type: string
          format: date-time
          description: Her düzenleme ve geri almada değişir.

    QuestionList:
      type: object
      required: [questions]
      properties:
        questions:
          type: array
          items: { $ref: "#/components/schemas/Question" }
        next_page_token: { type: string }

    QuestionCreateRequest:
      type: object
      required: [title, client_request_id]
      additionalProperties: false
      properties:
        title:
          type: string
          minLength: 10
          maxLength: 150
          description: Baştaki ve sondaki boşluklar atıldıktan sonra 10–150 karakter, tek satır.
        body:
          type: string
          maxLength: 10000
          description: En fazla 10000 karakter; satır sonu olabilir.
        tags:
          type: array
          maxItems: 5
          description: Etiket adları; her biri 1–30 karakter, tek satır, iç boşluklar teke iner.
          items: { type: string, minLength: 1, maxLength: 30 }
        client_request_id:
          type: string
          format: uuid
          description: İstemcinin her deneme için bir kez ürettiği, tekrar gönderimde aynen kullandığı UUID.

    QuestionUpdateRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        title: { type: string, minLength: 10, maxLength: 150 }
        body: { type: string, maxLength: 10000 }
        tags:
          type: array
          maxItems: 5
          items: { type: string, minLength: 1, maxLength: 30 }

    Answer:
      type: object
      required: [id, question_id, tayfa_id, body, vote_count, voted, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        question_id: { type: string, format: uuid }
        tayfa_id: { type: string, format: uuid }
        author_user_id:
          type: string
          format: uuid
          description: Yazarın hesabı silindiyse yoktur ("Silinmiş kullanıcı").
        body: { type: string }
        vote_count: { type: integer, description: Faydalı oyu sayısı. }
        voted: { type: boolean, description: Çağıran bu cevaba oy verdi mi. }
        created_at: { type: string, format: date-time }
        updated_at:
          type: string
          format: date-time
          description: Her düzenleme ve geri almada değişir; oylar değiştirmez.

    AnswerList:
      type: object
      required: [answers]
      properties:
        answers:
          type: array
          items: { $ref: "#/components/schemas/Answer" }
        next_page_token: { type: string }

    AnswerCreateRequest:
      type: object
      required: [body, client_request_id]
      additionalProperties: false
      properties:
        body:
          type: string
          minLength: 1
          maxLength: 10000
          description: Boşluklar atıldıktan sonra 1–10000 karakter; satır sonu olabilir.
        client_request_id: { type: string, format: uuid }

    AnswerUpdateRequest:
      type: object
      required: [body]
      additionalProperties: false
      properties:
        body: { type: string, minLength: 1, maxLength: 10000 }

    # --- Anketler ---

    Poll:
      type: object
      description: |
        Gizli ankette (`anonymous`) diğer üyeler, yöneticiler dahil, kimin
        neye oy verdiğini göremez; `own_option_ids` her zaman yalnızca
        çağıranın kendi oyudur. Sayımlar her ankette döner.
      required: [id, tayfa_id, question, anonymous, multiple_choice, closed, created_at, options, voter_count, own_option_ids]
      properties:
        id: { type: string, format: uuid }
        tayfa_id: { type: string, format: uuid }
        event_id:
          type: string
          format: uuid
          description: Anket bir etkinliğe bağlı değilse yoktur.
        created_by_user_id:
          type: string
          format: uuid
          description: Anketi açanın hesabı silindiyse yoktur ("Silinmiş kullanıcı").
        question: { type: string }
        anonymous: { type: boolean }
        multiple_choice: { type: boolean }
        closes_at:
          type: string
          format: date-time
          description: Planlanan kapanma zamanı; yoksa elle kapatılana kadar açık.
        closed_at:
          type: string
          format: date-time
          description: Erken kapatıldıysa.
        closed:
          type: boolean
          description: Erken kapatıldı ya da kapanma zamanı geçti; oy alınmaz.
        created_at: { type: string, format: date-time }
        options:
          type: array
          items: { $ref: "#/components/schemas/PollOption" }
        voter_count:
          type: integer
          format: int64
          description: Oy veren kişi sayısı (çok seçimlide kişi bir kez sayılır).
        own_option_ids:
          type: array
          description: Çağıranın kendi oyu; oy vermediyse boş.
          items: { type: string, format: uuid }

    PollOption:
      type: object
      required: [id, text, position, vote_count]
      properties:
        id: { type: string, format: uuid }
        text: { type: string }
        position: { type: integer }
        vote_count: { type: integer, format: int64 }

    PollList:
      type: object
      required: [polls]
      properties:
        polls:
          type: array
          items: { $ref: "#/components/schemas/Poll" }
        next_page_token: { type: string }

    PollCreateRequest:
      type: object
      required: [question, options]
      additionalProperties: false
      properties:
        question:
          type: string
          minLength: 1
          maxLength: 200
          description: Baştaki ve sondaki boşluklar atıldıktan sonra 1–200 karakter, tek satır.
        options:
          type: array
          minItems: 2
          maxItems: 10
          description: Her biri 1–100 karakter, tek satır; büyük/küçük harf farkı gözetmeden tekil.
          items: { type: string, minLength: 1, maxLength: 100 }
        anonymous:
          type: boolean
          default: false
          description: İlk oydan sonra değiştirilemez.
        multiple_choice: { type: boolean, default: false }
        closes_at:
          type: string
          format: date-time
          description: İsteğe bağlı; gelecekte, en fazla 365 gün sonra.
        event_id:
          type: string
          format: uuid
          description: İsteğe bağlı; aynı tayfanın etkinliği.

    PollVoteRequest:
      type: object
      required: [option_ids]
      additionalProperties: false
      properties:
        option_ids:
          type: array
          minItems: 1
          maxItems: 10
          uniqueItems: true
          items: { type: string, format: uuid }

    PollVoter:
      type: object
      required: [user_id, voted_at]
      properties:
        user_id: { type: string, format: uuid }
        voted_at: { type: string, format: date-time }

    PollVoterList:
      type: object
      required: [voters]
      properties:
        voters:
          type: array
          items: { $ref: "#/components/schemas/PollVoter" }
        next_page_token: { type: string }

    # --- Etkinlikler ---

    EventMode:
      type: string
      enum: [in_person, online]
    RsvpStatus:
      type: string
      description: "`waitlist` yalnızca sunucu tarafından verilir (dolu etkinlikte `going`)."
      enum: [going, maybe, not_going, waitlist]
    AttendanceStatus:
      type: string
      description: "`attended`: doğrulandı. `no_show`: organizatör düzeltmesiyle kaldırıldı."
      enum: [attended, no_show]
    AttendanceMethod:
      type: string
      description: |
        `location`: buluşma noktasına 300 m içinde check-in. `online`:
        çevrimiçi etkinlikte "Katıldım". `hike_start`: yürüyüşe çıkış.
        `organizer`: organizatör düzeltmesi.
      enum: [location, online, hike_start, organizer]

    LatLng:
      type: object
      required: [lat, lng]
      additionalProperties: false
      description: WGS 84 derece. Yalnızca gövdede taşınır; log'a yazılmaz.
      properties:
        lat: { type: number, minimum: -90, maximum: 90 }
        lng: { type: number, minimum: -180, maximum: 180 }

    ConvoyDetails:
      type: object
      properties:
        route:
          type: array
          description: Boş ya da 2–500 nokta.
          items: { $ref: "#/components/schemas/LatLng" }
        vehicles:
          type: array
          description: Yalnızca tek etkinlik yanıtında.
          items: { $ref: "#/components/schemas/ConvoyVehicle" }
    ConvoyDetailsInput:
      type: object
      additionalProperties: false
      properties:
        route:
          type: array
          maxItems: 500
          description: Boş ya da 2–500 nokta.
          items: { $ref: "#/components/schemas/LatLng" }
    ConvoyVehicle:
      type: object
      required: [id, user_id, make]
      properties:
        id: { type: string, format: uuid }
        user_id: { type: string, format: uuid }
        make: { type: string }
        model: { type: string }
        model_year: { type: integer, description: Verilmemişse yoktur. }
        color: { type: string }
        plate:
          type: string
          description: Yalnızca katılımcılara (`going`) ve organizatöre döner.
    ConvoyVehicleCreateRequest:
      type: object
      required: [make]
      additionalProperties: false
      properties:
        make: { type: string, minLength: 1, maxLength: 40 }
        model: { type: string, maxLength: 40 }
        model_year: { type: integer, description: "0 ya da 1900 – gelecek yıl." }
        color: { type: string, maxLength: 30 }
        plate:
          type: string
          maxLength: 16
          description: İsteğe bağlı, kişisel veri. Harf, rakam ve tek boşluk; 2–16 karakter.

    CampDetails:
      type: object
      properties:
        site_name: { type: string }
        has_water: { type: boolean, description: Bilinmiyorsa yoktur. }
        has_toilet: { type: boolean, description: Bilinmiyorsa yoktur. }
        notes: { type: string }
        items:
          type: array
          description: Yalnızca tek etkinlik yanıtında.
          items: { $ref: "#/components/schemas/CampItem" }
    CampDetailsInput:
      type: object
      additionalProperties: false
      properties:
        site_name: { type: string, maxLength: 120 }
        has_water: { type: boolean }
        has_toilet: { type: boolean }
        notes: { type: string, maxLength: 1000 }
    CampItem:
      type: object
      required: [id, name, quantity]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        quantity: { type: integer }
        assigned_user_id: { type: string, format: uuid, description: Getirecek kişi. }
    CampItemCreateRequest:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 60 }
        quantity: { type: integer, minimum: 0, maximum: 999, description: "0 ya da yok: 1." }
        assigned_user_id: { type: string, format: uuid, description: Tayfanın etkin bir üyesi. }

    HikeDetails:
      type: object
      properties:
        difficulty: { type: integer, minimum: 0, maximum: 5, description: "0: verilmemiş." }
        distance_km: { type: number, minimum: 0, maximum: 1000, description: "0: verilmemiş; iki ondalık." }
        elevation_m: { type: integer, minimum: 0, maximum: 9000, description: "0: verilmemiş." }
        expected_return_at: { type: string, format: date-time, description: Başlangıçtan sonra. }
        return_grace_minutes: { type: integer, minimum: 0, maximum: 1440, description: "0: varsayılan 30." }
    FishingDetails:
      type: object
      properties:
        spot_visibility:
          type: string
          enum: [tayfa, participants]
          description: |
            `participants`: buluşma noktasını yalnızca organizatör, moderatör,
            yönetici ve `going`/`maybe` cevabı verenler görür. Yoksa `tayfa`.
    GamingDetails:
      type: object
      required: [game, platform]
      properties:
        game: { type: string, minLength: 1, maxLength: 60 }
        platform: { type: string, enum: [pc, playstation, xbox, switch, mobile, other] }
    SportsDetails:
      type: object
      required: [sport]
      properties:
        sport: { type: string, enum: [football, table_football, basketball, volleyball, tennis, table_tennis, other] }
        venue_name: { type: string, maxLength: 120 }

    Recurrence:
      type: object
      required: [rrule]
      additionalProperties: false
      properties:
        rrule:
          type: string
          maxLength: 256
          description: |
            RFC 5545 RRULE alt kümesi: `FREQ=WEEKLY|MONTHLY`, `INTERVAL=1..52`,
            `BYDAY` (aylıkta sıralı: `2SA`, `-1FR`), `COUNT=1..500` ya da
            `UNTIL=YYYYMMDDTHHMMSSZ` (en fazla beş yıl), `WKST=MO`.
            `starts_at` ilk tekrardır ve kurala uymalıdır.
        time_zone:
          type: string
          maxLength: 64
          description: IANA adı; boşsa `Europe/Istanbul`. Yerel saat yaz saatinde korunur.

    Event:
      type: object
      required: [id, tayfa_id, type, mode, title, description, starts_at, ends_at, capacity, status, discoverable, going_count, maybe_count, waitlist_count, caller_can_manage, series_override, created_at, updated_at]
      description: |
        Bir etkin üyenin gördüğü etkinlik. Türe özel ayrıntı (`convoy`,
        `camp`, `hike`, `fishing`, `gaming`, `sports`) yalnızca tek etkinlik
        yanıtında ve en fazla biri dolu gelir.
      properties:
        cover_upload_id: { type: string, format: uuid, description: "Kapak; linkleri `POST /v1/media/urls`. Serinin ürettiği etkinliklerde yoktur." }
        id: { type: string, format: uuid }
        tayfa_id: { type: string, format: uuid }
        type: { $ref: "#/components/schemas/EventType" }
        mode: { $ref: "#/components/schemas/EventMode" }
        title: { type: string }
        description: { type: string }
        starts_at: { type: string, format: date-time }
        ends_at: { type: string, format: date-time }
        meeting_point_name: { type: string }
        meeting_point: { $ref: "#/components/schemas/LatLng" }
        city: { type: string }
        district: { type: string }
        online_url: { type: string, description: Çevrimiçi etkinlikte. }
        capacity: { type: integer, description: "0: sınırsız." }
        status: { type: string, enum: [scheduled, cancelled] }
        cancelled_at: { type: string, format: date-time }
        cancel_reason: { type: string }
        discoverable: { type: boolean }
        created_by_user_id:
          type: string
          format: uuid
          description: Organizatör; hesabı silindiyse yoktur.
        going_count: { type: integer }
        maybe_count: { type: integer }
        waitlist_count: { type: integer }
        caller_rsvp:
          allOf: [{ $ref: "#/components/schemas/RsvpStatus" }]
          description: Sizin cevabınız; cevap vermediyseniz yoktur.
        caller_can_manage:
          type: boolean
          description: Düzenleyip iptal edebilir misiniz (istemcinin doğru işlemleri göstermesi için; sunucu her istekte yeniden kontrol eder).
        caller_attendance:
          allOf: [{ $ref: "#/components/schemas/AttendanceStatus" }]
          description: Doğrulanmış katılımınız; yoksa yoktur.
        series_id: { type: string, format: uuid, description: Tekrarlayan serinin etkinliğiyse. }
        series_override: { type: boolean, description: Seriden ayrı düzenlendi; seri değişiklikleri ona dokunmaz. }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        convoy: { $ref: "#/components/schemas/ConvoyDetails" }
        camp: { $ref: "#/components/schemas/CampDetails" }
        hike: { $ref: "#/components/schemas/HikeDetails" }
        fishing: { $ref: "#/components/schemas/FishingDetails" }
        gaming: { $ref: "#/components/schemas/GamingDetails" }
        sports: { $ref: "#/components/schemas/SportsDetails" }

    EventList:
      type: object
      required: [events]
      properties:
        events:
          type: array
          items: { $ref: "#/components/schemas/Event" }
        next_page_token: { type: string }

    EventCreateRequest:
      type: object
      required: [type, mode, title, starts_at, ends_at, client_request_id]
      additionalProperties: false
      description: |
        Yüz yüze: `meeting_point`, `city`, `district` zorunlu; `online_url`
        boş. Çevrimiçi: `online_url` (https) zorunlu; yer alanları boş.
        Türe özel ayrıntı en fazla bir tane ve türle aynı olur; `gaming` ve
        `sports` için zorunlu, `general` için yoktur.
      properties:
        cover_upload_id: { type: string, format: uuid, description: "İsteğe bağlı: kendi hazır `cover` yüklemeniz (bu tayfa için açılmış). Yalnızca bu etkinliğe bağlanır." }
        type: { $ref: "#/components/schemas/EventType" }
        mode: { $ref: "#/components/schemas/EventMode" }
        title:
          type: string
          minLength: 1
          maxLength: 120
          description: Baştaki ve sondaki boşluklar atıldıktan sonra 1–120 karakter.
        description: { type: string, maxLength: 5000 }
        starts_at: { type: string, format: date-time, description: "Gelecekte, en fazla iki yıl ileri." }
        ends_at: { type: string, format: date-time, description: "Başlangıçtan sonra, en fazla 30 gün." }
        meeting_point_name: { type: string, maxLength: 120 }
        meeting_point: { $ref: "#/components/schemas/LatLng" }
        city: { type: string, maxLength: 50 }
        district: { type: string, maxLength: 50 }
        online_url: { type: string, maxLength: 2048 }
        capacity: { type: integer, minimum: 0, maximum: 10000, description: "0: sınırsız." }
        discoverable: { type: boolean }
        convoy: { $ref: "#/components/schemas/ConvoyDetailsInput" }
        camp: { $ref: "#/components/schemas/CampDetailsInput" }
        hike: { $ref: "#/components/schemas/HikeDetails" }
        fishing: { $ref: "#/components/schemas/FishingDetails" }
        gaming: { $ref: "#/components/schemas/GamingDetails" }
        sports: { $ref: "#/components/schemas/SportsDetails" }
        recurrence: { $ref: "#/components/schemas/Recurrence" }
        client_request_id:
          type: string
          format: uuid
          description: İstemcinin her açma denemesi için bir kez ürettiği, tekrar gönderimde aynen kullandığı UUID.

    EventUpdateRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      description: Kurallar açmadakiyle aynıdır; tür değişmez.
      properties:
        cover_upload_id:
          type: string
          description: |
            Kendi hazır `cover` yüklemeniz; `""` kapağı kaldırır, eski kapak
            silinir. `apply_to_series: true` ile verilemez.
        title: { type: string, minLength: 1, maxLength: 120 }
        description: { type: string, maxLength: 5000 }
        starts_at: { type: string, format: date-time }
        ends_at: { type: string, format: date-time }
        mode: { $ref: "#/components/schemas/EventMode" }
        meeting_point_name: { type: string, maxLength: 120 }
        meeting_point: { $ref: "#/components/schemas/LatLng" }
        city: { type: string, maxLength: 50 }
        district: { type: string, maxLength: 50 }
        online_url: { type: string, maxLength: 2048 }
        capacity: { type: integer, minimum: 0, maximum: 10000 }
        discoverable: { type: boolean }
        convoy: { $ref: "#/components/schemas/ConvoyDetailsInput" }
        camp: { $ref: "#/components/schemas/CampDetailsInput" }
        hike: { $ref: "#/components/schemas/HikeDetails" }
        fishing: { $ref: "#/components/schemas/FishingDetails" }
        gaming: { $ref: "#/components/schemas/GamingDetails" }
        sports: { $ref: "#/components/schemas/SportsDetails" }
        apply_to_series:
          type: boolean
          description: "`true` yalnızca seriye ait etkinlikte geçerlidir; yoksa `false`."

    EventCancelRequest:
      type: object
      additionalProperties: false
      properties:
        reason: { type: string, maxLength: 500 }

    RsvpRequest:
      type: object
      required: [status]
      additionalProperties: false
      properties:
        status: { type: string, enum: [going, maybe, not_going] }
    Rsvp:
      type: object
      required: [status]
      properties:
        status: { $ref: "#/components/schemas/RsvpStatus" }

    Attendee:
      type: object
      required: [user_id, status, updated_at]
      properties:
        user_id: { type: string, format: uuid }
        status: { $ref: "#/components/schemas/RsvpStatus" }
        updated_at:
          type: string
          format: date-time
          description: Cevabın ya da katılımın son değiştiği zaman.
        attendance:
          allOf: [{ $ref: "#/components/schemas/AttendanceStatus" }]
          description: Doğrulanmamışsa yoktur.
        attendance_method: { $ref: "#/components/schemas/AttendanceMethod" }
    AttendeeList:
      type: object
      required: [attendees]
      properties:
        attendees:
          type: array
          items: { $ref: "#/components/schemas/Attendee" }
        next_page_token: { type: string }

    CheckInRequest:
      type: object
      additionalProperties: false
      properties:
        location:
          allOf: [{ $ref: "#/components/schemas/LatLng" }]
          description: Yüz yüze etkinlikte zorunlu, şu anki konumunuz; çevrimiçide gönderilmez. Saklanmaz, log'a yazılmaz.
    CheckIn:
      type: object
      required: [attendance, method]
      properties:
        attendance: { $ref: "#/components/schemas/AttendanceStatus" }
        method: { $ref: "#/components/schemas/AttendanceMethod" }

    HikeStartRequest:
      type: object
      additionalProperties: false
      properties:
        started_at:
          type: string
          format: date-time
          description: İstemcinin çıkış zamanı; yoksa şimdi. Gelecekte değil, en fazla 48 saat önce.
    HikeReturnRequest:
      type: object
      additionalProperties: false
      properties:
        returned_at:
          type: string
          format: date-time
          description: İstemcinin dönüş zamanı; yoksa şimdi. Çıkıştan önce olamaz.
    HikeCheckin:
      type: object
      required: [started_at]
      properties:
        started_at: { type: string, format: date-time }
        returned_at: { type: string, format: date-time, description: Dönülmediyse yoktur. }

    FishingCatch:
      type: object
      required: [id, user_id, species, length_cm, visibility, created_at]
      properties:
        photo_upload_id: { type: string, format: uuid, description: "Fotoğraf; linkleri `POST /v1/media/urls`. Av kaydını gören her üye görür." }
        id: { type: string, format: uuid }
        user_id: { type: string, format: uuid }
        species: { type: string }
        length_cm: { type: number }
        location:
          allOf: [{ $ref: "#/components/schemas/LatLng" }]
          description: Avcıya, `tayfa` görünürlüğünde noktayı görebilenlere döner.
        visibility: { type: string, enum: [self, tayfa] }
        created_at: { type: string, format: date-time }
    FishingCatchCreateRequest:
      type: object
      required: [species, length_cm, client_request_id]
      additionalProperties: false
      properties:
        photo_upload_id:
          type: string
          format: uuid
          description: |
            İsteğe bağlı: kendi hazır `catch_photo` yüklemeniz (bu tayfa için).
            Fotoğrafın konum bilgisi (EXIF/GPS) işlemede silinmiştir; avın
            konumu yalnızca `location` ve `visibility` ile paylaşılır.
        species: { type: string, minLength: 1, maxLength: 60 }
        length_cm: { type: number, exclusiveMinimum: 0, maximum: 1000, description: Bir ondalık. }
        location: { $ref: "#/components/schemas/LatLng" }
        visibility:
          type: string
          enum: [self, tayfa]
          default: self
          description: Konumu kim görür; av kendisi her etkin üyeye görünür.
        client_request_id: { type: string, format: uuid }
    FishingCatchList:
      type: object
      required: [catches]
      properties:
        catches:
          type: array
          items: { $ref: "#/components/schemas/FishingCatch" }
        next_page_token: { type: string }

    EventSeries:
      type: object
      required: [id, tayfa_id, rrule, time_zone, starts_at, created_at]
      properties:
        id: { type: string, format: uuid }
        tayfa_id: { type: string, format: uuid }
        template_event_id:
          type: string
          format: uuid
          description: Yeni tekrarların kopyalandığı etkinlik.
        rrule: { type: string, description: Kanonik biçim. }
        time_zone: { type: string }
        starts_at: { type: string, format: date-time, description: İlk tekrar. }
        ended_at: { type: string, format: date-time, description: Seri bitirildiyse. }
        created_by_user_id: { type: string, format: uuid, description: Hesabı silindiyse yoktur. }
        created_at: { type: string, format: date-time }
    EventSeriesEnding:
      type: object
      required: [series, cancelled_count]
      properties:
        series: { $ref: "#/components/schemas/EventSeries" }
        cancelled_count: { type: integer, description: İptal edilen yaklaşan etkinlik sayısı. }

    Notification:
      type: object
      description: |
        Bildirim yalnızca kimlik taşır; başlık, gövde, yer, isim yoktur.
        İstemci `target_type` ve `target_id` ile içeriği ilgili uçtan çeker.
      required: [id, type, target_type, target_id, read, created_at]
      properties:
        id: { type: string, format: uuid }
        type:
          type: string
          description: |
            `event_created` (yeni etkinlik), `event_updated` ve
            `event_cancelled` (katıldığınız etkinlik değişti/iptal edildi),
            `rsvp_promoted` (bekleme listesinden katılımcılara geçtiniz),
            `announcement`, `answer_received` (sorunuza cevap),
            `join_request` (yönetici/moderatörlere başvuru),
            `join_approved` (başvurunuz onaylandı),
            `tayfa_deletion_requested` (yönetici/moderatörlere silme talebi),
            `tayfa_warned` (hareketsiz tayfa 7 gün içinde arşivlenecek;
            `warning_reason` var), `tayfa_archived`, `tayfa_suspended` ve `tayfa_unsuspended` (platform askısı; gerekçe tayfa ayrıntısında), `hike_overdue`
            (yürüyüşçü zamanında dönmedi; `subject_user_id` yürüyüşçüdür,
            sessize alma bu bildirimi engellemez), `friend_request` (size
            arkadaşlık isteği; `target_id` isteyen kişi), `friend_accepted`
            (isteğiniz kabul edildi; `target_id` yeni arkadaşınız),
            `tayfa_invitation` (bir arkadaşınız sizi tayfaya davet etti;
            hedef tayfa), `report_resolved` (şikâyetiniz çözüldü; hedef
            `report`, `actor_id` hiçbir zaman yoktur; sonucu
            `GET /v1/me/reports/{report_id}` verir). İki arkadaşlık bildirimi
            bir tayfayla ilgili değildir, `tayfa_id` yoktur. `dm_request`
            (size mesaj isteği) ve `dm_message` (yeni birebir mesaj;
            konuşma okunana kadar konuşma başına tek bildirim) yalnızca
            "yeni" bilgisi taşır: hedef `dm_conversation`, `actor_id` ve
            `tayfa_id` yoktur, içerik de gönderen de yazılmaz; okunmamış
            mesaj sayısını `unread_count` taşır. `data_export_ready` (KVKK
            veri dışa aktarmanız 7 gün indirilebilir; hedef `data_export`,
            `tayfa_id` ve `actor_id` yoktur; push çeviri anahtarları
            `push_data_export_ready_title` ve `push_data_export_ready_body`).
            Tanınmayan değer `unknown`.
          enum: [event_created, event_updated, event_cancelled, rsvp_promoted, announcement, answer_received, join_request, join_approved, tayfa_deletion_requested, tayfa_warned, tayfa_archived, tayfa_suspended, tayfa_unsuspended, hike_overdue, friend_request, friend_accepted, tayfa_invitation, report_resolved, dm_request, dm_message, data_export_ready, unknown]
        tayfa_id:
          type: string
          format: uuid
          description: Bildirim bir tayfayla ilgili değilse yoktur.
        actor_id:
          type: string
          format: uuid
          description: İşlemi yapan; sistem ya da silinmiş hesapsa yoktur.
        target_type:
          type: string
          description: |
            `membership` için `target_id` başvuran kullanıcının kimliğidir;
            `user` için bir kullanıcının kimliği (profilini açın); `report`
            için kendi şikâyetinizin kimliği; `dm_conversation` için
            konuşmanızın kimliği; `data_export` için kendi veri dışa
            aktarma talebinizin kimliği (`GET /v1/me/data-exports/{data_export_id}`).
          enum: [tayfa, membership, announcement, event, answer, user, report, dm_conversation, data_export, unknown]
        target_id: { type: string, format: uuid }
        question_id:
          type: string
          format: uuid
          description: Yalnızca `answer_received`; cevaplanan soru.
        subject_user_id:
          type: string
          format: uuid
          description: Yalnızca `hike_overdue`; dönmeyen yürüyüşçü.
        warning_reason:
          type: string
          description: Yalnızca `tayfa_warned`.
          enum: [inactive, few_members, unknown]
        unread_count:
          type: integer
          minimum: 1
          maximum: 100
          description: |
            Yalnızca `dm_request` ve `dm_message`: konuşma başına tek bildirim
            vardır; bu, bildirim son güncellendiğinde konuşmadaki okunmamış
            mesaj sayınızdır (en fazla 100; istemci "99+" gösterir). Her yeni
            mesajda güncellenir; konuşma okununca bildirim okundu olur ve
            sonraki mesaj yeni bildirimi 1'den başlatır.
        read: { type: boolean }
        created_at: { type: string, format: date-time }
    NotificationList:
      type: object
      required: [notifications]
      properties:
        notifications:
          type: array
          items: { $ref: "#/components/schemas/Notification" }
        next_page_token: { type: string }
    UnreadNotificationCount:
      type: object
      required: [unread_count]
      properties:
        unread_count: { type: integer, minimum: 0, maximum: 1000 }
    NotificationPreference:
      type: object
      required: [scope_type, scope_id, level, updated_at]
      properties:
        scope_type:
          type: string
          description: Şimdilik yalnızca `tayfa`; kanal ve konuşma sonra gelir.
          enum: [tayfa, channel, dm_conversation, unknown]
        scope_id: { type: string, format: uuid }
        level: { type: string, enum: [all, mentions, none, unknown] }
        mute_until:
          type: string
          format: date-time
          description: Yoksa süresiz.
        updated_at: { type: string, format: date-time }
    NotificationPreferenceList:
      type: object
      required: [preferences]
      properties:
        preferences:
          type: array
          items: { $ref: "#/components/schemas/NotificationPreference" }
    NotificationPreferenceRequest:
      type: object
      required: [level]
      additionalProperties: false
      properties:
        level: { type: string, enum: [all, mentions, none] }
        mute_until:
          type: string
          format: date-time
          description: Yalnızca `mentions` ya da `none` ile; en fazla bir yıl sonrası.

    # --- Kanallar (#81) ---
    ChannelVisibility:
      type: string
      description: "`members`: tüm etkin üyeler; `staff`: yalnızca yönetici ve moderatörler."
      enum: [members, staff, unknown]
    Channel:
      type: object
      required: [id, tayfa_id, name, visibility, slow_mode_seconds, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        tayfa_id: { type: string, format: uuid }
        name: { type: string }
        visibility: { $ref: "#/components/schemas/ChannelVisibility" }
        slow_mode_seconds:
          type: integer
          minimum: 0
          maximum: 3600
          description: 0 kapalı. Yönetici ve moderatörler muaftır.
        creator_user_id:
          type: string
          format: uuid
          description: Açanın hesabı silindiyse yoktur.
        archived_at:
          type: string
          format: date-time
          description: Arşivliyse dolu (salt okunur).
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        unread_count:
          type: integer
          minimum: 0
          maximum: 100
          description: Yalnızca listede. 100, "99+" demektir.
        last_read_message_id:
          type: string
          format: uuid
          description: Yalnızca listede; okundu işaretiniz yoksa yoktur.
    ChannelList:
      type: object
      required: [channels]
      properties:
        channels:
          type: array
          items: { $ref: "#/components/schemas/Channel" }
    ChannelCreateRequest:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 40 }
        visibility:
          type: string
          enum: [members, staff]
          default: members
        slow_mode_seconds: { type: integer, minimum: 0, maximum: 3600, default: 0 }
    ChannelUpdateRequest:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 40 }
        visibility: { type: string, enum: [members, staff] }
        slow_mode_seconds: { type: integer, minimum: 0, maximum: 3600 }
    ChannelMessage:
      type: object
      required: [id, channel_id, deleted, created_at]
      properties:
        id: { type: string, format: uuid }
        channel_id: { type: string, format: uuid }
        author_user_id:
          type: string
          format: uuid
          description: Yazarın hesabı silindiyse yoktur ("Silinmiş kullanıcı").
        body:
          type: string
          description: Silinmiş mesajda yoktur.
        deleted: { type: boolean }
        restorable:
          type: boolean
          description: Yalnızca yöneticilere; moderasyonla gizlenmiş ve hâlâ geri alınabilir.
        created_at: { type: string, format: date-time }
    ChannelMessageList:
      type: object
      required: [messages]
      properties:
        messages:
          type: array
          items: { $ref: "#/components/schemas/ChannelMessage" }
        next_page_token: { type: string }
    ChannelMessageCreateRequest:
      type: object
      required: [body, client_request_id]
      additionalProperties: false
      properties:
        body: { type: string, minLength: 1, maxLength: 4000 }
        client_request_id:
          type: string
          format: uuid
          description: İstemcinin ürettiği tekrar gönderim anahtarı; mesaj kimliği sunucudadır.
    ChannelReadRequest:
      type: object
      required: [message_id]
      additionalProperties: false
      properties:
        message_id: { type: string, format: uuid }

    # --- birebir mesajlar (#95) ---
    Conversation:
      type: object
      required: [id, status, unread_count, last_message_at, created_at]
      properties:
        id: { type: string, format: uuid }
        other_user_id:
          type: string
          format: uuid
          description: Karşı tarafın hesabı silindiyse yoktur ("Silinmiş kullanıcı"; yazılamaz).
        status:
          type: string
          description: |
            `active` (serbest yazışma), `request_sent` (isteğiniz cevap
            bekliyor; reddedilse de böyle görünür), `request_received`
            (size gelen istek: cevap yazın, kabul edin ya da reddedin).
            Tanınmayan değer `unknown`.
          enum: [active, request_sent, request_received, unknown]
        unread_count: { type: integer, minimum: 0, maximum: 100 }
        last_read_message_id: { type: string, format: uuid }
        peer_last_read_message_id:
          type: string
          format: uuid
          description: Karşı tarafın okundu işareti; yalnızca aktif konuşmada.
        last_message_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
    ConversationList:
      type: object
      required: [conversations]
      properties:
        conversations:
          type: array
          items: { $ref: "#/components/schemas/Conversation" }
        next_page_token: { type: string }
    DeclinedRequest:
      type: object
      required: [conversation_id, sender_user_id, declined_at, created_at]
      properties:
        conversation_id: { type: string, format: uuid }
        sender_user_id:
          type: string
          format: uuid
          description: İsteği gönderen.
        declined_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
    DeclinedRequestList:
      type: object
      required: [declined_requests]
      properties:
        declined_requests:
          type: array
          items: { $ref: "#/components/schemas/DeclinedRequest" }
        next_page_token: { type: string }
    DirectMessage:
      type: object
      required: [id, conversation_id, deleted, created_at]
      properties:
        id: { type: string, format: uuid }
        conversation_id: { type: string, format: uuid }
        sender_user_id:
          type: string
          format: uuid
          description: Gönderenin hesabı silindiyse yoktur.
        body:
          type: string
          description: Silinmiş ve uçtan uca şifreli mesajda yoktur.
        deleted: { type: boolean }
        encryption:
          type: string
          enum: [server, e2e]
          description: |
            `server`: düz sürüm, metin sunucu anahtarıyla şifreli saklanır
            (uçtan uca değildir; istemci bunu belirtir). `e2e`: içerik
            yalnızca zarflarda ve arşivdedir.
        created_at: { type: string, format: date-time }
    DirectMessageList:
      type: object
      required: [messages]
      properties:
        messages:
          type: array
          items: { $ref: "#/components/schemas/DirectMessage" }
        next_page_token: { type: string }
    DirectMessageCreateRequest:
      type: object
      description: "`body` ya da `envelopes`; ikisinden yalnızca biri."
      required: [recipient_user_id, client_request_id]
      additionalProperties: false
      properties:
        recipient_user_id: { type: string, format: uuid }
        body: { type: string, minLength: 1, maxLength: 4000 }
        envelopes:
          type: array
          minItems: 1
          maxItems: 16
          items: { $ref: "#/components/schemas/OutgoingEnvelope" }
        client_request_id:
          type: string
          format: uuid
          description: İstemcinin ürettiği tekrar gönderim anahtarı.
    DirectMessageSent:
      type: object
      required: [message, conversation]
      properties:
        message: { $ref: "#/components/schemas/DirectMessage" }
        conversation: { $ref: "#/components/schemas/Conversation" }

    # --- birebir mesajda uçtan uca şifreleme (#127, ADR-0018) ---
    # Bayt alanları standart base64'tür.

    OutgoingEnvelope:
      type: object
      required: [device_id, registration_id, type, content]
      additionalProperties: false
      properties:
        device_id: { type: string, format: uuid }
        registration_id:
          type: integer
          minimum: 1
          maximum: 16380
          description: Gönderenin bu cihazla oturumundaki kayıt kimliği; değişmişse cihaz değişmiştir.
        type:
          type: string
          enum: [whisper, prekey]
          description: Signal CiphertextMessageType (2 whisper, 3 prekey).
        content:
          type: string
          format: byte
          description: Opak Signal mesajı, 1 B – 64 KiB.
    E2EPreKey:
      type: object
      required: [key_id, public_key]
      additionalProperties: false
      properties:
        key_id: { type: integer, minimum: 0, maximum: 16777215 }
        public_key: { type: string, format: byte, description: "33 bayt, 0x05 ile başlar." }
    E2ESignedPreKey:
      type: object
      required: [key_id, public_key, signature]
      additionalProperties: false
      properties:
        key_id: { type: integer, minimum: 0, maximum: 16777215 }
        public_key:
          type: string
          format: byte
          description: EC imzalı ön anahtarda 33 bayt (0x05 ile), Kyber'de 1569 bayt.
        signature: { type: string, format: byte, description: 64 bayt. }
    E2EDevice:
      type: object
      required: [id, device_number, registration_id, identity_key, paired, created_at]
      properties:
        id: { type: string, format: uuid }
        device_number: { type: integer, minimum: 1, maximum: 127, description: Signal adresindeki cihaz numarası. }
        registration_id: { type: integer }
        identity_key: { type: string, format: byte }
        paired:
          type: boolean
          description: Cihaz geçmiş anahtarını biliyor (arşive yazar ve okur).
        created_at: { type: string, format: date-time }
    E2EPreKeyCounts:
      type: object
      required: [ec, kyber, low]
      properties:
        ec: { type: integer }
        kyber: { type: integer }
        low: { type: boolean, description: Bir türden 10'dan az kaldı; yükleyin. }
    UploadPurpose:
      type: string
      enum: [avatar, catch_photo, cover]
      description: "`cover` tayfa ya da etkinlik kapağıdır."
    UploadStatus:
      type: string
      enum: [pending, ready, rejected, unknown]
      description: |
        `pending` (PUT ve tamamlama bekleniyor) → `ready` | `rejected`.
        `unknown`: istemciden yeni bir sunucu değeri.
    UploadRejectReason:
      type: string
      enum: [not_image, unsupported_type, metadata_present, dimension_mismatch, size_mismatch, too_large, failed, unknown]
      description: |
        `not_image`: bir varyant JPEG/WebP değil ya da bildirilen türde
        değil. `unsupported_type`: PNG, HEIC, GIF, animasyonlu WebP (istemci
        dönüştürmeli). `metadata_present`: EXIF (GPS dahil), XMP ya da IPTC
        var. `dimension_mismatch`: başlıktaki ölçü bildirilenden farklı ya
        da preview oranı tutmuyor. `size_mismatch`: saklanan boyut
        bildirilenden farklı. `too_large`: preview 400, full 1600 px'ten
        büyük. `failed`: dosyadan bağımsız nedenlerle denetlenemedi.
    UploadVariant:
      type: object
      required: [kind, content_type, size_bytes]
      additionalProperties: false
      properties:
        kind: { type: string, enum: [preview, full] }
        content_type: { type: string, enum: [image/jpeg, image/webp] }
        size_bytes: { type: integer, format: int64, minimum: 1, maximum: 10485760, description: "Dosyanın tam boyutu." }
    UploadCreateRequest:
      type: object
      required: [purpose, variants, client_request_id]
      additionalProperties: false
      properties:
        purpose: { $ref: "#/components/schemas/UploadPurpose" }
        variants:
          type: array
          minItems: 2
          maxItems: 2
          description: Tam bir `preview` ve bir `full`.
          items: { $ref: "#/components/schemas/UploadVariant" }
        tayfa_id:
          type: string
          format: uuid
          description: "`cover` ve `catch_photo` için zorunlu; `avatar`'da verilmez."
        client_request_id:
          type: string
          format: uuid
          description: Her yükleme denemesi için bir kez üretilen, tekrar gönderimde aynen kullanılan UUID.
    UploadTarget:
      type: object
      required: [kind, method, url, headers, expires_at]
      properties:
        kind: { type: string, enum: [preview, full, unknown] }
        method: { type: string, enum: [PUT] }
        url: { type: string, format: uri, description: "R2'ye imzalı PUT linki. Taşıyıcı link; log'a yazılmaz." }
        headers:
          type: object
          additionalProperties: { type: string }
          description: PUT'ta aynen gönderilecek başlıklar (`Content-Type`, `Content-Length`).
        expires_at: { type: string, format: date-time }
    UploadCompleteRequest:
      type: object
      required: [width, height]
      additionalProperties: false
      properties:
        width: { type: integer, minimum: 1, maximum: 1600, description: "Full varyantın genişliği (piksel)." }
        height: { type: integer, minimum: 1, maximum: 1600 }
    MediaUrls:
      type: object
      required: [upload_id, preview_url, preview_content_type, full_url, full_content_type, width, height, expires_at]
      properties:
        upload_id: { type: string, format: uuid }
        preview_url: { type: string, format: uri, description: "Taşıyıcı link; log'a yazılmaz." }
        preview_content_type: { type: string, enum: [image/jpeg, image/webp] }
        full_url: { type: string, format: uri }
        full_content_type: { type: string, enum: [image/jpeg, image/webp] }
        width: { type: integer, description: "Full varyantın genişliği" }
        height: { type: integer }
        expires_at: { type: string, format: date-time, description: "Linklerin geçerliliği (1 saat)." }
    Upload:
      type: object
      required: [id, purpose, status, size_bytes, created_at, attached]
      properties:
        id: { type: string, format: uuid }
        purpose: { $ref: "#/components/schemas/UploadPurpose" }
        status: { $ref: "#/components/schemas/UploadStatus" }
        reject_reason: { $ref: "#/components/schemas/UploadRejectReason" }
        tayfa_id: { type: string, format: uuid }
        size_bytes: { type: integer, format: int64, description: "İki varyantın boyutları birlikte." }
        created_at: { type: string, format: date-time }
        attached:
          type: boolean
          description: Bir içerik dosyayı kullanıyor. Hazır ama 7 gün bağlanmayan dosya silinir.
        urls:
          allOf: [{ $ref: "#/components/schemas/MediaUrls" }]
          description: Yalnızca `ready` iken.
    UploadView:
      type: object
      required: [upload]
      properties:
        upload: { $ref: "#/components/schemas/Upload" }
    UploadCreated:
      type: object
      required: [upload, targets]
      properties:
        upload: { $ref: "#/components/schemas/Upload" }
        targets:
          type: array
          description: Her varyant için bir hedef; tekrar gönderimde yükleme artık `pending` değilse boş.
          items: { $ref: "#/components/schemas/UploadTarget" }
    MediaUrlsRequest:
      type: object
      required: [upload_ids]
      additionalProperties: false
      properties:
        upload_ids:
          type: array
          minItems: 1
          maxItems: 100
          uniqueItems: true
          items: { type: string, format: uuid }
    MediaUrlsList:
      type: object
      required: [media]
      properties:
        media:
          type: array
          items: { $ref: "#/components/schemas/MediaUrls" }
    DataExportRequest:
      type: object
      required: [client_request_id]
      additionalProperties: false
      properties:
        client_request_id: { type: string, format: uuid }
    DataExport:
      type: object
      required: [id, status, requested_at]
      properties:
        id: { type: string, format: uuid }
        status:
          type: string
          description: |
            `pending` (sırada), `processing` (toplanıyor), `ready` (7 gün
            indirilebilir), `expired` (dosya ve anahtar silindi), `failed`
            (30 günlük sınıra sayılmaz; tekrar talep açılabilir).
          enum: [pending, processing, ready, expired, failed, unknown]
        failure_reason:
          type: string
          description: |
            Yalnızca `failed`: `unavailable` (bir servise ya da depolamaya
            ulaşılamadı), `too_large` (arşiv 16 MiB'ı geçti; talebiniz elle
            yanıtlanır), `timeout` (zamanında bitmedi), `failed`.
          enum: [unavailable, too_large, timeout, failed, unknown]
        requested_at: { type: string, format: date-time }
        ready_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
        downloaded_at: { type: string, format: date-time }
        size_bytes:
          type: integer
          format: int64
          description: Şifreli dosyanın boyutu, `ready` iken.
    DataExportList:
      type: object
      required: [data_exports]
      properties:
        data_exports:
          type: array
          items: { $ref: "#/components/schemas/DataExport" }
        next_request_at:
          type: string
          format: date-time
          description: Bir sonraki talebin açılabileceği an; yoksa şimdi açılabilir (süren talep yine engeller).
    DataExportDownload:
      type: object
      required: [url, expires_at, key, size_bytes, format]
      properties:
        url:
          type: string
          format: uri
          description: Şifreli dosyanın imzalı GET linki; `expires_at`'e kadar (5 dakika) taşıyan herkes indirebilir.
        expires_at: { type: string, format: date-time }
        key:
          type: string
          format: byte
          description: 32 baytlık AES-256 anahtarı (base64).
        size_bytes: { type: integer, format: int64 }
        format: { type: string, enum: [aes-256-gcm-v1] }
    AvatarRequest:
      type: object
      required: [upload_id]
      additionalProperties: false
      properties:
        upload_id: { type: string, format: uuid }
    AvatarView:
      type: object
      required: [avatar_upload_id]
      properties:
        avatar_upload_id: { type: string, format: uuid }
    PushTokenRegistration:
      type: object
      required: [token, platform]
      additionalProperties: false
      properties:
        token:
          type: string
          minLength: 1
          maxLength: 1024
          pattern: "^[A-Za-z0-9:_.-]+$"
          description: FCM kayıt token'ı. Log'a yazılmaz.
        platform: { type: string, enum: [android, ios] }
    E2EDeviceRegistration:
      type: object
      required: [registration_id, identity_key, signed_prekey, kyber_last_resort_prekey]
      additionalProperties: false
      properties:
        registration_id: { type: integer, minimum: 1, maximum: 16380 }
        identity_key: { type: string, format: byte, description: "33 bayt, 0x05 ile başlar." }
        signed_prekey: { $ref: "#/components/schemas/E2ESignedPreKey" }
        kyber_last_resort_prekey: { $ref: "#/components/schemas/E2ESignedPreKey" }
        one_time_prekeys:
          type: array
          maxItems: 100
          items: { $ref: "#/components/schemas/E2EPreKey" }
        kyber_prekeys:
          type: array
          maxItems: 100
          items: { $ref: "#/components/schemas/E2ESignedPreKey" }
    E2EDeviceRegistered:
      type: object
      required: [device, prekey_counts]
      properties:
        device: { $ref: "#/components/schemas/E2EDevice" }
        prekey_counts: { $ref: "#/components/schemas/E2EPreKeyCounts" }
    E2EDeviceState:
      type: object
      required: [device, prekey_counts, history_key_version, rotation_needed, other_paired_device]
      properties:
        device: { $ref: "#/components/schemas/E2EDevice" }
        prekey_counts: { $ref: "#/components/schemas/E2EPreKeyCounts" }
        history_key_version:
          type: integer
          description: Hesabın geçmiş anahtarı sürümü; ilk cihaz anahtar alana kadar 0.
        rotation_needed:
          type: boolean
          description: Eşleştirilmiş bir cihaz kaldırıldı; eşleştirilmiş bir cihaz anahtarı yenilemeli.
        other_paired_device:
          type: boolean
          description: Hesabın eşleştirilmiş başka cihazı var (QR eşleştirme önerin).
    E2EPreKeyUpload:
      type: object
      additionalProperties: false
      properties:
        signed_prekey: { $ref: "#/components/schemas/E2ESignedPreKey" }
        kyber_last_resort_prekey: { $ref: "#/components/schemas/E2ESignedPreKey" }
        one_time_prekeys:
          type: array
          maxItems: 100
          items: { $ref: "#/components/schemas/E2EPreKey" }
        kyber_prekeys:
          type: array
          maxItems: 100
          items: { $ref: "#/components/schemas/E2ESignedPreKey" }
    E2EPublicDevice:
      type: object
      required: [id, device_number, registration_id, identity_key, created_at]
      properties:
        id: { type: string, format: uuid }
        device_number: { type: integer }
        registration_id: { type: integer }
        identity_key: { type: string, format: byte }
        created_at: { type: string, format: date-time }
    E2EPublicDeviceList:
      type: object
      required: [devices]
      properties:
        devices:
          type: array
          items: { $ref: "#/components/schemas/E2EPublicDevice" }
    E2EKeyEvent:
      type: object
      required: [id, device_id, device_number, type, created_at]
      properties:
        id: { type: string, format: uuid }
        device_id: { type: string, format: uuid }
        device_number: { type: integer }
        type:
          type: string
          enum: [device_added, device_removed, identity_changed]
          description: "`identity_changed` yazılmaz (yeni kimlik anahtarı yeni cihazdır); ileriye dönük."
        created_at: { type: string, format: date-time }
    E2EKeyEventList:
      type: object
      required: [events]
      properties:
        events:
          type: array
          items: { $ref: "#/components/schemas/E2EKeyEvent" }
        next_page_token: { type: string }
    E2EBundleRequest:
      type: object
      additionalProperties: false
      properties:
        device_ids:
          type: array
          maxItems: 5
          description: Yalnızca bu cihazlar; boşsa tüm cihazlar.
          items: { type: string, format: uuid }
    E2EPreKeyBundle:
      type: object
      required: [device_id, device_number, registration_id, identity_key, signed_prekey, kyber_prekey, kyber_last_resort]
      properties:
        device_id: { type: string, format: uuid }
        device_number: { type: integer }
        registration_id: { type: integer }
        identity_key: { type: string, format: byte }
        signed_prekey: { $ref: "#/components/schemas/E2ESignedPreKey" }
        one_time_prekey:
          $ref: "#/components/schemas/E2EPreKey"
        kyber_prekey: { $ref: "#/components/schemas/E2ESignedPreKey" }
        kyber_last_resort: { type: boolean }
    E2EPreKeyBundleList:
      type: object
      required: [bundles]
      properties:
        bundles:
          type: array
          items: { $ref: "#/components/schemas/E2EPreKeyBundle" }
    E2EEnvelope:
      type: object
      required: [id, message_id, conversation_id, sender_user_id, sender_device_id, sender_device_number, type, content, created_at]
      properties:
        id: { type: string, format: uuid }
        message_id: { type: string, format: uuid }
        conversation_id: { type: string, format: uuid }
        sender_user_id: { type: string, format: uuid }
        sender_device_id: { type: string, format: uuid }
        sender_device_number: { type: integer }
        type: { type: string, enum: [whisper, prekey] }
        content: { type: string, format: byte }
        created_at: { type: string, format: date-time }
    E2EEnvelopeList:
      type: object
      required: [envelopes]
      properties:
        envelopes:
          type: array
          items: { $ref: "#/components/schemas/E2EEnvelope" }
        next_page_token: { type: string }
    E2EEnvelopeAck:
      type: object
      required: [envelope_ids]
      additionalProperties: false
      properties:
        envelope_ids:
          type: array
          minItems: 1
          maxItems: 100
          items: { type: string, format: uuid }
    E2EArchiveWrite:
      type: object
      required: [history_key_version, entries]
      additionalProperties: false
      properties:
        history_key_version: { type: integer, minimum: 1, maximum: 32767 }
        entries:
          type: array
          minItems: 1
          maxItems: 50
          items:
            type: object
            required: [message_id, content]
            additionalProperties: false
            properties:
              message_id: { type: string, format: uuid }
              content: { type: string, format: byte, description: 1 B – 32 KiB. }
    E2EArchiveWritten:
      type: object
      required: [accepted_message_ids]
      properties:
        accepted_message_ids:
          type: array
          items: { type: string, format: uuid }
    E2EArchiveEntry:
      type: object
      required: [message_id, conversation_id, key_version, content, created_at]
      properties:
        message_id: { type: string, format: uuid }
        conversation_id: { type: string, format: uuid }
        key_version: { type: integer }
        content: { type: string, format: byte }
        created_at: { type: string, format: date-time }
    E2EArchiveEntryList:
      type: object
      required: [entries]
      properties:
        entries:
          type: array
          items: { $ref: "#/components/schemas/E2EArchiveEntry" }
        next_page_token: { type: string }
    E2EHistoryKeyVersion:
      type: object
      required: [history_key_version]
      properties:
        history_key_version: { type: integer }
    E2EHistoryKeyRotation:
      type: object
      required: [history_key_version, shares]
      additionalProperties: false
      properties:
        history_key_version: { type: integer, minimum: 1, maximum: 32767 }
        shares:
          type: array
          maxItems: 5
          items:
            type: object
            required: [device_id, bundle]
            additionalProperties: false
            properties:
              device_id: { type: string, format: uuid }
              bundle: { type: string, format: byte, description: 1 B – 16 KiB. }
    E2EHistoryKeyShare:
      type: object
      required: [id, sender_device_id, history_key_version, bundle, created_at]
      properties:
        id: { type: string, format: uuid }
        sender_device_id: { type: string, format: uuid }
        history_key_version: { type: integer }
        bundle: { type: string, format: byte }
        created_at: { type: string, format: date-time }
    E2EHistoryKeyShareList:
      type: object
      required: [shares]
      properties:
        shares:
          type: array
          items: { $ref: "#/components/schemas/E2EHistoryKeyShare" }
    E2EShareAck:
      type: object
      required: [share_ids]
      additionalProperties: false
      properties:
        share_ids:
          type: array
          minItems: 1
          maxItems: 100
          items: { type: string, format: uuid }
    E2ELinkRequestCreated:
      type: object
      required: [link_request_id, expires_at]
      properties:
        link_request_id: { type: string, format: uuid }
        expires_at: { type: string, format: date-time }
    E2ELinkRequest:
      type: object
      required: [link_request_id, expires_at, answered]
      properties:
        link_request_id: { type: string, format: uuid }
        expires_at: { type: string, format: date-time }
        answered: { type: boolean }
        answer: { type: string, format: byte, description: Cevaplanınca. }
        history_key_version: { type: integer, description: Cevaplanınca. }
        answered_by_device_id: { type: string, format: uuid, description: Cevaplanınca. }
    E2ELinkAnswer:
      type: object
      required: [history_key_version, answer]
      additionalProperties: false
      properties:
        history_key_version: { type: integer, minimum: 1, maximum: 32767 }
        answer: { type: string, format: byte, description: 1 B – 16 KiB. }
    E2EDevicesChangedProblem:
      description: |
        `e2e-devices-changed` (409) cevabının ek alanları; cihaz listelerini
        tazeleyip tekrar deneyin.
      allOf:
        - $ref: "#/components/schemas/Problem"
        - type: object
          required: [missing_device_ids, stale_device_ids]
          properties:
            missing_device_ids:
              type: array
              description: Zarf (ya da paylaşım) eksik cihazlar.
              items: { type: string, format: uuid }
            stale_device_ids:
              type: array
              description: Artık olmayan, değişmiş ya da iki kez verilen cihazlar.
              items: { type: string, format: uuid }

    # --- arkadaşlık, davet, profil, hesap (#71) ---

    ActivityVisibility:
      type: string
      description: Katılım geçmişinin kime görüneceği.
      enum: [private, tayfa, public]
    Account:
      type: object
      required: [referral_code, activity_visibility]
      properties:
        avatar_upload_id: { type: string, format: uuid, description: "Avatar; linkleri `POST /v1/media/urls`." }
        referral_code:
          type: string
          description: Örn. `TYF-8K2M4Q`; paylaşım linki `tayfam.app/r/<kod>`.
        activity_visibility: { $ref: "#/components/schemas/ActivityVisibility" }
    AccountUpdate:
      type: object
      required: [activity_visibility]
      additionalProperties: false
      properties:
        activity_visibility: { $ref: "#/components/schemas/ActivityVisibility" }
    ReferralCode:
      type: object
      required: [referral_code]
      properties:
        referral_code: { type: string }
    ReferralLookupRequest:
      type: object
      required: [referral_code]
      additionalProperties: false
      properties:
        referral_code:
          type: string
          maxLength: 32
          description: "`TYF-` öneki ve büyük/küçük harf fark etmez."
    ReferredUser:
      type: object
      required: [user_id, display_name]
      properties:
        user_id: { type: string, format: uuid }
        display_name: { type: string }
        avatar_upload_id: { type: string, format: uuid }
    UserRef:
      type: object
      required: [user_id]
      additionalProperties: false
      properties:
        user_id: { type: string, format: uuid }
    Friend:
      type: object
      required: [user_id, display_name, state, requested_at]
      properties:
        user_id: { type: string, format: uuid }
        display_name: { type: string }
        avatar_upload_id: { type: string, format: uuid }
        state:
          type: string
          description: "`incoming`: size gelen istek; `outgoing`: sizin isteğiniz."
          enum: [friends, incoming, outgoing]
        requested_at: { type: string, format: date-time }
        accepted_at: { type: string, format: date-time }
    FriendList:
      type: object
      required: [friends]
      properties:
        friends:
          type: array
          items: { $ref: "#/components/schemas/Friend" }
        next_page_token: { type: string }
    BlockedUser:
      type: object
      required: [user_id, blocked_at]
      properties:
        user_id: { type: string, format: uuid }
        display_name:
          type: string
          description: Hesap silinmişse yoktur.
        avatar_upload_id: { type: string, format: uuid }
        blocked_at: { type: string, format: date-time }
    BlockedUserList:
      type: object
      required: [users]
      properties:
        users:
          type: array
          items: { $ref: "#/components/schemas/BlockedUser" }
        next_page_token: { type: string }
    Invitation:
      type: object
      required: [tayfa_id, tayfa_name, user_id, invited_at]
      properties:
        tayfa_id: { type: string, format: uuid }
        tayfa_name: { type: string }
        user_id:
          type: string
          format: uuid
          description: Davet edilen kişi.
        inviter_user_id:
          type: string
          format: uuid
          description: Davet edenin hesabı silinmişse yoktur.
        invited_at: { type: string, format: date-time }
    InvitationList:
      type: object
      required: [invitations]
      properties:
        invitations:
          type: array
          items: { $ref: "#/components/schemas/Invitation" }
        next_page_token: { type: string }
    UserProfile:
      type: object
      required: [user_id, display_name, self, mutual_tayfas, activity_visible]
      properties:
        user_id: { type: string, format: uuid }
        display_name: { type: string }
        avatar_upload_id: { type: string, format: uuid }
        self: { type: boolean }
        friend_state:
          type: string
          description: Aranızda arkadaşlık ya da istek yoksa alan yoktur.
          enum: [friends, incoming, outgoing]
        mutual_tayfas:
          type: array
          description: İkinizin de etkin üyesi olduğu tayfalar (en fazla 100); kendi profilinizde boş.
          items:
            type: object
            required: [id, name]
            properties:
              id: { type: string, format: uuid }
              name: { type: string }
        activity_visible:
          type: boolean
          description: Katılım geçmişinden size bir şey gösterilip gösterilemeyeceği.
        activity_visibility:
          $ref: "#/components/schemas/ActivityVisibility"
    ActivityRecord:
      type: object
      required: [event_type, mode, started_at, tayfa_member]
      properties:
        event_type: { $ref: "#/components/schemas/EventType" }
        mode: { type: string, enum: [in_person, online] }
        city: { type: string }
        district: { type: string }
        started_at: { type: string, format: date-time }
        tayfa_member:
          type: boolean
          description: Kaydın tayfasının etkin üyesisiniz; aşağıdaki alanlar yalnızca o zaman doludur.
        tayfa_id: { type: string, format: uuid }
        tayfa_name: { type: string }
        event_id:
          type: string
          format: uuid
          description: Etkinlik silinmişse yoktur.
        event_title: { type: string }
        duration_minutes: { type: integer }
    ActivityList:
      type: object
      required: [records]
      properties:
        records:
          type: array
          items: { $ref: "#/components/schemas/ActivityRecord" }
        next_page_token: { type: string }

    ReportTargetType:
      type: string
      description: |
        `dm_message` (birebir mesaj) yalnızca `POST /v1/me/reports` ile;
        diğerleri yalnızca tayfa ucuyla. Kanal mesajları bu listede değildir.
      enum: [user, tayfa, announcement, event, question, answer, poll, fishing_catch, dm_message]

    ReportReason:
      type: string
      description: |
        Topluluk Kuralları'na göre. `child_safety` (çocuk/genç güvenliği)
        kuyrukta öne geçer ve hemen platforma da gider; `staff_conduct`
        (yönetici/moderatörün yetkisini kullanımı) yalnızca platforma gider.
      enum: [harassment, hate_speech, violence, privacy, impersonation, illegal_trade, drugs, gambling, dangerous_activity, fake_event, sexual_content, child_safety, spam, copyright, staff_conduct, other]

    ReportCreateRequest:
      type: object
      additionalProperties: false
      required: [target_type, target_id, reason]
      properties:
        target_type: { $ref: "#/components/schemas/ReportTargetType" }
        target_id:
          type: string
          format: uuid
          description: "`tayfa` için yoldaki `tayfa_id` ile aynı olmalıdır."
        reason: { $ref: "#/components/schemas/ReportReason" }
        description:
          type: string
          maxLength: 1000
          description: İsteğe bağlı; baştaki ve sondaki boşluklar atılır. Satır sonu olabilir.
        evidence_text:
          type: string
          minLength: 1
          maxLength: 2000
          description: |
            Yalnızca ve zorunlu olarak `dm_message` için: şikâyet ettiğiniz
            mesajın kendi cihazınızdan paylaştığınız metni. Yalnızca platform
            okur; log'a ve olaylara yazılmaz, size geri dönmez.

    MyReport:
      type: object
      description: |
        Şikâyet, şikâyet eden kişinin gördüğü haliyle. Hangi işlemin yapıldığı
        ve kimin çözdüğü gösterilmez; yalnızca sonuç (`outcome`) vardır.
      required: [id, target_type, target_id, reason, status, created_at]
      properties:
        id: { type: string, format: uuid }
        tayfa_id:
          type: string
          format: uuid
          description: Birebir mesaj şikâyetinde yoktur.
        target_type: { $ref: "#/components/schemas/ReportTargetType" }
        target_id: { type: string, format: uuid }
        reason: { $ref: "#/components/schemas/ReportReason" }
        description: { type: string }
        status: { type: string, enum: [open, resolved] }
        outcome:
          type: string
          description: Yalnızca çözülmüş şikâyette.
          enum: [action_taken, dismissed]
        created_at: { type: string, format: date-time }
        resolved_at: { type: string, format: date-time }

    MyReportList:
      type: object
      required: [reports]
      properties:
        reports:
          type: array
          items: { $ref: "#/components/schemas/MyReport" }
        next_page_token: { type: string }

    ModerationReport:
      type: object
      description: |
        Şikâyet, tayfa moderatörünün gördüğü haliyle. Şikâyet edenin kimliği,
        platforma yükselme ve yaş için alan yoktur. `priority:
        minor_involved` taraflardan birinin (şikâyet eden ya da şikâyet
        edilen) şikâyet anında 18 yaşından küçük olduğunu ya da bunun
        bilinmediğini söyler; hangisi olduğu ve kimsenin yaşı gösterilmez.
      required: [id, tayfa_id, target_type, target_id, reason, priority, status, created_at]
      properties:
        id: { type: string, format: uuid }
        tayfa_id: { type: string, format: uuid }
        target_type: { $ref: "#/components/schemas/ReportTargetType" }
        target_id: { type: string, format: uuid }
        subject_user_id:
          type: string
          format: uuid
          description: Şikâyet edilen üye ya da içeriğin yazarı; hesap silindiyse yoktur.
        reason: { $ref: "#/components/schemas/ReportReason" }
        description: { type: string }
        priority: { type: string, enum: [normal, minor_involved] }
        status: { type: string, enum: [open, resolved] }
        resolution:
          type: string
          description: Yalnızca çözülmüş şikâyette.
          enum: [content_removed, member_sanctioned, dismissed]
        handled_by_user_id:
          type: string
          format: uuid
          description: Çözen moderatör; açıkken ya da hesap silindiyse yoktur.
        created_at: { type: string, format: date-time }
        resolved_at: { type: string, format: date-time }

    ModerationReportList:
      type: object
      required: [reports]
      properties:
        reports:
          type: array
          items: { $ref: "#/components/schemas/ModerationReport" }
        next_page_token: { type: string }

    ReportResolveRequest:
      type: object
      additionalProperties: false
      required: [resolution]
      properties:
        resolution: { type: string, enum: [content_removed, member_sanctioned, dismissed] }

security:
  - bearer: []
