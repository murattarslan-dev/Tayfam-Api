      - $ref: "#/components/parameters/EventID"
      - $ref: "#/components/parameters/ComponentKey"
    post:
      operationId: returnEventRollCall
      summary: Döndüğünüzü kaydeder
      description: |
        Güvenlik sinyalidir: bitişten sonra, bileşen donduktan sonra,
        iptal edilmiş etkinlikte ve susturulmuşken de çalışır; yalnızca
        salt okunur tayfa reddeder (`tayfa-read-only`). Önce çıkış gerekir
        (`hike-not-started`). Tekrar gönderim ilk dönüşü döndürür.
      parameters:
        - $ref: "#/components/parameters/ClientHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RollCallReturnRequest" }
      responses:
        "200":
          description: Yoklama, güncel haliyle
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EventRollCall" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }

  # --- Etkinlik bileşenleri: günlük (`log`; core LogComponentService, #243, ADR-0025 §4, §5, ADR-0037 §3) ---
  # Etkinlikte tutulan kayıtlar (av, kitap, kuş, zirve…). Kaydın alanları
  # tür tanımındaki bileşenin `fields` parametresindendir (`CatalogField`
  # türleri); değerler `values`'ta alan anahtarına göre durur. Konum isteğe
  # bağlıdır (bileşenin `location` parametresi) ve kişinin bilerek
  # paylaştığı içeriktir (ADR-0008): cihazın anlık konumu alınmaz, istemci
  # kişinin seçtiği noktayı gönderir; konum log'a, denetim kaydına ve olaya
  # yazılmaz. Konumu kimin göreceği kayıt başına `location_visibility`'dir:
  # `self` (yalnızca kaydı giren), `participants` (ayrıca `going`/`maybe`
  # cevabı verenler, katılımı doğrulananlar, organizatör, moderatör ve
  # yönetici) ya da `tayfa` (kaydı gören herkes); varsayılanı bileşenin
  # `location_default` parametresidir. Balıkçılığın av günlüğü (`catches`)
  # Faz 1'deki `fishing-catches` uçlarının ve mera gizliliğinin yerini alır.

  /v1/tayfas/{tayfa_id}/events/{event_id}/components/{component_key}/entries:
    parameters:
      - $ref: "#/components/parameters/TayfaID"
      - $ref: "#/components/parameters/EventID"
      - $ref: "#/components/parameters/ComponentKey"
    get:
      operationId: listEventLogEntries
      summary: Günlüğün kayıtları, eskiden yeniye
      description: |
        Her etkin üyeye açıktır (susturulmuş üye de okur); iptal edilmiş ve
        donmuş etkinlikte de okunur. Kayıtları herkes görür; bir kaydın
        konumu kaydı girene, diğerlerine `location_visibility`'nin izin
        verdiği kadar döner. Bileşen uçlarının ortak kuralları geçerlidir
        (`component-not-found`, `component-disabled`).
      parameters:
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/PageToken"
      responses:
        "200":
          description: Kayıtlar
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EventLogEntryList" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
    post:
      operationId: addEventLogEntry
      summary: Günlüğe kayıt ekler
      description: |
        Katılımınız doğrulanmış olmalıdır (`not-attended`). Kişi başına en
        fazla bileşenin `max_entries` kadar (yoksa 100) kayıt
        (`event-limit`). Değerler tanıma göre doğrulanır
        (`invalid-request`, alan `values.<anahtar>`); zorunlu alanlar
        verilir, tanımda olmayan alan gönderilmez. Tayfa sözlüğüne bağlı
        alan (`CatalogVocabulary`) için ya `values`'ta metin ya
        `vocabulary_ids`'te tayfanın o ad alanındaki bir değerin kimliği
        gönderilir, ikisi birden değil (`vocabulary_ids.<anahtar>`); yeni
        metin sözlüğe eklenir. Konum yalnızca `location`
        parametresi açık günlükte verilir. Aynı `client_request_id` ile
        tekrar gönderim ilk kaydı döndürür. Bitişten 7 gün sonra donar
        (`component-frozen`); iptal edilmiş etkinliğe yazılmaz. Bileşen
        uçlarının ortak kuralları geçerlidir.
      parameters:
        - $ref: "#/components/parameters/ClientHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EventLogEntryCreateRequest" }
      responses:
        "201":
          description: Eklenen kayıt (ya da tekrar gönderimde ilk eklenen)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EventLogEntry" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }

  /v1/tayfas/{tayfa_id}/events/{event_id}/components/{component_key}/entries/{entry_id}:
    parameters:
      - $ref: "#/components/parameters/TayfaID"
      - $ref: "#/components/parameters/EventID"
      - $ref: "#/components/parameters/ComponentKey"
      - name: entry_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    delete:
      operationId: removeEventLogEntry
      summary: Günlükten kayıt çıkarır
      description: |
        Kendi kaydınızı yazma penceresi içinde (`component-frozen`);
        moderatör ve yönetici herkesinkini her zaman (iptal edilmiş ve
        donmuş etkinlikte de). Kayıt 30 gün sonra fotoğrafıyla kalıcı
        silinir. Bilinmeyen kayıt `event-item-not-found`.
      parameters:
        - $ref: "#/components/parameters/ClientHeader"
      responses:
        "204": { description: Kayıt çıkarıldı }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }

  # --- Etkinlik bileşenleri: ölçüm (`measure`; core MeasureComponentService, #245, ADR-0025 §4, §5, ADR-0037 §2, §3) ---
  # Birimli bir değer: etkinliğin tamamı için (`scope: total`, ör. yürüyüşün
  # mesafesi) ya da katılımcı başına (`scope: personal`, ör. gol, okunan
  # sayfa). Birim, sınırlar, ondalık basamak ve değeri kimin girdiği
  # (`entered_by`) tür tanımındaki bileşenin parametreleridir. Toplamı
  # organizatör, moderatör ve yönetici girer; kişisel değeri `entered_by:
