  # --- Etkinlikler (core EventService) ---
  #
  # Ortak kurallar: tayfanın etkinlik modülü kapalıysa okumalar dahil her uç
  # `module-disabled` alır. Bu tayfada olmayan ya da silinmiş etkinlik
  # `event-not-found`. İptal edilmiş etkinlikteki değişiklik
  # `event-cancelled`, bitmiş etkinlikteki `event-ended` alır.
  #
  # Konum: koordinatlar (WGS 84 derece) yalnızca istek gövdesinde taşınır,
  # hiçbir zaman URL'de değil; gateway onları log'a, hata ayrıntısına ve
  # erişim log'una yazmaz (ADR-0008).

  /v1/tayfas/{tayfa_id}/events:
    parameters:
      - $ref: "#/components/parameters/TayfaID"
    get:
      operationId: listUpcomingEvents
      summary: Bitmemiş etkinlikler, başlangıç zamanına göre
      description: |
        Her etkin üyeye açıktır (susturulmuş üye de okur). İptal edilenler
        de listededir. Türe özel ayrıntılar (`convoy`, `camp`, …) listede
        dolmaz; tek etkinlik ucunu kullanın.
      parameters:
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/PageToken"
      responses:
        "200":
          description: Etkinlikler
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EventList" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
    post:
      operationId: createEvent
      summary: Etkinlik açar; açan kişi organizatördür
      description: |
        Moderatör ve yönetici; tayfada `members_can_create_events` açıksa
        her etkin üye. Aynı `client_request_id` ile tekrar gönderim ilk
        açılan etkinliği döndürür ve yeni etkinlik açmaz. `recurrence`
        verilirse etkinlik tekrarlayan bir serinin ilkidir; sunucu sonraki
        etkinlikleri sekiz hafta ileriye kadar kendisi açar.
      parameters:
        - $ref: "#/components/parameters/ClientHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EventCreateRequest" }
      responses:
        "201":
          description: Açılan etkinlik (ya da tekrar gönderimde ilk açılan)
          headers:
            Location:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Event" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }

  /v1/tayfas/{tayfa_id}/events/{event_id}:
    parameters:
      - $ref: "#/components/parameters/TayfaID"
      - $ref: "#/components/parameters/EventID"
    get:
      operationId: getEvent
      summary: Tek etkinlik, türe özel ayrıntılarıyla
      description: |
        Katılımcılara özel balık noktasında (`spot_visibility=participants`)
        katılmayan üye `meeting_point` ve `meeting_point_name` almaz. Konvoy
        plakaları yalnızca katılımcılara (`going`) ve organizatöre döner.
      responses:
        "200":
          description: Etkinlik
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Event" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
    patch:
      operationId: updateEvent
      summary: Etkinliği düzenler (organizatör, moderatör, yönetici)
      description: |
        Gövdede bulunan alanlar değişir; en az bir alan gerekir. Alanlar
        gruplar halinde değişir:
        - `starts_at` ve `ends_at` birlikte gönderilir.
        - Yer: `mode`, `meeting_point_name`, `meeting_point`, `city`,
          `district`, `online_url` birlikte değişir; bunlardan biri
          gönderilirse `mode` zorunludur ve gönderilmeyenler boşalır.
        - Türe özel ayrıntı (`convoy`, `camp`, …) tamamen değişir; araçlar
          ve kamp listesi korunur.

        Kapasiteyi artırmak bekleme listesindekileri sırayla `going` yapar.
        Seriye ait bir etkinlikte `apply_to_series` `false` (varsayılan) ise
        yalnızca bu etkinlik değişir ve seriden ayrılır (`series_override`);
        `true` ise serinin başlamamış, düzenlenmemiş bütün etkinliklerini ve
        ileride açılacakları değiştirir; seride zaman değişmez. Bitmiş seri
        `event-series-ended` alır.
      parameters:
        - $ref: "#/components/parameters/ClientHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EventUpdateRequest" }
      responses:
        "200":
          description: Güncel etkinlik
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Event" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }

  /v1/tayfas/{tayfa_id}/events/{event_id}/cancellation:
    parameters:
      - $ref: "#/components/parameters/TayfaID"
      - $ref: "#/components/parameters/EventID"
    post:
      operationId: cancelEvent
      summary: Etkinliği iptal eder (organizatör, moderatör, yönetici)
      description: |
        Etkinlik silinmez; üyeler onu iptal zamanı ve sebebiyle görmeye devam
        eder. Sonrasında katılım cevapları değişmez.
      parameters:
        - $ref: "#/components/parameters/ClientHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EventCancelRequest" }
      responses:
        "200":
          description: İptal edilen etkinlik
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Event" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }

  /v1/tayfas/{tayfa_id}/events/{event_id}/calendar:
    parameters:
      - $ref: "#/components/parameters/TayfaID"
      - $ref: "#/components/parameters/EventID"
    get:
      operationId: exportEventCalendar
      summary: Etkinliği takvime eklemek için iCalendar (.ics) dosyası
      description: |
        RFC 5545. `UID` etkinlik kimliğidir; dosya tekrar içe aktarılırsa
        takvim kaydı güncellenir, iptal edilmiş etkinlik `STATUS:CANCELLED`
        taşır. Zamanlar UTC'dir. Koordinat, katılımcı, organizatör ya da
        plaka içermez; çevrimiçi etkinliğin linkini içerebilir, bu yüzden
        yanıt önbelleğe alınmaz (`Cache-Control: private, no-store`). Hata
        yanıtları `application/problem+json`'dur.
      responses:
        "200":
          description: iCalendar dosyası
          headers:
            Content-Disposition:
              description: '`attachment; filename="tayfam-<event_id>.ics"`'
              schema: { type: string }
            Cache-Control:
              schema: { type: string, enum: ["private, no-store"] }
          content:
            text/calendar:
              schema: { type: string }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
