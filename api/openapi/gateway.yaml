          description: Güncel soru
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Question" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
    delete:
      operationId: deleteQuestion
      summary: Soruyu siler (yazar ya da moderatör, yönetici)
      description: |
        Kendi sorunuzu silerseniz başlık, gövde ve etiketleri hemen
        kaldırılır, geri alınamaz. Başkasınınkini silmek onu gizler. Silinen
        sorunun cevapları da görünmez.
      parameters:
        - $ref: "#/components/parameters/ClientHeader"
      responses:
        "204": { description: Soru silindi }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }

  /v1/tayfas/{tayfa_id}/questions/{question_id}/restoration:
    parameters:
      - $ref: "#/components/parameters/TayfaID"
      - $ref: "#/components/parameters/QuestionID"
    post:
      operationId: restoreQuestion
      summary: Gizlenen soruyu geri alır (yönetici)
      description: |
        Moderatör ya da yöneticinin sildiği soru 30 gün içinde geri
        alınabilir; yazarın şu anki rolü sizinkinden düşük olmalıdır.
        Yazarın kendi sildiği ya da süresi geçen soru `question-not-found`
        alır. Görünen bir soru için de başarılıdır.
      parameters:
        - $ref: "#/components/parameters/ClientHeader"
      responses:
        "200":
          description: Geri alınan soru
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Question" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }

