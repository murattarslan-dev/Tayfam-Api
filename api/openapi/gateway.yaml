      schema: { type: string, format: uuid }
    BracketGame:
      name: game
      in: path
      required: true
      description: Maçtaki oyunun numarası (1–9).
      schema: { type: integer, format: int32, minimum: 1, maximum: 9 }
    SeriesID:
      name: series_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    AnnouncementID:
      name: announcement_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    PollID:
      name: poll_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    OptionID:
      name: option_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    QuestionID:
      name: question_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    AnswerID:
      name: answer_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    TagID:
      name: tag_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    ReportID:
      name: report_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    NotificationID:
      name: notification_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    ChannelID:
      name: channel_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    MessageID:
      name: message_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    ConversationID:
      name: conversation_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    LinkRequestID:
      name: link_request_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    SessionID:
      name: session_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    PageSize:
      name: page_size
      in: query
      required: false
      schema: { type: integer, minimum: 0, maximum: 100, default: 0 }
    AvailabilityDate:
      name: date
      in: path
      required: true
      description: Takvim günü (YYYY-MM-DD), saat değil; "bugün" Europe/Istanbul tarihidir.
      schema: { type: string, format: date }
    CatalogTypeKey:
      name: key
      in: path
      required: true
      description: Etkinlik türünün anahtarı (`hike`).
      schema: { type: string, pattern: "^[a-z][a-z0-9_]{1,39}$" }
    CatalogTypeVersion:
      name: version
      in: path
      required: true
      description: Tür sürümü; 1 ya da büyük, yalnızca rakam.
      schema: { type: integer, format: int32, minimum: 1 }
    PageToken:
      name: page_token
      in: query
      required: false
      description: Önceki yanıtın `next_page_token` değeri; opak.
      schema: { type: string, maxLength: 1024 }

