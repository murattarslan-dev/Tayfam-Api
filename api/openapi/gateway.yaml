          description: Güncel hesap ayarları
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Account" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }

  /v1/me/referral-code:
    post:
      operationId: rotateReferralCode
      summary: Yeni referans kodu üretir; eski kod ve linki hemen geçersiz olur
      parameters:
        - $ref: "#/components/parameters/ClientHeader"
      responses:
        "200":
          description: Yeni kod
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReferralCode" }
        "401": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }

  /v1/referral-lookups:
    post:
      operationId: lookupReferralCode
      summary: Referans koduyla kullanıcı bulur (yalnızca kimlik, ad, avatar)
      description: |
        Kod gövdededir; yol ve sorguda taşınmaz (erişim log'larına düşmez).
        Kullanıcı başına saatte 10 arama; bulunan, bulunamayan ve bozuk her
        deneme sayılır (`rate-limited`). Bulunamayan kod
        `referral-code-not-found`.
      parameters:
        - $ref: "#/components/parameters/ClientHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReferralLookupRequest" }
      responses:
        "200":
          description: Kodun sahibi
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReferredUser" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }

  # --- Arkadaşlık ve engelleme (core SocialService, #71) ---

  /v1/me/friends:
    get:
      operationId: listFriends
      summary: Arkadaşlarınız (yalnızca size görünür)
      parameters:
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/PageToken"
      responses:
        "200":
          description: Arkadaşlar
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FriendList" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }

  /v1/me/friends/{user_id}:
    parameters:
      - $ref: "#/components/parameters/UserID"
    delete:
      operationId: removeFriendship
      summary: Arkadaşlığı bitirir, isteğinizi geri çeker ya da gelen isteği reddeder
      description: Karşı tarafa bildirilmez. Silinecek bir şey yoksa da başarılıdır.
      parameters:
        - $ref: "#/components/parameters/ClientHeader"
      responses:
        "204": { description: Kaldırıldı }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }

  /v1/me/friend-requests:
    get:
      operationId: listFriendRequests
      summary: Size gelen (`incoming`, varsayılan) ya da gönderdiğiniz (`outgoing`) istekler
      parameters:
        - name: direction
          in: query
          schema: { type: string, enum: [incoming, outgoing], default: incoming }
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/PageToken"
      responses:
        "200":
          description: İstekler
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FriendList" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
    post:
      operationId: sendFriendRequest
      summary: Arkadaşlık isteği gönderir
      description: |
        Karşı tarafın size isteği zaten bekliyorsa kabul edilir (`state:
        friends`). Günde 20 istek; reddedilenler de sayılır
        (`friend-request-limit`). Engel varsa (iki yönden biri) kullanıcı
        bilinmeyen gibi görünür (`user-not-found`).
      parameters:
        - $ref: "#/components/parameters/ClientHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UserRef" }
      responses:
        "201":
          description: İstek (ya da kabul edilen arkadaşlık)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Friend" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }

  /v1/me/friend-requests/{user_id}/acceptance:
    parameters:
      - $ref: "#/components/parameters/UserID"
    post:
      operationId: acceptFriendRequest
      summary: Bu kullanıcının size gönderdiği isteği kabul eder
      parameters:
        - $ref: "#/components/parameters/ClientHeader"
      responses:
        "200":
          description: Arkadaşlık
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Friend" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }

  /v1/me/blocks:
    get:
      operationId: listBlockedUsers
      summary: Engellediğiniz kullanıcılar (sizi engelleyenler hiç listelenmez)
      parameters:
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/PageToken"
      responses:
        "200":
          description: Engellenenler
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BlockedUserList" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }

  /v1/me/blocks/{user_id}:
    parameters:
      - $ref: "#/components/parameters/UserID"
    put:
      operationId: blockUser
      summary: Kullanıcıyı engeller; arkadaşlık ve bekleyen istek silinir
      parameters:
        - $ref: "#/components/parameters/ClientHeader"
      responses:
        "204": { description: Engellendi }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
    delete:
      operationId: unblockUser
      summary: Engeli kaldırır; arkadaşlık geri gelmez
      parameters:
        - $ref: "#/components/parameters/ClientHeader"
      responses:
        "204": { description: Engel kaldırıldı }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }

  # --- Doğrudan tayfa daveti (core MembershipService, #71) ---

  /v1/tayfas/{tayfa_id}/invitations:
    parameters:
      - $ref: "#/components/parameters/TayfaID"
    get:
      operationId: listInvitations
      summary: Tayfanın cevaplanmamış doğrudan davetleri, yeniden eskiye (yönetici)
      parameters:
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/PageToken"
      responses:
        "200":
          description: Davetler
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InvitationList" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
    post:
      operationId: inviteFriend
      summary: Arkadaşınızı tayfaya davet eder (etkin, susturulmamış üye)
      description: |
        Yalnızca arkadaşlar (`not-friends`). Davet eden başına günde 10, tüm
        tayfalar birlikte (`direct-invite-limit`). Banlı ya da başvurusu
        bekleyen kişi `invite-not-allowed` (hangisi olduğu söylenmez).
      parameters:
        - $ref: "#/components/parameters/ClientHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UserRef" }
      responses:
        "201":
          description: Davet
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Invitation" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }

  /v1/tayfas/{tayfa_id}/invitations/{user_id}:
    parameters:
      - $ref: "#/components/parameters/TayfaID"
      - $ref: "#/components/parameters/UserID"
    delete:
      operationId: cancelInvitation
      summary: Cevaplanmamış bir daveti iptal eder (yönetici)
      parameters:
        - $ref: "#/components/parameters/ClientHeader"
      responses:
        "204": { description: Davet iptal edildi }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }

  /v1/me/invitations:
    get:
      operationId: listMyInvitations
      summary: Size gelen cevaplanmamış davetler, yeniden eskiye
      parameters:
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/PageToken"
      responses:
        "200":
          description: Davetler
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InvitationList" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }

  /v1/me/invitations/{tayfa_id}:
    parameters:
      - $ref: "#/components/parameters/TayfaID"
    delete:
      operationId: declineInvitation
      summary: Daveti reddeder; davet edene bildirilmez
      parameters:
        - $ref: "#/components/parameters/ClientHeader"
      responses:
        "204": { description: Davet reddedildi }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }

  /v1/me/invitations/{tayfa_id}/acceptance:
    parameters:
      - $ref: "#/components/parameters/TayfaID"
    post:
      operationId: acceptInvitation
      summary: Daveti kabul eder
      description: |
        Tayfa açık katılımlıysa ya da davet eden şu an moderatör veya
        yöneticiyse üyelik etkin olur; değilse onay bekler.
      parameters:
        - $ref: "#/components/parameters/ClientHeader"
      responses:
        "200":
          description: Üyelik (etkin ya da bekleyen)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Membership" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }

  # --- Profil (core ProfileService, #71) ---

  /v1/users/{user_id}/profile:
    parameters:
      - $ref: "#/components/parameters/UserID"
    get:
      operationId: getUserProfile
      summary: Bir kullanıcının profili (ad, avatar, ortak tayfalar)
      description: |
        Ortak tayfalar yalnızca ikinizin de etkin üyesi olduğu tayfalardır.
        Engel varsa (iki yönden biri) `user-not-found`, var olmayan kullanıcıyla
        aynı cevap.
      responses:
        "200":
          description: Profil
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserProfile" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }

  /v1/users/{user_id}/activity:
    parameters:
      - $ref: "#/components/parameters/UserID"
    get:
      operationId: listUserActivity
      summary: Kullanıcının katılım geçmişi, görünürlük ayarına göre
      description: |
        Arkadaşlar tümünü görür; ortak tayfa üyeleri (`tayfa`, `public`) ve
        diğerleri (`public`) son 14 günü göremez; `private` yalnızca kişinin
        kendisine görünür. Görmeye yetkiniz yoksa liste boş döner. Tayfa,
        etkinlik ve süre yalnızca o tayfanın etkin üyelerine doludur.
      parameters:
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/PageToken"
      responses:
        "200":
          description: Kayıtlar, yeniden eskiye
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ActivityList" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }

components:
  securitySchemes:
    bearer: { type: http, scheme: bearer, bearerFormat: JWT }
    cookie: { type: apiKey, in: cookie, name: tayfam_at }

  parameters:
    ClientHeader:
      name: X-Tayfam-Client
      in: header
      required: true
      description: CSRF koruması; durum değiştiren her istekte zorunlu.
      schema: { type: string, enum: [android, ios, web] }
    TayfaID:
      name: tayfa_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    UserID:
      name: user_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    EventID:
      name: event_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    SeriesID:
      name: series_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    AnnouncementID:
      name: announcement_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    PollID:
      name: poll_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    OptionID:
      name: option_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    QuestionID:
      name: question_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    AnswerID:
      name: answer_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    TagID:
      name: tag_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    NotificationID:
      name: notification_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    PageSize:
      name: page_size
      in: query
      required: false
      schema: { type: integer, minimum: 0, maximum: 100, default: 0 }
    PageToken:
      name: page_token
      in: query
      required: false
      description: Önceki yanıtın `next_page_token` değeri; opak.
      schema: { type: string, maxLength: 1024 }

  responses:
    Problem:
      description: |
        Hata. `type` değeri `https://tayfam.app/problems/<kod>` biçimindedir;
        kodların tam listesi `x-problem-types` altındadır.
      x-problem-types:
        # Genel
        - invalid-request
        - missing-client-header
        - unauthenticated
        - not-found
        - rate-limited
        - unavailable
        - internal
        # identity
        - invalid-credentials
        - unsupported-provider
        - age-blocked
        - invalid-refresh
        - refresh-conflict
        - invalid-birth-date
        - consent-outdated
        - already-registered
        - invalid-display-name
        # core: tayfa ve yetki
        - tayfa-not-found
        - permission-denied
        - muted
        - tayfa-read-only
        - tayfa-create-limit
        - deletion-already-requested
        - deletion-not-requested
        # core: katılım ve davet
        - invalid-join-code
        - invite-invalid
        - invite-expired
        - invite-revoked
        - invite-exhausted
        - invite-not-found
        - already-member
        - already-pending
        - banned
        # core: üye yönetimi
        - member-not-found
        - role-hierarchy
        - last-admin
        # core: modüller ve duyurular
        - module-disabled
        - announcement-not-found
        # core: etkinlikler
        - event-not-found
        - event-cancelled
        - event-ended
        - event-not-going
        - event-item-not-found
        - event-limit
        - event-type-mismatch
        # core: katılım doğrulama, av günlüğü
        - check-in-closed
        - check-in-too-far
        - check-in-attempts-exhausted
        - correction-closed
        - hike-not-started
        - not-attended
        # core: tekrarlayan etkinlik (#51)
        - event-series-not-found
        - event-series-ended
        # core: soru-cevap (#59)
        - question-not-found
        - answer-not-found
        - tag-not-found
        - own-answer-vote
        - tag-limit
        # core: anketler (#60)
        - poll-not-found
        - poll-closed
        - poll-anonymous
        # core: arkadaşlık, engelleme, doğrudan davet (#71)
        - user-not-found
        - friend-request-limit
        - friend-request-not-found
        - already-friends
        - friend-request-pending
        - not-friends
        - direct-invite-limit
        - invitation-not-found
        - already-invited
        - invite-not-allowed
        # core: şikâyetler ve moderasyon kuyruğu (#76)
        - report-not-found
        - report-target-not-found
        - report-limit
        - report-already-resolved
        - report-action-missing
        # identity: hesap ve referans kodu (#71; rate-limited yukarıda)
        - referral-code-not-found
        # chat: bildirimler (#64)
        - notification-not-found
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }

  schemas:
    Problem:
      type: object
      required: [type, title, status]
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
        request_id: { type: string }

    Status:
      type: object
      required: [status, version, services, checked_at]
      properties:
        status: { type: string, enum: [ok, degraded] }
        version: { type: string }
        services:
          type: object
          additionalProperties: { type: string, enum: [ok, unavailable] }
        checked_at: { type: string, format: date-time }

    SignInRequest:
      type: object
      required: [provider, id_token, nonce, platform]
      additionalProperties: false
      properties:
        provider: { type: string, enum: [google] }
        id_token: { type: string, maxLength: 8192 }
        nonce: { type: string, minLength: 16, maxLength: 256 }
        platform: { type: string, enum: [android, ios, web] }

    RefreshRequest:
      type: object
      additionalProperties: false
      properties:
        refresh_token:
          type: string
          maxLength: 64
          description: Mobil istemciler için; web çerezi kullanır.

    Session:
      type: object
      required: [user_id, session_id, access_expires_at, refresh_expires_at, registration_pending]
      properties:
        user_id: { type: string, format: uuid }
        session_id: { type: string, format: uuid }
        access_token:
          type: string
          description: Yalnızca mobil; web'de çerezdedir.
        access_expires_at: { type: string, format: date-time }
        refresh_token:
          type: string
          description: Yalnızca mobil; web'de çerezdedir.
        refresh_expires_at: { type: string, format: date-time }
        registration_pending: { type: boolean }

    RegistrationRequirements:
      type: object
      required: [privacy_notice_version, terms_version, minimum_age]
      properties:
        privacy_notice_version: { type: string }
        terms_version: { type: string }
        minimum_age: { type: integer }

    RegistrationRequest:
      type: object
      required: [birth_date, accepted_privacy_notice_version, accepted_terms_version]
      additionalProperties: false
      properties:
        birth_date: { type: string, format: date }
        display_name: { type: string, minLength: 1, maxLength: 40 }
        accepted_privacy_notice_version: { type: string, maxLength: 32 }
        accepted_terms_version: { type: string, maxLength: 32 }
        referral_code:
          type: string
          maxLength: 32
          description: |
            İsteğe bağlı; uygulamaya getiren kişinin referans kodu (Android'de
            mağaza referansı, iOS'ta elle). Bir kez kaydedilir; kimseyi
            bulmayan kod hata vermeden yok sayılır.

    # --- core ---

    EventType:
      type: string
      description: Tayfanın ilgi alanları etkinlik türleriyle aynı değerleri kullanır.
      enum: [convoy, camp, hike, fishing, gaming, sports, general]
    JoinPolicy:
      type: string
      description: "`approval`: yeni üyeler onay bekler. `open`: hemen etkin olur."
      enum: [approval, open]
    Module:
      type: string
      enum: [announcements, events, qa, polls]
    Role:
      type: string
      enum: [member, moderator, admin]

    TayfaCreateRequest:
      type: object
      required: [name, client_request_id]
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 3
          maxLength: 50
          description: Baştaki ve sondaki boşluklar atıldıktan sonra 3–50 karakter.
        description: { type: string, maxLength: 500 }
        interests:
          type: array
          maxItems: 7
          uniqueItems: true
          items: { $ref: "#/components/schemas/EventType" }
        join_policy:
          allOf: [{ $ref: "#/components/schemas/JoinPolicy" }]
          default: approval
        client_request_id:
          type: string
          format: uuid
          description: İstemcinin her açma denemesi için bir kez ürettiği, tekrar gönderimde aynen kullandığı UUID.

    TayfaUpdateRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name: { type: string, minLength: 3, maxLength: 50 }
        description: { type: string, maxLength: 500 }
        interests:
          type: array
          maxItems: 7
          uniqueItems: true
          items: { $ref: "#/components/schemas/EventType" }
        join_policy: { $ref: "#/components/schemas/JoinPolicy" }
        members_can_create_events:
          type: boolean
          description: "`true`: her etkin üye etkinlik açabilir. `false`: yalnızca moderatör ve yönetici."

    Tayfa:
      type: object
      required: [id, name, description, interests, join_policy, modules, status, member_count, members_can_create_events, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string }
        interests:
          type: array
          items: { $ref: "#/components/schemas/EventType" }
        join_policy: { $ref: "#/components/schemas/JoinPolicy" }
        modules:
          type: object
          description: Her modülün açık olup olmadığı.
          properties:
            announcements: { type: boolean }
            events: { type: boolean }
            qa: { type: boolean }
            polls: { type: boolean }
        status:
          type: string
          description: "`warned`: hareketsiz, 7 gün sonra arşivlenir. `archived`: salt okunur."
          enum: [active, warned, archived]
        suspended_at:
          type: string
          format: date-time
          description: Platform tayfayı askıya aldıysa (salt okunur). Sebep dönmez.
        deletion_at:
          type: string
          format: date-time
          description: Silme bekliyorsa tayfanın silineceği zaman (salt okunur).
        member_count: { type: integer }
        members_can_create_events:
          type: boolean
          description: |
            `true` ise her etkin üye etkinlik açabilir; `false` (varsayılan)
            ise yalnızca moderatör ve yönetici. Organizatör kendi etkinliğini
            her zaman yönetir.
        join_code:
          type: string
          description: Yalnızca yöneticiye döner.
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    TayfaView:
      type: object
      required: [tayfa, caller_role]
      properties:
        tayfa: { $ref: "#/components/schemas/Tayfa" }
        caller_role: { $ref: "#/components/schemas/Role" }

    MyTayfa:
      type: object
      required: [tayfa_id, name, role, status]
      properties:
        tayfa_id: { type: string, format: uuid }
        name: { type: string }
        role: { $ref: "#/components/schemas/Role" }
        status: { type: string, enum: [active, pending] }
        tayfa:
          allOf: [{ $ref: "#/components/schemas/Tayfa" }]
          description: Yalnızca etkin üyelikte.

    MyTayfaList:
      type: object
      required: [tayfas]
      properties:
        tayfas:
          type: array
          items: { $ref: "#/components/schemas/MyTayfa" }
        next_page_token: { type: string }

    ModuleUpdate:
      type: object
      required: [enabled]
      additionalProperties: false
      properties:
        enabled: { type: boolean }

    JoinCode:
      type: object
      required: [join_code]
      properties:
        join_code:
          type: string
          description: 8 karakter, `[2-9A-HJ-NP-Z]`.

    Deletion:
      type: object
      required: [deletion_at]
      properties:
        deletion_at: { type: string, format: date-time }

    Membership:
      type: object
      required: [tayfa_id, user_id, role, status]
      properties:
        tayfa_id: { type: string, format: uuid }
        user_id: { type: string, format: uuid }
        role: { $ref: "#/components/schemas/Role" }
        status: { type: string, enum: [invited, pending, active, banned] }
        joined_at:
          type: string
          format: date-time
          description: Üyelik etkin olduğunda.
        muted_until:
          type: string
          format: date-time
          description: Susturma bitişi; yalnızca üyenin kendisine, moderatöre ve yöneticiye döner.

    MemberList:
      type: object
      required: [members]
      properties:
        members:
          type: array
          items: { $ref: "#/components/schemas/Membership" }
        next_page_token: { type: string }

    RoleUpdate:
      type: object
      required: [role]
      additionalProperties: false
      properties:
        role: { $ref: "#/components/schemas/Role" }

    MuteRequest:
      type: object
      required: [muted_until]
      additionalProperties: false
      properties:
        muted_until:
          type: string
          format: date-time
          description: Şimdiden sonra, en fazla 30 gün ileri.

    JoinRequest:
      type: object
      required: [user_id, requested_at, source]
      properties:
        user_id: { type: string, format: uuid }
        requested_at: { type: string, format: date-time }
        source: { type: string, enum: [invite_link, direct_invite, code, discover] }
        inviter_user_id:
          type: string
          format: uuid
          description: Davet eden ya da linki açan kişi; kodla katılımda yok.
        invite_id:
          type: string
          format: uuid
          description: Kullanılan davet linki; yalnızca `source=invite_link`.

    JoinRequestList:
      type: object
      required: [join_requests]
      properties:
        join_requests:
          type: array
          items: { $ref: "#/components/schemas/JoinRequest" }
        next_page_token: { type: string }

    InviteCreateRequest:
      type: object
      required: [ttl_seconds, max_uses]
      additionalProperties: false
      properties:
        ttl_seconds:
          type: integer
          minimum: 3600
          maximum: 2592000
          description: Linkin geçerlilik süresi; 1 saat ile 30 gün arası.
        max_uses: { type: integer, minimum: 1, maximum: 100 }

    Invite:
      type: object
      required: [id, tayfa_id, created_by_user_id, created_at, expires_at, max_uses, use_count]
      description: Davet linki. Token ya da özeti hiçbir zaman dönmez.
      properties:
        id: { type: string, format: uuid }
        tayfa_id: { type: string, format: uuid }
        created_by_user_id: { type: string, format: uuid }
        created_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
        max_uses: { type: integer }
        use_count: { type: integer }
        revoked_at: { type: string, format: date-time }

    CreatedInvite:
      type: object
      required: [invite, token]
      properties:
        invite: { $ref: "#/components/schemas/Invite" }
        token:
          type: string
          description: Linkin gizli kısmı (43 karakter base64url). Yalnızca burada, bir kez döner.

    InviteList:
      type: object
      required: [invites]
      properties:
        invites:
          type: array
          items: { $ref: "#/components/schemas/Invite" }

    JoinByCodeRequest:
      type: object
      required: [code]
      additionalProperties: false
      properties:
        code:
          type: string
          maxLength: 32
          description: Katılım kodu; büyük/küçük harf duyarsız.

    InviteTokenRequest:
      type: object
      required: [token]
      additionalProperties: false
      properties:
        token: { type: string, maxLength: 64 }

    InvitePreview:
      type: object
      required: [tayfa_id, name, member_count, already_member]
      description: Linki bilen herkesin görebileceği dar görünüm.
      properties:
        tayfa_id: { type: string, format: uuid }
        name: { type: string }
        member_count: { type: integer }
        already_member:
          type: boolean
          description: Zaten etkin üyeyseniz ya da bekleyen isteğiniz varsa.

    Announcement:
      type: object
      required: [id, tayfa_id, title, body, pinned, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        tayfa_id: { type: string, format: uuid }
        author_user_id:
          type: string
          format: uuid
          description: Yazarın hesabı silindiyse yoktur ("Silinmiş kullanıcı").
        title: { type: string }
        body: { type: string }
        pinned: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at:
          type: string
          format: date-time
          description: Her düzenleme, sabitleme ve geri almada değişir.

    AnnouncementList:
      type: object
      required: [announcements]
      properties:
        announcements:
          type: array
          items: { $ref: "#/components/schemas/Announcement" }
        next_page_token: { type: string }

    AnnouncementCreateRequest:
      type: object
      required: [title, client_request_id]
      additionalProperties: false
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 120
          description: Baştaki ve sondaki boşluklar atıldıktan sonra 1–120 karakter, tek satır.
        body:
          type: string
          maxLength: 5000
          description: En fazla 5000 karakter; satır sonu olabilir.
        client_request_id:
          type: string
          format: uuid
          description: İstemcinin her yayınlama denemesi için bir kez ürettiği, tekrar gönderimde aynen kullandığı UUID.

    AnnouncementUpdateRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        title: { type: string, minLength: 1, maxLength: 120 }
        body: { type: string, maxLength: 5000 }

    # --- Soru-cevap ---

    Tag:
      type: object
      required: [id, name]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, description: İlk yazıldığı haliyle 1–30 karakter. }
        question_count:
          type: integer
          description: Yalnızca etiket listesinde; etiketi taşıyan görünen soru sayısı.

    TagList:
      type: object
      required: [tags]
      properties:
        tags:
          type: array
          items: { $ref: "#/components/schemas/Tag" }

    Question:
      type: object
      required: [id, tayfa_id, title, body, tags, answer_count, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        tayfa_id: { type: string, format: uuid }
        author_user_id:
          type: string
          format: uuid
          description: Yazarın hesabı silindiyse yoktur ("Silinmiş kullanıcı").
        title: { type: string }
        body: { type: string }
        tags:
          type: array
          items: { $ref: "#/components/schemas/Tag" }
        answer_count: { type: integer, description: Görünen cevap sayısı. }
        created_at: { type: string, format: date-time }
        updated_at:
          type: string
          format: date-time
          description: Her düzenleme ve geri almada değişir.

    QuestionList:
      type: object
      required: [questions]
      properties:
        questions:
          type: array
          items: { $ref: "#/components/schemas/Question" }
        next_page_token: { type: string }

    QuestionCreateRequest:
      type: object
      required: [title, client_request_id]
      additionalProperties: false
      properties:
        title:
          type: string
          minLength: 10
          maxLength: 150
          description: Baştaki ve sondaki boşluklar atıldıktan sonra 10–150 karakter, tek satır.
        body:
          type: string
          maxLength: 10000
          description: En fazla 10000 karakter; satır sonu olabilir.
        tags:
          type: array
          maxItems: 5
          description: Etiket adları; her biri 1–30 karakter, tek satır, iç boşluklar teke iner.
          items: { type: string, minLength: 1, maxLength: 30 }
        client_request_id:
          type: string
          format: uuid
          description: İstemcinin her deneme için bir kez ürettiği, tekrar gönderimde aynen kullandığı UUID.

    QuestionUpdateRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        title: { type: string, minLength: 10, maxLength: 150 }
        body: { type: string, maxLength: 10000 }
        tags:
          type: array
          maxItems: 5
          items: { type: string, minLength: 1, maxLength: 30 }

    Answer:
      type: object
      required: [id, question_id, tayfa_id, body, vote_count, voted, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        question_id: { type: string, format: uuid }
        tayfa_id: { type: string, format: uuid }
        author_user_id:
          type: string
          format: uuid
          description: Yazarın hesabı silindiyse yoktur ("Silinmiş kullanıcı").
        body: { type: string }
        vote_count: { type: integer, description: Faydalı oyu sayısı. }
        voted: { type: boolean, description: Çağıran bu cevaba oy verdi mi. }
        created_at: { type: string, format: date-time }
        updated_at:
          type: string
          format: date-time
          description: Her düzenleme ve geri almada değişir; oylar değiştirmez.

    AnswerList:
      type: object
      required: [answers]
      properties:
        answers:
          type: array
          items: { $ref: "#/components/schemas/Answer" }
        next_page_token: { type: string }

    AnswerCreateRequest:
      type: object
      required: [body, client_request_id]
      additionalProperties: false
      properties:
        body:
          type: string
          minLength: 1
          maxLength: 10000
          description: Boşluklar atıldıktan sonra 1–10000 karakter; satır sonu olabilir.
        client_request_id: { type: string, format: uuid }

    AnswerUpdateRequest:
      type: object
      required: [body]
      additionalProperties: false
      properties:
        body: { type: string, minLength: 1, maxLength: 10000 }

    # --- Anketler ---

    Poll:
      type: object
      description: |
        Gizli ankette (`anonymous`) diğer üyeler, yöneticiler dahil, kimin
        neye oy verdiğini göremez; `own_option_ids` her zaman yalnızca
        çağıranın kendi oyudur. Sayımlar her ankette döner.
      required: [id, tayfa_id, question, anonymous, multiple_choice, closed, created_at, options, voter_count, own_option_ids]
      properties:
        id: { type: string, format: uuid }
        tayfa_id: { type: string, format: uuid }
        event_id:
          type: string
          format: uuid
          description: Anket bir etkinliğe bağlı değilse yoktur.
        created_by_user_id:
          type: string
          format: uuid
          description: Anketi açanın hesabı silindiyse yoktur ("Silinmiş kullanıcı").
        question: { type: string }
        anonymous: { type: boolean }
        multiple_choice: { type: boolean }
        closes_at:
          type: string
          format: date-time
          description: Planlanan kapanma zamanı; yoksa elle kapatılana kadar açık.
        closed_at:
          type: string
          format: date-time
          description: Erken kapatıldıysa.
        closed:
          type: boolean
          description: Erken kapatıldı ya da kapanma zamanı geçti; oy alınmaz.
        created_at: { type: string, format: date-time }
        options:
          type: array
          items: { $ref: "#/components/schemas/PollOption" }
        voter_count:
          type: integer
          format: int64
          description: Oy veren kişi sayısı (çok seçimlide kişi bir kez sayılır).
        own_option_ids:
          type: array
          description: Çağıranın kendi oyu; oy vermediyse boş.
          items: { type: string, format: uuid }

    PollOption:
      type: object
      required: [id, text, position, vote_count]
      properties:
        id: { type: string, format: uuid }
        text: { type: string }
        position: { type: integer }
        vote_count: { type: integer, format: int64 }

    PollList:
      type: object
      required: [polls]
      properties:
        polls:
          type: array
          items: { $ref: "#/components/schemas/Poll" }
        next_page_token: { type: string }

    PollCreateRequest:
      type: object
      required: [question, options]
      additionalProperties: false
      properties:
        question:
          type: string
          minLength: 1
          maxLength: 200
          description: Baştaki ve sondaki boşluklar atıldıktan sonra 1–200 karakter, tek satır.
        options:
          type: array
          minItems: 2
          maxItems: 10
          description: Her biri 1–100 karakter, tek satır; büyük/küçük harf farkı gözetmeden tekil.
          items: { type: string, minLength: 1, maxLength: 100 }
        anonymous:
          type: boolean
          default: false
          description: İlk oydan sonra değiştirilemez.
        multiple_choice: { type: boolean, default: false }
        closes_at:
          type: string
          format: date-time
          description: İsteğe bağlı; gelecekte, en fazla 365 gün sonra.
        event_id:
          type: string
          format: uuid
          description: İsteğe bağlı; aynı tayfanın etkinliği.

    PollVoteRequest:
      type: object
      required: [option_ids]
      additionalProperties: false
      properties:
        option_ids:
          type: array
          minItems: 1
          maxItems: 10
          uniqueItems: true
          items: { type: string, format: uuid }

    PollVoter:
      type: object
      required: [user_id, voted_at]
      properties:
        user_id: { type: string, format: uuid }
        voted_at: { type: string, format: date-time }

    PollVoterList:
      type: object
      required: [voters]
      properties:
        voters:
          type: array
          items: { $ref: "#/components/schemas/PollVoter" }
        next_page_token: { type: string }

    # --- Etkinlikler ---

    EventMode:
      type: string
      enum: [in_person, online]
    RsvpStatus:
      type: string
      description: "`waitlist` yalnızca sunucu tarafından verilir (dolu etkinlikte `going`)."
      enum: [going, maybe, not_going, waitlist]
    AttendanceStatus:
      type: string
      description: "`attended`: doğrulandı. `no_show`: organizatör düzeltmesiyle kaldırıldı."
      enum: [attended, no_show]
    AttendanceMethod:
      type: string
      description: |
        `location`: buluşma noktasına 300 m içinde check-in. `online`:
        çevrimiçi etkinlikte "Katıldım". `hike_start`: yürüyüşe çıkış.
        `organizer`: organizatör düzeltmesi.
      enum: [location, online, hike_start, organizer]

    LatLng:
      type: object
      required: [lat, lng]
      additionalProperties: false
      description: WGS 84 derece. Yalnızca gövdede taşınır; log'a yazılmaz.
      properties:
        lat: { type: number, minimum: -90, maximum: 90 }
        lng: { type: number, minimum: -180, maximum: 180 }

    ConvoyDetails:
      type: object
      properties:
        route:
          type: array
          description: Boş ya da 2–500 nokta.
          items: { $ref: "#/components/schemas/LatLng" }
        vehicles:
          type: array
          description: Yalnızca tek etkinlik yanıtında.
          items: { $ref: "#/components/schemas/ConvoyVehicle" }
    ConvoyDetailsInput:
      type: object
      additionalProperties: false
      properties:
        route:
          type: array
          maxItems: 500
          description: Boş ya da 2–500 nokta.
          items: { $ref: "#/components/schemas/LatLng" }
    ConvoyVehicle:
      type: object
      required: [id, user_id, make]
      properties:
        id: { type: string, format: uuid }
        user_id: { type: string, format: uuid }
        make: { type: string }
        model: { type: string }
        model_year: { type: integer, description: Verilmemişse yoktur. }
        color: { type: string }
        plate:
          type: string
          description: Yalnızca katılımcılara (`going`) ve organizatöre döner.
    ConvoyVehicleCreateRequest:
      type: object
      required: [make]
      additionalProperties: false
      properties:
        make: { type: string, minLength: 1, maxLength: 40 }
        model: { type: string, maxLength: 40 }
        model_year: { type: integer, description: "0 ya da 1900 – gelecek yıl." }
        color: { type: string, maxLength: 30 }
        plate:
          type: string
          maxLength: 16
          description: İsteğe bağlı, kişisel veri. Harf, rakam ve tek boşluk; 2–16 karakter.

    CampDetails:
      type: object
      properties:
        site_name: { type: string }
        has_water: { type: boolean, description: Bilinmiyorsa yoktur. }
        has_toilet: { type: boolean, description: Bilinmiyorsa yoktur. }
        notes: { type: string }
        items:
          type: array
          description: Yalnızca tek etkinlik yanıtında.
          items: { $ref: "#/components/schemas/CampItem" }
    CampDetailsInput:
      type: object
      additionalProperties: false
      properties:
        site_name: { type: string, maxLength: 120 }
        has_water: { type: boolean }
        has_toilet: { type: boolean }
        notes: { type: string, maxLength: 1000 }
    CampItem:
      type: object
      required: [id, name, quantity]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        quantity: { type: integer }
        assigned_user_id: { type: string, format: uuid, description: Getirecek kişi. }
    CampItemCreateRequest:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 60 }
        quantity: { type: integer, minimum: 0, maximum: 999, description: "0 ya da yok: 1." }
        assigned_user_id: { type: string, format: uuid, description: Tayfanın etkin bir üyesi. }

    HikeDetails:
      type: object
      properties:
        difficulty: { type: integer, minimum: 0, maximum: 5, description: "0: verilmemiş." }
        distance_km: { type: number, minimum: 0, maximum: 1000, description: "0: verilmemiş; iki ondalık." }
        elevation_m: { type: integer, minimum: 0, maximum: 9000, description: "0: verilmemiş." }
        expected_return_at: { type: string, format: date-time, description: Başlangıçtan sonra. }
        return_grace_minutes: { type: integer, minimum: 0, maximum: 1440, description: "0: varsayılan 30." }
    FishingDetails:
      type: object
      properties:
        spot_visibility:
          type: string
          enum: [tayfa, participants]
          description: |
            `participants`: buluşma noktasını yalnızca organizatör, moderatör,
            yönetici ve `going`/`maybe` cevabı verenler görür. Yoksa `tayfa`.
    GamingDetails:
      type: object
      required: [game, platform]
      properties:
        game: { type: string, minLength: 1, maxLength: 60 }
        platform: { type: string, enum: [pc, playstation, xbox, switch, mobile, other] }
    SportsDetails:
      type: object
      required: [sport]
      properties:
        sport: { type: string, enum: [football, table_football, basketball, volleyball, tennis, table_tennis, other] }
        venue_name: { type: string, maxLength: 120 }

    Recurrence:
      type: object
      required: [rrule]
      additionalProperties: false
      properties:
        rrule:
          type: string
          maxLength: 256
          description: |
            RFC 5545 RRULE alt kümesi: `FREQ=WEEKLY|MONTHLY`, `INTERVAL=1..52`,
            `BYDAY` (aylıkta sıralı: `2SA`, `-1FR`), `COUNT=1..500` ya da
            `UNTIL=YYYYMMDDTHHMMSSZ` (en fazla beş yıl), `WKST=MO`.
            `starts_at` ilk tekrardır ve kurala uymalıdır.
        time_zone:
          type: string
          maxLength: 64
          description: IANA adı; boşsa `Europe/Istanbul`. Yerel saat yaz saatinde korunur.

    Event:
      type: object
      required: [id, tayfa_id, type, mode, title, description, starts_at, ends_at, capacity, status, discoverable, going_count, maybe_count, waitlist_count, caller_can_manage, series_override, created_at, updated_at]
      description: |
        Bir etkin üyenin gördüğü etkinlik. Türe özel ayrıntı (`convoy`,
        `camp`, `hike`, `fishing`, `gaming`, `sports`) yalnızca tek etkinlik
        yanıtında ve en fazla biri dolu gelir.
      properties:
        id: { type: string, format: uuid }
        tayfa_id: { type: string, format: uuid }
        type: { $ref: "#/components/schemas/EventType" }
        mode: { $ref: "#/components/schemas/EventMode" }
        title: { type: string }
        description: { type: string }
        starts_at: { type: string, format: date-time }
        ends_at: { type: string, format: date-time }
        meeting_point_name: { type: string }
        meeting_point: { $ref: "#/components/schemas/LatLng" }
        city: { type: string }
        district: { type: string }
        online_url: { type: string, description: Çevrimiçi etkinlikte. }
        capacity: { type: integer, description: "0: sınırsız." }
        status: { type: string, enum: [scheduled, cancelled] }
        cancelled_at: { type: string, format: date-time }
        cancel_reason: { type: string }
        discoverable: { type: boolean }
        created_by_user_id:
          type: string
          format: uuid
          description: Organizatör; hesabı silindiyse yoktur.
        going_count: { type: integer }
        maybe_count: { type: integer }
        waitlist_count: { type: integer }
        caller_rsvp:
          allOf: [{ $ref: "#/components/schemas/RsvpStatus" }]
          description: Sizin cevabınız; cevap vermediyseniz yoktur.
        caller_can_manage:
          type: boolean
          description: Düzenleyip iptal edebilir misiniz (istemcinin doğru işlemleri göstermesi için; sunucu her istekte yeniden kontrol eder).
        caller_attendance:
          allOf: [{ $ref: "#/components/schemas/AttendanceStatus" }]
          description: Doğrulanmış katılımınız; yoksa yoktur.
        series_id: { type: string, format: uuid, description: Tekrarlayan serinin etkinliğiyse. }
        series_override: { type: boolean, description: Seriden ayrı düzenlendi; seri değişiklikleri ona dokunmaz. }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        convoy: { $ref: "#/components/schemas/ConvoyDetails" }
        camp: { $ref: "#/components/schemas/CampDetails" }
        hike: { $ref: "#/components/schemas/HikeDetails" }
        fishing: { $ref: "#/components/schemas/FishingDetails" }
        gaming: { $ref: "#/components/schemas/GamingDetails" }
        sports: { $ref: "#/components/schemas/SportsDetails" }

    EventList:
      type: object
      required: [events]
      properties:
        events:
          type: array
          items: { $ref: "#/components/schemas/Event" }
        next_page_token: { type: string }

    EventCreateRequest:
      type: object
      required: [type, mode, title, starts_at, ends_at, client_request_id]
      additionalProperties: false
      description: |
        Yüz yüze: `meeting_point`, `city`, `district` zorunlu; `online_url`
        boş. Çevrimiçi: `online_url` (https) zorunlu; yer alanları boş.
        Türe özel ayrıntı en fazla bir tane ve türle aynı olur; `gaming` ve
        `sports` için zorunlu, `general` için yoktur.
      properties:
        type: { $ref: "#/components/schemas/EventType" }
        mode: { $ref: "#/components/schemas/EventMode" }
        title:
          type: string
          minLength: 1
          maxLength: 120
          description: Baştaki ve sondaki boşluklar atıldıktan sonra 1–120 karakter.
        description: { type: string, maxLength: 5000 }
        starts_at: { type: string, format: date-time, description: Gelecekte, en fazla iki yıl ileri. }
        ends_at: { type: string, format: date-time, description: Başlangıçtan sonra, en fazla 30 gün. }
        meeting_point_name: { type: string, maxLength: 120 }
        meeting_point: { $ref: "#/components/schemas/LatLng" }
        city: { type: string, maxLength: 50 }
        district: { type: string, maxLength: 50 }
        online_url: { type: string, maxLength: 2048 }
        capacity: { type: integer, minimum: 0, maximum: 10000, description: "0: sınırsız." }
        discoverable: { type: boolean }
        convoy: { $ref: "#/components/schemas/ConvoyDetailsInput" }
        camp: { $ref: "#/components/schemas/CampDetailsInput" }
        hike: { $ref: "#/components/schemas/HikeDetails" }
        fishing: { $ref: "#/components/schemas/FishingDetails" }
        gaming: { $ref: "#/components/schemas/GamingDetails" }
        sports: { $ref: "#/components/schemas/SportsDetails" }
        recurrence: { $ref: "#/components/schemas/Recurrence" }
        client_request_id:
          type: string
          format: uuid
          description: İstemcinin her açma denemesi için bir kez ürettiği, tekrar gönderimde aynen kullandığı UUID.

    EventUpdateRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      description: Kurallar açmadakiyle aynıdır; tür değişmez.
      properties:
        title: { type: string, minLength: 1, maxLength: 120 }
        description: { type: string, maxLength: 5000 }
        starts_at: { type: string, format: date-time }
        ends_at: { type: string, format: date-time }
        mode: { $ref: "#/components/schemas/EventMode" }
        meeting_point_name: { type: string, maxLength: 120 }
        meeting_point: { $ref: "#/components/schemas/LatLng" }
        city: { type: string, maxLength: 50 }
        district: { type: string, maxLength: 50 }
        online_url: { type: string, maxLength: 2048 }
        capacity: { type: integer, minimum: 0, maximum: 10000 }
        discoverable: { type: boolean }
        convoy: { $ref: "#/components/schemas/ConvoyDetailsInput" }
        camp: { $ref: "#/components/schemas/CampDetailsInput" }
        hike: { $ref: "#/components/schemas/HikeDetails" }
        fishing: { $ref: "#/components/schemas/FishingDetails" }
        gaming: { $ref: "#/components/schemas/GamingDetails" }
        sports: { $ref: "#/components/schemas/SportsDetails" }
        apply_to_series:
          type: boolean
          description: "`true` yalnızca seriye ait etkinlikte geçerlidir; yoksa `false`."

    EventCancelRequest:
      type: object
      additionalProperties: false
      properties:
        reason: { type: string, maxLength: 500 }

    RsvpRequest:
      type: object
      required: [status]
      additionalProperties: false
      properties:
        status: { type: string, enum: [going, maybe, not_going] }
    Rsvp:
      type: object
      required: [status]
      properties:
        status: { $ref: "#/components/schemas/RsvpStatus" }

    Attendee:
      type: object
      required: [user_id, status, updated_at]
      properties:
        user_id: { type: string, format: uuid }
        status: { $ref: "#/components/schemas/RsvpStatus" }
        updated_at:
          type: string
          format: date-time
          description: Cevabın ya da katılımın son değiştiği zaman.
        attendance:
          allOf: [{ $ref: "#/components/schemas/AttendanceStatus" }]
          description: Doğrulanmamışsa yoktur.
        attendance_method: { $ref: "#/components/schemas/AttendanceMethod" }
    AttendeeList:
      type: object
      required: [attendees]
      properties:
        attendees:
          type: array
          items: { $ref: "#/components/schemas/Attendee" }
        next_page_token: { type: string }

    CheckInRequest:
      type: object
      additionalProperties: false
      properties:
        location:
          allOf: [{ $ref: "#/components/schemas/LatLng" }]
          description: Yüz yüze etkinlikte zorunlu, şu anki konumunuz; çevrimiçide gönderilmez. Saklanmaz, log'a yazılmaz.
    CheckIn:
      type: object
      required: [attendance, method]
      properties:
        attendance: { $ref: "#/components/schemas/AttendanceStatus" }
        method: { $ref: "#/components/schemas/AttendanceMethod" }

    HikeStartRequest:
      type: object
      additionalProperties: false
      properties:
        started_at:
          type: string
          format: date-time
          description: İstemcinin çıkış zamanı; yoksa şimdi. Gelecekte değil, en fazla 48 saat önce.
    HikeReturnRequest:
      type: object
      additionalProperties: false
      properties:
        returned_at:
          type: string
          format: date-time
          description: İstemcinin dönüş zamanı; yoksa şimdi. Çıkıştan önce olamaz.
    HikeCheckin:
      type: object
      required: [started_at]
      properties:
        started_at: { type: string, format: date-time }
        returned_at: { type: string, format: date-time, description: Dönülmediyse yoktur. }

    FishingCatch:
      type: object
      required: [id, user_id, species, length_cm, visibility, created_at]
      properties:
        id: { type: string, format: uuid }
        user_id: { type: string, format: uuid }
        species: { type: string }
        length_cm: { type: number }
        location:
          allOf: [{ $ref: "#/components/schemas/LatLng" }]
          description: Avcıya, `tayfa` görünürlüğünde noktayı görebilenlere döner.
        visibility: { type: string, enum: [self, tayfa] }
        created_at: { type: string, format: date-time }
    FishingCatchCreateRequest:
      type: object
      required: [species, length_cm, client_request_id]
      additionalProperties: false
      properties:
        species: { type: string, minLength: 1, maxLength: 60 }
        length_cm: { type: number, exclusiveMinimum: 0, maximum: 1000, description: Bir ondalık. }
        location: { $ref: "#/components/schemas/LatLng" }
        visibility:
          type: string
          enum: [self, tayfa]
          default: self
          description: Konumu kim görür; av kendisi her etkin üyeye görünür.
        client_request_id: { type: string, format: uuid }
    FishingCatchList:
      type: object
      required: [catches]
      properties:
        catches:
          type: array
          items: { $ref: "#/components/schemas/FishingCatch" }
        next_page_token: { type: string }

    EventSeries:
      type: object
      required: [id, tayfa_id, rrule, time_zone, starts_at, created_at]
      properties:
        id: { type: string, format: uuid }
        tayfa_id: { type: string, format: uuid }
        template_event_id:
          type: string
          format: uuid
          description: Yeni tekrarların kopyalandığı etkinlik.
        rrule: { type: string, description: Kanonik biçim. }
        time_zone: { type: string }
        starts_at: { type: string, format: date-time, description: İlk tekrar. }
        ended_at: { type: string, format: date-time, description: Seri bitirildiyse. }
        created_by_user_id: { type: string, format: uuid, description: Hesabı silindiyse yoktur. }
        created_at: { type: string, format: date-time }
    EventSeriesEnding:
      type: object
      required: [series, cancelled_count]
      properties:
        series: { $ref: "#/components/schemas/EventSeries" }
        cancelled_count: { type: integer, description: İptal edilen yaklaşan etkinlik sayısı. }

    Notification:
      type: object
      description: |
        Bildirim yalnızca kimlik taşır; başlık, gövde, yer, isim yoktur.
        İstemci `target_type` ve `target_id` ile içeriği ilgili uçtan çeker.
      required: [id, type, target_type, target_id, read, created_at]
      properties:
        id: { type: string, format: uuid }
        type:
          type: string
          description: |
            `event_created` (yeni etkinlik), `event_updated` ve
            `event_cancelled` (katıldığınız etkinlik değişti/iptal edildi),
            `rsvp_promoted` (bekleme listesinden katılımcılara geçtiniz),
            `announcement`, `answer_received` (sorunuza cevap),
            `join_request` (yönetici/moderatörlere başvuru),
            `join_approved` (başvurunuz onaylandı),
            `tayfa_deletion_requested` (yönetici/moderatörlere silme talebi),
            `tayfa_warned` (hareketsiz tayfa 7 gün içinde arşivlenecek;
            `warning_reason` var), `tayfa_archived`, `hike_overdue`
            (yürüyüşçü zamanında dönmedi; `subject_user_id` yürüyüşçüdür,
            sessize alma bu bildirimi engellemez), `friend_request` (size
            arkadaşlık isteği; `target_id` isteyen kişi), `friend_accepted`
            (isteğiniz kabul edildi; `target_id` yeni arkadaşınız),
            `tayfa_invitation` (bir arkadaşınız sizi tayfaya davet etti;
            hedef tayfa). İki arkadaşlık bildirimi bir tayfayla ilgili
            değildir, `tayfa_id` yoktur. Tanınmayan değer `unknown`.
          enum: [event_created, event_updated, event_cancelled, rsvp_promoted, announcement, answer_received, join_request, join_approved, tayfa_deletion_requested, tayfa_warned, tayfa_archived, hike_overdue, friend_request, friend_accepted, tayfa_invitation, unknown]
        tayfa_id:
          type: string
          format: uuid
          description: Bildirim bir tayfayla ilgili değilse yoktur.
        actor_id:
          type: string
          format: uuid
          description: İşlemi yapan; sistem ya da silinmiş hesapsa yoktur.
        target_type:
          type: string
          description: |
            `membership` için `target_id` başvuran kullanıcının kimliğidir;
            `user` için bir kullanıcının kimliği (profilini açın).
          enum: [tayfa, membership, announcement, event, answer, user, unknown]
        target_id: { type: string, format: uuid }
        question_id:
          type: string
          format: uuid
          description: Yalnızca `answer_received`; cevaplanan soru.
        subject_user_id:
          type: string
          format: uuid
          description: Yalnızca `hike_overdue`; dönmeyen yürüyüşçü.
        warning_reason:
          type: string
          description: Yalnızca `tayfa_warned`.
          enum: [inactive, few_members, unknown]
        read: { type: boolean }
        created_at: { type: string, format: date-time }
    NotificationList:
      type: object
      required: [notifications]
      properties:
        notifications:
          type: array
          items: { $ref: "#/components/schemas/Notification" }
        next_page_token: { type: string }
    UnreadNotificationCount:
      type: object
      required: [unread_count]
      properties:
        unread_count: { type: integer, minimum: 0, maximum: 1000 }
    NotificationPreference:
      type: object
      required: [scope_type, scope_id, level, updated_at]
      properties:
        scope_type:
          type: string
          description: Şimdilik yalnızca `tayfa`; kanal ve konuşma sonra gelir.
          enum: [tayfa, channel, dm_conversation, unknown]
        scope_id: { type: string, format: uuid }
        level: { type: string, enum: [all, mentions, none, unknown] }
        mute_until:
          type: string
          format: date-time
          description: Yoksa süresiz.
        updated_at: { type: string, format: date-time }
    NotificationPreferenceList:
      type: object
      required: [preferences]
      properties:
        preferences:
          type: array
          items: { $ref: "#/components/schemas/NotificationPreference" }
    NotificationPreferenceRequest:
      type: object
      required: [level]
      additionalProperties: false
      properties:
        level: { type: string, enum: [all, mentions, none] }
        mute_until:
          type: string
          format: date-time
          description: Yalnızca `mentions` ya da `none` ile; en fazla bir yıl sonrası.

security:
  - bearer: []
  - cookie: []

    # --- arkadaşlık, davet, profil, hesap (#71) ---

    ActivityVisibility:
      type: string
      description: Katılım geçmişinin kime görüneceği.
      enum: [private, tayfa, public]
    Account:
      type: object
      required: [referral_code, activity_visibility]
      properties:
        referral_code:
          type: string
          description: Örn. `TYF-8K2M4Q`; paylaşım linki `tayfam.app/r/<kod>`.
        activity_visibility: { $ref: "#/components/schemas/ActivityVisibility" }
    AccountUpdate:
      type: object
      required: [activity_visibility]
      additionalProperties: false
      properties:
        activity_visibility: { $ref: "#/components/schemas/ActivityVisibility" }
    ReferralCode:
      type: object
      required: [referral_code]
      properties:
        referral_code: { type: string }
    ReferralLookupRequest:
      type: object
      required: [referral_code]
      additionalProperties: false
      properties:
        referral_code:
          type: string
          maxLength: 32
          description: "`TYF-` öneki ve büyük/küçük harf fark etmez."
    ReferredUser:
      type: object
      required: [user_id, display_name]
      properties:
        user_id: { type: string, format: uuid }
        display_name: { type: string }
        avatar_upload_id: { type: string, format: uuid }
    UserRef:
      type: object
      required: [user_id]
      additionalProperties: false
      properties:
        user_id: { type: string, format: uuid }
    Friend:
      type: object
      required: [user_id, display_name, state, requested_at]
      properties:
        user_id: { type: string, format: uuid }
        display_name: { type: string }
        avatar_upload_id: { type: string, format: uuid }
        state:
          type: string
          description: "`incoming`: size gelen istek; `outgoing`: sizin isteğiniz."
          enum: [friends, incoming, outgoing]
        requested_at: { type: string, format: date-time }
        accepted_at: { type: string, format: date-time }
    FriendList:
      type: object
      required: [friends]
      properties:
        friends:
          type: array
          items: { $ref: "#/components/schemas/Friend" }
        next_page_token: { type: string }
    BlockedUser:
      type: object
      required: [user_id, blocked_at]
      properties:
        user_id: { type: string, format: uuid }
        display_name:
          type: string
          description: Hesap silinmişse yoktur.
        avatar_upload_id: { type: string, format: uuid }
        blocked_at: { type: string, format: date-time }
    BlockedUserList:
      type: object
      required: [users]
      properties:
        users:
          type: array
          items: { $ref: "#/components/schemas/BlockedUser" }
        next_page_token: { type: string }
    Invitation:
      type: object
      required: [tayfa_id, tayfa_name, user_id, invited_at]
      properties:
        tayfa_id: { type: string, format: uuid }
        tayfa_name: { type: string }
        user_id:
          type: string
          format: uuid
          description: Davet edilen kişi.
        inviter_user_id:
          type: string
          format: uuid
          description: Davet edenin hesabı silinmişse yoktur.
        invited_at: { type: string, format: date-time }
    InvitationList:
      type: object
      required: [invitations]
      properties:
        invitations:
          type: array
          items: { $ref: "#/components/schemas/Invitation" }
        next_page_token: { type: string }
    UserProfile:
      type: object
      required: [user_id, display_name, self, mutual_tayfas, activity_visible]
      properties:
        user_id: { type: string, format: uuid }
        display_name: { type: string }
        avatar_upload_id: { type: string, format: uuid }
        self: { type: boolean }
        friend_state:
          type: string
          description: Aranızda arkadaşlık ya da istek yoksa alan yoktur.
          enum: [friends, incoming, outgoing]
        mutual_tayfas:
          type: array
          description: İkinizin de etkin üyesi olduğu tayfalar (en fazla 100); kendi profilinizde boş.
          items:
            type: object
            required: [id, name]
            properties:
              id: { type: string, format: uuid }
              name: { type: string }
        activity_visible:
          type: boolean
          description: Katılım geçmişinden size bir şey gösterilip gösterilemeyeceği.
        activity_visibility:
          $ref: "#/components/schemas/ActivityVisibility"
    ActivityRecord:
      type: object
      required: [event_type, mode, started_at, tayfa_member]
      properties:
        event_type: { $ref: "#/components/schemas/EventType" }
        mode: { type: string, enum: [in_person, online] }
        city: { type: string }
        district: { type: string }
        started_at: { type: string, format: date-time }
        tayfa_member:
          type: boolean
          description: Kaydın tayfasının etkin üyesisiniz; aşağıdaki alanlar yalnızca o zaman doludur.
        tayfa_id: { type: string, format: uuid }
        tayfa_name: { type: string }
        event_id:
          type: string
          format: uuid
          description: Etkinlik silinmişse yoktur.
        event_title: { type: string }
        duration_minutes: { type: integer }
    ActivityList:
      type: object
      required: [records]
      properties:
        records:
          type: array
          items: { $ref: "#/components/schemas/ActivityRecord" }
        next_page_token: { type: string }
