  # moderatörüne ve yöneticisine de) `author_id` olarak dönmez; yazar
  # yalnızca sorunun kendisinin olduğunu (`caller_is_author`) görür. Anonim
  # soru şikâyet edilirse (`event_question`) yazarı yalnızca platform
  # yönetimi görür. Soru metni log'a, denetim kaydına ve olaya yazılmaz.
  # Değişiklikler canlı güncellenir (`event.component_changed`).

  /v1/tayfas/{tayfa_id}/events/{event_id}/components/{component_key}/questions:
    parameters:
      - $ref: "#/components/parameters/TayfaID"
      - $ref: "#/components/parameters/EventID"
      - $ref: "#/components/parameters/ComponentKey"
    get:
      operationId: listEventQuestions
      summary: Bileşenin soruları
      description: |
        Her etkin üyeye açıktır (susturulmuş üye de okur); iptal edilmiş ve
        donmuş etkinlikte de okunur. Cevaplanmamışlar önce, sonra çok oy
        alan, sonra eski. Bileşen uçlarının ortak kuralları geçerlidir
        (`component-not-found`, `component-disabled`).
      responses:
        "200":
          description: Sorular
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EventQuestionList" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
    post:
      operationId: askEventQuestion
      summary: Soru sorar
      description: |
        Etkinliğe `going` cevabı vermiş ya da katılımı doğrulanmış olmalısınız
        (`event-not-going`); susturulmuş üye soramaz. Metin kırpılır, iç
        boşlukları teke indirilir; 1–500 karakter, denetim ve biçim
        karakteri olmadan (`invalid-request`, alan `body`). `anonymous`
        yalnızca bileşen izin veriyorsa (`anonymous_allowed`; alan
        `anonymous`). Kişi başına en fazla 20, bileşende en fazla 500 soru
        (`event-limit`). Aynı `client_request_id` ile tekrar gönderim ilk
        soruyu döndürür. Bitişten 7 gün sonra donar (`component-frozen`);
        iptal edilmiş etkinliğe yazılmaz.
      parameters:
        - $ref: "#/components/parameters/ClientHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EventQuestionCreateRequest" }
      responses:
        "201":
          description: Sorulan soru (ya da tekrar gönderimde ilk sorulan)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EventQuestion" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }

  /v1/tayfas/{tayfa_id}/events/{event_id}/components/{component_key}/questions/{question_id}:
    parameters:
      - $ref: "#/components/parameters/TayfaID"
      - $ref: "#/components/parameters/EventID"
      - $ref: "#/components/parameters/ComponentKey"
      - $ref: "#/components/parameters/QuestionID"
    delete:
      operationId: removeEventQuestion
      summary: Soruyu kaldırır
      description: |
        Kendi sorunuzu yazma penceresi içinde (`component-frozen`);
        moderatör ve yönetici herkesinkini, anonim soruyu da yazarını
        görmeden, her zaman (iptal edilmiş ve donmuş etkinlikte de). Soru 30
        gün sonra oylarıyla kalıcı silinir. Bilinmeyen soru
        `event-item-not-found`.
      parameters:
        - $ref: "#/components/parameters/ClientHeader"
      responses:
        "204": { description: Soru kaldırıldı }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }

  /v1/tayfas/{tayfa_id}/events/{event_id}/components/{component_key}/questions/{question_id}/vote:
