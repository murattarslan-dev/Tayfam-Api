            application/json:
              schema: { $ref: "#/components/schemas/PollVoterList" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }

  /v1/tayfas/{tayfa_id}/polls/{poll_id}/closure:
    parameters:
      - $ref: "#/components/parameters/TayfaID"
      - $ref: "#/components/parameters/PollID"
    post:
      operationId: closePoll
      summary: Anketi erken kapatır (açan; moderatör, yönetici)
      description: |
        Hiyerarşi silmedeki gibidir. Kapalı anket için de başarılıdır.
      parameters:
        - $ref: "#/components/parameters/ClientHeader"
      responses:
        "200":
          description: Kapanan anket
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Poll" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }

  # --- Etkinlikler (core EventService) ---
  #
  # Ortak kurallar: tayfanın etkinlik modülü kapalıysa okumalar dahil her uç
  # `module-disabled` alır. Bu tayfada olmayan ya da silinmiş etkinlik
  # `event-not-found`. İptal edilmiş etkinlikteki değişiklik
  # `event-cancelled`, bitmiş etkinlikteki `event-ended` alır.
  #
  # Konum: koordinatlar (WGS 84 derece) yalnızca istek gövdesinde taşınır,
  # hiçbir zaman URL'de değil; gateway onları log'a, hata ayrıntısına ve
  # erişim log'una yazmaz (ADR-0008).

  /v1/tayfas/{tayfa_id}/events:
    parameters:
      - $ref: "#/components/parameters/TayfaID"
    get:
      operationId: listUpcomingEvents
      summary: Bitmemiş etkinlikler, başlangıç zamanına göre
      description: |
        Her etkin üyeye açıktır (susturulmuş üye de okur). İptal edilenler
        de listededir. Türün alan değerleri (`fields`) listede dolmaz; tek
        etkinlik ucunu kullanın.
      parameters:
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/PageToken"
      responses:
        "200":
          description: Etkinlikler
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EventList" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
    post:
      operationId: createEvent
      summary: Etkinlik açar; açan kişi organizatördür
      description: |
        Moderatör ve yönetici; tayfada `members_can_create_events` açıksa
        her etkin üye. `starts_now` ile (Şimdi başlat) tayfanın
        `now_create_min_role` ayarı ve üstü (varsayılan her etkin üye).
        Aynı `client_request_id` ile tekrar gönderim ilk
        açılan etkinliği döndürür ve yeni etkinlik açmaz. `recurrence`
        verilirse etkinlik tekrarlayan bir serinin ilkidir; sunucu sonraki
        etkinlikleri sekiz hafta ileriye kadar kendisi açar.
      parameters:
        - $ref: "#/components/parameters/ClientHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EventCreateRequest" }
      responses:
        "201":
          description: Açılan etkinlik (ya da tekrar gönderimde ilk açılan)
          headers:
            Location:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Event" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }

  /v1/tayfas/{tayfa_id}/events/{event_id}:
    parameters:
      - $ref: "#/components/parameters/TayfaID"
      - $ref: "#/components/parameters/EventID"
    get:
      operationId: getEvent
      summary: Tek etkinlik, türe özel ayrıntılarıyla
      description: |
        Balık etkinliğinin av günlüğü ve mera gizliliği `log` bileşenindedir
        (`GET …/components/{component_key}/entries`, #243). Araçlar
        (ve plakalar) burada değildir; `vehicles` bileşenindedir
        (`GET …/components/{component_key}/vehicles`, #240). Kamp listesi
        `checklist` bileşenindedir (`GET …/components/{component_key}/items`,
        #241); kamp yeri, su, tuvalet ve notlar `fields`'tadır.
      responses:
        "200":
          description: Etkinlik
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Event" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
    patch:
      operationId: updateEvent
      summary: Etkinliği düzenler (organizatör, moderatör, yönetici)
      description: |
        Gövdede bulunan alanlar değişir; en az bir alan gerekir. Alanlar
        gruplar halinde değişir:
        - `starts_at` ve `ends_at` birlikte gönderilir.
        - Yer: `mode`, `meeting_point_name`, `meeting_point`, `city`,
          `district`, `online_url` birlikte değişir; bunlardan biri
          gönderilirse `mode` zorunludur ve gönderilmeyenler boşalır.
        - Türe özel ayrıntı yoktur (#243). Konvoyun
          rotası `route` bileşenindedir
          (`PUT …/components/{component_key}/route`); kampın ve yürüyüşün
          ayrıntıları `fields`'tadır, yürüyüşün beklenen dönüşü `roll_call`
          bileşenindedir
          (`PUT …/components/{component_key}/roll-call/expected-return`);
          balık etkinliğinin av günlüğü `log` bileşenindedir.

        Kapasiteyi artırmak bekleme listesindekileri sırayla `going` yapar.
        Seriye ait bir etkinlikte `apply_to_series` `false` (varsayılan) ise
        yalnızca bu etkinlik değişir ve seriden ayrılır (`series_override`);
        `true` ise serinin başlamamış, düzenlenmemiş bütün etkinliklerini ve
        ileride açılacakları değiştirir; seride zaman değişmez. Bitmiş seri
        `event-series-ended` alır.
      parameters:
        - $ref: "#/components/parameters/ClientHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EventUpdateRequest" }
      responses:
        "200":
          description: Güncel etkinlik
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Event" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }

  /v1/tayfas/{tayfa_id}/events/{event_id}/cancellation:
    parameters:
      - $ref: "#/components/parameters/TayfaID"
      - $ref: "#/components/parameters/EventID"
    post:
      operationId: cancelEvent
      summary: Etkinliği iptal eder (organizatör, moderatör, yönetici)
      description: |
        Etkinlik silinmez; üyeler onu iptal zamanı ve sebebiyle görmeye devam
        eder. Sonrasında katılım cevapları değişmez.
      parameters:
        - $ref: "#/components/parameters/ClientHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EventCancelRequest" }
      responses:
        "200":
          description: İptal edilen etkinlik
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Event" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }

  /v1/tayfas/{tayfa_id}/events/{event_id}/finish:
    parameters:
      - $ref: "#/components/parameters/TayfaID"
      - $ref: "#/components/parameters/EventID"
    post:
      operationId: finishEvent
      summary: Açık uçlu etkinliği bitirir (organizatör)
      description: |
        Şimdi başlat ile açılmış (`open_ended`) etkinlikte "Bitir"
        (ADR-0038 §1): `ends_at` sunucu saatiyle şimdi olur, `open_ended`
        `false` olur. Check-in, bileşenlerin yazma penceresi ve 7 günlük
        düzeltme penceresi yeni bitişten sayılır. Katılımcılara bildirim
        gitmez. Yalnızca organizatör; bitirilmeyen etkinlik başlangıçtan 12
        saat sonra kendiliğinden biter. Planlı etkinlik
        `event-not-open-ended`, bitmiş ya da bitirilmiş etkinlik
        `event-ended`, iptal edilmiş etkinlik `event-cancelled` alır.
      parameters:
        - $ref: "#/components/parameters/ClientHeader"
      responses:
        "200":
          description: Biten etkinlik
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Event" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }

  /v1/tayfas/{tayfa_id}/events/{event_id}/join-qr:
    parameters:
      - $ref: "#/components/parameters/TayfaID"
      - $ref: "#/components/parameters/EventID"
    post:
      operationId: createEventJoinQr
      summary: Etkinliğin QR'ı için kısa ömürlü katılım token'ı
      description: |
        QR ile katılım (ADR-0038 §3). Organizatör kendi etkinliği için,
        tayfanın yöneticileri her etkinlik için alır. Yalnızca yüz yüze ve
        bitmemiş etkinlik; çevrimiçi etkinlik `invalid-request`, bitmiş
        etkinlik `event-ended`, iptal edilmiş etkinlik `event-cancelled`
        alır. Token 128 bit rastgele değerdir ve yalnızca bu yanıtta
        döner; sunucu yalnızca özetini saklar. Ömrü 2 dakikadır
        (`expires_at`): istemci süre dolmadan yenisini ister; eski token
        süresi dolana kadar geçerli kalır. QR yalnızca token'ı taşır
        (`https://tayfam.app/q#<token>`, token fragment'ta). Etkinlik 30
        QR katılımına ulaştıysa `join-qr-limit-reached`. IP başına sınır
        vardır.
      parameters:
        - $ref: "#/components/parameters/ClientHeader"
      responses:
        "201":
          description: Yeni katılım token'ı
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JoinQrToken" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }

  /v1/tayfas/{tayfa_id}/events/{event_id}/calendar:
    parameters:
      - $ref: "#/components/parameters/TayfaID"
      - $ref: "#/components/parameters/EventID"
    get:
      operationId: exportEventCalendar
      summary: Etkinliği takvime eklemek için iCalendar (.ics) dosyası
      description: |
        RFC 5545. `UID` etkinlik kimliğidir; dosya tekrar içe aktarılırsa
        takvim kaydı güncellenir, iptal edilmiş etkinlik `STATUS:CANCELLED`
        taşır. Zamanlar UTC'dir. Koordinat, katılımcı, organizatör ya da
        plaka içermez; çevrimiçi etkinliğin linkini içerebilir, bu yüzden
        yanıt önbelleğe alınmaz (`Cache-Control: private, no-store`). Hata
        yanıtları `application/problem+json`'dur.
      responses:
        "200":
          description: iCalendar dosyası
          headers:
            Content-Disposition:
              description: '`attachment; filename="tayfam-<event_id>.ics"`'
              schema: { type: string }
            Cache-Control:
              schema: { type: string, enum: ["private, no-store"] }
          content:
            text/calendar:
              schema: { type: string }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }

  /v1/tayfas/{tayfa_id}/events/{event_id}/rsvp:
    parameters:
      - $ref: "#/components/parameters/TayfaID"
      - $ref: "#/components/parameters/EventID"
    put:
      operationId: setEventRsvp
      summary: Etkinliğe katılım cevabınızı verir
      description: |
        Dolu etkinlikte `going` bekleme listesine (`waitlist`) düşer;
        yanıttaki `status` kaydedilen cevaptır. Bir `going` cevabı
        değişince bekleme listesinin en eskisi `going` olur. Aynı cevabı
        tekrar vermek bir şey değiştirmez; bekleme listesindeyken `going`
        sıranızı korur.
      parameters:
        - $ref: "#/components/parameters/ClientHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RsvpRequest" }
      responses:
        "200":
          description: Kaydedilen cevap
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Rsvp" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }

  /v1/tayfas/{tayfa_id}/events/{event_id}/attendees:
    parameters:
      - $ref: "#/components/parameters/TayfaID"
      - $ref: "#/components/parameters/EventID"
    get:
      operationId: listEventAttendees
      summary: Bir cevaptaki katılımcılar, eskiden yeniye
      description: |
        `status=waitlist` için sıra bekleme sırasıdır. `attendance`
        doğrulanmış katılımı gösterir. Türü `sensitive_attendance`
        bayraklı etkinlikte (ADR-0037 §1, kan bağışı) listeyi yalnızca
        organizatör, moderatör ve yönetici alır; diğerleri
        `attendees-hidden` alır ve etkinlikteki sayıları görür.
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [going, maybe, not_going, waitlist]
            default: going
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/PageToken"
      responses:
        "200":
          description: Katılımcılar
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AttendeeList" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }

  /v1/tayfas/{tayfa_id}/events/{event_id}/attendees/{user_id}/attendance:
    parameters:
      - $ref: "#/components/parameters/TayfaID"
      - $ref: "#/components/parameters/EventID"
      - $ref: "#/components/parameters/UserID"
    put:
      operationId: confirmAttendance
      summary: Organizatör düzeltmesi — katılımı ekler
      description: |
        Organizatör kendi etkinliği için, moderatör ve yönetici her etkinlik
        için; iptal edilmemiş bir etkinliğin bitişinden sonraki yedi gün
        içinde (`correction-closed`). Kimse kendi katılımını düzeltemez
        (`permission-denied`). Kişi etkin üye olmalıdır (`member-not-found`).
        Her düzeltme denetim kaydına yazılır.
      parameters:
        - $ref: "#/components/parameters/ClientHeader"
      responses:
        "204": { description: Katılım eklendi }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
    delete:
      operationId: removeAttendance
      summary: Organizatör düzeltmesi — sahte katılımı kaldırır
      description: Ekleme ile aynı kurallar; kişinin katılım geçmişi kaydı silinir.
      parameters:
        - $ref: "#/components/parameters/ClientHeader"
      responses:
        "204": { description: Katılım kaldırıldı }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }

  /v1/tayfas/{tayfa_id}/events/{event_id}/check-in:
    parameters:
      - $ref: "#/components/parameters/TayfaID"
      - $ref: "#/components/parameters/EventID"
    post:
      operationId: checkInToEvent
      summary: Katılımınızı doğrular (konumla check-in ya da "Katıldım")
      description: |
        Pencere başlangıçtan 30 dakika önce açılır, bitişte kapanır
        (`check-in-closed`); `going` cevabı gerekir (`event-not-going`).

        Yüz yüze etkinlikte `location` zorunludur ve buluşma noktasına en
        fazla 300 m olmalıdır (`check-in-too-far`; uzaklık hiçbir yanıtta
        söylenmez). Etkinlik başına başarısızlar dahil en fazla beş deneme
        sayılır (`check-in-attempts-exhausted`, core). Ayrıca IP başına
        sınır vardır (`rate-limited`, gateway). Konum yalnızca uzaklık
        kontrolünde kullanılır: saklanmaz, log'a yazılmaz, geri dönmez.

        Çevrimiçi etkinlikte `location` gönderilmez; `going` cevabı
        başlangıçtan önce verilmiş olmalıdır.

        Başarılı check-in'den sonra tekrar denemek bir şey değiştirmez ve
        deneme saymaz. Susturulmuş üye de check-in yapabilir.
      parameters:
        - $ref: "#/components/parameters/ClientHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CheckInRequest" }
      responses:
        "200":
          description: Katılım doğrulandı
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CheckIn" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }

  /v1/tayfas/{tayfa_id}/events/{event_id}/photos:
    parameters:
      - $ref: "#/components/parameters/TayfaID"
      - $ref: "#/components/parameters/EventID"
    get:
      operationId: listEventPhotos
      summary: Etkinlik albümü, eskiden yeniye
      description: |
        Tayfanın her aktif üyesi okur (susturulmuşken ve iptal edilmiş
        etkinlikte de). Yanıt link taşımaz: fotoğrafların linkleri
        `POST /v1/media/urls` ile alınır (bir sayfa tek çağrıya sığar).
      parameters:
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/PageToken"
      responses:
        "200":
          description: Albüm fotoğrafları
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EventPhotoList" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
    post:
      operationId: addEventPhoto
      summary: Albüme fotoğraf ekler
      description: |
        Önce `POST /v1/uploads` ile `event_photo` amaçlı, bu tayfa için
        bir yükleme açılıp tamamlanır; burada albüme bağlanır. Katılımınız
        doğrulanmış olmalıdır (`not-attended`). Albüm etkinliğin
        başlangıcından bitişten sonraki yedi günün sonuna kadar açıktır
        (`album-closed`); iptal edilmiş etkinlikte kapalıdır
        (`event-cancelled`). Kişi başı 30, albüm başına 500 fotoğraf
        (`event-limit`; silinenler sayılmaz). Aynı `client_request_id` ile
        tekrar gönderim ilk fotoğrafı döndürür. Fotoğraf bildirim üretmez.
        Türü `album_notice` bayraklı etkinlikte (ADR-0037 §1, ziyaret)
        `consent_ack: true` zorunludur; yoksa `album-consent-required`.
      parameters:
        - $ref: "#/components/parameters/ClientHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EventPhotoCreateRequest" }
      responses:
        "201":
          description: Eklenen fotoğraf (ya da tekrar gönderimde ilk eklenen)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EventPhoto" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }

  /v1/tayfas/{tayfa_id}/events/{event_id}/photos/{photo_id}:
    parameters:
      - $ref: "#/components/parameters/TayfaID"
      - $ref: "#/components/parameters/EventID"
      - name: photo_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    delete:
      operationId: removeEventPhoto
      summary: Albümden fotoğraf kaldırır
      description: |
        Kendi fotoğrafınızı (susturulmuşken de); organizatör kendi
        etkinliğinin, moderatör ve yönetici her etkinliğin her fotoğrafını.
        Dosya 30 gün sonra kalıcı olarak silinir.
      parameters:
        - $ref: "#/components/parameters/ClientHeader"
      responses:
        "204": { description: Fotoğraf kaldırıldı }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }

  # --- Etkinlik bileşenleri: çerçeve (core EventComponentService, #238, ADR-0025 §4–§6, ADR-0037 §2) ---
  # Her bileşenin kendi uçları bu bölümün altına, kendi başlığıyla eklenir:
  # /v1/tayfas/{tayfa_id}/events/{event_id}/components/{component_key}/…

  /v1/tayfas/{tayfa_id}/events/{event_id}/components:
    parameters:
      - $ref: "#/components/parameters/TayfaID"
      - $ref: "#/components/parameters/EventID"
    get:
      operationId: listEventComponents
      summary: Etkinliğin bileşenleri ve organizatörün seçimleri
      description: |
        Etkinliğin tür sürümündeki her bileşen, tanımdaki sırayla ve bu
        etkinlikteki haliyle: açık mı (`optional` bileşeni organizatör
        açıp kapatır) ve organizatöre bırakılan (`organizer_choice`) her
        parametrede geçerli seçenek (ADR-0037 §2). Bileşenin diğer
        parametreleri ve adı tür tanımındadır (`CatalogComponent`). Her
        etkin üyeye açıktır (susturulmuş üye de okur).

        **Bileşen uçlarının ortak kuralları** (her bileşenin
        `…/components/{component_key}/…` uçları için): etkinliğin tür
        sürümünde o anahtarla bir bileşen yoksa ya da bileşen ucun türünden
        değilse `component-not-found`; kapalı bileşenin bütün uçları
        (okuma dahil) `component-disabled`; iptal edilmiş etkinlikte yazma
        `event-cancelled`, salt okunur tayfada `tayfa-read-only`;
        etkinliğin bitiminden 7 gün sonra bileşen verisi donar
        (`component-frozen`, ADR-0025 §5). "Organizatör" yetkisi etkinliği
        açana ve her etkinlikte olduğu gibi moderatör ve yöneticilere
        aittir; hakemler `…/referees` ile atanır.

        **Canlı güncelleme:** bir bileşen, seçimler ya da hakemler
        değişince etkinliği izleyen bağlantılara `event.component_changed`
        çerçevesi gider (`GET /v1/realtime`, `event.watch`); istemci
        bileşeni REST'ten yeniden çeker.
      responses:
        "200":
          description: Bileşenler
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EventComponentList" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }

  /v1/tayfas/{tayfa_id}/events/{event_id}/components/{component_key}:
    parameters:
      - $ref: "#/components/parameters/TayfaID"
      - $ref: "#/components/parameters/EventID"
      - $ref: "#/components/parameters/ComponentKey"
    put:
      operationId: setEventComponent
      summary: Organizatörün bir bileşen için seçimini değiştirir
      description: |
        `optional` bileşeni açar ya da kapatır ve organizatöre bırakılan
        parametrelerde seçenek belirler (ADR-0037 §2). Gövdede en az biri
        bulunur; gönderilmeyen seçim olduğu gibi kalır. Organizatör,
        moderatör ve yönetici; yalnızca etkinlik **başlamadan önce**
        (`component-locked`). `optional` olmayan bileşeni kapatmak,
        organizatöre bırakılmamış bir parametre ya da listede olmayan bir
        seçenek `invalid-request`. Seriye ait etkinlikte yalnızca bu
        etkinlik değişir. Yeni etkinlikte seçimler `POST …/events`
        gövdesindeki `components` ile verilir.
      parameters:
        - $ref: "#/components/parameters/ClientHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EventComponentSelectionRequest" }
      responses:
        "200":
          description: Etkinliğin bileşenleri, güncel haliyle
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EventComponentList" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }

  /v1/tayfas/{tayfa_id}/events/{event_id}/referees:
    parameters:
      - $ref: "#/components/parameters/TayfaID"
      - $ref: "#/components/parameters/EventID"
    get:
      operationId: listEventReferees
      summary: Etkinliğin hakemleri
      description: Atama sırasıyla. Her etkin üyeye açıktır.
      responses:
        "200":
          description: Hakem atamaları
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EventRefereeList" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
    post:
      operationId: assignEventReferee
      summary: Hakem atar
      description: |
        Tayfanın etkin bir üyesini etkinliğin tamamına, bir bileşenine
        (`component_key`) ya da bileşenin bir kapsamına (`scope_id`: masa,
        maç) hakem yapar. Hakem, organizatörle birlikte sonuç girer
        (ADR-0025 §5). Organizatör, moderatör ve yönetici. Aynı atama
        tekrar gönderilirse ilk atama döner. Etkinlik başına en fazla 50
        atama (`event-limit`). Etkin üye olmayan kişi `member-not-found`.
      parameters:
        - $ref: "#/components/parameters/ClientHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EventRefereeAssignRequest" }
      responses:
        "201":
          description: Atama (ya da tekrar gönderimde ilk atama)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EventReferee" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }

  /v1/tayfas/{tayfa_id}/events/{event_id}/referees/{referee_id}:
    parameters:
      - $ref: "#/components/parameters/TayfaID"
      - $ref: "#/components/parameters/EventID"
      - name: referee_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    delete:
      operationId: removeEventReferee
      summary: Hakem atamasını kaldırır
      description: Organizatör, moderatör ve yönetici. Olmayan atamayı kaldırmak hata değildir.
      parameters:
        - $ref: "#/components/parameters/ClientHeader"
      responses:
        "204": { description: Atama kaldırıldı }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }

  # --- Etkinlik bileşenleri: rota (`route`; core RouteComponentService, #239, ADR-0025 §4) ---
  # Güzergâh sıralı nokta dizisidir. Organizatörün bilerek paylaştığı
  # içeriktir (ADR-0008); noktalar yalnızca gövdede taşınır, log'a yazılmaz.

  /v1/tayfas/{tayfa_id}/events/{event_id}/components/{component_key}/route:
    parameters:
      - $ref: "#/components/parameters/TayfaID"
      - $ref: "#/components/parameters/EventID"
      - $ref: "#/components/parameters/ComponentKey"
    get:
      operationId: getEventRoute
      summary: Etkinliğin rotası
      description: |
        Rota yoksa `points` boş dizidir ve `updated_at` yoktur. Her etkin
        üyeye açıktır (susturulmuş üye de okur); iptal edilmiş ve donmuş
        etkinlikte de okunur. Bileşen uçlarının ortak kuralları geçerlidir
        (`component-not-found`, `component-disabled`).
      responses:
        "200":
          description: Rota
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EventRoute" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
    put:
      operationId: setEventRoute
      summary: Rotayı yazar ya da kaldırır (organizatör, moderatör, yönetici)
      description: |
        Rotanın tamamı değişir: 2–500 nokta. Boş `points` rotayı kaldırır;
        olmayan rotayı kaldırmak hata değildir. Etkinlik başladıktan ve
        bittikten sonra da değişir; bitişten 7 gün sonra donar
        (`component-frozen`). Seriye ait etkinlikte yalnızca bu etkinlik
        değişir. Bileşen uçlarının ortak kuralları geçerlidir.
      parameters:
        - $ref: "#/components/parameters/ClientHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EventRouteRequest" }
      responses:
        "200":
          description: Rota, güncel haliyle
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EventRoute" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }

  # --- Etkinlik bileşenleri: araçlar ve koltuk paylaşımı (`vehicles`; core VehiclesComponentService, #240, ADR-0025 §4, ADR-0037 §3) ---
  # Katılımcıların araçları (kişi başına bir araç) ve bileşenin `seats`
  # parametresi açıksa boş koltuklar ile koltuk istekleri. Para ya da masraf
  # alanı yoktur. Plaka kişisel veridir; yalnızca gövdede taşınır, log'a
  # yazılmaz. Yazan her uç bileşenin araçlarını güncel haliyle döner.

  /v1/tayfas/{tayfa_id}/events/{event_id}/components/{component_key}/vehicles:
    parameters:
      - $ref: "#/components/parameters/TayfaID"
      - $ref: "#/components/parameters/EventID"
      - $ref: "#/components/parameters/ComponentKey"
    get:
      operationId: listEventVehicles
      summary: Etkinliğin araçları
      description: |
        Araçlar eklenme sırasıyladır. Her etkin üyeye açıktır (susturulmuş
        üye de okur); iptal edilmiş ve donmuş etkinlikte de okunur. Plaka
        yalnızca katılımcılara (`going`), organizatöre ve aracın sahibine
        döner. Bekleyen koltuk isteklerini aracın sahibi görür; başkası
        yalnızca kendi isteğini görür. Bileşen uçlarının ortak kuralları
        geçerlidir (`component-not-found`, `component-disabled`).
      responses:
        "200":
          description: Bileşenin araçları, güncel haliyle
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EventVehicles" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }

  /v1/tayfas/{tayfa_id}/events/{event_id}/components/{component_key}/vehicles/mine:
    parameters:
      - $ref: "#/components/parameters/TayfaID"
      - $ref: "#/components/parameters/EventID"
      - $ref: "#/components/parameters/ComponentKey"
    put:
      operationId: setEventVehicle
      summary: Aracınızı yazar; önceki aracınızın yerini alır
      description: |
        Yalnızca `going` cevabıyla (`event-not-going`) ve etkinlik bitene
        kadar (`event-ended`). Aracın kimliği değişmez. `plate` yalnızca
        bileşenin `plate` parametresi açıksa, sıfırdan büyük `seats`
        yalnızca `seats` parametresi açıksa kabul edilir (`plate_enabled`,
        `seats_enabled`). Koltuk sayısı onaylanmış yolcu sayısının altına
        inemez (`vehicle-seats-taken`). Araç yazan kişinin başka bir araca
        yazdığı koltuk isteği silinir. Bileşen uçlarının ortak kuralları
        geçerlidir.
      parameters:
        - $ref: "#/components/parameters/ClientHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EventVehicleRequest" }
      responses:
        "200":
          description: Bileşenin araçları, güncel haliyle
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EventVehicles" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }

  /v1/tayfas/{tayfa_id}/events/{event_id}/components/{component_key}/vehicles/{vehicle_id}:
    parameters:
      - $ref: "#/components/parameters/TayfaID"
      - $ref: "#/components/parameters/EventID"
      - $ref: "#/components/parameters/ComponentKey"
      - $ref: "#/components/parameters/VehicleID"
    delete:
      operationId: removeEventVehicle
      summary: Aracı, ona yazılmış koltuk istekleriyle birlikte çıkarır
      description: |
        Kendi aracınızı (susturulmuş olsanız da); organizatör, moderatör ve
        yönetici her aracı. Bilinmeyen araç `event-item-not-found`. İptal
        edilmiş ve donmuş etkinlikte çıkarılamaz (`event-cancelled`,
        `component-frozen`); plaka etkinlik bitiminden 30 gün sonra
        kendiliğinden silinir. Bileşen uçlarının ortak kuralları geçerlidir.
      parameters:
        - $ref: "#/components/parameters/ClientHeader"
      responses:
        "200":
          description: Bileşenin araçları, güncel haliyle
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EventVehicles" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }

  /v1/tayfas/{tayfa_id}/events/{event_id}/components/{component_key}/vehicles/{vehicle_id}/seat-requests/mine:
    parameters:
      - $ref: "#/components/parameters/TayfaID"
      - $ref: "#/components/parameters/EventID"
      - $ref: "#/components/parameters/ComponentKey"
      - $ref: "#/components/parameters/VehicleID"
    put:
      operationId: requestEventVehicleSeat
      summary: Bu araçla gelmek için koltuk ister
      description: |
        Yalnızca `going` cevabıyla (`event-not-going`), etkinlik bitene kadar
        (`event-ended`) ve bileşende kendi aracı olmayan için
        (`seat-request-driver`). Araçta boş koltuk yoksa ya da bileşenin
        `seats` parametresi kapalıysa `vehicle-full`. Kişinin bileşende tek
        isteği vardır; başka araca istek öncekinin (onaylanmış olsa da)
        yerini alır, aynı isteği yinelemek hiçbir şey değiştirmez. İstek
        araç sahibinin onayını bekler. Gövde yoktur.
      parameters:
        - $ref: "#/components/parameters/ClientHeader"
      responses:
        "200":
          description: Bileşenin araçları, güncel haliyle
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EventVehicles" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }

  /v1/tayfas/{tayfa_id}/events/{event_id}/components/{component_key}/vehicles/{vehicle_id}/seat-requests/{user_id}:
    parameters:
      - $ref: "#/components/parameters/TayfaID"
      - $ref: "#/components/parameters/EventID"
      - $ref: "#/components/parameters/ComponentKey"
      - $ref: "#/components/parameters/VehicleID"
      - $ref: "#/components/parameters/UserID"
    delete:
      operationId: releaseEventVehicleSeat
      summary: Koltuk isteğini (bekleyen ya da onaylanmış) kaldırır
      description: |
        İsteyen kişi kendi isteğini geri çeker (susturulmuş olsa da); araç
        sahibi isteği reddeder ya da yolcuyu çıkarır; organizatör, moderatör
        ve yönetici her isteği kaldırır. Araç ya da bu kişinin o araca isteği
        yoksa `event-item-not-found`. Bileşen uçlarının ortak kuralları
        geçerlidir.
      parameters:
        - $ref: "#/components/parameters/ClientHeader"
      responses:
        "200":
          description: Bileşenin araçları, güncel haliyle
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EventVehicles" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }

  /v1/tayfas/{tayfa_id}/events/{event_id}/components/{component_key}/vehicles/{vehicle_id}/seat-requests/{user_id}/approval:
    parameters:
      - $ref: "#/components/parameters/TayfaID"
      - $ref: "#/components/parameters/EventID"
      - $ref: "#/components/parameters/ComponentKey"
      - $ref: "#/components/parameters/VehicleID"
      - $ref: "#/components/parameters/UserID"
    put:
      operationId: approveEventVehicleSeat
      summary: Aracınıza yazılmış koltuk isteğini onaylar (yalnızca araç sahibi)
      description: |
        Onaylanmış isteği yeniden onaylamak hiçbir şey değiştirmez. Boş
        koltuk kalmadıysa `vehicle-full`; etkinlik bittiyse `event-ended`.
        Araç ya da bu kişinin o araca isteği yoksa `event-item-not-found`.
        Gövde yoktur. Bileşen uçlarının ortak kuralları geçerlidir.
      parameters:
        - $ref: "#/components/parameters/ClientHeader"
      responses:
        "200":
          description: Bileşenin araçları, güncel haliyle
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EventVehicles" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }

  # --- Etkinlik bileşenleri: liste (`checklist`; core ChecklistComponentService, #241, ADR-0025 §4, §5) ---
  # Kim ne getiriyor, yapıyor, hangi bölümü alıyor. Bir etkinlikte birden çok
  # liste olabilir (tanımdaki `key`: `gear`, `duty` …). Maddeyi organizatör,
  # moderatör ve yönetici ekler ve çıkarır; bileşenin `assignment`
  # parametresi açıksa `going` cevabı vermiş üye boştaki maddeyi üstlenir.
  # Kampın Faz 1 malzeme listesi `gear` anahtarlı listedir. Yazan her uç
  # listeyi güncel haliyle döner.

  /v1/tayfas/{tayfa_id}/events/{event_id}/components/{component_key}/items:
    parameters:
      - $ref: "#/components/parameters/TayfaID"
      - $ref: "#/components/parameters/EventID"
      - $ref: "#/components/parameters/ComponentKey"
    get:
      operationId: listChecklist
      summary: Listenin maddeleri
      description: |
        Maddeler eklenme sırasıyladır. Her etkin üyeye açıktır (susturulmuş
        üye de okur); iptal edilmiş ve donmuş etkinlikte de okunur. Bileşen
        uçlarının ortak kuralları geçerlidir (`component-not-found`,
        `component-disabled`).
      responses:
        "200":
          description: Liste, güncel haliyle
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Checklist" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
