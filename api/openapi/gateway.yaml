        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }

  # --- Etkinlik bileşenleri: eşleşme ağacı (`bracket`; core BracketComponentService, #251, ADR-0025 §4–§6, ADR-0037 §3) ---
  # Etkinliğin kurasından tohumlanan turnuva; canlı güncellenir
  # (`event.component_changed`). Biçim (`format`: eleme, lig, İsviçre) ve
  # maç başına oyun (`best_of`: 1, 3, 5) bileşen parametresidir (tanım
  # bırakıyorsa organizatörün seçimi). Maç oyun oyun yazboz kuralıyla
  # skorlanır: türün ilk yazboz bileşeni oyunun puanla (yüksek ya da düşük
  # kazanır) mı galibiyet/beraberlik/mağlubiyetle (`wdl`) mi oynandığını
  # söyler. Kurallar turnuva başlarken saklanır. Katılımcılar türün ilk kura
  # bileşeninin yerleridir (kura çekilmiş olmalı); maçlar yerleri adlandırır,
  # kişi ya da takım kuradan okunur. Eleme: 1. tur kuradaki yerleri sırayla
  # eşler (boş ya da tek kalan son yer bay geçer), sonraki tur kazananları
  # sırayla; berabere biten eleme maçı ek oyunla sürer. Lig: herkes herkesle
  # bir kez; tüm turlar başlangıçta eşlenir. İsviçre: ⌈log2 n⌉ tur; sonraki
  # tur sıralamayı yukarıdan aşağı, rövanşsız eşler; bay (galibiyet sayılır)
  # henüz bay geçmemiş en alttakine. Lig ve İsviçre sıralaması: puan
  # (galibiyet 1, beraberlik ½, bay 1) → aralarındaki maç → Buchholz;
  # rating/ELO yok. Başlatma, sonraki turu eşleme, düzeltme ve sıfırlama
  # organizatör, moderatör ve yöneticinin; oyun girme ayrıca maça, bileşene
  # ya da etkinliğe atanmış hakemin. Oyunlar etkinlik başladıktan sonra
  # girilir (`score-not-started`); her yazma bitişten 7 gün sonra kapanır
  # (`component-frozen`). Turnuva katılımdır, seri örneğine kopyalanmaz.

  /v1/tayfas/{tayfa_id}/events/{event_id}/components/{component_key}/bracket:
    parameters:
      - $ref: "#/components/parameters/TayfaID"
      - $ref: "#/components/parameters/EventID"
      - $ref: "#/components/parameters/ComponentKey"
    get:
      operationId: getEventBracket
      summary: Etkinliğin eşleşme ağacı
      description: |
        Her etkin üyeye açıktır (susturulmuş üye de okur); iptal edilmiş ve
        donmuş etkinlikte de okunur. Başlamamışsa `started` false; kurallar
        ve kuranın alanları başlatılırsa alınacak olanlardır. Bileşen
        uçlarının ortak kuralları geçerlidir (`component-not-found`,
        `component-disabled`).
      responses:
        "200":
          description: Eşleşme ağacı
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EventBracket" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
    post:
      operationId: startEventBracket
      summary: Eşleşme ağacını başlatır (organizatör, moderatör, yönetici)
      description: |
        Gövde almaz. Kuradan ilk turu (ligde tüm turları) eşler. Başlamışsa
        `bracket-started`; kura çekilmemişse ya da türde kura yoksa
        `bracket-draw-required`; kurada ikiden az dolu yer varsa
        `bracket-too-few`; elemede 128 yerden, ligde 20 ve İsviçre'de 64
        katılımcıdan fazlası `event-limit`. Bileşen uçlarının ortak
        kuralları geçerlidir.
      parameters:
        - $ref: "#/components/parameters/ClientHeader"
      responses:
        "200":
          description: Başlatılan eşleşme ağacı
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EventBracket" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
    delete:
      operationId: resetEventBracket
      summary: Eşleşme ağacını sıfırlar (organizatör, moderatör, yönetici)
      description: |
        Maçları, oyunları ve maçlara atanmış hakemleri siler; kura kalır.
        Başlamamışsa `bracket-not-started`. Bileşen uçlarının ortak
        kuralları geçerlidir.
      parameters:
        - $ref: "#/components/parameters/ClientHeader"
      responses:
        "200":
          description: Sıfırlanan eşleşme ağacı (başlamamış haliyle)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EventBracket" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }

  /v1/tayfas/{tayfa_id}/events/{event_id}/components/{component_key}/bracket/rounds:
    parameters:
      - $ref: "#/components/parameters/TayfaID"
      - $ref: "#/components/parameters/EventID"
      - $ref: "#/components/parameters/ComponentKey"
    post:
      operationId: pairEventBracketRound
      summary: Sonraki turu eşler (organizatör, moderatör, yönetici)
      description: |
        Gövde almaz. Elemede ve İsviçre'de, mevcut turun tüm maçları
        sonuçlanınca sonraki turu eşler. Sonuçlanmamış maç varsa
        `bracket-round-open`; sonraki tur yoksa (ligde turların hepsi
        başlangıçta eşlenir) `bracket-finished`; başlamamışsa
        `bracket-not-started`. Bileşen uçlarının ortak kuralları geçerlidir.
      parameters:
        - $ref: "#/components/parameters/ClientHeader"
      responses:
        "200":
