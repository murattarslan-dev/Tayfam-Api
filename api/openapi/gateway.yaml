        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
    post:
      operationId: createAnnouncement
      summary: Duyuru yayınlar (moderatör, yönetici)
      description: |
        Aynı `client_request_id` ile tekrar gönderilen istek yeni duyuru
        açmaz, ilk duyuruyu döndürür.
      parameters:
        - $ref: "#/components/parameters/ClientHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AnnouncementCreateRequest" }
      responses:
