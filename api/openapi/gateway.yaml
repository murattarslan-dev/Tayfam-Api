        "200":
          description: iCalendar dosyası
          headers:
            Content-Disposition:
              description: '`attachment; filename="tayfam-<event_id>.ics"`'
              schema: { type: string }
            Cache-Control:
              schema: { type: string, enum: ["private, no-store"] }
          content:
            text/calendar:
              schema: { type: string }
