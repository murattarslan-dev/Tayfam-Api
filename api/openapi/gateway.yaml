          description: Kanallar
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChannelList" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
    post:
      operationId: createChannel
      summary: Kanal açar (yönetici ve moderatör)
      description: |
        İsim 1–40 karakterdir; arşivlenmemiş kanallar arasında Türkçe büyük/
        küçük harf duyarsız tekildir (`channel-name-taken`). Susturulmuş
        yönetim kanal açamaz (`muted`).
      parameters:
        - $ref: "#/components/parameters/ClientHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChannelCreateRequest" }
      responses:
        "201":
          description: Kanal
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Channel" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }

  /v1/tayfas/{tayfa_id}/channels/{channel_id}:
    parameters:
      - $ref: "#/components/parameters/TayfaID"
      - $ref: "#/components/parameters/ChannelID"
    get:
      operationId: getChannel
      summary: Bir kanal
      description: |
        Başka tayfanın kanalı ve üyeye `staff` kanalı, olmayan kanalla aynı
        cevabı alır (`channel-not-found`).
      responses:
        "200":
          description: Kanal
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Channel" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
    patch:
      operationId: updateChannel
      summary: Kanalın adını, görünürlüğünü ya da yavaş modunu değiştirir
      description: Yalnızca gönderilen alanlar değişir; en az biri gerekir. Yönetici ve moderatör.
      parameters:
        - $ref: "#/components/parameters/ClientHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChannelUpdateRequest" }
      responses:
        "200":
          description: Kanal
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Channel" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }

  /v1/tayfas/{tayfa_id}/channels/{channel_id}/archive:
    parameters:
      - $ref: "#/components/parameters/TayfaID"
      - $ref: "#/components/parameters/ChannelID"
    put:
      operationId: archiveChannel
      summary: Kanalı arşivler (salt okunur)
      description: Arşivli kanala mesaj yazılamaz; okuma ve moderasyon sürer. Yönetici ve moderatör.
      parameters:
        - $ref: "#/components/parameters/ClientHeader"
      responses:
        "200":
          description: Kanal
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Channel" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
    delete:
      operationId: unarchiveChannel
      summary: Kanalı arşivden çıkarır
      description: Arada aynı isimde kanal açıldıysa `channel-name-taken`.
      parameters:
        - $ref: "#/components/parameters/ClientHeader"
      responses:
        "200":
          description: Kanal
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Channel" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }

  /v1/tayfas/{tayfa_id}/channels/{channel_id}/messages:
    parameters:
      - $ref: "#/components/parameters/TayfaID"
      - $ref: "#/components/parameters/ChannelID"
    get:
      operationId: listChannelMessages
      summary: Kanal mesajları
      description: |
        `after_message_id` yoksa en yeni önce, `next_page_token` eskiye
        doğru gider. `after_message_id` (elinizdeki son mesaj) verilirse
        ondan yeni mesajlar en eski önce gelir ve `next_page_token` yeniye
        doğru gider: yeniden bağlanınca eksikler böyle tamamlanır (ADR-0005).
        Silinen mesaj yerinde `deleted: true` ve metinsiz durur ("Bu mesaj
        silindi").
      parameters:
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/PageToken"
        - name: after_message_id
          in: query
          required: false
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Mesajlar
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChannelMessageList" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
    post:
      operationId: sendChannelMessage
      summary: Kanala mesaj yazar
      description: |
        Metin 1–4000 karakter, yalnız boşluk olamaz; sekme ve satır sonu
        dışında kontrol karakteri içeremez. Aynı `client_request_id` ile
        tekrar gönderim ilk mesajı döndürür, yeni mesaj yazmaz (yavaş moda da
        takılmaz); başka kanalda kullanılmış değer `invalid-request`.
        Susturulmuşsanız `muted`, kanal arşivliyse `channel-archived`. Yavaş
        modda erken gönderim `slow-mode` (429) ve `Retry-After` başlığını
        (saniye) alır; yönetici ve moderatörler muaftır. Mesaj düzenlenemez.
        Aynı kurallar WebSocket gönderiminde de geçerlidir.
      parameters:
        - $ref: "#/components/parameters/ClientHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChannelMessageCreateRequest" }
      responses:
        "201":
          description: Mesaj (tekrar gönderimde ilk mesaj)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChannelMessage" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "429":
          description: Yavaş mod (`slow-mode`)
          headers:
            Retry-After:
              description: Tekrar denemeden önce beklenecek saniye.
              schema: { type: integer, minimum: 1, maximum: 3600 }
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "503": { $ref: "#/components/responses/Problem" }

  /v1/tayfas/{tayfa_id}/channels/{channel_id}/messages/{message_id}:
    parameters:
      - $ref: "#/components/parameters/TayfaID"
      - $ref: "#/components/parameters/ChannelID"
      - $ref: "#/components/parameters/MessageID"
    delete:
      operationId: deleteChannelMessage
      summary: Mesajı siler
      description: |
        Kendi mesajınızı silerseniz metin hemen ve geri alınamaz biçimde
        silinir. Yönetici ve moderatörler başkasının mesajını gizler; yazarın
        güncel rolü sizinkine eşit ya da yüksekse `role-hierarchy` (403;
        tayfadan ayrılmış yazar sınırlamaz). Yönetici 30 gün içinde geri
        alabilir, sonra kalıcı silinir. Silinmiş mesajı silmek bir şey
        değiştirmez.
      parameters:
        - $ref: "#/components/parameters/ClientHeader"
      responses:
        "204": { description: Silindi }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }

  /v1/tayfas/{tayfa_id}/channels/{channel_id}/messages/{message_id}/restoration:
    parameters:
      - $ref: "#/components/parameters/TayfaID"
      - $ref: "#/components/parameters/ChannelID"
      - $ref: "#/components/parameters/MessageID"
    post:
      operationId: restoreChannelMessage
      summary: Moderasyonla gizlenen mesajı geri alır (yönetici)
      description: |
        30 gün içinde, yazarın güncel rolünün üstündeyseniz (`role-hierarchy`).
        Yazarın kendi silmesi ve daha eskisi `message-not-found` alır. Görünür mesajı geri almak bir şey
        değiştirmez. Her geri alma kayıt altına alınır.
      parameters:
        - $ref: "#/components/parameters/ClientHeader"
      responses:
        "200":
          description: Mesaj
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChannelMessage" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }

  /v1/tayfas/{tayfa_id}/channels/{channel_id}/read:
    parameters:
      - $ref: "#/components/parameters/TayfaID"
      - $ref: "#/components/parameters/ChannelID"
    put:
      operationId: markChannelRead
      summary: Kanalı bu mesaja kadar okundu işaretler
      description: |
        Okundu işareti yalnızca ileri gider; daha eski bir mesaj bir şey
        değiştirmez. Mesaj bu kanalda olmalıdır (`message-not-found`).
        Susturulmuş üyeler de işaretleyebilir.
      parameters:
        - $ref: "#/components/parameters/ClientHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChannelReadRequest" }
      responses:
        "204": { description: Okundu }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }

  /v1/notifications:
    get:
      operationId: listNotifications
      summary: Bildirimlerinizi listeler (uygulama içi, en yeni önce)
      description: |
        Yalnızca kendi bildirimleriniz. Bildirim içerik metni taşımaz:
        tür, tayfa, işlemi yapan ve hedefin kimliği vardır; istemci içeriği
        ilgili uçtan (duyuru, etkinlik, cevap…) çeker. Yalnızca etkin
        üyesi olduğunuz tayfaların bildirimleri üretilir; kendi yaptığınız
        işlem için bildirim gelmez. Sessize aldığınız tayfanın bildirimleri
        de listede görünür. Bildirimler 90 gün saklanır.
      parameters:
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/PageToken"
      responses:
        "200":
          description: Bildirimler
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotificationList" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }

  /v1/notifications/unread-count:
    get:
      operationId: getUnreadNotificationCount
      summary: Okunmamış bildirim sayısı (en fazla 1000)
      responses:
        "200":
          description: Okunmamış sayısı
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UnreadNotificationCount" }
        "401": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }

  /v1/notifications/read-all:
    post:
      operationId: markAllNotificationsRead
      summary: Tüm bildirimlerinizi okundu işaretler
      parameters:
        - $ref: "#/components/parameters/ClientHeader"
      responses:
        "204": { description: Okundu }
        "401": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }

  /v1/notifications/{notification_id}/read:
    parameters:
      - $ref: "#/components/parameters/NotificationID"
    put:
      operationId: markNotificationRead
      summary: Bir bildirimi okundu işaretler
      description: |
        Tekrar çağrılırsa ilk okunma zamanı korunur. Başka bir kullanıcının
        bildirimi, olmayan bir bildirimle aynı cevabı alır
        (`notification-not-found`).
      parameters:
        - $ref: "#/components/parameters/ClientHeader"
      responses:
        "204": { description: Okundu }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }

  /v1/notification-preferences:
    get:
      operationId: listNotificationPreferences
      summary: Bildirim tercihleriniz (sessize alınanlar)
      description: Tercihi olmayan tayfa için seviye `all`'dur.
      responses:
        "200":
          description: Tercihler
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotificationPreferenceList" }
        "401": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }

  /v1/notification-preferences/tayfas/{tayfa_id}:
    parameters:
      - $ref: "#/components/parameters/TayfaID"
    put:
      operationId: setTayfaNotificationPreference
      summary: Bir tayfayı sessize alır ya da seviyesini değiştirir
      description: |
        Etkin üyesi olduğunuz tayfa için (`tayfa-not-found`). `mentions` ya da
        `none` isteğe bağlı olarak `mute_until`'e kadar sürer (en fazla bir
        yıl), sonra tayfa `all`'a döner. `all` ile `mute_until` verilemez;
        `all` tercihi kaldırır. Sessize alma bildirimleri listeden gizlemez;
        anlık bildirim (push) gönderiminde kullanılır.
      parameters:
        - $ref: "#/components/parameters/ClientHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NotificationPreferenceRequest" }
      responses:
        "200":
          description: Tercih
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotificationPreference" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
    delete:
      operationId: resetTayfaNotificationPreference
      summary: Tayfanın bildirim tercihini varsayılana (`all`) döndürür
      parameters:
        - $ref: "#/components/parameters/ClientHeader"
      responses:
        "204": { description: Varsayılana döndü }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }

  # --- Hesap, referans kodu (identity AccountService, #71) ---

  /v1/me/account:
    get:
      operationId: getAccount
      summary: Kendi referans kodunuz ve katılım geçmişi görünürlüğünüz
      responses:
        "200":
          description: Hesap ayarları
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Account" }
        "401": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
    patch:
      operationId: updateAccount
      summary: Katılım geçmişinin kime görüneceğini değiştirir
      description: |
        `private`: yalnızca siz. `tayfa` (varsayılan): arkadaşlar tümünü,
        ortak tayfa üyeleri son 14 gün hariç. `public`: arkadaşlar tümünü,
        diğer herkes son 14 gün hariç.
      parameters:
        - $ref: "#/components/parameters/ClientHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AccountUpdate" }
      responses:
        "200":
          description: Güncel hesap ayarları
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Account" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }

  /v1/me/referral-code:
    post:
      operationId: rotateReferralCode
      summary: Yeni referans kodu üretir; eski kod ve linki hemen geçersiz olur
      parameters:
        - $ref: "#/components/parameters/ClientHeader"
      responses:
        "200":
          description: Yeni kod
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReferralCode" }
        "401": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }

  /v1/referral-lookups:
    post:
      operationId: lookupReferralCode
      summary: Referans koduyla kullanıcı bulur (yalnızca kimlik, ad, avatar)
      description: |
        Kod gövdededir; yol ve sorguda taşınmaz (erişim log'larına düşmez).
        Kullanıcı başına saatte 10 arama; bulunan, bulunamayan ve bozuk her
        deneme sayılır (`rate-limited`). Bulunamayan kod
        `referral-code-not-found`.
      parameters:
        - $ref: "#/components/parameters/ClientHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReferralLookupRequest" }
      responses:
        "200":
          description: Kodun sahibi
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReferredUser" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }

  # --- Arkadaşlık ve engelleme (core SocialService, #71) ---

  /v1/me/friends:
    get:
      operationId: listFriends
      summary: Arkadaşlarınız (yalnızca size görünür)
      parameters:
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/PageToken"
      responses:
        "200":
          description: Arkadaşlar
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FriendList" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }

  /v1/me/friends/{user_id}:
    parameters:
      - $ref: "#/components/parameters/UserID"
    delete:
      operationId: removeFriendship
      summary: Arkadaşlığı bitirir, isteğinizi geri çeker ya da gelen isteği reddeder
      description: Karşı tarafa bildirilmez. Silinecek bir şey yoksa da başarılıdır.
      parameters:
        - $ref: "#/components/parameters/ClientHeader"
      responses:
        "204": { description: Kaldırıldı }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }

  /v1/me/friend-requests:
    get:
      operationId: listFriendRequests
      summary: Size gelen (`incoming`, varsayılan) ya da gönderdiğiniz (`outgoing`) istekler
      parameters:
        - name: direction
          in: query
          schema: { type: string, enum: [incoming, outgoing], default: incoming }
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/PageToken"
      responses:
        "200":
          description: İstekler
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FriendList" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
    post:
      operationId: sendFriendRequest
      summary: Arkadaşlık isteği gönderir
      description: |
        Karşı tarafın size isteği zaten bekliyorsa kabul edilir (`state:
        friends`). Günde 20 istek; reddedilenler de sayılır
        (`friend-request-limit`). Engel varsa (iki yönden biri) kullanıcı
        bilinmeyen gibi görünür (`user-not-found`).
      parameters:
        - $ref: "#/components/parameters/ClientHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UserRef" }
      responses:
        "201":
          description: İstek (ya da kabul edilen arkadaşlık)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Friend" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }

  /v1/me/friend-requests/{user_id}/acceptance:
    parameters:
      - $ref: "#/components/parameters/UserID"
    post:
      operationId: acceptFriendRequest
      summary: Bu kullanıcının size gönderdiği isteği kabul eder
      parameters:
        - $ref: "#/components/parameters/ClientHeader"
      responses:
        "200":
          description: Arkadaşlık
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Friend" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }

  /v1/me/blocks:
    get:
      operationId: listBlockedUsers
      summary: Engellediğiniz kullanıcılar (sizi engelleyenler hiç listelenmez)
      parameters:
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/PageToken"
