      - $ref: "#/components/parameters/TayfaID"
      - $ref: "#/components/parameters/AnswerID"
    post:
      operationId: restoreAnswer
      summary: Gizlenen cevabı geri alır (yönetici)
      description: |
        Kurallar soruyu geri almadaki gibi; sorusu silinmiş cevap
        `answer-not-found` alır.
      parameters:
        - $ref: "#/components/parameters/ClientHeader"
      responses:
        "200":
          description: Geri alınan cevap
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Answer" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }

  /v1/tayfas/{tayfa_id}/answers/{answer_id}/vote:
    parameters:
      - $ref: "#/components/parameters/TayfaID"
      - $ref: "#/components/parameters/AnswerID"
    put:
      operationId: voteAnswer
      summary: Cevaba faydalı oyu verir
      description: |
        Kişi başına bir oy; zaten verdiyseniz değişmez. Kendi cevabınıza oy
        veremezsiniz (`own-answer-vote`).
      parameters:
        - $ref: "#/components/parameters/ClientHeader"
      responses:
        "200":
          description: Güncel cevap
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Answer" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
    delete:
      operationId: unvoteAnswer
      summary: Faydalı oyunu geri alır
      description: Oy yoksa değişmez.
      parameters:
        - $ref: "#/components/parameters/ClientHeader"
      responses:
        "200":
          description: Güncel cevap
          content:
            application/json:
