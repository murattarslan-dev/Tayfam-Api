      description: |
        Gün bugünden (Europe/Istanbul) en fazla 30 gün ileri olabilir.
        Bildirim gitmez; tüm arkadaşlarınız görür, başka kimse görmez. Not
        isteğe bağlıdır; boş ya da yalnızca boşluk ise not yoktur.
      parameters:
