        - $ref: "#/components/parameters/PageToken"
      responses:
        "200":
          description: Konuşmalar
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConversationList" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }

  /v1/direct-messages/conversations/{conversation_id}:
    parameters:
      - $ref: "#/components/parameters/ConversationID"
    get:
      operationId: getConversation
      summary: Bir konuşma
      description: |
        Yalnızca tarafı olduğunuz konuşma; başkasınınki ve reddettiğiniz
        istek `conversation-not-found`.
      responses:
        "200":
          description: Konuşma
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Conversation" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }

  /v1/direct-messages/conversations/{conversation_id}/messages:
    parameters:
      - $ref: "#/components/parameters/ConversationID"
    get:
      operationId: listDirectMessages
      summary: Konuşmanın mesajları
      description: |
        Kanal mesajlarıyla aynı sayfalama: `after_message_id` yoksa en yeni
        önce; verilirse ondan yeniler en eski önce (yeniden bağlanınca
        eksikleri tamamlama, ADR-0005). Silinen mesaj yerinde
        `deleted: true` ve metinsiz durur ("Bu mesaj silindi").
        `encryption: e2e` mesajın metni burada hiçbir zaman yoktur; içerik
        zarfta ve arşivdedir (`…/archive`).
      parameters:
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/PageToken"
        - name: after_message_id
          in: query
          required: false
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Mesajlar
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DirectMessageList" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }

  /v1/direct-messages/conversations/{conversation_id}/messages/{message_id}:
    parameters:
      - $ref: "#/components/parameters/ConversationID"
      - $ref: "#/components/parameters/MessageID"
    delete:
      operationId: deleteDirectMessage
      summary: Kendi mesajınızı siler
      description: |
        Metin hemen ve geri alınamaz biçimde silinir. Başkasının mesajı
        `message-not-found`. Silinmiş mesajı silmek bir şey değiştirmez.
        Uçtan uca şifreli mesajın bekleyen zarfları ve iki tarafın arşiv
        kayıtları da silinir.
        Engellemeden sonra da kendi mesajınızı silebilirsiniz.
      parameters:
        - $ref: "#/components/parameters/ClientHeader"
      responses:
        "204": { description: Silindi }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }

  /v1/direct-messages/conversations/{conversation_id}/read:
    parameters:
      - $ref: "#/components/parameters/ConversationID"
    put:
      operationId: markConversationRead
      summary: Konuşmayı bu mesaja kadar okundu işaretler
      description: |
        Okundu işareti yalnızca ileri gider. Mesaj bu konuşmada olmalıdır
        (`message-not-found`). Karşı taraf işaretinizi yalnızca aktif
        konuşmada görür (isteği okuduğunuzu gönderen öğrenmez). Konuşmanın
        bildirimleri de okunmuş olur.
      parameters:
        - $ref: "#/components/parameters/ClientHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChannelReadRequest" }
      responses:
        "204": { description: Okundu }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }

  /v1/direct-messages/conversations/{conversation_id}/accept:
    parameters:
      - $ref: "#/components/parameters/ConversationID"
    post:
      operationId: acceptMessageRequest
      summary: Size gelen mesaj isteğini kabul eder
      description: |
        Konuşma aktif olur; cevap yazmak da kabul sayılır. Aktif konuşmayı
        kabul etmek bir şey değiştirmez. Bekleyen isteğiniz yoksa (kendi
        isteğiniz dahil) `message-request-not-found`.
      parameters:
        - $ref: "#/components/parameters/ClientHeader"
      responses:
        "200":
          description: Konuşma
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Conversation" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }

  /v1/direct-messages/conversations/{conversation_id}/decline:
    parameters:
      - $ref: "#/components/parameters/ConversationID"
    post:
      operationId: declineMessageRequest
      summary: Size gelen mesaj isteğini reddeder
      description: |
        Gönderen bunu öğrenmez ve siz onu reddedilenler listesinden
        çıkarana kadar (`DELETE /v1/direct-messages/declined-requests/{conversation_id}`)
        arkadaş olsanız bile yeniden yazamaz. Konuşma listenizden çıkar,
        reddedilenler listesinde görünür. Sonra siz yazarsanız konuşma
        aktif açılır. Bekleyen isteğiniz yoksa `message-request-not-found`.
      parameters:
        - $ref: "#/components/parameters/ClientHeader"
      responses:
        "204": { description: Reddedildi }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }

  /v1/direct-messages/declined-requests:
    get:
      operationId: listDeclinedRequests
      summary: Reddettiğiniz mesaj istekleri (reddedilenler listesi)
      description: |
        En son reddedilen önce. Listeyi yalnızca siz görürsünüz; gönderen
        ne reddi ne bu listeyi öğrenir. Hesabı silinmiş gönderenin isteği
        listelenmez.
      parameters:
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/PageToken"
      responses:
        "200":
          description: Reddedilen istekler
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeclinedRequestList" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }

  /v1/direct-messages/declined-requests/{conversation_id}:
    parameters:
      - $ref: "#/components/parameters/ConversationID"
    delete:
      operationId: removeDeclinedRequest
      summary: Bir isteği reddedilenler listesinden çıkarır
      description: |
        Konuşma yeniden size gelen bekleyen istek olur
        (`request_received`): cevap yazabilir, kabul edebilir ya da yeniden
        reddedebilirsiniz. Gönderen yine yalnızca tek mesajını görür; kabul
        edene kadar (ya da serbest yazışabilir hale gelene kadar, ör.
        arkadaşlık) ikinci mesajı yazamaz. Gönderene bildirim gitmez.
        Tarafı olmadığınız konuşma `conversation-not-found`; sizin
        reddetmediğiniz konuşma (kendi isteğiniz dahil)
        `message-request-not-found`.
      parameters:
        - $ref: "#/components/parameters/ClientHeader"
      responses:
        "204": { description: Listeden çıkarıldı }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }

  /v1/notifications:
    get:
      operationId: listNotifications
      summary: Bildirimlerinizi listeler (uygulama içi, en yeni önce)
      description: |
        Yalnızca kendi bildirimleriniz. Bildirim içerik metni taşımaz:
        tür, tayfa, işlemi yapan ve hedefin kimliği vardır; istemci içeriği
        ilgili uçtan (duyuru, etkinlik, cevap…) çeker. Yalnızca etkin
        üyesi olduğunuz tayfaların bildirimleri üretilir; kendi yaptığınız
        işlem için bildirim gelmez. Sessize aldığınız tayfanın bildirimleri
        de listede görünür. Bildirimler 90 gün saklanır.
      parameters:
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/PageToken"
      responses:
        "200":
          description: Bildirimler
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotificationList" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }

  /v1/notifications/unread-count:
    get:
      operationId: getUnreadNotificationCount
      summary: Okunmamış bildirim sayısı (en fazla 1000)
      responses:
        "200":
          description: Okunmamış sayısı
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UnreadNotificationCount" }
        "401": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }

  /v1/notifications/read-all:
    post:
      operationId: markAllNotificationsRead
      summary: Tüm bildirimlerinizi okundu işaretler
      parameters:
        - $ref: "#/components/parameters/ClientHeader"
      responses:
        "204": { description: Okundu }
        "401": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }

  /v1/notifications/{notification_id}/read:
    parameters:
      - $ref: "#/components/parameters/NotificationID"
    put:
      operationId: markNotificationRead
      summary: Bir bildirimi okundu işaretler
      description: |
        Tekrar çağrılırsa ilk okunma zamanı korunur. Başka bir kullanıcının
        bildirimi, olmayan bir bildirimle aynı cevabı alır
        (`notification-not-found`).
      parameters:
        - $ref: "#/components/parameters/ClientHeader"
      responses:
        "204": { description: Okundu }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }

  /v1/notification-preferences:
    get:
      operationId: listNotificationPreferences
      summary: Bildirim tercihleriniz (sessize alınanlar)
      description: Tercihi olmayan tayfa için seviye `all`'dur.
      responses:
        "200":
          description: Tercihler
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotificationPreferenceList" }
        "401": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }

  /v1/notification-preferences/tayfas/{tayfa_id}:
    parameters:
      - $ref: "#/components/parameters/TayfaID"
    put:
      operationId: setTayfaNotificationPreference
      summary: Bir tayfayı sessize alır ya da seviyesini değiştirir
      description: |
        Etkin üyesi olduğunuz tayfa için (`tayfa-not-found`). `mentions` ya da
        `none` isteğe bağlı olarak `mute_until`'e kadar sürer (en fazla bir
        yıl), sonra tayfa `all`'a döner. `all` ile `mute_until` verilemez;
        `all` tercihi kaldırır. Sessize alma bildirimleri listeden gizlemez;
        anlık bildirim (push) gönderiminde kullanılır.
      parameters:
        - $ref: "#/components/parameters/ClientHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NotificationPreferenceRequest" }
      responses:
        "200":
          description: Tercih
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotificationPreference" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
    delete:
      operationId: resetTayfaNotificationPreference
      summary: Tayfanın bildirim tercihini varsayılana (`all`) döndürür
      parameters:
        - $ref: "#/components/parameters/ClientHeader"
      responses:
        "204": { description: Varsayılana döndü }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }

  # --- Push bildirimleri (#134, ADR-0019) ---
  #
  # Push token'ı oturuma bağlıdır: token'ı kaydeden erişim token'ının
  # oturumu. Oturum kapanınca (çıkış, başka cihazdan kapatma, yaptırım,
  # hesap silme) token silinir. Push, açık WebSocket bağlantınız yokken ve
  # bildirim tercihleriniz izin veriyorsa gider; bildirim listesi her
  # durumda eksiksizdir.
  #
  # Push metin taşımaz. Görünen başlık ve gövde istemcinin çeviri
  # dosyasından gelir: Android `title_loc_key`/`body_loc_key`, iOS
  # `title-loc-key`/`loc-key` = `push_<type>_title`, `push_<type>_body`
  # (`<type>`: `NotificationType`). Çeviri argümanı yoktur. `data` yalnızca
  # kimlik taşır: `notification_id`, `type`, `target_type`, `target_id`,
  # varsa `tayfa_id`, `question_id` (answer_received), `subject_user_id`
  # (hike_overdue), `reason` (tayfa_warned). Birebir mesaj push'u
  # (`dm_message`, `dm_request`) yalnızca konuşmanın kimliğini taşır.
  # Gruplama: Android `tag`, iOS `thread-id` = `target_id`. Android
  # kanalları: `tayfam_messages`, `tayfam_alerts` (hike_overdue),
  # `tayfam_general`.

  /v1/me/push-token:
    put:
      operationId: putPushToken
      summary: Bu oturumun push (FCM) token'ını kaydeder ya da yeniler
      description: |
        Uygulama her açılışta ve FCM token'ı yenilediğinde çağırır; 60 gün
        yenilenmeyen token silinir. Oturum başına bir token: yeni değer
        eskisinin yerine geçer. Aynı token başka bir oturumda kayıtlıysa
        (cihazda başka hesapla giriş) oraya bağlı kayıt silinir. Hesap
        başına en fazla 10 token (en eski yenilenen gider). Kapatılmış
        oturumun hâlâ geçerli token'ı kaydedemez (401). Hız sınırı:
        kullanıcı başına dakikada 10. Push sunucuda kapalıysa da kayıt
        kabul edilir.
      parameters:
        - $ref: "#/components/parameters/ClientHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PushTokenRegistration" }
      responses:
        "204": { description: Kaydedildi }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
    delete:
      operationId: deletePushToken
      summary: Bu oturumun push token'ını siler
      description: |
        Çıkışta ya da kullanıcı cihazda bildirimleri kapatınca. Token yoksa
        bir şey değişmez. Çıkışta oturum kapanınca token zaten silinir; bu
        çağrı onu beklemeden yapar.
      parameters:
        - $ref: "#/components/parameters/ClientHeader"
      responses:
        "204": { description: Silindi }
        "401": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }

  # --- Hesap, referans kodu (identity AccountService, #71) ---

  # --- birebir mesajda uçtan uca şifreleme (#127, ADR-0018) ---
  #
  # Sunucu hiçbir kriptografi yapmaz: açık anahtarları, opak zarfları,
  # şifreli arşivi ve eşleştirme mesajlarını saklar ve iletir. "Cihaz",
  # token'ın oturumudur (ADR-0018 madde 1): oturum kapanınca (çıkış, başka
  # cihazdan kapatma, yaptırım, hesap silme) cihaz, ön anahtarları ve
  # bekleyen zarfları silinir. Bayt alanları standart base64'tür.
  # Biçim: EC açık anahtar 33 bayt (0x05 ile başlar), Kyber açık anahtar
  # 1569 bayt, imza 64 bayt, ön anahtar kimliği 0–16777215, kayıt kimliği
  # 1–16380. Sunucu imza doğrulamaz.

  /v1/me/e2e/device:
    get:
      operationId: getMyE2EDevice
      summary: Bu oturumun E2E cihazı ve hesabın E2E durumu
      description: |
        Tek kullanımlık ön anahtar sayıları (`prekey_counts.low`: bir türden
        10'dan az kaldı), geçmiş anahtarı sürümü, anahtar yenileme gerekip
        gerekmediği ve eşleştirilmiş başka cihaz olup olmadığı (varsa QR
        eşleştirme önerin). Cihaz yoksa `e2e-device-not-registered` (409).
      responses:
        "200":
          description: Cihaz ve durum
          content:
            application/json:
              schema: { $ref: "#/components/schemas/E2EDeviceState" }
        "401": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
    post:
      operationId: registerE2EDevice
      summary: Bu oturumu E2E cihazı olarak kaydeder
      description: |
        Kimlik anahtarı, kayıt kimliği, imzalı ön anahtar ve son çare Kyber
        ön anahtarı zorunlu (PQXDH); tek kullanımlık EC ve Kyber ön
        anahtarları türüne göre en fazla 100. Hesap sıradaki cihaz
        numarasını alır (1–127, Signal adresi) ve karşı taraflar için
        `device_added` anahtar olayı yazılır. Hesap başına en fazla 5 cihaz
        (`e2e-device-limit`, 409: eski bir oturumu kapatın). Aynı oturum aynı
        anahtarlarla tekrar kaydolursa aynı cihaz döner; başka anahtarlarla
        `e2e-device-already-registered` (409; önce `DELETE`). Kapatılmış
        oturumun hâlâ geçerli token'ı kaydedemez (401). Gövde en fazla
        512 KiB. Hız sınırı: anahtar işlemleri kullanıcı başına dakikada 30.
      parameters:
        - $ref: "#/components/parameters/ClientHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/E2EDeviceRegistration" }
      responses:
        "200":
          description: Kayıtlı cihaz
          content:
            application/json:
              schema: { $ref: "#/components/schemas/E2EDeviceRegistered" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
    delete:
      operationId: unregisterE2EDevice
      summary: Bu oturumun E2E cihazını kaldırır
      description: |
        Ön anahtarlar, bekleyen zarflar, anahtar paylaşımları ve eşleştirme
        isteği de silinir; `device_removed` anahtar olayı yazılır.
        Eşleştirilmiş cihazsa ve eşleştirilmiş başka cihaz kalırsa geçmiş
        anahtarının yenilenmesi istenir. Cihaz yoksa bir şey değişmez.
      parameters:
        - $ref: "#/components/parameters/ClientHeader"
      responses:
        "204": { description: Kaldırıldı }
        "401": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }

  /v1/me/e2e/device/prekeys:
    post:
      operationId: uploadE2EPreKeys
      summary: Ön anahtar yükler
      description: |
        Verilirse imzalı ön anahtarı ve son çare Kyber ön anahtarını
        değiştirir; tek kullanımlık ön anahtarları ekler (çağrı başına
        türüne göre en fazla 100, cihazda türüne göre en fazla 200; var olan
        kimlik değişmez). Gövde en fazla 512 KiB.
      parameters:
        - $ref: "#/components/parameters/ClientHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/E2EPreKeyUpload" }
      responses:
        "200":
          description: Kalan sayılar
          content:
            application/json:
              schema: { $ref: "#/components/schemas/E2EPreKeyCounts" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }

  /v1/users/{user_id}/e2e/devices:
    parameters:
      - $ref: "#/components/parameters/UserID"
    get:
      operationId: listE2EDevices
      summary: Bir kullanıcının E2E cihazları (açık kimlik anahtarlarıyla)
      description: |
        Güvenlik kodu ve zarf adresleme için. Kullanıcının kendisi, onunla
        görünür bir konuşması olan ya da ona yazabilecek kişi görür; diğerleri
        `direct-message-not-allowed` (403).
      responses:
        "200":
          description: Cihazlar
          content:
            application/json:
              schema: { $ref: "#/components/schemas/E2EPublicDeviceList" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }

  /v1/users/{user_id}/e2e/key-events:
    parameters:
      - $ref: "#/components/parameters/UserID"
    get:
      operationId: listE2EKeyEvents
      summary: Bir kullanıcının anahtar olayları ("güvenlik kodu değişti")
      description: |
        En yeni önce; 90 gün tutulur. İzin cihaz listesiyle aynı.
      parameters:
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/PageToken"
      responses:
        "200":
          description: Olaylar
          content:
            application/json:
              schema: { $ref: "#/components/schemas/E2EKeyEventList" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }

  /v1/users/{user_id}/e2e/prekey-bundles:
    parameters:
      - $ref: "#/components/parameters/UserID"
    post:
      operationId: claimE2EPreKeyBundles
      summary: Ön anahtar paketlerini çeker (tek kullanımlık anahtarları tüketir)
      description: |
        Kullanıcının her cihazı (ya da yalnızca `device_ids`) için bir paket;
        her cihazdan bir tek kullanımlık EC ve bir tek kullanımlık Kyber ön
        anahtarı alınır ve silinir: aynı anahtar eşzamanlı çekmelerde de iki
        kişiye verilmez. Tek kullanımlık Kyber kalmadıysa son çare Kyber
        (`kyber_last_resort: true`), EC kalmadıysa paket EC'siz döner.
        Bu oturumun kendi cihazı hiçbir zaman dönmez.

        Yalnızca kendi diğer cihazlarınız için ya da o an bu kişiye mesaj
        **gönderebiliyorsanız**: gönderimle aynı kurallar
        (`direct-message-not-allowed` 403, `message-request-pending` 409,
        `message-request-limit` 429). Hız sınırı: kullanıcı başına dakikada
        20 (`rate-limited`).
      parameters:
        - $ref: "#/components/parameters/ClientHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/E2EBundleRequest" }
      responses:
        "200":
          description: Paketler
          content:
            application/json:
              schema: { $ref: "#/components/schemas/E2EPreKeyBundleList" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }

  /v1/me/e2e/envelopes:
    get:
      operationId: listE2EEnvelopes
      summary: Bu cihazı bekleyen zarflar (en eski önce)
      description: |
        Teslim en az bir kezdir: zarf `id` ile tekilleştirilir, saklandıktan
        sonra onaylanır. Onaylanmayan zarf 30 gün sonra silinir. Onaydan
        sonra liste baştan çekilir.
      parameters:
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/PageToken"
      responses:
        "200":
          description: Zarflar
          content:
            application/json:
              schema: { $ref: "#/components/schemas/E2EEnvelopeList" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }

  /v1/me/e2e/envelopes/ack:
    post:
      operationId: ackE2EEnvelopes
      summary: Teslim alınan zarfları onaylar (siler)
      description: |
        Yalnızca bu cihazın zarfları silinir; başka cihazın ya da bilinmeyen
        kimlikler yok sayılır. WebSocket `dm.envelope_ack` ile aynı.
      parameters:
        - $ref: "#/components/parameters/ClientHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/E2EEnvelopeAck" }
      responses:
        "204": { description: Onaylandı }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }

  /v1/me/e2e/archive:
    post:
      operationId: putE2EArchiveEntries
      summary: Geçmiş arşivine kayıt yazar
      description: |
        Her kayıt hesabın geçmiş anahtarıyla şifrelidir (sunucu çözemez).
        Yalnızca eşleştirilmiş cihaz yazar (`e2e-not-paired`, 409);
        `history_key_version` güncel olmalı (`e2e-history-key-stale`, 409).
        Taraf olmadığınız ya da silinmiş mesajlar atlanır, var olan kayıt
        değişmez; `accepted_message_ids` artık kaydınız olan mesajlardır.
        Çağrı başına 1–50 kayıt, kayıt 1 B – 32 KiB; gövde en fazla 2,5 MiB.
        Hız sınırı: kullanıcı başına dakikada 120.
      parameters:
        - $ref: "#/components/parameters/ClientHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/E2EArchiveWrite" }
      responses:
        "200":
          description: Kabul edilenler
          content:
            application/json:
              schema: { $ref: "#/components/schemas/E2EArchiveWritten" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
    delete:
      operationId: deleteE2EArchive
      summary: Tüm geçmiş arşivinizi siler
      description: Karşı tarafların arşivi etkilenmez.
      parameters:
        - $ref: "#/components/parameters/ClientHeader"
      responses:
        "204": { description: Silindi }
        "401": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }

  /v1/direct-messages/conversations/{conversation_id}/archive:
    parameters:
      - $ref: "#/components/parameters/ConversationID"
    get:
      operationId: listE2EArchiveEntries
      summary: Bir konuşmanın geçmiş arşivi (sizin kayıtlarınız)
      description: |
        Mesaj listesiyle aynı sayfalama (`after_message_id`). Yalnızca
        eşleştirilmiş cihaz okur (`e2e-not-paired`, 409). Her kayıt kendi
        `key_version`'ıyla çözülür.
      parameters:
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/PageToken"
        - name: after_message_id
          in: query
          required: false
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Kayıtlar
          content:
            application/json:
              schema: { $ref: "#/components/schemas/E2EArchiveEntryList" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
    delete:
      operationId: deleteE2EConversationArchive
      summary: Bir konuşmanın arşiv kayıtlarınızı siler
      parameters:
        - $ref: "#/components/parameters/ClientHeader"
      responses:
        "204": { description: Silindi }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }

  /v1/me/e2e/history-key:
    post:
      operationId: claimE2EHistoryKey
      summary: Yeni geçmiş anahtarını bildirir (ilk cihaz)
      description: |
        Hesabın eşleştirilmiş cihazı yoksa bu cihaz yeni bir geçmiş anahtarı
        üretir ve bunu çağırır: sürüm bir artar, cihaz eşleştirilmiş olur.
        Eski arşiv bu cihaz için okunamaz; kullanıcıya söyleyin.
        Eşleştirilmiş başka cihaz varsa `e2e-paired-device-exists` (409; QR
        ile eşleşin). Zaten eşleştirilmiş cihaz güncel sürümü alır.
      parameters:
        - $ref: "#/components/parameters/ClientHeader"
      responses:
        "200":
          description: Geçmiş anahtarı sürümü
          content:
            application/json:
              schema: { $ref: "#/components/schemas/E2EHistoryKeyVersion" }
        "401": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }

  /v1/me/e2e/history-key/rotate:
    post:
      operationId: rotateE2EHistoryKey
      summary: Geçmiş anahtarını yeniler
      description: |
        Eşleştirilmiş bir cihaz, yenileme gerektiğinde (eşleştirilmiş bir
        cihaz kaldırıldı; `rotation_needed`) yeni anahtarı üretir ve
        **diğer tüm** eşleştirilmiş cihazlara birer paylaşım gönderir
        (paylaşım 1 B – 16 KiB). `history_key_version` güncel sürümün bir
        fazlası olmalı (`e2e-history-key-stale`, 409); paylaşımlar kümesi
        tutmazsa `e2e-devices-changed` (409). Alan cihazlara WebSocket
        `e2e.history_key_shared` gider.
      parameters:
        - $ref: "#/components/parameters/ClientHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/E2EHistoryKeyRotation" }
      responses:
        "204": { description: Yenilendi }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }

  /v1/me/e2e/history-key-shares:
    get:
      operationId: listE2EHistoryKeyShares
      summary: Bu cihazı bekleyen geçmiş anahtarı paylaşımları
      description: En eski önce, en fazla 100. Onaylanmayan 30 gün sonra silinir.
      responses:
        "200":
          description: Paylaşımlar
          content:
            application/json:
              schema: { $ref: "#/components/schemas/E2EHistoryKeyShareList" }
        "401": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }

  /v1/me/e2e/history-key-shares/ack:
    post:
      operationId: ackE2EHistoryKeyShares
      summary: Alınan paylaşımları onaylar (siler)
      parameters:
        - $ref: "#/components/parameters/ClientHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/E2EShareAck" }
      responses:
        "204": { description: Onaylandı }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }

  /v1/me/e2e/link-requests:
    post:
      operationId: createE2ELinkRequest
      summary: QR eşleştirme isteği açar (yeni cihaz)
      description: |
        Eşleştirilmemiş cihaz açar (eşleştirilmişse `e2e-already-paired`,
        409). 10 dakika yaşar; cihazın önceki isteğinin yerine geçer. QR'ı
        istemci üretir: istek kimliği, bu iş için üretilen açık anahtar ve
        tek kullanımlık doğrulama kodu. Sunucu QR'ın hiçbir parçasını
        saklamaz.
      parameters:
        - $ref: "#/components/parameters/ClientHeader"
      responses:
        "201":
          description: İstek
          content:
            application/json:
              schema: { $ref: "#/components/schemas/E2ELinkRequestCreated" }
        "401": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }

  /v1/me/e2e/link-requests/{link_request_id}:
    parameters:
      - $ref: "#/components/parameters/LinkRequestID"
    get:
      operationId: getE2ELinkRequest
      summary: Bu cihazın eşleştirme isteği ve cevabı
      description: |
        Yalnızca isteği açan cihaz okur; başkasınınki ve süresi dolmuş
        cevapsız istek `e2e-link-request-not-found` (404).
      responses:
        "200":
          description: İstek
          content:
            application/json:
              schema: { $ref: "#/components/schemas/E2ELinkRequest" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }

  /v1/me/e2e/link-requests/{link_request_id}/answer:
    parameters:
      - $ref: "#/components/parameters/LinkRequestID"
    post:
      operationId: answerE2ELinkRequest
      summary: Eşleştirme isteğini cevaplar (eşleştirilmiş cihaz)
      description: |
        QR'ı okutan, aynı hesabın eşleştirilmiş cihazı geçmiş anahtarlarını
        yeni cihazın açık anahtarıyla şifreleyip gönderir (1 B – 16 KiB);
        `history_key_version` güncel olmalı. Başka hesabın, süresi dolmuş,
        cevaplanmış ya da bilinmeyen istek `e2e-link-request-not-found`
        (404). Yeni cihaza WebSocket `e2e.link_answered` gider.
      parameters:
        - $ref: "#/components/parameters/ClientHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/E2ELinkAnswer" }
      responses:
        "204": { description: Cevaplandı }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }

  /v1/me/e2e/link-requests/{link_request_id}/complete:
    parameters:
      - $ref: "#/components/parameters/LinkRequestID"
    post:
      operationId: completeE2ELinkRequest
      summary: Eşleştirmeyi tamamlar (yeni cihaz)
      description: |
        Yeni cihaz cevabı çözdükten sonra çağırır: cihaz eşleştirilmiş olur,
        istek silinir. Arada anahtar yenilendiyse `e2e-history-key-stale`
        (409); yeni istek açın.
      parameters:
        - $ref: "#/components/parameters/ClientHeader"
      responses:
        "200":
          description: Eşleştirilmiş cihaz
          content:
            application/json:
              schema: { $ref: "#/components/schemas/E2EDevice" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }

  /v1/me/account:
    get:
      operationId: getAccount
      summary: Kendi referans kodunuz ve katılım geçmişi görünürlüğünüz
      responses:
        "200":
          description: Hesap ayarları
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Account" }
        "401": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
    patch:
      operationId: updateAccount
      summary: Katılım geçmişinin kime görüneceğini değiştirir
      description: |
        `private`: yalnızca siz. `tayfa` (varsayılan): arkadaşlar tümünü,
        ortak tayfa üyeleri son 14 gün hariç. `public`: arkadaşlar tümünü,
        diğer herkes son 14 gün hariç.
      parameters:
        - $ref: "#/components/parameters/ClientHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AccountUpdate" }
      responses:
        "200":
          description: Güncel hesap ayarları
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Account" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }

  /v1/me/referral-code:
    post:
      operationId: rotateReferralCode
      summary: Yeni referans kodu üretir; eski kod ve linki hemen geçersiz olur
      parameters:
        - $ref: "#/components/parameters/ClientHeader"
      responses:
        "200":
          description: Yeni kod
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReferralCode" }
        "401": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }

  /v1/referral-lookups:
    post:
      operationId: lookupReferralCode
      summary: Referans koduyla kullanıcı bulur (yalnızca kimlik, ad, avatar)
      description: |
        Kod gövdededir; yol ve sorguda taşınmaz (erişim log'larına düşmez).
        Kullanıcı başına saatte 10 arama; bulunan, bulunamayan ve bozuk her
        deneme sayılır (`rate-limited`). Bulunamayan kod
        `referral-code-not-found`.
      parameters:
        - $ref: "#/components/parameters/ClientHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReferralLookupRequest" }
      responses:
        "200":
          description: Kodun sahibi
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReferredUser" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }

  # --- Arkadaşlık ve engelleme (core SocialService, #71) ---

  /v1/me/friends:
    get:
      operationId: listFriends
      summary: Arkadaşlarınız (yalnızca size görünür)
      parameters:
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/PageToken"
      responses:
        "200":
          description: Arkadaşlar
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FriendList" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }

  /v1/me/friends/{user_id}:
    parameters:
      - $ref: "#/components/parameters/UserID"
    delete:
      operationId: removeFriendship
      summary: Arkadaşlığı bitirir, isteğinizi geri çeker ya da gelen isteği reddeder
      description: Karşı tarafa bildirilmez. Silinecek bir şey yoksa da başarılıdır.
      parameters:
        - $ref: "#/components/parameters/ClientHeader"
      responses:
        "204": { description: Kaldırıldı }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }

  /v1/me/friend-requests:
    get:
      operationId: listFriendRequests
      summary: Size gelen (`incoming`, varsayılan) ya da gönderdiğiniz (`outgoing`) istekler
      parameters:
        - name: direction
          in: query
          schema: { type: string, enum: [incoming, outgoing], default: incoming }
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/PageToken"
      responses:
        "200":
          description: İstekler
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FriendList" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
    post:
      operationId: sendFriendRequest
      summary: Arkadaşlık isteği gönderir
      description: |
        Karşı tarafın size isteği zaten bekliyorsa kabul edilir (`state:
        friends`). Günde 20 istek; reddedilenler de sayılır
        (`friend-request-limit`). Engel varsa (iki yönden biri) kullanıcı
        bilinmeyen gibi görünür (`user-not-found`).
      parameters:
        - $ref: "#/components/parameters/ClientHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UserRef" }
      responses:
        "201":
          description: İstek (ya da kabul edilen arkadaşlık)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Friend" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }

  /v1/me/friend-requests/{user_id}/acceptance:
    parameters:
      - $ref: "#/components/parameters/UserID"
    post:
      operationId: acceptFriendRequest
      summary: Bu kullanıcının size gönderdiği isteği kabul eder
      parameters:
        - $ref: "#/components/parameters/ClientHeader"
      responses:
        "200":
          description: Arkadaşlık
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Friend" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }

  /v1/me/blocks:
    get:
      operationId: listBlockedUsers
      summary: Engellediğiniz kullanıcılar (sizi engelleyenler hiç listelenmez)
      parameters:
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/PageToken"
      responses:
        "200":
          description: Engellenenler
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BlockedUserList" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }

  /v1/me/blocks/{user_id}:
    parameters:
      - $ref: "#/components/parameters/UserID"
    put:
      operationId: blockUser
      summary: Kullanıcıyı engeller; arkadaşlık ve bekleyen istek silinir
      parameters:
        - $ref: "#/components/parameters/ClientHeader"
      responses:
        "204": { description: Engellendi }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
    delete:
      operationId: unblockUser
      summary: Engeli kaldırır; arkadaşlık geri gelmez
      parameters:
        - $ref: "#/components/parameters/ClientHeader"
      responses:
        "204": { description: Engel kaldırıldı }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }

  # --- Doğrudan tayfa daveti (core MembershipService, #71) ---

  /v1/tayfas/{tayfa_id}/invitations:
    parameters:
      - $ref: "#/components/parameters/TayfaID"
    get:
      operationId: listInvitations
      summary: Tayfanın cevaplanmamış doğrudan davetleri, yeniden eskiye (yönetici)
      parameters:
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/PageToken"
      responses:
        "200":
          description: Davetler
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InvitationList" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
    post:
      operationId: inviteFriend
      summary: Arkadaşınızı tayfaya davet eder (etkin, susturulmamış üye)
      description: |
        Yalnızca arkadaşlar (`not-friends`). Davet eden başına günde 10, tüm
        tayfalar birlikte (`direct-invite-limit`). Banlı ya da başvurusu
        bekleyen kişi `invite-not-allowed` (hangisi olduğu söylenmez).
      parameters:
        - $ref: "#/components/parameters/ClientHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UserRef" }
      responses:
        "201":
          description: Davet
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Invitation" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }

  /v1/tayfas/{tayfa_id}/invitations/{user_id}:
    parameters:
      - $ref: "#/components/parameters/TayfaID"
      - $ref: "#/components/parameters/UserID"
    delete:
      operationId: cancelInvitation
      summary: Cevaplanmamış bir daveti iptal eder (yönetici)
      parameters:
        - $ref: "#/components/parameters/ClientHeader"
      responses:
        "204": { description: Davet iptal edildi }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }

  /v1/me/invitations:
    get:
      operationId: listMyInvitations
      summary: Size gelen cevaplanmamış davetler, yeniden eskiye
      parameters:
        - $ref: "#/components/parameters/PageSize"
