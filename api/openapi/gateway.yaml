  # --- Tayfa sözlüğü (core TayfaVocabularyService, #244, ADR-0037 §4) ---
  # Tayfanın kendi değer listesi: bir ad alanındaki (`fish_species`, `book`
  # …) değerler. Tanımda `vocabulary` olan metin alanı (`CatalogVocabulary`)
  # bu sözlüğe bağlıdır: kayıtta ya var olan değerin kimliği
  # (`vocabulary_ids`) ya da metin gönderilir; bilinen metin (Türkçe küçük
  # harf, tek boşluk) yeniden kullanılır, yeni metin sözlüğe eklenir.
  # Tayfam içerik sağlamaz. Birleştirmeyi moderatör ve yönetici yapar ve
  # geri alır; birleştirilen değeri seçen kayıtlar hedefi gösterir.
  # Birleştirme tek düzeydir: hedef birleştirilmiş olamaz, birleştirilen
  # değere bağlı değerler de hedefe taşınır. Etkilenen yılların istatistiği
  # yeniden hesaplanır. Etkin üye olmayan `tayfa-not-found` alır.

  /v1/tayfas/{tayfa_id}/vocabulary/{namespace}:
    parameters:
      - $ref: "#/components/parameters/TayfaID"
      - $ref: "#/components/parameters/VocabularyNamespace"
    get:
      operationId: listTayfaVocabulary
      summary: Sözlükte arar (otomatik tamamlama)
      description: |
        Her etkin üyeye açıktır (susturulmuş üye de okur). Metni ya da ona
        birleştirilmiş bir değerin metni `q`'yu içeren en fazla 20 değer;
        `q` ile başlayanlar önce. Birleştirilmiş değerler hedeflerine
        çözülür. `merged=true` ile bunların yerine birleştirilmiş değerler
        hedefleriyle döner (geri alma için).
      parameters:
        - name: q
          in: query
          required: false
          description: Arama metni; en fazla 60 karakter. Boşsa ilk 20 değer.
          schema: { type: string, maxLength: 60 }
        - name: merged
          in: query
          required: false
          description: Birleştirilmiş değerleri listeler.
          schema: { type: boolean, default: false }
      responses:
        "200":
          description: Değerler
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TayfaVocabularyList" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }

  /v1/tayfas/{tayfa_id}/vocabulary/{namespace}/{vocabulary_id}/merge:
    parameters:
      - $ref: "#/components/parameters/TayfaID"
      - $ref: "#/components/parameters/VocabularyNamespace"
      - name: vocabulary_id
        in: path
        required: true
        description: Birleştirilen değer.
        schema: { type: string, format: uuid }
    post:
      operationId: mergeTayfaVocabulary
      summary: Değeri başka bir değere birleştirir (moderatör, yönetici)
      description: |
        Değeri seçen kayıtlar artık hedefi gösterir. Değer ya da hedef zaten
        birleştirilmişse `vocabulary-merged`; bilinmeyen değer
        `vocabulary-not-found`; kendisine birleştirme `invalid-request`.
        Salt okunur tayfada `tayfa-read-only`.
      parameters:
        - $ref: "#/components/parameters/ClientHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TayfaVocabularyMergeRequest" }
      responses:
        "200":
          description: Birleştirilen değer, hedefiyle
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TayfaVocabularyValue" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
    delete:
      operationId: unmergeTayfaVocabulary
      summary: Birleştirmeyi geri alır (moderatör, yönetici)
      description: |
        Değeri seçen kayıtlar yine kendi değerini gösterir. Birleştirilmemiş
        değer `vocabulary-not-merged`; bilinmeyen değer
        `vocabulary-not-found`.
      parameters:
        - $ref: "#/components/parameters/ClientHeader"
      responses:
        "204": { description: Birleştirme geri alındı }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }

  /v1/tayfas/{tayfa_id}/event-series/{series_id}:
    parameters:
      - $ref: "#/components/parameters/TayfaID"
      - $ref: "#/components/parameters/SeriesID"
    get:
      operationId: getEventSeries
      summary: Tekrarlayan serinin kuralı
      description: Her etkin üyeye açıktır. Bilinmeyen seri `event-series-not-found`.
      responses:
        "200":
          description: Seri
