# Tayfam dış REST sözleşmesi (ADR-0003). Önce burası değişir, sonra kod.
openapi: 3.1.0
info:
  title: Tayfam API
  version: 0.1.0
  description: |
    gateway'in dışa açık uçları. İç servisler yalnızca gRPC konuşur.

    **İstemciler (ADR-0017):** Uygulama yalnızca Android ve iOS'ta
    yayınlanır. Web derlemesi yalnızca yerel geliştirme içindir ve prod'da
    hizmet almaz: `web` istemci adı, `web` platformlu giriş ve `web/...`
    sürüm başlığı yalnızca prod dışında (local, dev) kabul edilir.

    **Kimlik:** Token'lar her zaman yanıt gövdesinde döner; istemci erişim
    token'ını `Authorization: Bearer` başlığıyla, refresh token'ı
    `/v1/auth/refresh` gövdesinde gönderir. Uygulama API'si çerez yazmaz ve
    çerez okumaz; çerezle gelen istek kimliksiz sayılır.

    **CORS:** prod'da hiçbir `Origin` için CORS başlığı dönmez. Dev'de
    yalnızca yerel geliştirme kaynağına (`http://localhost:<port>`)
    kimlik bilgisi (`credentials`) olmadan izin verilir; izinli başlıklar
    `Authorization`, `Content-Type`, `X-Tayfam-Client`,
    `X-Tayfam-Client-Version`, `X-Request-Id`.

    **İstemci başlığı:** Durum değiştiren her istek (POST, PUT, PATCH,
    DELETE) `X-Tayfam-Client` başlığını taşır; değeri istemcinin adıdır
    (`android`, `ios`; prod dışında `web`). Başlık yoksa ya da değer kabul
    edilmiyorsa `missing-client-header` (400). Tarayıcı bu başlığı ancak
    CORS ön isteğinden geçerek ekleyebilir.

    **İstemci sürümü (ADR-0016):** Uygulama her istekte
    `X-Tayfam-Client-Version: <platform>/<sürüm>` başlığını gönderir
    (`android/1.4.2`; platform `android`, `ios`, prod dışında `web`; sürüm
    Semantic Versioning 2.0.0, `v` öneki yok). Sürüm platformun en düşük
    desteklenen sürümünün altındaysa istek `client-outdated` (426) ile
    reddedilir; WebSocket el sıkışması da. Bozuk başlık ya da bu ortamda
    hizmet verilmeyen platform (prod'da `web`) `invalid-client-version`
    (400) alır. Başlıksız istek kabul edilir (curl, health check).
    `GET /v1/status` ve
    `GET /v1/client-config` hiçbir zaman reddedilmez. Ön sürüm, sürümün
    kendisinden düşüktür (`1.2.0-rc.1` < `1.2.0`); derleme bilgisi
    (`+...`) karşılaştırmada sayılmaz.

    **Uygulama bütünlüğü (ADR-0022):** Oturum girişte ve 24 saatte bir
    Play Integrity ile doğrulanır (`integrity_token`, `integrity_check_after`).
    Ortam `enforce` modundaysa doğrulamadan geçmemiş oturumun erişim
    token'ı `integrity-required` (403) alır; WebSocket el sıkışması da.
    Muaf uçlar: giriş, yenileme, çıkış, kayıt, onaylar, oturum listesi ve
    kapatma, hesap silme, KVKK veri dışa aktarma, `GET /v1/status`,
    `GET /v1/client-config`. `report` ve `off` modunda bu yüzden hiçbir
    istek reddedilmez.

    **Hatalar:** RFC 9457 `application/problem+json`. `type` alanı makine
    tarafından okunur: `https://tayfam.app/problems/<kod>`. `title` ve
    `detail` kullanıcıya gösterilmez; istemci kodu çeviri dosyasında arar.

    **Sayfalama:** Liste uçları `page_size` (0–100; 0 = 50) ve `page_token`
    alır. `next_page_token` opaktır: istemci onu çözmez, yalnızca aynı uca
    aynı parametrelerle geri gönderir. Alan yoksa son sayfadır.

    **Tayfa kapsamı:** Etkin üyesi olmadığınız bir tayfa, var olmayan bir
    tayfa ile aynı cevabı alır (`tayfa-not-found`); tayfanın varlığı sızmaz.

    **Gizli değerler URL'de taşınmaz:** Katılım kodu ve davet token'ı yalnızca
    istek gövdesinde gönderilir; erişim log'larına, tarayıcı geçmişine ve
    `Referer` başlığına düşmez. Davet önizlemesi bu yüzden POST'tur.

    **Bilinmeyen değerler:** Yanıtlardaki enum alanlarına ileride yeni değer
    eklenebilir; gateway'in tanımadığı bir değer `unknown` olarak döner.
    İstemci tanımadığı değeri yok sayar.
servers:
  - url: https://api-dev.tayfam.app
    description: dev (ev cluster'ı)

paths:
  /v1/status:
    get:
      operationId: getStatus
      summary: Servislerin erişilebilirliği
      security: []
      responses:
        "200":
          description: Durum
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Status" }

  /v1/client-config:
    get:
      operationId: getClientConfig
      summary: Desteklenen istemci sürümleri
      description: |
        Platform başına en düşük desteklenen ve en son sürüm (issue #114,
        ADR-0016). İstemci açılışta, girişten önce çağırır; kendi sürümü
        `min_supported_version`'ın altındaysa kullanıcıyı mağazaya
        yönlendirir. Token istemez, kişisel veri döndürmez; herkese aynı
        cevap. Bir platformda değer yapılandırılmamışsa alan yoktur
        (`min_supported_version` yoksa o platformda zorlama yoktur). IP
        başına hız sınırı vardır (`rate-limited`). Sürüm başlığına
        bakılmaz; eski sürüm de bu ucu her zaman çağırabilir.
      security: []
      responses:
        "200":
          description: Sürümler
          headers:
            Cache-Control:
              description: "`public, max-age=60`"
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ClientConfig" }
        "429": { $ref: "#/components/responses/Problem" }

  /v1/auth/sign-in:
    post:
      operationId: signIn
      summary: Google (ileride Apple) ID token'ı ile giriş
      description: |
        Kullanıcı yoksa oluşturulur ve kayıt bekler (`registration_pending`).
        Bu durumdaki erişim token'ı yalnızca `/v1/registration` uçlarına
        geçer (ADR-0012). Token'lar gövdede döner; çerez yazılmaz.
        `platform: web` yalnızca prod dışında kabul edilir; prod'da
        `invalid-request` (400). Platform genelinde askıdaki veya banlı hesap
        `account-sanctioned` (403) alır; token yenileme de aynı cevabı verir.
      security: []
      parameters:
        - $ref: "#/components/parameters/ClientHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SignInRequest" }
      responses:
        "200":
          description: Oturum açıldı
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }

  /v1/auth/refresh:
    post:
      operationId: refresh
      summary: Refresh token ile yeni token çifti
      description: |
        Refresh token her kullanımda yenilenir; eski token geçersiz olur.
        Kullanılmış bir token tekrar gelirse oturum tamamen kapanır.
        Refresh token yalnızca gövdede gelir; çerez okunmaz ve yazılmaz.
      security: []
      parameters:
        - $ref: "#/components/parameters/ClientHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RefreshRequest" }
      responses:
        "200":
          description: Yeni token'lar
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
        "401": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/Problem" }

  /v1/auth/sign-out:
    post:
      operationId: signOut
      summary: Bu cihazdaki oturumu kapatır
      parameters:
        - $ref: "#/components/parameters/ClientHeader"
      responses:
        "204": { description: Oturum kapandı }
        "401": { $ref: "#/components/responses/Problem" }

  /v1/registration/requirements:
    get:
      operationId: getRegistrationRequirements
      summary: Onaylanacak belge sürümleri ve yaş sınırı
      responses:
        "200":
          description: Gereksinimler
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RegistrationRequirements" }
        "401": { $ref: "#/components/responses/Problem" }

  /v1/registration:
    post:
      operationId: completeRegistration
      summary: Kaydı tamamlar (doğum tarihi, onaylar, ad)
      description: |
        Başarılı olunca istemci `/v1/auth/refresh` çağırır ve tam erişim
        token'ı alır. Yaş sınırının altındaki bir doğum tarihi hesabı kalıcı
        olarak kapatır (`age-blocked`) ve oturumları sonlandırır.
      parameters:
        - $ref: "#/components/parameters/ClientHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RegistrationRequest" }
      responses:
        "204": { description: Kayıt tamamlandı }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }

  # --- Hesap (identity AccountService, issue #75) ---

  /v1/me:
    delete:
      operationId: deleteAccount
      summary: Hesabınızı siler (KVKK)
      description: |
        **Yeniden kimlik doğrulama:** Son 10 dakika içinde Google/Apple ile
        giriş yapılmış olmalıdır; hem erişim token'ı hem de oturumu o
        girişten gelmelidir. `/v1/auth/refresh` ile yenilenmiş bir token
        yetmez. Değilse `403 reauthentication-required`: istemci kullanıcıyı
        sağlayıcıyla yeniden giriş yaptırır (`/v1/auth/sign-in`) ve yeni
        token'la tekrar dener.

        Kişisel bilgiler (ad, profil fotoğrafı, doğum tarihi, referans kodu)
        hemen silinir; tüm cihazlardaki oturumlar kapanır, tayfalardan
        çıkılır. İçerikler kalır, yazarı "Silinmiş kullanıcı" görünür. Kayıt
        30 gün sonra tamamen silinir; geri alma yoktur. Aynı Google/Apple
        hesabıyla sonraki giriş yeni bir hesap açar.

        Erişim token'ı iptal edilemez (ADR-0004): kalan ömrü boyunca (en
        fazla 15 dakika) hesap uçları onu reddeder, tayfa uçları üyelik
        kalmadığı için reddeder.
      parameters:
        - $ref: "#/components/parameters/ClientHeader"
      responses:
        "204": { description: Hesap silindi }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }

  /v1/me/sessions:
    get:
      operationId: listSessions
      summary: Açık oturumlarınız (cihaz başına bir oturum)
      description: |
        En son kullanılan önce, en fazla 100. IP adresi ve token dönmez.
        `current` bu isteğin oturumudur. Kapatılmış bir oturumun token'ı
        oturum uçlarında `401` alır.
      responses:
        "200":
          description: Oturumlar
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeviceSessionList" }
        "401": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }

  /v1/me/sessions/{session_id}:
    parameters:
      - $ref: "#/components/parameters/SessionID"
    delete:
      operationId: revokeSession
      summary: Bir oturumu kapatır (uzaktan çıkış)
      description: |
        O cihazın refresh token'ı hemen geçersiz olur; erişim token'ı en
        fazla 15 dakika daha geçerli kalabilir (ADR-0004). Kendi oturumunuzu
        kapatmak çıkış yapmaktır (istemci kendi oturumu için
        `/v1/auth/sign-out` kullanır). Başka kullanıcının, bilinmeyen ya da
        zaten kapalı oturum aynı cevabı alır (`session-not-found`).
      parameters:
        - $ref: "#/components/parameters/ClientHeader"
      responses:
        "204": { description: Oturum kapandı }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }

  /v1/me/sessions/sign-out-others:
    post:
      operationId: revokeOtherSessions
      summary: Bu oturum dışındaki tüm oturumları kapatır
      parameters:
        - $ref: "#/components/parameters/ClientHeader"
      responses:
        "200":
          description: Kapatılan oturum sayısı
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RevokedSessions" }
        "401": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }

  /v1/me/consents:
    get:
      operationId: getConsents
      summary: Güncel metin sürümleri ve onay durumunuz
      description: |
        Aydınlatma metni veya kullanım koşulları yeni sürümle yayınlanınca
        `consent_required` true olur (giriş ve yenileme yanıtında da döner).
        İstemci yeni metinleri gösterir ve `POST /v1/me/consents` ile onaylar.
      responses:
        "200":
          description: Onay durumu
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConsentStatus" }
        "401": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
    post:
      operationId: acceptConsents
      summary: Güncel metin sürümlerini onaylar
      description: |
        Gösterilen sürümler gönderilir; güncel değillerse `409
        consent-outdated` (ekran açıkken yeni sürüm yayınlanmış olabilir).
        Onaylar yalnızca eklenir; aynı sürüm tekrar onaylanınca bir şey
        değişmez.
      parameters:
        - $ref: "#/components/parameters/ClientHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ConsentRequest" }
      responses:
        "204": { description: Onaylandı }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }

  # --- Tayfalar (core TayfaService) ---

  /v1/tayfas:
    get:
      operationId: listMyTayfas
      summary: Etkin üyelikleriniz ve bekleyen katılım istekleriniz
      description: |
        En yeniden eskiye. Bekleyen bir istekte yalnızca `tayfa_id` ve `name`
        dolu gelir; `tayfa` alanı yalnızca etkin üyelikte vardır.
      parameters:
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/PageToken"
      responses:
        "200":
          description: Tayfalar
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MyTayfaList" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
    post:
      operationId: createTayfa
      summary: Yeni tayfa açar; açan kişi tek yöneticisidir
      description: |
        Kullanıcı başına 24 saatte 1 (`tayfa-create-limit`, core) ve IP başına
        saatte 1 (`rate-limited`, gateway). Aynı `client_request_id` ile
        tekrar gönderim ilk açılan tayfayı döndürür ve yeni tayfa açmaz;
        aynı IP'den aynı `client_request_id` ile yapılan tekrar IP sınırına
        takılmaz. Bütün modüller açık başlar.
      parameters:
        - $ref: "#/components/parameters/ClientHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TayfaCreateRequest" }
      responses:
        "201":
          description: Tayfa açıldı (ya da tekrar gönderimde ilk açılan)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Tayfa" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }

  /v1/tayfas/{tayfa_id}:
    parameters:
      - $ref: "#/components/parameters/TayfaID"
    get:
      operationId: getTayfa
      summary: Tayfanın tam görünümü ve sizin rolünüz
      description: |
        Yalnızca etkin üyelere. `caller_role` istemcinin doğru işlemleri
        göstermesi içindir; sunucu her istekte yetkiyi yeniden kontrol eder.
      responses:
        "200":
          description: Tayfa
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TayfaView" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
    patch:
      operationId: updateTayfa
      summary: Tayfa ayarlarını değiştirir (yönetici)
      description: |
        Yalnızca gövdede bulunan alanlar değişir; en az bir alan gerekir.
        `interests` gönderilirse ilgi alanlarının tamamını değiştirir.
        `members_can_create_events` etkinlik açma iznini üyelere açar ya da
        kapatır. `now_create_min_role` Şimdi başlat için gereken en düşük
        roldür (ADR-0038 §2).
      parameters:
        - $ref: "#/components/parameters/ClientHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TayfaUpdateRequest" }
      responses:
        "200":
          description: Güncel tayfa
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Tayfa" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }

  /v1/tayfas/{tayfa_id}/conversion:
    parameters:
      - $ref: "#/components/parameters/TayfaID"
    post:
      operationId: convertInstantTayfa
      summary: Anlık tayfayı kalıcı tayfaya dönüştürür ("Bu ekiple tayfa kur")
      description: |
        Yalnızca anlık tayfanın yöneticisi (organizatör; hesabı silindiyse
        devralan yönetici), tayfa salt okunur değilken (ADR-0032). Dönüşmüş
        tayfada tekrar istek, bir şey değiştirmeden tayfayı döndürür. Ad, ilgi alanları, açıklama ve katılım
        politikası tayfa açmadaki kurallarla verilir; bütün modüller açılır,
        üyeler, etkinlik ve kanal kalır. Dönüştürme tayfa açma sayılır:
        kullanıcı başına 24 saatte 1 (`tayfa-create-limit`) ve IP başına
        saatte 1 (`rate-limited`). Kalıcı tayfada `permission-denied`.
      parameters:
        - $ref: "#/components/parameters/ClientHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TayfaConvertRequest" }
      responses:
        "200":
          description: Dönüşen tayfa
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Tayfa" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }

  /v1/instant-events:
    post:
      operationId: createInstantEvent
      summary: Anlık (bireysel) etkinlik açar; arka planda gizli bir tayfa açılır
      description: |
        Tek istekte gizli, tek etkinlikli bir tayfa (`kind: instant`) ve
        etkinliği açılır; açan kişi tayfanın tek yöneticisi ve etkinliğin
        organizatörüdür (ADR-0032). Yalnızca etkinlik modülü açıktır.
        `invitee_user_ids`'deki kişiler doğrudan davet edilir; hepsi
        arkadaşınız olmalıdır (`not-friends`), biri davet edilemezse hiçbir
        şey açılmaz. Aynı anda en fazla 3 açık anlık etkinlik (bitmemiş,
        iptal edilmemiş) ve 24 saatte en fazla 5 anlık etkinlik (iptal
        edilenler de sayılır); ikisi de `instant-event-limit`. Tayfa açma sınırlarına
        sayılmaz. `event` alanının kuralları `POST
        /v1/tayfas/{tayfa_id}/events` ile aynıdır; `recurrence` ve
        `cover_upload_id` kabul edilmez (kapak sonra etkinlik
        düzenlemesiyle eklenir), `discoverable` `true` olamaz (sonradan da). Aynı `event.client_request_id` ile tekrar
        gönderim ilk açılanı döndürür. `event.starts_now` ile anlık
        etkinlik şimdi başlar (ADR-0038 §1); açık şimdi etkinliği hem bu
        sınıra hem kişi başı 1 açık şimdi etkinliği sınırına
        (`now-limit-reached`) sayılır.

        Etkinlik bitince (iptalde iptal anından) 7 gün sonra tayfa
        arşivlenir. Davet linkiyle gelen her zaman katılım isteği bırakır,
        organizatör onaylar; katılım koduyla katılım yoktur. Etkinlik
        kanalını istemci `POST /v1/tayfas/{tayfa_id}/channels`
        (`visibility: event`) ile açar.
      parameters:
        - $ref: "#/components/parameters/ClientHeader"
      requestBody:
        required: true
        content:
