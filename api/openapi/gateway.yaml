  # --- Soru-cevap (core QAService) ---
  #
  # Ortak kurallar: tayfanın soru-cevap modülü (`qa`) kapalıysa okumalar
  # dahil her uç `module-disabled` alır. Bu tayfada olmayan ya da silinmiş
  # soru `question-not-found`, cevap `answer-not-found`, etiket
  # `tag-not-found` alır; silinen sorunun cevapları da bulunmaz. Soru ve
  # cevabı her etkin üye yazar; susturulmuş üye yazamaz (`muted`), yalnızca
  # kendi soru ve cevabını silebilir. Başkasının içeriğini moderatör ve
  # yönetici, yazarın şu anki rolü kendisininkinden düşükse
  # (`role-hierarchy`) düzenler ve siler. Kendi sildiğiniz içerik hemen
  # boşaltılır; başkasının sildiği gizlenir ve yönetici 30 gün içinde geri
  # alabilir.

  /v1/tayfas/{tayfa_id}/questions:
    parameters:
      - $ref: "#/components/parameters/TayfaID"
    get:
      operationId: listQuestions
      summary: Soruları listeler ve arar
      description: |
        `q` yoksa yeniden eskiye; `q` varsa başlıkta ve gövdede Türkçe tam
        metin arama yapar (İ/ı doğru: "IŞIK" "ışık"ı, "izmir" "İzmir"i
        bulur) ve en ilgiliden başlar. `tag_id` ikisiyle de süzer. Arama
        metni gateway'de ve core'da log'a yazılmaz; `next_page_token`
        metni taşımaz ve yalnızca aynı `q` ve `tag_id` ile geçerlidir.
      parameters:
        - name: q
          in: query
          required: false
          description: Arama metni; en fazla 100 karakter, tek satır.
          schema: { type: string, maxLength: 100 }
        - name: tag_id
          in: query
          required: false
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/PageToken"
      responses:
        "200":
          description: Sorular
          content:
            application/json:
              schema: { $ref: "#/components/schemas/QuestionList" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
    post:
      operationId: createQuestion
      summary: Soru sorar
      description: |
        Etiketler adla verilir; tayfada büyük/küçük harf farkıyla (Türkçe
        kurallarla) aynı adlı etiket varsa o kullanılır, yoksa açılır.
        Tayfada en fazla 200 etiket olabilir (`tag-limit`). Aynı
        `client_request_id` ile tekrar gönderilen istek yeni soru açmaz,
        ilk soruyu döndürür.
      parameters:
        - $ref: "#/components/parameters/ClientHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/QuestionCreateRequest" }
      responses:
        "201":
          description: Sorulan soru
          headers:
            Location:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Question" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }

  /v1/tayfas/{tayfa_id}/questions/{question_id}:
    parameters:
      - $ref: "#/components/parameters/TayfaID"
      - $ref: "#/components/parameters/QuestionID"
    get:
      operationId: getQuestion
      summary: Tek bir soru
      responses:
