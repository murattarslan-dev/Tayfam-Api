      parameters:
        - $ref: "#/components/parameters/ClientHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EventMeasureValueRequest" }
      responses:
        "200":
          description: Ölçüm, güncel haliyle
