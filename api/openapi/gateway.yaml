  # organizatörün atadığı hakemler katılımcı başına girer. Değer etkinlik
  # başladıktan (`measurement-not-started`) bitişten 7 gün sonrasına kadar
  # (`component-frozen`) yazılır; tanımdaki ondalık basamağa yuvarlanır,
  # sınır dışı değer `invalid-request` alır. Diğer kapsamın ucu
