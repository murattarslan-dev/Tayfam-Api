      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }

  schemas:
    Problem:
      type: object
      required: [type, title, status]
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
        request_id: { type: string }

    Status:
      type: object
      required: [status, version, services, checked_at]
      properties:
        status: { type: string, enum: [ok, degraded] }
        version: { type: string }
        services:
          type: object
          additionalProperties: { type: string, enum: [ok, unavailable] }
        checked_at: { type: string, format: date-time }

    ClientConfig:
      type: object
      required: [platforms]
      properties:
        platforms:
          type: object
          required: [android, ios]
          properties:
            android: { $ref: "#/components/schemas/PlatformVersions" }
            ios: { $ref: "#/components/schemas/PlatformVersions" }
            web:
              $ref: "#/components/schemas/PlatformVersions"
              description: Yalnızca prod dışında; web geliştirme derlemesi (ADR-0017).

    PlatformVersions:
      type: object
      description: Yapılandırılmamış alan yoktur.
      properties:
        min_supported_version:
          type: string
          description: Bunun altındaki sürümler `client-outdated` alır.
          examples: ["1.2.0"]
        latest_version:
          type: string
          description: Mağazadaki en son sürüm; yalnızca bilgi.
          examples: ["1.5.0"]

    SignInRequest:
      type: object
      required: [provider, id_token, nonce, platform]
      additionalProperties: false
      properties:
        provider: { type: string, enum: [google] }
        id_token: { type: string, maxLength: 8192 }
        nonce: { type: string, minLength: 16, maxLength: 256 }
        platform:
          type: string
          enum: [android, ios, web]
          description: "`web` yalnızca prod dışında (ADR-0017)."
        integrity_token:
          type: string
          maxLength: 16384
          description: |
            İsteğe bağlı, Android: Play Integrity standard request token'ı
            (ADR-0022). `requestHash` = base64url(SHA-256("tayfam-integrity/v1/sign-in\n" + nonce)),
            dolgusuz.

    RefreshRequest:
      type: object
      required: [refresh_token]
      additionalProperties: false
      properties:
        refresh_token: { type: string, maxLength: 64 }
        integrity_token:
          type: string
          maxLength: 16384
          description: |
            İsteğe bağlı, Android: Play Integrity token'ı; yalnızca
            `integrity_check_after` geçtiyse gönderilir, öncesinde yok
            sayılır (ADR-0022). `requestHash` =
            base64url(SHA-256("tayfam-integrity/v1/refresh\n" + SHA-256(refresh_token))), dolgusuz;
            iç özet ham bayttır.

    Session:
      type: object
      required: [user_id, session_id, access_token, access_expires_at, refresh_token, refresh_expires_at, registration_pending]
      properties:
        user_id: { type: string, format: uuid }
        session_id: { type: string, format: uuid }
        access_token: { type: string }
        access_expires_at: { type: string, format: date-time }
        refresh_token: { type: string }
        refresh_expires_at: { type: string, format: date-time }
        registration_pending: { type: boolean }
        consent_required:
          type: boolean
          description: |
            Kayıtlı kullanıcı aydınlatma metninin veya kullanım koşullarının
            güncel sürümünü onaylamamış. İstemci `/v1/me/consents` ile
            yeni metinleri gösterip onay alır.
        integrity_check_after:
          type: string
          format: date-time
          description: |
            Bu zamandan sonraki ilk yenilemede `integrity_token` gönderilir
            (ADR-0022). Bütünlük denetimi kapalıyken alan yoktur.

    RegistrationRequirements:
      type: object
      required: [privacy_notice_version, terms_version, minimum_age]
      properties:
        privacy_notice_version: { type: string }
        terms_version: { type: string }
        minimum_age: { type: integer }

    DeviceSession:
      type: object
      required: [session_id, platform, created_at, last_seen_at, current]
      properties:
        session_id: { type: string, format: uuid }
        platform: { type: string, enum: [android, ios, web, unknown] }
        created_at: { type: string, format: date-time }
        last_seen_at:
          type: string
          format: date-time
          description: Oturumun son token yenilemesi.
        current: { type: boolean, description: Bu isteğin oturumu. }

    DeviceSessionList:
      type: object
      required: [sessions]
      properties:
        sessions:
          type: array
          items: { $ref: "#/components/schemas/DeviceSession" }

    RevokedSessions:
      type: object
      required: [revoked_count]
      properties:
        revoked_count: { type: integer, minimum: 0 }

    ConsentStatus:
      type: object
      required: [privacy_notice_version, terms_version, consent_required]
      properties:
        privacy_notice_version: { type: string }
        terms_version: { type: string }
        consent_required: { type: boolean }

    ConsentRequest:
      type: object
      required: [privacy_notice_version, terms_version]
      additionalProperties: false
      properties:
        privacy_notice_version: { type: string, maxLength: 32 }
        terms_version: { type: string, maxLength: 32 }

    RegistrationRequest:
      type: object
      required: [birth_date, accepted_privacy_notice_version, accepted_terms_version]
      additionalProperties: false
      properties:
        birth_date: { type: string, format: date }
        display_name: { type: string, minLength: 1, maxLength: 40 }
        accepted_privacy_notice_version: { type: string, maxLength: 32 }
        accepted_terms_version: { type: string, maxLength: 32 }
        referral_code:
          type: string
          maxLength: 32
          description: |
            İsteğe bağlı; uygulamaya getiren kişinin referans kodu (Android'de
            mağaza referansı, iOS'ta elle). Bir kez kaydedilir; kimseyi
            bulmayan kod hata vermeden yok sayılır.

    # --- core ---

    InterestKey:
      type: string
      description: |
        İlgi alanı: katalogdaki bir ilgi alanının anahtarı (`GET /v1/catalog`,
        `CatalogInterest.key`). Kapalı liste değildir; yeni ilgi alanı sürüm
        çıkmadan eklenir (ADR-0025). Etkinlik türü değildir: türler ilgi
        alanlarının altında gruplanır. Katalogda olmayan anahtar ve yeni
        seçilen emekli (`retired`) ilgi alanı `validation` hatasıdır; emekli
        ilgi alanı, onu daha önce seçmiş tayfada ve profilde görünmeye devam
        eder.
      pattern: "^[a-z][a-z0-9_]{1,39}$"
    JoinPolicy:
      type: string
      description: "`approval`: yeni üyeler onay bekler. `open`: hemen etkin olur."
      enum: [approval, open]
    Module:
      type: string
      enum: [announcements, events, qa, polls]
    Role:
      type: string
      enum: [member, moderator, admin]

    TayfaCreateRequest:
      type: object
      required: [name, client_request_id]
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 3
          maxLength: 50
          description: Baştaki ve sondaki boşluklar atıldıktan sonra 3–50 karakter.
        description: { type: string, maxLength: 500 }
        interests:
          type: array
          maxItems: 20
          uniqueItems: true
          items: { $ref: "#/components/schemas/InterestKey" }
        join_policy:
          allOf: [{ $ref: "#/components/schemas/JoinPolicy" }]
          default: approval
        client_request_id:
          type: string
          format: uuid
          description: İstemcinin her açma denemesi için bir kez ürettiği, tekrar gönderimde aynen kullandığı UUID.

    TayfaConvertRequest:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 3
          maxLength: 50
          description: Baştaki ve sondaki boşluklar atıldıktan sonra 3–50 karakter.
        description: { type: string, maxLength: 500 }
        interests:
          type: array
          maxItems: 20
          uniqueItems: true
          items: { $ref: "#/components/schemas/InterestKey" }
        join_policy:
          allOf: [{ $ref: "#/components/schemas/JoinPolicy" }]
          default: approval

    TayfaKind:
      type: string
      description: |
        `standard`: tayfa. `instant`: anlık etkinliğin gizli, tek etkinlikli
        tayfası; Keşfet'e çıkmaz, etkinlik bitince 7 gün sonra arşivlenir
        (ADR-0032).
      enum: [standard, instant]

    InstantEventCreateRequest:
      type: object
      required: [event]
      additionalProperties: false
      properties:
        event:
          allOf: [{ $ref: "#/components/schemas/EventCreateRequest" }]
          description: |
            Etkinlik; kuralları tayfa etkinliğiyle aynı. `recurrence` ve
            `cover_upload_id` verilemez, `discoverable` `true` olamaz. `client_request_id` isteğin tekrar
            gönderim anahtarıdır.
        invitee_user_ids:
          type: array
          maxItems: 10
          uniqueItems: true
          items: { type: string, format: uuid }
          description: Doğrudan davet edilecek arkadaşlarınız (en fazla 10, siz değil).

    InstantEvent:
      type: object
      required: [tayfa, event]
      properties:
        tayfa: { $ref: "#/components/schemas/Tayfa" }
        event: { $ref: "#/components/schemas/Event" }

    TayfaUpdateRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        cover_upload_id:
          type: string
          description: |
            Kendi hazır `cover` yüklemeniz (bu tayfa için açılmış); `""` kapağı
            kaldırır. Eski kapak silinir. Yönetici yetkisi gerekir.
        name: { type: string, minLength: 3, maxLength: 50 }
        description: { type: string, maxLength: 500 }
        interests:
          type: array
          maxItems: 20
          uniqueItems: true
          items: { $ref: "#/components/schemas/InterestKey" }
        join_policy: { $ref: "#/components/schemas/JoinPolicy" }
        members_can_create_events:
          type: boolean
          description: "`true`: her etkin üye etkinlik açabilir. `false`: yalnızca moderatör ve yönetici."
        now_create_min_role:
          allOf: [{ $ref: "#/components/schemas/Role" }]
          description: Şimdi başlat (`starts_now`) için gereken en düşük rol (ADR-0038 §2).

    Tayfa:
      type: object
      required: [id, name, description, interests, join_policy, modules, status, member_count, members_can_create_events, now_create_min_role, created_at, updated_at, kind]
      properties:
        cover_upload_id: { type: string, format: uuid, description: "Kapak; linkleri `POST /v1/media/urls`." }
        id: { type: string, format: uuid }
        name:
          type: string
          description: 3–50 karakter; anlık tayfada etkinliğin başlığıdır (1–120).
        kind: { $ref: "#/components/schemas/TayfaKind" }
        instant_event_id:
          type: string
          format: uuid
          description: Yalnızca anlık tayfada; tayfanın tek etkinliği.
        converted_at:
          type: string
          format: date-time
          description: |
            Yalnızca anlık tayfadan "Bu ekiple tayfa kur" ile kalıcıya dönmüş
            tayfada: dönüşüm anı (ADR-0032 §7). Kurulum dönemi bu andan sayılır.
        description: { type: string }
        interests:
          type: array
          items: { $ref: "#/components/schemas/InterestKey" }
        join_policy: { $ref: "#/components/schemas/JoinPolicy" }
        modules:
          type: object
          description: Her modülün açık olup olmadığı.
          properties:
            announcements: { type: boolean }
            events: { type: boolean }
            qa: { type: boolean }
            polls: { type: boolean }
        status:
          type: string
          description: "`warned`: hareketsiz, 7 gün sonra arşivlenir. `archived`: salt okunur."
          enum: [active, warned, archived]
        suspended_at:
          type: string
          format: date-time
          description: Platform tayfayı askıya aldıysa (salt okunur). Sebep dönmez.
        deletion_at:
          type: string
          format: date-time
          description: Silme bekliyorsa tayfanın silineceği zaman (salt okunur).
        member_count: { type: integer }
        members_can_create_events:
          type: boolean
          description: |
            `true` ise her etkin üye etkinlik açabilir; `false` (varsayılan)
            ise yalnızca moderatör ve yönetici. Organizatör kendi etkinliğini
            her zaman yönetir.
        now_create_min_role:
          allOf: [{ $ref: "#/components/schemas/Role" }]
          description: |
            Tayfada Şimdi başlat (`starts_now`) için gereken en düşük rol;
            varsayılan `member` (ADR-0038 §2). `members_can_create_events`
            ayarından bağımsızdır. Yalnızca yönetici değiştirir.
        join_code:
          type: string
          description: Yalnızca yöneticiye döner.
        pending_join_request_count:
          type: integer
          format: int32
          minimum: 0
          description: |
            Onay bekleyen katılım istekleri; yalnızca istekleri onaylayabilen
            moderatör ve yöneticiye döner, diğerlerinde alan yoktur.
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    TayfaView:
      type: object
      required: [tayfa, caller_role, badges]
      properties:
        tayfa: { $ref: "#/components/schemas/Tayfa" }
        caller_role: { $ref: "#/components/schemas/Role" }
        badges:
          type: array
          description: Tayfanın rozetleri, kazanılma sırasıyla (#258, ADR-0039 §3).
          items: { $ref: "#/components/schemas/EarnedBadge" }

    MyTayfa:
      type: object
      required: [tayfa_id, name, role, status, kind]
      properties:
        tayfa_id: { type: string, format: uuid }
        name: { type: string }
        kind: { $ref: "#/components/schemas/TayfaKind" }
        role: { $ref: "#/components/schemas/Role" }
        status: { type: string, enum: [active, pending] }
        tayfa:
          allOf: [{ $ref: "#/components/schemas/Tayfa" }]
          description: Yalnızca etkin üyelikte.

    MyTayfaList:
      type: object
      required: [tayfas]
      properties:
        tayfas:
          type: array
          items: { $ref: "#/components/schemas/MyTayfa" }
        next_page_token: { type: string }

    ModuleUpdate:
      type: object
      required: [enabled]
      additionalProperties: false
      properties:
        enabled: { type: boolean }

    JoinCode:
      type: object
      required: [join_code]
      properties:
        join_code:
          type: string
          description: 8 karakter, `[2-9A-HJ-NP-Z]`.

    Deletion:
      type: object
      required: [deletion_at]
      properties:
        deletion_at: { type: string, format: date-time }

    Membership:
      type: object
      required: [tayfa_id, user_id, role, status]
      properties:
        tayfa_id: { type: string, format: uuid }
        user_id: { type: string, format: uuid }
        role: { $ref: "#/components/schemas/Role" }
        status: { type: string, enum: [invited, pending, active, banned] }
        joined_at:
          type: string
          format: date-time
          description: Üyelik etkin olduğunda.
        muted_until:
          type: string
          format: date-time
          description: Susturma bitişi; yalnızca üyenin kendisine, moderatöre ve yöneticiye döner.
        joined_via_discover:
          type: boolean
          description: |
            Kişi Keşfet'ten katılım istedi (ADR-0033). Yalnızca moderatör ve
            yöneticiye döner; diğer üyelere hiç dönmez.

    MemberList:
      type: object
      required: [members]
      properties:
        members:
          type: array
          items: { $ref: "#/components/schemas/Membership" }
        next_page_token: { type: string }

    RoleUpdate:
      type: object
      required: [role]
      additionalProperties: false
      properties:
        role: { $ref: "#/components/schemas/Role" }

    MuteRequest:
      type: object
      required: [muted_until]
      additionalProperties: false
      properties:
        muted_until:
          type: string
          format: date-time
          description: Şimdiden sonra, en fazla 30 gün ileri.

    JoinRequest:
      type: object
      required: [user_id, requested_at, source]
      properties:
        user_id: { type: string, format: uuid }
        requested_at: { type: string, format: date-time }
        source: { type: string, enum: [invite_link, direct_invite, code, discover, qr] }
        inviter_user_id:
          type: string
          format: uuid
          description: Davet eden ya da linki açan kişi; kodla katılımda yok.
        invite_id:
          type: string
          format: uuid
          description: Kullanılan davet linki; yalnızca `source=invite_link`.

    JoinRequestList:
      type: object
      required: [join_requests]
      properties:
        join_requests:
          type: array
          items: { $ref: "#/components/schemas/JoinRequest" }
        next_page_token: { type: string }

    InviteCreateRequest:
      type: object
      required: [ttl_seconds, max_uses]
      additionalProperties: false
      properties:
        ttl_seconds:
          type: integer
          minimum: 3600
          maximum: 2592000
          description: Linkin geçerlilik süresi; 1 saat ile 30 gün arası.
        max_uses: { type: integer, minimum: 1, maximum: 100 }

    Invite:
      type: object
      required: [id, tayfa_id, created_by_user_id, created_at, expires_at, max_uses, use_count]
      description: Davet linki. Token ya da özeti hiçbir zaman dönmez.
      properties:
        id: { type: string, format: uuid }
        tayfa_id: { type: string, format: uuid }
        created_by_user_id: { type: string, format: uuid }
        created_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
        max_uses: { type: integer }
        use_count: { type: integer }
        revoked_at: { type: string, format: date-time }

    CreatedInvite:
      type: object
      required: [invite, token]
      properties:
        invite: { $ref: "#/components/schemas/Invite" }
        token:
          type: string
          description: Linkin gizli kısmı (43 karakter base64url). Yalnızca burada, bir kez döner.

    InviteList:
      type: object
      required: [invites]
      properties:
        invites:
          type: array
          items: { $ref: "#/components/schemas/Invite" }

    JoinByCodeRequest:
      type: object
      required: [code]
      additionalProperties: false
      properties:
        code:
          type: string
          maxLength: 32
          description: Katılım kodu; büyük/küçük harf duyarsız.

    InviteTokenRequest:
      type: object
      required: [token]
      additionalProperties: false
      properties:
        token: { type: string, maxLength: 64 }

    JoinQrToken:
      type: object
      required: [token, expires_at]
      description: QR ile katılım token'ı (ADR-0038 §3). Log'a yazılmaz.
      properties:
        token:
          type: string
          minLength: 22
          maxLength: 22
          description: base64url, 128 bit. QR `https://tayfam.app/q#<token>` taşır.
        expires_at:
          type: string
          format: date-time
          description: Oluşturmadan 2 dakika sonra.

    JoinQrResult:
      type: object
      required: [tayfa_id, event_id, pending]
      properties:
        tayfa_id: { type: string, format: uuid }
        event_id: { type: string, format: uuid }
        pending:
          type: boolean
          description: Onaylı tayfada katılım isteği bırakıldı (ya da zaten bekliyordu); `rsvp` ve `attendance` yok.
        rsvp: { $ref: "#/components/schemas/RsvpStatus" }
        attendance: { $ref: "#/components/schemas/AttendanceStatus" }

    InvitePreview:
      type: object
      required: [tayfa_id, name, member_count, already_member, interests]
      description: Linki bilen herkesin görebileceği dar görünüm.
      properties:
        tayfa_id: { type: string, format: uuid }
        name: { type: string }
        member_count: { type: integer }
        already_member:
          type: boolean
          description: Zaten etkin üyeyseniz ya da bekleyen isteğiniz varsa.
        interests:
          type: array
          description: |
            Tayfanın ilgi alanları (issue #194; avatar rengi). Yalnızca geçerli
            davette döner; geçersiz davette hiçbir tayfa bilgisi dönmez.
          items: { $ref: "#/components/schemas/InterestKey" }

    Announcement:
      type: object
      required: [id, tayfa_id, title, body, pinned, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        tayfa_id: { type: string, format: uuid }
        author_user_id:
          type: string
          format: uuid
          description: Yazarın hesabı silindiyse yoktur ("Silinmiş kullanıcı").
        title: { type: string }
        body: { type: string }
        pinned: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at:
          type: string
          format: date-time
          description: Her düzenleme, sabitleme ve geri almada değişir.
        edited_at:
          type: string
          format: date-time
          description: |
            Başlık ya da gövdenin son değiştiği zaman (issue #191).
            Sabitleme, sabitlemeyi kaldırma ve geri alma onu değiştirmez.
            Hiç düzenlenmemiş duyuruda yoktur; istemci "düzenlendi"
            etiketini bu alana göre gösterir.

    AnnouncementList:
      type: object
      required: [announcements]
      properties:
        announcements:
          type: array
          items: { $ref: "#/components/schemas/Announcement" }
        next_page_token: { type: string }

    AnnouncementCreateRequest:
      type: object
      required: [title, client_request_id]
      additionalProperties: false
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 120
          description: Baştaki ve sondaki boşluklar atıldıktan sonra 1–120 karakter, tek satır.
        body:
          type: string
          maxLength: 5000
          description: En fazla 5000 karakter; satır sonu olabilir.
        client_request_id:
          type: string
          format: uuid
          description: İstemcinin her yayınlama denemesi için bir kez ürettiği, tekrar gönderimde aynen kullandığı UUID.

    AnnouncementUpdateRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        title: { type: string, minLength: 1, maxLength: 120 }
        body: { type: string, maxLength: 5000 }

    # --- Soru-cevap ---

    Tag:
      type: object
      required: [id, name]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, description: İlk yazıldığı haliyle 1–30 karakter. }
        question_count:
          type: integer
          description: Yalnızca etiket listesinde; etiketi taşıyan görünen soru sayısı.

    TagList:
      type: object
      required: [tags]
      properties:
        tags:
          type: array
          items: { $ref: "#/components/schemas/Tag" }

    Question:
      type: object
      required: [id, tayfa_id, title, body, tags, answer_count, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        tayfa_id: { type: string, format: uuid }
        author_user_id:
          type: string
          format: uuid
          description: Yazarın hesabı silindiyse yoktur ("Silinmiş kullanıcı").
        title: { type: string }
        body: { type: string }
        tags:
          type: array
          items: { $ref: "#/components/schemas/Tag" }
        answer_count: { type: integer, description: Görünen cevap sayısı. }
        created_at: { type: string, format: date-time }
        updated_at:
          type: string
          format: date-time
          description: Her düzenleme ve geri almada değişir.

    QuestionList:
      type: object
      required: [questions]
      properties:
        questions:
          type: array
          items: { $ref: "#/components/schemas/Question" }
        next_page_token: { type: string }

    QuestionCreateRequest:
      type: object
      required: [title, client_request_id]
      additionalProperties: false
      properties:
        title:
          type: string
          minLength: 10
          maxLength: 150
          description: Baştaki ve sondaki boşluklar atıldıktan sonra 10–150 karakter, tek satır.
        body:
          type: string
          maxLength: 10000
          description: En fazla 10000 karakter; satır sonu olabilir.
        tags:
          type: array
          maxItems: 5
          description: Etiket adları; her biri 1–30 karakter, tek satır, iç boşluklar teke iner.
          items: { type: string, minLength: 1, maxLength: 30 }
        client_request_id:
          type: string
          format: uuid
          description: İstemcinin her deneme için bir kez ürettiği, tekrar gönderimde aynen kullandığı UUID.

    QuestionUpdateRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        title: { type: string, minLength: 10, maxLength: 150 }
        body: { type: string, maxLength: 10000 }
        tags:
          type: array
          maxItems: 5
          items: { type: string, minLength: 1, maxLength: 30 }

    Answer:
      type: object
      required: [id, question_id, tayfa_id, body, vote_count, voted, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        question_id: { type: string, format: uuid }
        tayfa_id: { type: string, format: uuid }
        author_user_id:
          type: string
          format: uuid
          description: Yazarın hesabı silindiyse yoktur ("Silinmiş kullanıcı").
        body: { type: string }
        vote_count: { type: integer, description: Faydalı oyu sayısı. }
        voted: { type: boolean, description: Çağıran bu cevaba oy verdi mi. }
        created_at: { type: string, format: date-time }
        updated_at:
          type: string
          format: date-time
          description: Her düzenleme ve geri almada değişir; oylar değiştirmez.

    AnswerList:
      type: object
      required: [answers]
      properties:
        answers:
          type: array
          items: { $ref: "#/components/schemas/Answer" }
        next_page_token: { type: string }

    AnswerCreateRequest:
      type: object
      required: [body, client_request_id]
      additionalProperties: false
      properties:
        body:
          type: string
          minLength: 1
          maxLength: 10000
          description: Boşluklar atıldıktan sonra 1–10000 karakter; satır sonu olabilir.
        client_request_id: { type: string, format: uuid }

    AnswerUpdateRequest:
      type: object
      required: [body]
      additionalProperties: false
      properties:
        body: { type: string, minLength: 1, maxLength: 10000 }

    # --- Anketler ---

    Poll:
      type: object
      description: |
        Gizli ankette (`anonymous`) diğer üyeler, yöneticiler dahil, kimin
        neye oy verdiğini göremez; `own_option_ids` her zaman yalnızca
        çağıranın kendi oyudur. Sayımlar her ankette döner.
      required: [id, tayfa_id, question, anonymous, multiple_choice, closed, created_at, options, voter_count, own_option_ids]
      properties:
        id: { type: string, format: uuid }
        tayfa_id: { type: string, format: uuid }
        event_id:
          type: string
          format: uuid
          description: Anket bir etkinliğe bağlı değilse yoktur.
        created_by_user_id:
          type: string
          format: uuid
          description: Anketi açanın hesabı silindiyse yoktur ("Silinmiş kullanıcı").
        question: { type: string }
        anonymous: { type: boolean }
        multiple_choice: { type: boolean }
        closes_at:
          type: string
          format: date-time
          description: Planlanan kapanma zamanı; yoksa elle kapatılana kadar açık.
        closed_at:
          type: string
          format: date-time
          description: Erken kapatıldıysa.
        closed:
          type: boolean
          description: Erken kapatıldı ya da kapanma zamanı geçti; oy alınmaz.
        created_at: { type: string, format: date-time }
        options:
          type: array
          items: { $ref: "#/components/schemas/PollOption" }
        voter_count:
          type: integer
          format: int64
          description: Oy veren kişi sayısı (çok seçimlide kişi bir kez sayılır).
        own_option_ids:
          type: array
          description: Çağıranın kendi oyu; oy vermediyse boş.
          items: { type: string, format: uuid }

    PollOption:
      type: object
      required: [id, text, position, vote_count]
      properties:
        id: { type: string, format: uuid }
        text: { type: string }
        position: { type: integer }
        vote_count: { type: integer, format: int64 }

    PollList:
      type: object
      required: [polls]
      properties:
        polls:
          type: array
          items: { $ref: "#/components/schemas/Poll" }
        next_page_token: { type: string }

    PollCreateRequest:
      type: object
      required: [question, options]
      additionalProperties: false
      properties:
        question:
          type: string
          minLength: 1
          maxLength: 200
          description: Baştaki ve sondaki boşluklar atıldıktan sonra 1–200 karakter, tek satır.
        options:
          type: array
          minItems: 2
          maxItems: 10
          description: Her biri 1–100 karakter, tek satır; büyük/küçük harf farkı gözetmeden tekil.
          items: { type: string, minLength: 1, maxLength: 100 }
        anonymous:
          type: boolean
          default: false
          description: İlk oydan sonra değiştirilemez.
        multiple_choice: { type: boolean, default: false }
        closes_at:
          type: string
          format: date-time
          description: İsteğe bağlı; gelecekte, en fazla 365 gün sonra.
        event_id:
          type: string
          format: uuid
          description: İsteğe bağlı; aynı tayfanın etkinliği.
        client_request_id:
          type: string
          format: uuid
          description: |
            İsteğe bağlı. İstemcinin her oluşturma denemesi için bir kez
            ürettiği, tekrar gönderimde aynen kullandığı UUID; aynı kişiden
            tekrar gelirse ilk anket döner, ikinci anket açılmaz. Başka bir
            tayfada ya da o anket silindikten sonra tekrar kullanılırsa
            `validation` (alan `client_request_id`).

    PollVoteRequest:
      type: object
      required: [option_ids]
      additionalProperties: false
      properties:
        option_ids:
          type: array
          minItems: 1
          maxItems: 10
          uniqueItems: true
          items: { type: string, format: uuid }

    PollVoter:
      type: object
      required: [user_id, voted_at]
      properties:
        user_id: { type: string, format: uuid }
        voted_at: { type: string, format: date-time }

    PollVoterList:
      type: object
      required: [voters]
      properties:
        voters:
          type: array
          items: { $ref: "#/components/schemas/PollVoter" }
        next_page_token: { type: string }

    # --- Etkinlikler ---

    EventMode:
      type: string
      enum: [in_person, online]
    RsvpStatus:
      type: string
      description: "`waitlist` yalnızca sunucu tarafından verilir (dolu etkinlikte `going`)."
      enum: [going, maybe, not_going, waitlist]
    AttendanceStatus:
      type: string
      description: "`attended`: doğrulandı. `no_show`: organizatör düzeltmesiyle kaldırıldı."
      enum: [attended, no_show]
    AttendanceMethod:
      type: string
      description: |
        `location`: buluşma noktasına 300 m içinde check-in. `online`:
        çevrimiçi etkinlikte "Katıldım". `hike_start`: yoklamada çıkış (`roll_call`).
        `organizer`: organizatör düzeltmesi. `qr`: üye organizatörün
        QR'ını okuttu (ADR-0038 §3).
      enum: [location, online, hike_start, organizer, qr]

    LatLng:
      type: object
      required: [lat, lng]
      additionalProperties: false
      description: WGS 84 derece. Yalnızca gövdede taşınır; log'a yazılmaz.
      properties:
        lat: { type: number, minimum: -90, maximum: 90 }
        lng: { type: number, minimum: -180, maximum: 180 }

    EventRoute:
      type: object
      required: [points, caller_can_edit]
      description: Bir etkinliğin rota bileşeninin güzergâhı (#239).
      properties:
        points:
          type: array
          maxItems: 500
          description: Sırayla; rota yoksa boş, varsa 2–500 nokta.
          items: { $ref: "#/components/schemas/LatLng" }
        updated_at: { type: string, format: date-time, description: Rotanın son yazıldığı an; rota yoksa yoktur. }
        caller_can_edit:
          type: boolean
          description: Rotayı şu an değiştirebilirsiniz (organizatör yetkisi; etkinlik iptal değil, donmamış, tayfa salt okunur değil).
    EventRouteRequest:
      type: object
      required: [points]
      additionalProperties: false
      properties:
        points:
          type: array
          maxItems: 500
          description: Boş (rotayı kaldırır) ya da 2–500 nokta.
          items: { $ref: "#/components/schemas/LatLng" }
    EventVehicle:
      type: object
      required: [id, user_id, make, seats, rider_user_ids, pending_user_ids]
      description: Bir katılımcının etkinliğe yazdığı araç (#240).
      properties:
        id: { type: string, format: uuid }
        user_id: { type: string, format: uuid, description: Aracın sahibi. }
        make: { type: string }
        model: { type: string }
        model_year: { type: integer, description: Verilmemişse yoktur. }
        color: { type: string }
        plate:
          type: string
          description: Kişisel veri. Yalnızca katılımcılara (`going`), organizatöre ve aracın sahibine döner.
        seats:
          type: integer
          minimum: 0
          maximum: 8
          description: Araç sahibinin yazdığı boş koltuk sayısı; bileşenin `seats` parametresi kapalıysa hep 0.
        rider_user_ids:
          type: array
          description: Koltuk isteği onaylanan kişiler, istek sırasıyla.
          items: { type: string, format: uuid }
        pending_user_ids:
          type: array
          description: Onay bekleyen kişiler. Aracın sahibi hepsini, başkası yalnızca kendisini görür.
          items: { type: string, format: uuid }
    EventVehicles:
      type: object
      required: [vehicles, plate_enabled, seats_enabled, caller_can_participate, caller_can_manage]
      description: Bir etkinliğin araçlar bileşeninin araçları, isteği yapanın gördüğü haliyle (#240).
      properties:
        vehicles:
          type: array
          description: Eklenme sırasıyla.
          items: { $ref: "#/components/schemas/EventVehicle" }
        plate_enabled: { type: boolean, description: Bileşenin `plate` parametresi; kapalıysa plaka yazılamaz. }
        seats_enabled: { type: boolean, description: Bileşenin `seats` parametresi; kapalıysa koltuk paylaşımı yoktur. }
        caller_can_participate:
          type: boolean
          description: Şu an araç yazabilir ve koltuk isteyebilirsiniz (`going`, susturulmamış; etkinlik bitmemiş, iptal değil, tayfa salt okunur değil).
        caller_can_manage:
          type: boolean
          description: Şu an başkasının aracını ve koltuk isteğini kaldırabilirsiniz (organizatör yetkisi; etkinlik iptal değil, donmamış, tayfa salt okunur değil).
    EventVehicleRequest:
      type: object
      required: [make]
      additionalProperties: false
      properties:
        make: { type: string, minLength: 1, maxLength: 40 }
        model: { type: string, maxLength: 40 }
        model_year: { type: integer, minimum: 0, description: "0 ya da 1900 – gelecek yıl." }
        color: { type: string, maxLength: 30 }
        plate:
          type: string
          maxLength: 16
          description: İsteğe bağlı, kişisel veri; yalnızca `plate_enabled` ise. Harf, rakam ve tek boşluk; 2–16 karakter.
        seats:
          type: integer
          minimum: 0
          maximum: 8
          description: Boş koltuk sayısı; verilmezse 0. Sıfırdan büyük değer yalnızca `seats_enabled` ise.

    ChecklistItem:
      type: object
      required: [id, name, quantity]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        quantity: { type: integer, description: "1–999; bileşenin `quantity` parametresi kapalıysa hep 1." }
        assigned_user_id: { type: string, format: uuid, description: Maddeyi üstlenen kişi; kimse üstlenmediyse yoktur. }
    Checklist:
      type: object
      required: [items, label, assignment_enabled, quantity_enabled, caller_can_manage, caller_can_take]
      description: Bir etkinliğin bir liste bileşeni, isteği yapanın gördüğü haliyle (#241).
      properties:
        items:
          type: array
          description: Eklenme sırasıyla.
          items: { $ref: "#/components/schemas/ChecklistItem" }
        label:
          type: string
          enum: [gear, task, section, duty, item]
          description: Bileşenin `label` parametresi (malzeme, görev, bölüm, nöbet, madde); tanım vermezse `item`. Metni istemci çevirir.
        assignment_enabled: { type: boolean, description: Bileşenin `assignment` parametresi; kapalıysa madde üstlenilmez. }
        quantity_enabled: { type: boolean, description: Bileşenin `quantity` parametresi; kapalıysa adet hep 1. }
        caller_can_manage:
          type: boolean
          description: Şu an madde ekleyebilir, çıkarabilir ve atayabilirsiniz (organizatör yetkisi, susturulmamış; etkinlik bitmemiş, iptal değil, tayfa salt okunur değil).
        caller_can_take:
          type: boolean
          description: Şu an boştaki maddeyi kendinize atayabilir ve kendi atamanızı kaldırabilirsiniz (`going`, susturulmamış, `assignment_enabled`; aynı pencereler).
    ChecklistItemRequest:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 60 }
        quantity: { type: integer, minimum: 0, maximum: 999, description: "0 ya da yok: 1. Birden büyük değer yalnızca `quantity_enabled` ise." }
        assigned_user_id:
          type: string
          format: uuid
          description: İsteğe bağlı; yalnızca `assignment_enabled` ise. Tayfanın `going` cevabı vermiş etkin bir üyesi (`event-not-going`).
    ChecklistAssignRequest:
      type: object
      additionalProperties: false
      properties:
        assigned_user_id:
          type: string
          format: uuid
          description: Üstlenecek kişi. Yoksa (ya da `null`) atama kaldırılır.
    RollCallEntry:
      type: object
      required: [user_id, started_at]
      properties:
        user_id: { type: string, format: uuid }
        started_at: { type: string, format: date-time, description: İstemcinin bildirdiği çıkış anı. }
        returned_at: { type: string, format: date-time, description: İstemcinin bildirdiği dönüş anı; dışarıdayken yoktur. }
    EventRollCall:
      type: object
      required: [alarm, return_grace_minutes, entries, caller_can_manage, caller_can_edit]
      description: Bir etkinliğin bir yoklama bileşeni, isteği yapanın gördüğü haliyle (#242).
      properties:
        alarm: { type: boolean, description: Bileşenin `alarm` parametresi; kapalıysa dönmeme alarmı kurulmaz. }
        return_grace_minutes: { type: integer, minimum: 0, maximum: 1440, description: "Beklenen dönüşten sonraki tolerans (dakika); tanım vermezse 30." }
        expected_return_at: { type: string, format: date-time, description: Beklenen dönüş; plan yoksa yoktur (alarm kurulmaz). }
        mine:
          allOf: [{ $ref: "#/components/schemas/RollCallEntry" }]
          description: Kendi kaydınız; çıkmadıysanız yoktur.
        entries:
          type: array
          maxItems: 1000
          description: Herkesin kaydı, önce dışarıdakiler; yalnızca `caller_can_manage` ise dolu, değilse boş.
          items: { $ref: "#/components/schemas/RollCallEntry" }
        caller_can_manage: { type: boolean, description: "Etkinliğin bileşenlerini yönetirsiniz (organizatör yetkisi, susturulmamış)." }
        caller_can_edit:
          type: boolean
          description: Beklenen dönüşü şu an değiştirebilirsiniz (organizatör yetkisi; etkinlik iptal değil, donmamış, tayfa salt okunur değil).
    RollCallPlanRequest:
      type: object
      additionalProperties: false
      properties:
        expected_return_at:
          type: string
          format: date-time
          description: Etkinliğin başlangıcından sonra. Yoksa (ya da `null`) plan kaldırılır.
    RollCallStartRequest:
      type: object
      additionalProperties: false
      properties:
        started_at:
          type: string
          format: date-time
          description: İstemcinin çıkış zamanı; yoksa şimdi. Gelecekte değil, en fazla 48 saat önce.
    RollCallReturnRequest:
      type: object
      additionalProperties: false
      properties:
        returned_at:
          type: string
          format: date-time
          description: İstemcinin dönüş zamanı; yoksa şimdi. Çıkıştan önce olamaz.
    LogLocationVisibility:
      type: string
      enum: [self, participants, tayfa]
      description: |
        Bir günlük kaydının konumunu kaydı girenin dışında kim görür:
        `self` kimse; `participants` `going`/`maybe` cevabı verenler,
        katılımı doğrulananlar, organizatör, moderatör ve yönetici; `tayfa`
        kaydı gören herkes.
    EventLogEntry:
      type: object
      required: [id, user_id, values, created_at, caller_can_remove]
      description: Bir günlük kaydı, isteği yapanın gördüğü haliyle (#243).
      properties:
        id: { type: string, format: uuid }
        user_id: { type: string, format: uuid, description: Kaydı giren. }
        values:
          allOf: [{ $ref: "#/components/schemas/EventFieldValues" }]
          description: Kaydın alan değerleri; alanlar bileşenin `fields` parametresindedir.
        location:
          allOf: [{ $ref: "#/components/schemas/LatLng" }]
          description: Kaydın konumu; yoksa ya da görmeniz gerekmiyorsa yoktur.
        location_visibility:
          allOf: [{ $ref: "#/components/schemas/LogLocationVisibility" }]
          description: Yalnızca kendi konumlu kayıtlarınızda.
        photo_upload_id: { type: string, format: uuid, description: "Fotoğraf; linkleri `POST /v1/media/urls`. Kaydı gören her üye görür." }
        created_at: { type: string, format: date-time }
        caller_can_remove: { type: boolean, description: Kaydı şu an çıkarabilirsiniz. }
        vocabulary_ids:
          allOf: [{ $ref: "#/components/schemas/VocabularyIds" }]
          description: |
            Tayfa sözlüğüne bağlı alanların değerleri (birleştirme hedefine
            çözülmüş); metinleri `values`'ta. Böyle alan yoksa yoktur.
    EventLogEntryList:
      type: object
      required: [entries, location_enabled, max_entries, caller_can_add]
      description: Bir etkinliğin bir günlük bileşeninin kayıtları, eskiden yeniye (#243).
      properties:
        entries:
          type: array
          maxItems: 100
          items: { $ref: "#/components/schemas/EventLogEntry" }
        next_page_token: { type: string }
        location_enabled: { type: boolean, description: Bileşenin `location` parametresi; kapalıysa kayda konum verilmez. }
        location_default:
          allOf: [{ $ref: "#/components/schemas/LogLocationVisibility" }]
          description: Yeni kaydın konum görünürlüğünün varsayılanı; konum kapalıysa yoktur.
        max_entries: { type: integer, minimum: 1, maximum: 500, description: Kişi başına en fazla kayıt. }
        caller_can_add:
          type: boolean
          description: Şu an kayıt ekleyebilirsiniz (katılımınız doğrulanmış, susturulmamış; etkinlik iptal değil, donmamış, tayfa salt okunur değil). Sayı sınırı ayrıca denetlenir.
    EventLogEntryCreateRequest:
      type: object
      required: [values, client_request_id]
      additionalProperties: false
      properties:
        values:
          allOf: [{ $ref: "#/components/schemas/EventFieldValues" }]
          description: Kaydın alan değerleri (en fazla 8); zorunlu alanlar verilir.
        location:
          allOf: [{ $ref: "#/components/schemas/LatLng" }]
          description: İsteğe bağlı; yalnızca `location_enabled` günlükte. Kişinin seçtiği nokta.
        location_visibility:
          allOf: [{ $ref: "#/components/schemas/LogLocationVisibility" }]
          description: Yalnızca konumla; yoksa günlüğün varsayılanı.
        photo_upload_id:
          type: string
          format: uuid
          description: |
            İsteğe bağlı: kendi hazır `log_photo` yüklemeniz (bu tayfa için).
            Fotoğrafın konum bilgisi (EXIF/GPS) işlemede silinmiştir; kaydın
            konumu yalnızca `location` ile paylaşılır.
        client_request_id: { type: string, format: uuid }
        vocabulary_ids:
          allOf: [{ $ref: "#/components/schemas/VocabularyIds" }]
          description: |
            Tayfa sözlüğüne bağlı alanlar için var olan değerler (en fazla
            8); aynı alan `values`'ta da verilmez.
    EventMeasure:
      type: object
      required: [unit, scope, entered_by, min, max, decimals, entries, caller_can_edit]
      description: Bir etkinliğin bir ölçüm bileşeni, isteği yapanın gördüğü haliyle (#245).
      properties:
        unit: { type: string, description: "Tanımdaki birim (kapalı liste, `CatalogComponent`); adı istemcinin çeviri dosyasında." }
        scope:
          type: string
          enum: [total, personal]
          description: "`total` etkinlik başına tek değer, `personal` katılımcı başına."
        entered_by:
          type: string
          enum: [self, organizer]
          description: "`self` katılımcı kendi adına girer; `organizer` organizatör ve atanmış hakem girer."
        min: { type: number, description: Değerin alt sınırı (tanımda yoksa 0). }
        max: { type: number, description: Değerin üst sınırı (tanımda yoksa 1000000000). }
        decimals: { type: integer, minimum: 0, maximum: 3, description: Değerin yuvarlandığı ondalık basamak. }
        total: { type: number, description: Toplam ölçümün değeri; yoksa ya da kişisel ölçümde yoktur. }
        total_updated_at: { type: string, format: date-time, description: Toplamın son yazıldığı an; değer yoksa yoktur. }
        entries:
          type: array
          description: Kişisel ölçümün görebildiğiniz değerleri, en eski değişiklik önce; toplam ölçümde boş.
          items: { $ref: "#/components/schemas/EventMeasureEntry" }
        suggested:
          type: number
          description: |
            Önerilen değer (`prefill_from`): etkinlik bittikten sonra, toplam
            ölçümün değeri yokken etkinliğin ilgili alanının değeri. Biri
            yazana kadar ölçüm sayılmaz.
        caller_can_edit:
          type: boolean
          description: Şu an yazabilirsiniz (toplamı, kendi değerinizi ya da herkesinkini; ölçümün kuralına göre). Etkinlik başlamış, iptal değil, donmamış, tayfa salt okunur değil.
    EventMeasureEntry:
      type: object
      required: [user_id, value]
      properties:
        user_id: { type: string, format: uuid, description: Değerin ait olduğu katılımcı. }
        value: { type: number }
        updated_at: { type: string, format: date-time }
    EventMeasureValueRequest:
      type: object
      required: [value]
      additionalProperties: false
      properties:
        value:
          type: number
          minimum: -1000000000
          maximum: 1000000000
          description: Tanımdaki sınırlar içinde; ondalık basamağa yuvarlanır.
    EventGoal:
      type: object
      required: [measure_key, unit, decimals, target_set, progress_hidden, measure_enabled, reached, caller_can_edit]
      description: Bir etkinliğin bir hedef bileşeni, isteği yapanın gördüğü haliyle (#246).
      properties:
        measure_key: { type: string, description: "Hedefin bağlı olduğu ölçümün anahtarı (`EventMeasure`)." }
        unit: { type: string, description: "Bağlı ölçümün birimi (kapalı liste, `CatalogComponent`); adı istemcinin çeviri dosyasında." }
        decimals: { type: integer, minimum: 0, maximum: 3, description: Bağlı ölçümün ondalık basamağı. }
        target: { type: number, description: "Etkinliğin hedefi: organizatörün koyduğu, yoksa tanımdaki varsayılan; ikisi de yoksa yoktur." }
        target_set: { type: boolean, description: "Hedefi organizatör koydu (`false` ise varsayılan ya da hedef yok)." }
        target_updated_at: { type: string, format: date-time, description: Organizatörün hedefi son yazdığı an; yoksa yoktur. }
        default_target: { type: number, description: Tanımdaki varsayılan hedef; yoksa yoktur. }
        current:
          type: number
          description: |
            Bağlı ölçümün kaydedilmiş değeri (toplam ölçüm) ya da değerlerinin
            toplamı (kişisel ölçüm); değer yoksa 0. Önerilen değer sayılmaz.
            `progress_hidden` ya da ölçüm kapalıysa yoktur.
        progress_hidden: { type: boolean, description: "İlerlemeyi göremezsiniz (hassas kişisel ölçüm)." }
        measure_enabled: { type: boolean, description: "Bağlı ölçüm bu etkinlikte açık (isteğe bağlı ölçüm kapalıysa ilerleme yoktur)." }
        reached: { type: boolean, description: "`current` hedefe ulaştı." }
        caller_can_edit:
          type: boolean
          description: Şu an hedefi koyabilirsiniz (organizatör, moderatör, yönetici; etkinlik iptal değil, donmamış, tayfa salt okunur değil).
    EventGoalTargetRequest:
      type: object
      required: [target]
      additionalProperties: false
      properties:
        target:
          type: number
          exclusiveMinimum: 0
          maximum: 1000000000
          description: Bağlı ölçümün biriminde; ondalık basamağına yuvarlanır.
    EventScheduleItem:
      type: object
      required: [id, starts_at, title]
      properties:
        id: { type: string, format: uuid }
        starts_at: { type: string, format: date-time }
        ends_at: { type: string, format: date-time, description: Bitiş saati; yoksa yoktur. }
        title: { type: string, description: 1–120 karakter. }
        note: { type: string, description: En fazla 500 karakter; yoksa yoktur. }
    EventSchedule:
      type: object
      required: [items, max_items, caller_can_edit]
      description: Bir etkinliğin bir program bileşeni, isteği yapanın gördüğü haliyle (#247).
      properties:
        items:
          type: array
          description: Başlangıç saatine göre; aynı saattekiler eklenme sırasıyla.
          items: { $ref: "#/components/schemas/EventScheduleItem" }
        max_items: { type: integer, minimum: 1, maximum: 100, description: "Programın alabileceği madde sayısı (bileşenin `max_items` parametresi; tanım vermezse 100)." }
        caller_can_edit:
          type: boolean
          description: Şu an madde ekleyebilir, düzenleyebilir ve çıkarabilirsiniz (organizatör, moderatör, yönetici; susturulmamış; etkinlik iptal değil, donmamış, tayfa salt okunur değil).
    EventScheduleItemRequest:
      type: object
      required: [starts_at, title]
      additionalProperties: false
      properties:
        starts_at:
          type: string
          format: date-time
          description: Etkinliğin başlangıcından en çok bir gün önce, bitişinden en çok bir gün sonra.
        ends_at:
          type: string
          format: date-time
          description: İsteğe bağlı; başlangıçtan sonra, etkinliğin bitişinden en çok bir gün sonra.
        title: { type: string, minLength: 1, maxLength: 120 }
        note: { type: string, maxLength: 500, description: İsteğe bağlı; boş metin notu kaldırır. }
    EventTeam:
      type: object
      required: [id, position, member_ids]
      properties:
        id: { type: string, format: uuid }
        position: { type: integer, minimum: 1, maximum: 50, description: "Takımın sırası; adsız takımı istemci sırasıyla adlandırır." }
        name: { type: string, description: 1–40 karakter; adsız takımda yoktur. }
        member_ids:
          type: array
          description: Takımdaki ve hâlâ katılımcı olan kişilerin kullanıcı kimlikleri.
          items: { type: string, format: uuid }
    EventTeams:
      type: object
      required: [teams, mode, caller_can_edit]
      description: Bir etkinliğin bir takım bileşeni, isteği yapanın gördüğü haliyle (#248).
      properties:
        teams:
          type: array
          description: Sıraya göre; takım kurulmamışsa boş.
          items: { $ref: "#/components/schemas/EventTeam" }
        mode:
          type: string
          enum: [random, balanced, manual]
          description: Bu etkinlikte geçerli mod (organizatörün seçimi ya da tanımdaki değer; tanım vermezse random).
        team_count: { type: integer, minimum: 1, maximum: 50, description: "Bileşenin `team_count` parametresi; tanım vermezse yoktur." }
        team_size: { type: integer, minimum: 1, maximum: 50, description: "Bileşenin `team_size` parametresi; tanım vermezse yoktur." }
        caller_can_edit:
          type: boolean
          description: Şu an takımları kurabilirsiniz (organizatör, moderatör, yönetici; susturulmamış; etkinlik iptal değil, donmamış, tayfa salt okunur değil).
    EventTeamsRequest:
      type: object
      required: [teams]
      additionalProperties: false
      properties:
        teams:
          type: array
          maxItems: 50
          description: Sırasıyla; boş liste takımları kaldırır.
          items:
            type: object
            additionalProperties: false
            properties:
              name: { type: string, maxLength: 40, description: İsteğe bağlı; boş metin adsız takım. }
              member_ids:
                type: array
                description: Katılımcıların kullanıcı kimlikleri; bir kişi en fazla bir takımda.
                items: { type: string, format: uuid }
    EventTeamsGenerateRequest:
      type: object
      additionalProperties: false
      properties:
        levels:
          type: array
          maxItems: 500
          description: Yalnızca `balanced` modda kullanılır; kişi başına en fazla bir. Saklanmaz.
          items:
            type: object
            required: [user_id, level]
            additionalProperties: false
            properties:
              user_id: { type: string, format: uuid }
              level: { type: integer, minimum: 1, maximum: 5, description: "1 (başlangıç) – 5 (en güçlü)." }
    EventDrawEntry:
      type: object
      required: [position]
      description: Kurada bir yer. Boş yerde (kişi ya da takım geri çekildi) ne `user_id` ne `team_id` vardır.
      properties:
        position: { type: integer, minimum: 1, maximum: 500 }
        user_id: { type: string, format: uuid, description: "Katılımcı kurasında kişinin kullanıcı kimliği." }
        team_id: { type: string, format: uuid, description: "Takım kurasında `teams_key` bileşenindeki takımın kimliği." }
        guest_id: { type: string, format: uuid, description: "Katılımcı kurasında misafir oyuncunun kimliği (`EventGuestPlayer.id`); misafirin yeri boşalmaz." }
    EventDraw:
      type: object
      required: [drawn, subject, entries, caller_can_draw]
      description: Bir etkinliğin bir kura bileşeni, isteği yapanın gördüğü haliyle (#249).
      properties:
        drawn: { type: boolean, description: Kura çekildi. }
        subject:
          type: string
          enum: [participants, teams]
          description: Kuranın sıraladığı (çekilmemişse şu an çekilse sıralayacağı) giriş türü.
        teams_key: { type: string, description: "Yalnızca `teams` kurasında, takım bileşeninin anahtarı." }
        drawn_at: { type: string, format: date-time, description: Yalnızca çekilmiş kurada. }
        entries:
          type: array
          description: Sıraya göre; kura çekilmemişse boş. Ardışık iki yer bir eşleşmedir.
          items: { $ref: "#/components/schemas/EventDrawEntry" }
        caller_can_draw:
          type: boolean
          description: Şu an kurayı çekebilirsiniz (kura çekilmemiş; organizatör, moderatör, yönetici; susturulmamış; etkinlik iptal değil, donmamış, tayfa salt okunur değil).
    EventScoreRules:
      type: object
      description: |
        Yazboz kuralları (#250). Ön ayarda verilmeyen kural boştur ve
        bileşenden gelir; masada ve bileşende hepsi doludur.
      properties:
        side: { type: string, enum: [player, team], description: "Oyuncular kişiler (`player`) ya da takımlar (`team`)." }
        rounds: { type: string, enum: [round, single, first_to], description: "El el, tek maç ya da hedefe ilk ulaşana kadar." }
        winner: { type: string, enum: [high, low, first], description: "Yüksek, düşük toplam ya da hedefe ilk ulaşan kazanır." }
        result: { type: string, enum: [points, wdl], description: "Puan ya da galibiyet (1) / beraberlik (½) / mağlubiyet (0)." }
        target: { type: integer, format: int32, minimum: 1, maximum: 100000, description: Hedef puan; yoksa alan yok. }
        best_of: { type: integer, format: int32, enum: [3, 5], description: "BO maçı; yarıdan fazlasını kazanan kazanır. Yoksa alan yok." }
    EventScorePreset:
      type: object
      required: [key, labels, rules, retired]
      description: Katalogdaki bir yazboz ön ayarı (Batak, 101 Okey …; #250).
      properties:
        key: { type: string, description: "Değişmez anahtar: `^[a-z][a-z0-9_]{1,39}$`." }
        labels: { $ref: "#/components/schemas/CatalogLabels" }
        players_min: { type: integer, format: int32, description: Masanın en az yer sayısı; yoksa alan yok. }
        players_max: { type: integer, format: int32, description: Masanın en çok yer sayısı; yoksa alan yok. }
        rules: { $ref: "#/components/schemas/EventScoreRules" }
        retired: { type: boolean, description: Emekli ön ayar eski masalarda görünür; yeni masa kullanamaz. }
    EventScorePlayer:
      type: object
      required: [id, position]
      description: |
        Masadaki bir yer. Kişi ya da takım; ikisi de yoksa kişi hesabını
        silmiştir ("Silinmiş kullanıcı") ya da takım kaldırılmıştır.
      properties:
        id: { type: string, format: uuid }
        position: { type: integer, format: int32, minimum: 1, maximum: 50 }
        user_id: { type: string, format: uuid }
        team_id: { type: string, format: uuid, description: Takım masasında takım bileşeninin takımı. }
        guest_id: { type: string, format: uuid, description: "Misafir oyuncunun kimliği (`EventGuestPlayer.id`)." }
    EventScoreEntry:
      type: object
      required: [player_id]
      description: Bir yerin bir eldeki skoru.
      properties:
        player_id: { type: string, format: uuid, description: "Yer (`EventScorePlayer.id`)." }
        points: { type: integer, format: int32, description: "Yalnızca `points` modunda." }
        outcome: { type: string, enum: [win, draw, loss], description: "Yalnızca `wdl` modunda." }
    EventScoreRound:
      type: object
      required: [number, scores]
      properties:
        number: { type: integer, format: int32, minimum: 1, maximum: 200 }
        scores:
          type: array
          items: { $ref: "#/components/schemas/EventScoreEntry" }
    EventScoreStanding:
      type: object
      required: [player_id, total, rounds_won, rank]
      properties:
        player_id: { type: string, format: uuid }
        total: { type: number, format: double, description: "Puan toplamı; `wdl` modunda galibiyet 1, beraberlik 0.5." }
        rounds_won: { type: integer, format: int32, description: Tek başına kazanılan el sayısı; BO maçında kazananı belirler. }
        rank: { type: integer, format: int32, description: 1'den başlar; eşitler aynı sırayı paylaşır. }
    EventScoreTable:
      type: object
      required: [id, label, rules, status, created_at, players, rounds, standings, winner_ids, caller_can_score]
      description: Yazbozun bir masası (#250).
      properties:
        id: { type: string, format: uuid }
        label: { type: string, minLength: 1, maxLength: 30 }
        preset_key: { type: string, description: Masanın ön ayarı; yoksa alan yok. }
        rules: { $ref: "#/components/schemas/EventScoreRules" }
        teams_key: { type: string, description: "Yalnızca takım masasında, takım bileşeninin anahtarı." }
        status: { type: string, enum: [open, finished] }
        finished_at: { type: string, format: date-time, description: Yalnızca biten masada. }
        created_at: { type: string, format: date-time }
        players:
          type: array
          maxItems: 50
          description: Sıraya göre.
          items: { $ref: "#/components/schemas/EventScorePlayer" }
        rounds:
          type: array
          maxItems: 200
          description: El numarasına göre.
          items: { $ref: "#/components/schemas/EventScoreRound" }
        standings:
          type: array
          description: Sıralamaya, sonra yer sırasına göre.
          items: { $ref: "#/components/schemas/EventScoreStanding" }
        winner_ids:
          type: array
          description: Biten masada birinci sıradaki yerler (beraberlikte birden çok); açık masada boş.
          items: { type: string, format: uuid }
        caller_can_score:
          type: boolean
          description: Şu an el girebilir ve masayı bitirebilirsiniz (organizatör, moderatör, yönetici ya da masanın hakemi; susturulmamış; masa açık; etkinlik başlamış, iptal değil, donmamış; tayfa salt okunur değil).
    EventScoreboard:
      type: object
      required: [tables, presets, rules, max_tables, caller_can_manage]
      description: Bir etkinliğin bir yazboz bileşeni, isteği yapanın gördüğü haliyle (#250).
      properties:
        tables:
          type: array
          maxItems: 20
          description: Kuruluş sırasıyla.
          items: { $ref: "#/components/schemas/EventScoreTable" }
        presets:
          type: array
          description: Bileşenin sunduğu ve masaların kullandığı ön ayarlar, katalog sırasıyla.
          items: { $ref: "#/components/schemas/EventScorePreset" }
        rules: { $ref: "#/components/schemas/EventScoreRules" }
        max_tables: { type: integer, format: int32, description: "20; bileşenin `tables` parametresi kapalıysa 1." }
        caller_can_manage:
          type: boolean
          description: Şu an masaları yönetebilir ve skor düzeltebilirsiniz (organizatör, moderatör, yönetici; susturulmamış; etkinlik iptal değil, donmamış; tayfa salt okunur değil).
    EventScorePlayerInput:
      type: object
      description: |
        Bir yer; `user_id`, `team_id` ve `guest_id`'den tam olarak biri.
        Misafir yalnızca kişi masasına ve misafir alan (`guests`) bileşene
        oturur (`guest-players-disabled`); etkinliğin misafiri değilse
        `guest-player-not-found`.
      properties:
        user_id: { type: string, format: uuid }
        team_id: { type: string, format: uuid }
        guest_id: { type: string, format: uuid }
    EventScoreTableRequest:
      type: object
      required: [label]
      properties:
        label: { type: string, minLength: 1, maxLength: 30 }
        preset_key: { type: string, description: Bileşen ön ayar sunuyorsa zorunlu; sunmuyorsa verilmez. }
        target: { type: integer, format: int32, minimum: 0, maximum: 100000, description: Hedef puanı değiştirir; 0 ya da yok kuraldakini korur. }
        teams_key: { type: string, description: "Takım masasında zorunlu: etkinliğin türündeki `teams` bileşeninin anahtarı." }
        players:
          type: array
          maxItems: 50
          description: Sırasıyla; boş ya da yoksa yerler sonra verilir.
          items: { $ref: "#/components/schemas/EventScorePlayerInput" }
    EventScoreTableUpdate:
      type: object
      description: En az bir alan.
      properties:
        label: { type: string, minLength: 1, maxLength: 30 }
        status: { type: string, enum: [open, finished] }
    EventScorePlayersRequest:
      type: object
      required: [players]
      properties:
        players:
          type: array
          maxItems: 50
          items: { $ref: "#/components/schemas/EventScorePlayerInput" }
    EventScoreRoundRequest:
      type: object
      required: [scores]
      properties:
        scores:
          type: array
          minItems: 1
          maxItems: 50
          items: { $ref: "#/components/schemas/EventScoreEntry" }
    EventGuestPlayer:
      type: object
      required: [id, created_at]
      description: |
        Misafir oyuncu: uygulamada hesabı olmayan, yalnızca takma adla
        oynayan kişi. Profili, kişisel kaydı ve iletişim alanı yoktur;
        istatistiğe girmez.
      properties:
        id: { type: string, format: uuid }
        nickname:
          type: string
          maxLength: 24
          description: "Takma ad. Etkinliğin bitiminden 30 gün sonra (ya da ekleyen hesabını silince) silinir ve alan yer almaz; istemci adsız misafir gösterir."
        created_at: { type: string, format: date-time }
    EventGuestPlayers:
      type: object
      required: [guests, max_guests, caller_can_add, caller_can_remove]
      properties:
        guests:
          type: array
          description: Eklenme sırasıyla.
          items: { $ref: "#/components/schemas/EventGuestPlayer" }
        max_guests: { type: integer, format: int32, description: Etkinlik başına en fazla misafir (30). }
        caller_can_add: { type: boolean, description: "Çağıran şimdi masa vermeden misafir ekleyebilir (organizatör, moderatör, yönetici ya da etkinliğin veya bileşenin hakemi). Masanın hakemi `table_id` ile ekler." }
        caller_can_remove: { type: boolean, description: "Çağıran şimdi misafir silebilir (organizatör, moderatör, yönetici)." }
    EventGuestPlayerRequest:
      type: object
      required: [nickname]
      properties:
        nickname: { type: string, minLength: 1, maxLength: 24, description: Baştaki ve sondaki boşluk atılır; denetim ve biçim karakterleri reddedilir. }
        table_id: { type: string, format: uuid, description: "Ekleyen masanın hakemiyse o masa (`EventScoreTable.id`); organizatör ve etkinliğin ya da bileşenin hakemi vermez." }
    EventBracketEntrant:
      type: object
      required: [position]
      description: Eşleşme ağacının tohumlandığı kuradaki bir yer. Boş yerde (kişi ya da takım geri çekildi) ne `user_id` ne `team_id` vardır.
      properties:
        position: { type: integer, format: int32, minimum: 1, maximum: 500 }
        user_id: { type: string, format: uuid, description: "Katılımcı kurasında kişinin kullanıcı kimliği." }
        team_id: { type: string, format: uuid, description: "Takım kurasında takımın kimliği." }
        guest_id: { type: string, format: uuid, description: "Katılımcı kurasında misafir oyuncunun kimliği (`EventGuestPlayer.id`)." }
    EventBracketGame:
      type: object
      required: [number]
      description: Maçın bir oyunu.
      properties:
        number: { type: integer, format: int32, minimum: 1, maximum: 9 }
        a_points: { type: integer, format: int32, description: "Yalnızca `points` kuralında." }
        b_points: { type: integer, format: int32, description: "Yalnızca `points` kuralında." }
        a_outcome: { type: string, enum: [win, draw, loss], description: "Yalnızca `wdl` kuralında; B tarafınınki tersidir." }
    EventBracketMatch:
      type: object
      required: [id, round, slot, games, decided, bye, a_total, b_total, a_games_won, b_games_won, caller_can_score]
      description: Eşleşme ağacının bir maçı (#251). Taraflar kuradaki yerlerdir.
      properties:
        id: { type: string, format: uuid }
        round: { type: integer, format: int32, minimum: 1 }
        slot: { type: integer, format: int32, minimum: 1, description: Maçın turdaki sırası. }
        a_position: { type: integer, format: int32, description: "A tarafının kuradaki yeri; yoksa (bay) alan yok." }
        b_position: { type: integer, format: int32, description: "B tarafının kuradaki yeri; yoksa (bay) alan yok." }
        games:
          type: array
          items: { $ref: "#/components/schemas/EventBracketGame" }
        decided: { type: boolean, description: "Maç sonuçlandı: kazanan, beraberlik (elemede yok) ya da bay." }
        bye: { type: boolean, description: En fazla bir taraflı maç. }
        winner_position: { type: integer, format: int32, description: "Kazananın yeri; beraberlikte, sonuçlanmamış maçta ya da tarafsız maçta alan yok." }
        a_total: { type: number, format: double, description: "Tarafın toplamı; `wdl` kuralında galibiyet 1, beraberlik 0.5." }
        b_total: { type: number, format: double }
        a_games_won: { type: integer, format: int32, description: Tarafın tek başına kazandığı oyun sayısı. }
        b_games_won: { type: integer, format: int32 }
        caller_can_score:
          type: boolean
          description: Şu an bu maça oyun girebilirsiniz (organizatör, moderatör, yönetici ya da maçın hakemi; mevcut turun sonuçlanmamış maçı; etkinlik başlamış, iptal değil, donmamış, tayfa salt okunur değil).
    EventBracketStanding:
      type: object
      required: [position, played, won, drawn, lost, points, head_to_head, buchholz, rank]
      description: Lig ya da İsviçre sıralamasında bir katılımcı.
      properties:
        position: { type: integer, format: int32, description: Kuradaki yeri. }
        played: { type: integer, format: int32 }
        won: { type: integer, format: int32 }
        drawn: { type: integer, format: int32 }
        lost: { type: integer, format: int32 }
        points: { type: number, format: double, description: "Galibiyet 1, beraberlik 0.5, bay 1." }
        head_to_head: { type: number, format: double, description: Puanca eşit olanlara karşı alınan puan. }
        buchholz: { type: number, format: double, description: Rakiplerin puanları toplamı. }
        rank: { type: integer, format: int32, description: "1'den başlar; üçünde de eşit olanlar aynı sırayı paylaşır." }
    EventBracket:
      type: object
      required: [started, format, best_of, result, winner, drawn, rounds, current_round, entrants, matches, standings, finished, winner_positions, caller_can_manage]
      description: Bir etkinliğin bir eşleşme ağacı bileşeni, isteği yapanın gördüğü haliyle (#251).
      properties:
        started: { type: boolean, description: Eşleşme ağacı başlatıldı. }
        format: { type: string, enum: [elimination, league, swiss], description: "Eleme, lig ya da İsviçre; başlamamışsa başlatılırsa alınacak olan." }
        best_of: { type: integer, format: int32, enum: [1, 3, 5], description: Maç başına oyun (BO1/BO3/BO5). }
        result: { type: string, enum: [points, wdl], description: "Oyun puanla mı galibiyet/beraberlik/mağlubiyetle mi skorlanır." }
        winner: { type: string, enum: [high, low], description: "`points` kuralında yüksek ya da düşük puan kazanır." }
        draw_key: { type: string, description: Tohumların geldiği kura bileşeninin anahtarı; türde kura yoksa alan yok. }
        drawn: { type: boolean, description: "Kura çekildi; `subject`, `teams_key` ve `entrants` onundur." }
        subject: { type: string, enum: [participants, teams] }
        teams_key: { type: string, description: "Yalnızca takım kurasında, takım bileşeninin anahtarı." }
        rounds: { type: integer, format: int32, description: "Planlanan tur: ligin turları, İsviçre'de oynanacak tur, elemede en çok tur." }
        current_round: { type: integer, format: int32, description: Eşlenmiş son tur; başlamamışsa 0. }
        started_at: { type: string, format: date-time, description: Yalnızca başlamış eşleşme ağacında. }
        entrants:
          type: array
          description: Kuradaki yerler, sıraya göre.
          items: { $ref: "#/components/schemas/EventBracketEntrant" }
        matches:
          type: array
          description: Tura ve sıraya göre.
          items: { $ref: "#/components/schemas/EventBracketMatch" }
        standings:
          type: array
          description: Lig ya da İsviçre sıralaması (puan → aralarındaki maç → Buchholz); elemede boş.
          items: { $ref: "#/components/schemas/EventBracketStanding" }
        finished: { type: boolean, description: Eşleşme ağacı sonuçlandı. }
        winner_positions:
          type: array
          description: Sonuçlandıysa kazananların kuradaki yerleri (elemede son kazanan, lig ve İsviçre'de birinci; tam eşitlikte birden çok); öncesinde boş.
          items: { type: integer, format: int32 }
        caller_can_manage:
          type: boolean
          description: Şu an başlatabilir, sonraki turu eşleyebilir, düzeltebilir ve sıfırlayabilirsiniz (organizatör, moderatör, yönetici; susturulmamış; etkinlik iptal değil, donmamış, tayfa salt okunur değil).
    EventBracketGameRequest:
      type: object
      description: "`points` kuralında `a_points` ve `b_points` birlikte, `wdl` kuralında yalnızca `a_outcome`."
      additionalProperties: false
      properties:
        a_points: { type: integer, format: int32, minimum: -1000000, maximum: 1000000 }
        b_points: { type: integer, format: int32, minimum: -1000000, maximum: 1000000 }
        a_outcome: { type: string, enum: [win, draw, loss] }
    EventRanking:
      type: object
      required: [direction, decimals, entries, hidden, measure_enabled, caller_can_edit]
      description: Bir etkinliğin bir derece bileşeni, isteği yapanın gördüğü haliyle (#253).
      properties:
        source: { type: string, description: "Derecenin hesaplandığı kişisel ölçümün anahtarı (`EventMeasure`); elle girilen derecede yoktur." }
        metric:
          type: string
          enum: [duration, rank]
          description: "Elle girilen derecenin ölçütü: `duration` süre (saniye), `rank` sıra. Ölçümden hesaplanan derecede yoktur."
        direction:
          type: string
          enum: [asc, desc]
          description: "`asc` en küçük değer önde (süre, sıra), `desc` en büyük değer önde."
        unit: { type: string, description: "Ölçümden hesaplanan derecede ölçümün birimi (kapalı liste); elle girilen derecede yoktur." }
        decimals: { type: integer, minimum: 0, maximum: 3, description: "Değerin ondalık basamağı: ölçümünki ya da ölçütünkü (`duration` 2, `rank` 0)." }
        entries:
          type: array
          description: Katılımcılar sırayla, en iyi önde; gizliyken ya da kaynak ölçüm kapalıyken boş.
          items: { $ref: "#/components/schemas/EventRankingEntry" }
        hidden: { type: boolean, description: "Derece hassas bir ölçümden hesaplanıyor ve ölçümün bütün değerlerini göremiyorsunuz." }
        measure_enabled: { type: boolean, description: "Ölçümden hesaplanan derecede kaynak ölçüm bu etkinlikte açık; elle girilen derecede her zaman `true`." }
        caller_can_edit:
          type: boolean
          description: Şu an değer girebilirsiniz (yalnızca elle girilen derecede; organizatör, moderatör, yönetici ya da atanmış hakem). Etkinlik başlamış, iptal değil, donmamış, tayfa salt okunur değil.
    EventRankingEntry:
      type: object
      required: [user_id, value, rank]
      properties:
        user_id: { type: string, format: uuid, description: Derecenin ait olduğu katılımcı. }
        value: { type: number, description: "Süre (saniye), sıra ya da ölçümün değeri." }
        rank: { type: integer, format: int32, minimum: 1, description: "Sıra; eşit değerler aynı sırayı paylaşır (1, 1, 3)." }
        updated_at: { type: string, format: date-time }
    EventRankingValueRequest:
      type: object
      required: [value]
      additionalProperties: false
      properties:
        value:
          type: number
          exclusiveMinimum: 0
          maximum: 1000000
          description: "`duration` ölçütünde saniye (iki basamağa yuvarlanır, en çok 1000000), `rank` ölçütünde 1–10000 arası tam sayı."
    EventCelebration:
      type: object
      required: [winners, hidden, announced, caller_can_announce]
      description: Bir etkinliğin bir kutlama bileşeni, isteği yapanın gördüğü haliyle (#255).
      properties:
        source: { type: string, description: "Kazananların okunduğu bileşenin anahtarı; elle seçilen kazananlarda yoktur." }
        source_kind:
          type: string
          enum: [scoreboard, bracket, ranking, vote]
          description: Kaynak bileşenin türü; elle seçilen kazananlarda yoktur.
        winners:
          type: array
          description: Kazananlar; kaynağın sırasıyla (masalar sırayla, eşitlikte yer sırası) ya da elle verilen sırayla. Kaynak sonuçlanmadıysa, elle seçilmediyse ve gizliyken boş.
          items: { $ref: "#/components/schemas/EventCelebrationWinner" }
        hidden: { type: boolean, description: "Kaynak sonucunu herkesten gizliyor (hassas ölçüm) ya da türün katılımı hassas." }
        announced: { type: boolean, description: Organizatör kazananı ilan etti. }
        announced_at: { type: string, format: date-time, description: "Yalnızca ilan edildiyse; ilk ilan zamanı." }
        caller_can_announce:
          type: boolean
          description: Şu an ilan edebilirsiniz (organizatör, moderatör, yönetici; etkinlik başlamış, iptal değil, donmamış, tayfa salt okunur değil). Kazanan olup olmadığı `winners`'tadır.
    EventCelebrationWinner:
      type: object
      description: "Bir kazanan: `user_id`, `team_id` ve `guest_id`'den tam olarak biri vardır."
      properties:
        user_id: { type: string, format: uuid }
        team_id: { type: string, format: uuid, description: Kaynağın oturttuğu takım bileşenindeki takım. }
        guest_id: { type: string, format: uuid, description: Etkinliğin misafir oyuncusu; takma adı etkinliğin misafirlerinden okunur. }
        table_id: { type: string, format: uuid, description: "Yalnızca yazboz kaynağında; kazanılan masa." }
    EventCelebrationRequest:
      type: object
      additionalProperties: false
      properties:
        winner_ids:
          type: array
          maxItems: 10
          description: Yalnızca kaynaksız kutlamada, elle seçilen kazananlar (etkinliğin katılımcıları, 1–10 farklı kişi).
          items: { type: string, format: uuid }
    EventQuestion:
      type: object
      required: [id, body, anonymous, caller_is_author, vote_count, caller_voted, created_at, caller_can_remove]
      description: Bir etkinlik sorusu, isteği yapanın gördüğü haliyle (#256).
      properties:
        id: { type: string, format: uuid }
        body: { type: string, minLength: 1, maxLength: 500 }
        anonymous: { type: boolean, description: "Anonim soru; `author_id` hiçbir zaman verilmez." }
        author_id: { type: string, format: uuid, description: Soran; anonim soruda yoktur (yazara ve yönetime de). }
        caller_is_author: { type: boolean, description: Soruyu siz sordunuz. }
        vote_count: { type: integer, minimum: 0 }
        caller_voted: { type: boolean, description: Bu soruya oy verdiniz. }
        answered_at: { type: string, format: date-time, description: Yalnızca cevaplandı işaretliyse. }
        created_at: { type: string, format: date-time }
        caller_can_remove: { type: boolean, description: Soruyu şu an kaldırabilirsiniz. }
    EventQuestionList:
      type: object
      required: [questions, anonymous_allowed, caller_can_ask, caller_can_mark_answered, max_questions_per_person]
      description: Bir etkinliğin bir soru toplama bileşeninin soruları (#256).
      properties:
        questions:
          type: array
          maxItems: 500
          description: Cevaplanmamışlar önce, sonra çok oy alan, sonra eski.
          items: { $ref: "#/components/schemas/EventQuestion" }
        anonymous_allowed: { type: boolean, description: "Bileşenin `anonymous` parametresi; açıksa soru anonim sorulabilir." }
        caller_can_ask:
          type: boolean
          description: Şu an soru sorabilir ve oy verebilirsiniz (`going` ya da katılımı doğrulanmış, susturulmamış; etkinlik iptal değil, donmamış, tayfa salt okunur değil). Sayı sınırları ayrıca denetlenir.
        caller_can_mark_answered: { type: boolean, description: Şu an soruları cevaplandı işaretleyebilirsiniz. }
        max_questions_per_person: { type: integer, minimum: 1, description: Kişi başına en fazla soru. }
    EventQuestionCreateRequest:
      type: object
      required: [body, client_request_id]
      additionalProperties: false
      properties:
        body: { type: string, minLength: 1, maxLength: 2256, description: "Soru; kırpıldıktan ve iç boşluklar teke indirildikten sonra 1–500 karakter." }
        anonymous: { type: boolean, default: false, description: "Yalnızca `anonymous_allowed` bileşende." }
        client_request_id: { type: string, format: uuid }
    VocabularyIds:
      type: object
      description: Alan anahtarı → tayfa sözlüğündeki değerin kimliği (#244).
      maxProperties: 8
      additionalProperties: { type: string, format: uuid }
    TayfaVocabularyValue:
      type: object
      required: [id, value]
      description: Tayfa sözlüğünde bir değer (#244).
      properties:
        id: { type: string, format: uuid }
        value: { type: string, minLength: 1, maxLength: 60 }
        merged_into_id:
          type: string
          format: uuid
          description: Yalnızca birleştirilmiş değerde, gösterildiği değer.
        merged_into_value: { type: string, description: "Yalnızca birleştirilmiş değerde, hedefin metni." }
    TayfaVocabularyList:
      type: object
      required: [values, caller_can_merge]
      properties:
        values:
          type: array
          maxItems: 20
          items: { $ref: "#/components/schemas/TayfaVocabularyValue" }
        caller_can_merge: { type: boolean, description: Şu an değerleri birleştirebilir ve geri alabilirsiniz. }
    TayfaVocabularyMergeRequest:
      type: object
      required: [target_id]
      additionalProperties: false
      properties:
        target_id: { type: string, format: uuid, description: Birleştirilmemiş hedef değer. }

    EventTypeKey:
      type: string
      description: |
        Etkinlik türü: katalogdaki bir türün anahtarı (`GET /v1/catalog`).
        Kapalı liste değildir; yeni tür sürüm çıkmadan eklenir (ADR-0025).
      pattern: "^[a-z][a-z0-9_]{1,39}$"
    EventFieldValues:
      type: object
      description: |
        Türün alanlarının değerleri: alan anahtarı → değer. Alanlar
        etkinliğin tür sürümünün tanımındadır (`CatalogDefinition.fields`);
        değerin biçimi alanın `kind`'ine göredir (`CatalogField` tablosu):
        metin, sayı, `true`/`false`, `YYYY-MM-DD` ya da metin dizisi. Değeri
        olmayan alan nesnede yer almaz; `null` gönderilmez.
      additionalProperties: true

    ComponentChoice:
      type: object
      required: [param, value]
      additionalProperties: false
      description: |
        Organizatöre bırakılan bir parametre için seçim (ADR-0037 §2).
        `value` seçeneğin metin halidir: seçeneğin kendisi ya da tam sayı
        seçeneğin rakamları (`"swiss"`, `"3"`).
      properties:
        param: { type: string, pattern: "^[a-z][a-z0-9_]{1,39}$" }
        value: { type: string, minLength: 1, maxLength: 40 }
    EventComponentSelection:
      type: object
      required: [key]
      additionalProperties: false
      description: Yeni etkinlikte bir bileşen için organizatörün seçimi.
      properties:
        key: { type: string, pattern: "^[a-z][a-z0-9_]{1,39}$", description: "Bileşenin anahtarı (`CatalogComponent.key`; yoksa `kind`)." }
        enabled: { type: boolean, description: "`optional` bileşeni açar ya da kapatır; gönderilmezse tanımdaki varsayılan." }
        choices:
          type: array
          maxItems: 20
          items: { $ref: "#/components/schemas/ComponentChoice" }
    EventComponentSelectionRequest:
      type: object
      additionalProperties: false
      description: En az biri bulunur.
      properties:
        enabled: { type: boolean, description: "`optional` bileşeni açar ya da kapatır." }
        choices:
          type: array
          maxItems: 20
          items: { $ref: "#/components/schemas/ComponentChoice" }
    EventComponentChoiceState:
      type: object
      required: [param, value, options]
      properties:
        param: { type: string }
        value: { type: string, description: "Geçerli seçenek: organizatörün seçimi ya da tanımdaki varsayılan." }
        options:
          type: array
          description: Tanımdaki seçenekler, tanımdaki sırayla.
          items: { type: string }
    EventComponentState:
      type: object
      required: [key, kind, optional, enabled, choices]
      properties:
        key: { type: string }
        kind: { type: string, description: "Bileşen türü (`CatalogComponent.kind`)." }
        optional: { type: boolean, description: "Organizatör bileşeni açıp kapatabilir." }
        enabled: { type: boolean, description: "Yalnızca kapatılmış `optional` bileşende `false`." }
        choices:
          type: array
          description: Organizatöre bırakılan her parametre, ada göre.
          items: { $ref: "#/components/schemas/EventComponentChoiceState" }
    EventComponentList:
      type: object
      required: [components, locked, caller_can_manage]
      properties:
        components:
          type: array
          items: { $ref: "#/components/schemas/EventComponentState" }
        locked: { type: boolean, description: "Seçimler artık değişmez: etkinlik başladı ya da iptal edildi, ya da tayfa salt okunur." }
        caller_can_manage: { type: boolean, description: "Çağıran organizatör, moderatör ya da yöneticidir ve susturulmamıştır." }
    EventReferee:
      type: object
      required: [id, user_id, created_at]
      properties:
        id: { type: string, format: uuid }
        user_id: { type: string, format: uuid }
        component_key: { type: string, description: "Yoksa atama etkinliğin bütün bileşenleri içindir." }
        scope_id: { type: string, format: uuid, description: "Bileşenin bir kapsamı (masa, maç); yoksa bileşenin tamamı." }
        created_at: { type: string, format: date-time }
    EventRefereeList:
      type: object
      required: [referees]
      properties:
        referees:
          type: array
          items: { $ref: "#/components/schemas/EventReferee" }
    EventRefereeAssignRequest:
      type: object
      required: [user_id]
      additionalProperties: false
      properties:
        user_id: { type: string, format: uuid, description: "Tayfanın etkin bir üyesi." }
        component_key: { type: string, pattern: "^[a-z][a-z0-9_]{1,39}$" }
        scope_id: { type: string, format: uuid, description: "`component_key` ile birlikte verilir." }

    Recurrence:
      type: object
      required: [rrule]
      additionalProperties: false
      properties:
        rrule:
          type: string
          maxLength: 256
          description: |
            RFC 5545 RRULE alt kümesi: `FREQ=WEEKLY|MONTHLY`, `INTERVAL=1..52`,
            `BYDAY` (aylıkta sıralı: `2SA`, `-1FR`), `COUNT=1..500` ya da
            `UNTIL=YYYYMMDDTHHMMSSZ` (en fazla beş yıl), `WKST=MO`.
            `starts_at` ilk tekrardır ve kurala uymalıdır.
        time_zone:
          type: string
          maxLength: 64
          description: IANA adı; boşsa `Europe/Istanbul`. Yerel saat yaz saatinde korunur.

    Event:
      type: object
      required: [id, tayfa_id, type, type_version, mode, title, description, starts_at, ends_at, open_ended, capacity, status, discoverable, going_count, maybe_count, waitlist_count, caller_can_manage, series_override, created_at, updated_at]
      description: |
        Bir etkin üyenin gördüğü etkinlik. `type` katalog anahtarıdır;
        etkinlik oluşturulduğu tür sürümüne (`type_version`) bağlıdır ve o
        sürümün tanımıyla gösterilir (güncel katalogda yoksa
        `GET /v1/catalog/event-types/{key}/versions/{version}`). `fields`
        yalnızca tek etkinlik yanıtında gelir. Konvoyun rotası ve
        araçları bileşenlerindedir (`route`, `vehicles`); kampın listesi
        `checklist` bileşenindedir, kamp yeri, su, tuvalet ve notlar
        `fields`'tadır (`site_name`, `has_water`, `has_toilet`, `notes`;
        #241). Yürüyüşün yoklaması ve beklenen dönüşü `roll_call`
        bileşenindedir; zorluk, planlanan mesafe ve irtifa `fields`'tadır
        (`difficulty`, `planned_distance`, `planned_elevation`; #242).
        Balık etkinliğinin av günlüğü `log` bileşenindedir (`catches`; #243).
      properties:
        cover_upload_id: { type: string, format: uuid, description: "Kapak; linkleri `POST /v1/media/urls`. Serinin ürettiği etkinliklerde yoktur." }
        id: { type: string, format: uuid }
        tayfa_id: { type: string, format: uuid }
        type: { $ref: "#/components/schemas/EventTypeKey" }
        type_version:
          type: integer
          format: int32
          minimum: 1
          description: Etkinliğin oluşturulduğu tür sürümü; etkinlik boyunca değişmez.
        fields: { $ref: "#/components/schemas/EventFieldValues" }
        mode: { $ref: "#/components/schemas/EventMode" }
        title: { type: string }
        description: { type: string }
        starts_at: { type: string, format: date-time }
        ends_at: { type: string, format: date-time }
        open_ended:
          type: boolean
          description: |
            `starts_now` ile açılmış ve organizatörün henüz bitirmediği
            etkinlik (ADR-0038 §1): `ends_at` planlanmış bitiş değil, en geç
            bitiştir (başlangıçtan 12 saat sonra); etkinlik o anda
            kendiliğinden biter. Kendiliğinden bittikten sonra da `true`
            kalır; etkinliğin sürüp sürmediği `ends_at` ile şimdiye bakılarak
            anlaşılır. Organizatör `POST …/finish` ile bitirir.
        meeting_point_name: { type: string }
        meeting_point: { $ref: "#/components/schemas/LatLng" }
        city: { type: string }
        district: { type: string }
        online_url: { type: string, description: Çevrimiçi etkinlikte. }
        capacity: { type: integer, description: "0: sınırsız." }
        status: { type: string, enum: [scheduled, cancelled] }
        cancelled_at: { type: string, format: date-time }
        cancel_reason: { type: string }
        discoverable:
          type: boolean
          description: |
            Organizatörün işareti: etkinlik halka açık bir yerde buluşur ve
            Keşfet'te görünebilir (ADR-0033). Yalnızca yüz yüze etkinlikte
            etkilidir; özel adreste buluşan etkinlik işaretlenmez.
        created_by_user_id:
          type: string
          format: uuid
          description: Organizatör; hesabı silindiyse yoktur.
        going_count: { type: integer }
        maybe_count: { type: integer }
        waitlist_count: { type: integer }
        caller_rsvp:
          allOf: [{ $ref: "#/components/schemas/RsvpStatus" }]
          description: Sizin cevabınız; cevap vermediyseniz yoktur.
        caller_can_manage:
          type: boolean
          description: Düzenleyip iptal edebilir misiniz (istemcinin doğru işlemleri göstermesi için; sunucu her istekte yeniden kontrol eder).
        caller_attendance:
          allOf: [{ $ref: "#/components/schemas/AttendanceStatus" }]
          description: Doğrulanmış katılımınız; yoksa yoktur.
        series_id: { type: string, format: uuid, description: Tekrarlayan serinin etkinliğiyse. }
        series_override: { type: boolean, description: Seriden ayrı düzenlendi; seri değişiklikleri ona dokunmaz. }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    EventList:
      type: object
      required: [events]
      properties:
        events:
          type: array
          items: { $ref: "#/components/schemas/Event" }
        next_page_token: { type: string }

    EventCreateRequest:
      type: object
      required: [type, mode, title, client_request_id]
      additionalProperties: false
      description: |
        `starts_at` ve `ends_at` zorunludur; `starts_now` `true` ise ikisi
        de gönderilmez.
        Yüz yüze: `meeting_point`, `city`, `district` zorunlu; `online_url`
        boş. Çevrimiçi: `online_url` (https) zorunlu; yer alanları boş.
        `type` katalogdaki aktif bir türün anahtarıdır; etkinlik türün
        güncel sürümüyle oluşturulur ve `mode` türün izin verdiği modlardan
        biri olmalıdır. `fields` türün tanımına göre doğrulanır: zorunlu
        alanlar verilir, tanımda olmayan alan gönderilmez (ör. `gaming`:
        `game`, `platform`; `sports`: `sport`, `venue_name`; `camp`:
        `site_name`, `has_water`, `has_toilet`, `notes`; `hike`:
        `difficulty`, `planned_distance`, `planned_elevation`). Türe özel
        ayrıntı nesnesi yoktur (#243). Rota ve
        yürüyüşün beklenen dönüşü etkinlik oluşturulduktan sonra
        bileşenlerinden (`route`, `roll_call`) yazılır.
      properties:
        cover_upload_id: { type: string, format: uuid, description: "İsteğe bağlı: kendi hazır `cover` yüklemeniz (bu tayfa için açılmış). Yalnızca bu etkinliğe bağlanır." }
        components:
          type: array
          maxItems: 20
          description: |
            Organizatörün bileşen seçimleri (ADR-0037 §2): `optional`
            bileşenlerin açık/kapalı hali ve organizatöre bırakılan
            parametreler. Gönderilmeyen bileşen tanımdaki varsayılanla
            başlar. Türde olmayan ya da tekrar eden bileşen, `optional`
            olmayan bileşeni kapatmak ve geçersiz seçim `invalid-request`.
            Sonradan `PUT …/components/{component_key}` ile, etkinlik
            başlayana kadar değişir.
          items: { $ref: "#/components/schemas/EventComponentSelection" }
        type: { $ref: "#/components/schemas/EventTypeKey" }
        fields: { $ref: "#/components/schemas/EventFieldValues" }
        mode: { $ref: "#/components/schemas/EventMode" }
        title:
          type: string
          minLength: 1
          maxLength: 120
          description: Baştaki ve sondaki boşluklar atıldıktan sonra 1–120 karakter.
        description: { type: string, maxLength: 5000 }
        starts_at: { type: string, format: date-time, description: "Gelecekte, en fazla iki yıl ileri. `starts_now` ile gönderilmez." }
        ends_at: { type: string, format: date-time, description: "Başlangıçtan sonra, en fazla 30 gün. `starts_now` ile gönderilmez." }
        starts_now:
          type: boolean
          description: |
            Şimdi başlat (ADR-0038 §1): etkinlik sunucu saatiyle şimdi başlar
            (istemci saati kullanılmaz) ve açık uçludur (`open_ended`):
            `ends_at` 12 saat sonrasına yazılır, organizatör
            `POST …/finish` ile bitirir. `starts_at`, `ends_at` ve
            `recurrence` gönderilmez, `discoverable` `true` olamaz
            (`invalid-request`). Tayfada etkinlik açma izni yerine tayfanın
            `now_create_min_role` ayarı geçerlidir. Kişi başına aynı anda en
            fazla bir açık şimdi etkinliği (tayfa içi ve anlık toplam):
            aşılırsa `now-limit-reached`. Yüz yüzede buluşma noktası yine
            zorunludur; istemcinin cihaz konumuyla önerip kullanıcının
            onayladığı noktadır, cihaz konumu ayrıca gönderilmez.
        meeting_point_name: { type: string, maxLength: 120 }
        meeting_point: { $ref: "#/components/schemas/LatLng" }
        city: { type: string, maxLength: 50 }
        district: { type: string, maxLength: 50 }
        online_url: { type: string, maxLength: 2048 }
        capacity: { type: integer, minimum: 0, maximum: 10000, description: "0: sınırsız." }
        discoverable:
          type: boolean
          description: |
            Organizatörün işareti: etkinlik halka açık bir yerde buluşur ve
            Keşfet'te görünebilir (ADR-0033). Yalnızca yüz yüze etkinlikte
            etkilidir; özel adreste buluşan etkinlik işaretlenmez.
        recurrence: { $ref: "#/components/schemas/Recurrence" }
        client_request_id:
          type: string
          format: uuid
          description: İstemcinin her açma denemesi için bir kez ürettiği, tekrar gönderimde aynen kullandığı UUID.

    EventUpdateRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      description: |
        Kurallar açmadakiyle aynıdır; tür ve tür sürümü değişmez. `fields`
        verilirse alan değerlerinin TAMAMI yerine geçer (etkinliğin kendi tür
        sürümüne göre doğrulanır); `{}` bütün değerleri kaldırır.
      properties:
        fields: { $ref: "#/components/schemas/EventFieldValues" }
        cover_upload_id:
          type: string
          description: |
            Kendi hazır `cover` yüklemeniz; `""` kapağı kaldırır, eski kapak
            silinir. `apply_to_series: true` ile verilemez.
        title: { type: string, minLength: 1, maxLength: 120 }
        description: { type: string, maxLength: 5000 }
        starts_at: { type: string, format: date-time }
        ends_at: { type: string, format: date-time }
        mode: { $ref: "#/components/schemas/EventMode" }
        meeting_point_name: { type: string, maxLength: 120 }
        meeting_point: { $ref: "#/components/schemas/LatLng" }
        city: { type: string, maxLength: 50 }
        district: { type: string, maxLength: 50 }
        online_url: { type: string, maxLength: 2048 }
        capacity: { type: integer, minimum: 0, maximum: 10000 }
        discoverable:
          type: boolean
          description: |
            Organizatörün işareti: etkinlik halka açık bir yerde buluşur ve
            Keşfet'te görünebilir (ADR-0033). Yalnızca yüz yüze etkinlikte
            etkilidir; özel adreste buluşan etkinlik işaretlenmez.
        apply_to_series:
          type: boolean
          description: "`true` yalnızca seriye ait etkinlikte geçerlidir; yoksa `false`."

    EventCancelRequest:
      type: object
      additionalProperties: false
      properties:
        reason: { type: string, maxLength: 500 }

    RsvpRequest:
      type: object
      required: [status]
      additionalProperties: false
      properties:
        status: { type: string, enum: [going, maybe, not_going] }
    Rsvp:
      type: object
      required: [status]
      properties:
        status: { $ref: "#/components/schemas/RsvpStatus" }

    Attendee:
      type: object
      required: [user_id, status, updated_at]
      properties:
        user_id: { type: string, format: uuid }
        status: { $ref: "#/components/schemas/RsvpStatus" }
        updated_at:
          type: string
          format: date-time
          description: Cevabın ya da katılımın son değiştiği zaman.
        attendance:
          allOf: [{ $ref: "#/components/schemas/AttendanceStatus" }]
          description: Doğrulanmamışsa yoktur.
        attendance_method: { $ref: "#/components/schemas/AttendanceMethod" }
    AttendeeList:
      type: object
      required: [attendees]
      properties:
        attendees:
          type: array
          items: { $ref: "#/components/schemas/Attendee" }
        next_page_token: { type: string }

    CheckInRequest:
      type: object
      additionalProperties: false
      properties:
        location:
          allOf: [{ $ref: "#/components/schemas/LatLng" }]
          description: Yüz yüze etkinlikte zorunlu, şu anki konumunuz; çevrimiçide gönderilmez. Saklanmaz, log'a yazılmaz.
    CheckIn:
      type: object
      required: [attendance, method]
      properties:
        attendance: { $ref: "#/components/schemas/AttendanceStatus" }
        method: { $ref: "#/components/schemas/AttendanceMethod" }

    EventPhoto:
      type: object
      required: [id, event_id, uploader_id, upload_id, created_at]
      properties:
        id: { type: string, format: uuid }
        event_id: { type: string, format: uuid }
        uploader_id: { type: string, format: uuid }
        upload_id: { type: string, format: uuid, description: "Linkleri `POST /v1/media/urls`." }
        caption: { type: string, description: Açıklama yoksa alan yoktur. }
        created_at: { type: string, format: date-time }
    EventPhotoCreateRequest:
      type: object
      required: [upload_id, client_request_id]
      additionalProperties: false
      properties:
        upload_id:
          type: string
          format: uuid
          description: |
            Kendi hazır `event_photo` yüklemeniz (bu tayfa için, başka içeriğe
            bağlanmamış). Konum bilgisi (EXIF/GPS) işlemede silinmiştir.
        caption: { type: string, maxLength: 200, description: "İsteğe bağlı; boşluklar kırpılır, boş ise yok sayılır." }
        client_request_id: { type: string, format: uuid }
        consent_ack:
          type: boolean
          default: false
          description: |
            Yüzü görünenlerden (çocuklarda velisinden) izin alındığının
            onayı. Türü `album_notice` bayraklı etkinlikte `true` olmalıdır
            (`album-consent-required`); diğerlerinde yok sayılır. Saklanmaz.
    EventPhotoList:
      type: object
      required: [photos]
      properties:
        photos:
          type: array
          items: { $ref: "#/components/schemas/EventPhoto" }
        next_page_token: { type: string }

    EventSeries:
      type: object
      required: [id, tayfa_id, rrule, time_zone, starts_at, created_at]
      properties:
        id: { type: string, format: uuid }
        tayfa_id: { type: string, format: uuid }
        template_event_id:
          type: string
          format: uuid
          description: Yeni tekrarların kopyalandığı etkinlik.
        rrule: { type: string, description: Kanonik biçim. }
        time_zone: { type: string }
        starts_at: { type: string, format: date-time, description: İlk tekrar. }
        ended_at: { type: string, format: date-time, description: Seri bitirildiyse. }
        created_by_user_id: { type: string, format: uuid, description: Hesabı silindiyse yoktur. }
        created_at: { type: string, format: date-time }
    EventSeriesEnding:
      type: object
      required: [series, cancelled_count]
      properties:
        series: { $ref: "#/components/schemas/EventSeries" }
        cancelled_count: { type: integer, description: İptal edilen yaklaşan etkinlik sayısı. }

    Notification:
      type: object
      description: |
        Bildirim yalnızca kimlik taşır; başlık, gövde, yer, isim yoktur.
        İstemci `target_type` ve `target_id` ile içeriği ilgili uçtan çeker.
      required: [id, type, target_type, target_id, read, created_at]
      properties:
        id: { type: string, format: uuid }
        type:
          type: string
          description: |
            `event_created` (yeni etkinlik), `event_updated` ve
            `event_cancelled` (katıldığınız etkinlik değişti/iptal edildi),
            `rsvp_promoted` (bekleme listesinden katılımcılara geçtiniz),
            `announcement`, `answer_received` (sorunuza cevap),
            `join_request` (yönetici/moderatörlere başvuru),
            `join_approved` (başvurunuz onaylandı),
            `tayfa_deletion_requested` (yönetici/moderatörlere silme talebi),
            `tayfa_warned` (hareketsiz tayfa 7 gün içinde arşivlenecek;
            `warning_reason` var), `tayfa_archived`, `tayfa_suspended` ve `tayfa_unsuspended` (platform askısı; gerekçe tayfa ayrıntısında), `hike_overdue`
            (yürüyüşçü zamanında dönmedi; `subject_user_id` yürüyüşçüdür,
            sessize alma bu bildirimi engellemez), `friend_request` (size
            arkadaşlık isteği; `target_id` isteyen kişi), `friend_accepted`
            (isteğiniz kabul edildi; `target_id` yeni arkadaşınız),
            `tayfa_invitation` (bir arkadaşınız sizi tayfaya davet etti;
            hedef tayfa), `report_resolved` (şikâyetiniz çözüldü; hedef
            `report`, `actor_id` hiçbir zaman yoktur; sonucu
            `GET /v1/me/reports/{report_id}` verir). İki arkadaşlık bildirimi
            bir tayfayla ilgili değildir, `tayfa_id` yoktur. `dm_request`
            (size mesaj isteği) ve `dm_message` (yeni birebir mesaj;
            konuşma okunana kadar konuşma başına tek bildirim) yalnızca
            "yeni" bilgisi taşır: hedef `dm_conversation`, `actor_id` ve
            `tayfa_id` yoktur, içerik de gönderen de yazılmaz; okunmamış
            mesaj sayısını `unread_count` taşır. `data_export_ready` (KVKK
            veri dışa aktarmanız 7 gün indirilebilir; hedef `data_export`,
            `tayfa_id` ve `actor_id` yoktur; push çeviri anahtarları
            `push_data_export_ready_title` ve `push_data_export_ready_body`).
            `friend_suggestion` (arkadaş önerisi; `target_id` önerilen kişi,
            `tayfa_id` ve `actor_id` yoktur; yalnızca uygulama içi, push
            gitmez; açık öneriler `GET /v1/me/friend-suggestions`).
            `safety_alert` (#210, ADR-0033): sizi güvenlik kişisi seçen
            `target_id` (hedef `user`) etkinliğin bitişi ve toleransı geçtiği
            halde "Döndüm" demedi; `tayfa_id` ve `actor_id` yoktur, içerik ve
            konum taşımaz; etkinliği `GET /v1/me/safety-shares` verir.
            Susturma uygulanmaz, push gider.
            `celebration` (#255): organizatör (`actor_id`) hedef etkinliğin
            bir kutlama bileşeninde kazananı ilan etti; kutlama başına bir
            kez, tayfanın ilan eden dışındaki etkin üyelerine. Kazananı
            adlandırmaz; kutlamayı bileşenin ucu verir. Yalnızca uygulama
            içi, push gitmez.
            `badge_earned` (#258, ADR-0039 §4): bir rozet kazanıldı; rozeti
            adlandırmaz, `actor_id` yoktur. Kişisel rozette alıcı rozeti
            kazanan kişidir, hedef `user` kendisidir (kendi profilinizi
            açın) ve `tayfa_id` yoktur; tayfa rozetinde alıcılar tayfanın
            yönetici ve moderatörleridir, hedef `tayfa`'dır. Yalnızca
            uygulama içi, push gitmez.
            Tanınmayan değer `unknown`.
          enum: [event_created, event_updated, event_cancelled, rsvp_promoted, announcement, answer_received, join_request, join_approved, tayfa_deletion_requested, tayfa_warned, tayfa_archived, tayfa_suspended, tayfa_unsuspended, hike_overdue, friend_request, friend_accepted, tayfa_invitation, report_resolved, dm_request, dm_message, data_export_ready, friend_suggestion, safety_alert, celebration, badge_earned, unknown]
        tayfa_id:
          type: string
          format: uuid
          description: Bildirim bir tayfayla ilgili değilse yoktur.
        actor_id:
          type: string
          format: uuid
          description: |
            İşlemi yapan; sistem ya da silinmiş hesapsa yoktur. Adı
            `GET /v1/users/{user_id}/profile` verir (ortak tayfa gerekmez).
        target_type:
          type: string
          description: |
            `membership` için `target_id` başvuran kullanıcının kimliğidir;
            `user` için bir kullanıcının kimliği (profilini açın); `report`
            için kendi şikâyetinizin kimliği; `dm_conversation` için
            konuşmanızın kimliği; `data_export` için kendi veri dışa
            aktarma talebinizin kimliği (`GET /v1/me/data-exports/{data_export_id}`).
          enum: [tayfa, membership, announcement, event, answer, user, report, dm_conversation, data_export, unknown]
        target_id: { type: string, format: uuid }
        question_id:
          type: string
          format: uuid
          description: Yalnızca `answer_received`; cevaplanan soru.
        subject_user_id:
          type: string
          format: uuid
          description: Yalnızca `hike_overdue`; dönmeyen yürüyüşçü.
        warning_reason:
          type: string
          description: Yalnızca `tayfa_warned`.
          enum: [inactive, few_members, unknown]
        unread_count:
          type: integer
          minimum: 1
          maximum: 100
          description: |
            Yalnızca `dm_request` ve `dm_message`: konuşma başına tek bildirim
            vardır; bu, bildirim son güncellendiğinde konuşmadaki okunmamış
            mesaj sayınızdır (en fazla 100; istemci "99+" gösterir). Her yeni
            mesajda güncellenir; konuşma okununca bildirim okundu olur ve
            sonraki mesaj yeni bildirimi 1'den başlatır.
        resolution:
          type: string
          description: |
            Yalnızca `friend_request` ve `tayfa_invitation` (issue #192):
            isteğin ya da davetin şu anki durumu. `pending` yanıt bekliyor
            (satır içi düğmeler gösterilir); `accepted` kabul edildi;
            `declined` siz reddettiniz; `withdrawn` karşı taraf geri çekti;
            `expired` artık bilinmiyor. Liste alınırken core'dan hesaplanır,
            bildirime yazılmaz; yalnızca alıcıya döner, kimin geri çektiği
            söylenmez. O an hesaplanamazsa alan yoktur.

            `friend_suggestion` (issue #208, ADR-0030): `pending` öneri hâlâ
            geçerli ("Arkadaş ekle" / "Kapat" gösterilir); `accepted`
            arkadaş oldunuz ya da istek gönderildi; `declined` siz
            kapattınız; `expired` öneri geri çekildi ya da artık geçerli
            değil (neden söylenmez). İstemci `pending` olmayan öneri
            bildirimini göstermez.
          enum: [pending, accepted, declined, withdrawn, expired, unknown]
        read: { type: boolean }
        created_at: { type: string, format: date-time }
    NotificationList:
      type: object
      required: [notifications]
      properties:
        notifications:
          type: array
          items: { $ref: "#/components/schemas/Notification" }
        next_page_token: { type: string }
    UnreadNotificationCount:
      type: object
      required: [unread_count]
      properties:
        unread_count: { type: integer, minimum: 0, maximum: 1000 }
    NotificationPreference:
      type: object
      required: [scope_type, scope_id, level, updated_at]
      properties:
        scope_type:
          type: string
          description: "`tayfa` ya da `dm_conversation` (birebir konuşma); kanal sonra gelir."
          enum: [tayfa, channel, dm_conversation, unknown]
        scope_id: { type: string, format: uuid }
        level: { type: string, enum: [all, mentions, none, unknown] }
        mute_until:
          type: string
          format: date-time
          description: Yoksa süresiz.
        updated_at: { type: string, format: date-time }
    NotificationPreferenceList:
      type: object
      required: [preferences]
      properties:
        preferences:
          type: array
          items: { $ref: "#/components/schemas/NotificationPreference" }
    NotificationPreferenceRequest:
      type: object
      required: [level]
      additionalProperties: false
      properties:
        level: { type: string, enum: [all, mentions, none] }
        mute_until:
          type: string
          format: date-time
          description: Yalnızca `mentions` ya da `none` ile; en fazla bir yıl sonrası.
    ConversationNotificationPreferenceRequest:
      type: object
      description: Birebir konuşma tercihi; `mentions` yoktur.
      required: [level]
      additionalProperties: false
      properties:
        level: { type: string, enum: [all, none] }
        mute_until:
          type: string
          format: date-time
          description: Yalnızca `none` ile; en fazla bir yıl sonrası.

    # --- Kanallar (#81) ---
    ChannelVisibility:
      type: string
      description: |
        `members`: tüm etkin üyeler; `staff`: yalnızca yönetici ve
        moderatörler; `event`: kanalı açan, etkinliğin organizatörü ve
        etkinliğe gelenler; `selected`: kanalı açan ve seçtikleri (issue
        #183). `event` ve `selected` sonradan başka türe, başka tür de
        bunlara çevrilemez.
      enum: [members, staff, event, selected, unknown]
    Channel:
      type: object
      required: [id, tayfa_id, name, visibility, slow_mode_seconds, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        tayfa_id: { type: string, format: uuid }
        name: { type: string }
        visibility: { $ref: "#/components/schemas/ChannelVisibility" }
        slow_mode_seconds:
          type: integer
          minimum: 0
          maximum: 3600
          description: 0 kapalı. Yönetici ve moderatörler muaftır.
        creator_user_id:
          type: string
          format: uuid
          description: Açanın hesabı silindiyse yoktur.
        archived_at:
          type: string
          format: date-time
          description: Arşivliyse dolu (salt okunur).
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        unread_count:
          type: integer
          minimum: 0
          maximum: 100
          description: Yalnızca listede. 100, "99+" demektir.
        last_read_message_id:
          type: string
          format: uuid
          description: Yalnızca listede; okundu işaretiniz yoksa yoktur.
        event_id:
          type: string
          format: uuid
          description: Yalnızca `event` kanalında.
        event_title:
          type: string
          description: |
            Yalnızca `event` kanalında: etkinliğin başlığı, iptal edilmiş olsa
            da (issue #193). Etkinlik size görünmüyorsa yoktur.
        member_count:
          type: integer
          minimum: 0
          description: Yalnızca `event` ve `selected` kanalında; kitlenin büyüklüğü.
        archive_at:
          type: string
          format: date-time
          description: |
            Yalnızca `event` kanalında: planlanan arşiv zamanı (etkinliğin
            bitişi ya da iptal anı + 7 gün). İstemci kalan süreyi bundan
            hesaplar. Bu zaman gelince `archived_at` dolar.
    ChannelList:
      type: object
      required: [channels]
      properties:
        channels:
          type: array
          items: { $ref: "#/components/schemas/Channel" }
    ChannelCreateRequest:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 40 }
        visibility:
          type: string
          enum: [members, staff, event, selected]
          default: members
        slow_mode_seconds: { type: integer, minimum: 0, maximum: 3600, default: 0 }
        event_id:
          type: string
          format: uuid
          description: Yalnızca ve zorunlu olarak `event` kanalında.
        member_user_ids:
          type: array
          description: Yalnızca `selected` kanalında; açan dışındaki ilk üyeler.
          maxItems: 100
          items: { type: string, format: uuid }
    ChannelMemberList:
      type: object
      required: [user_ids, members]
      properties:
        user_ids:
          type: array
          items: { type: string, format: uuid }
        members:
          type: array
          description: |
            `user_ids` ile aynı kişiler aynı sırada, kanaldaki rolleriyle
            (issue #193). Tayfa rolü burada yoktur; ad ve avatar profil
            ucundan gelir.
          items: { $ref: "#/components/schemas/ChannelMember" }
        next_page_token: { type: string }
    ChannelMember:
      type: object
      required: [user_id, roles]
      properties:
        user_id: { type: string, format: uuid }
        roles:
          type: array
          description: "`organizer`: etkinliğin organizatörü (yalnızca `event`); `creator`: kanalı açan. Boş olabilir."
          items: { type: string, enum: [organizer, creator] }
    ChannelMembersAddRequest:
      type: object
      required: [user_ids]
      additionalProperties: false
      properties:
        user_ids:
          type: array
          minItems: 1
          maxItems: 100
          items: { type: string, format: uuid }
    ChannelUpdateRequest:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 40 }
        visibility:
          type: string
          enum: [members, staff]
          description: "`event` ve `selected` kanalının türü değişmez (`invalid-request`)."
        slow_mode_seconds: { type: integer, minimum: 0, maximum: 3600 }
    ChannelMessage:
      type: object
      required: [id, channel_id, kind, deleted, created_at]
      properties:
        id: { type: string, format: uuid }
        channel_id: { type: string, format: uuid }
        author_user_id:
          type: string
          format: uuid
          description: Yazarın hesabı silindiyse yoktur ("Silinmiş kullanıcı").
        kind: { $ref: "#/components/schemas/ChannelMessageKind" }
        body:
          type: string
          description: Yalnızca `text`; silinmiş mesajda yoktur.
        photo_upload_id:
          type: string
          format: uuid
          description: |
            Yalnızca `photo`; silinmiş mesajda yoktur. Linkler
            `POST /v1/media/urls` ile (yalnızca kanalın kitlesine).
        place:
          allOf: [{ $ref: "#/components/schemas/Place" }]
          description: Yalnızca `place`; silinmiş mesajda yoktur.
        deleted: { type: boolean }
        restorable:
          type: boolean
          description: Yalnızca yöneticilere; moderasyonla gizlenmiş ve hâlâ geri alınabilir.
        created_at: { type: string, format: date-time }
    ChannelMessageList:
      type: object
      required: [messages]
      properties:
        messages:
          type: array
          items: { $ref: "#/components/schemas/ChannelMessage" }
        next_page_token: { type: string }
    ChannelMessageKind:
      type: string
      enum: [text, photo, place, unknown]
      description: "`unknown`: istemciden yeni bir sunucu değeri (#205)."
    Place:
      type: object
      description: |
        Kullanıcının haritadan seçip paylaştığı yer (ADR-0008: içerik,
        cihaz konumu değil). Log'a yazılmaz.
      required: [latitude, longitude]
      additionalProperties: false
      properties:
        latitude: { type: number, format: double, minimum: -90, maximum: 90 }
        longitude: { type: number, format: double, minimum: -180, maximum: 180 }
        name: { type: string, minLength: 1, maxLength: 120 }
    ChannelMessageCreateRequest:
      type: object
      required: [client_request_id]
      additionalProperties: false
      properties:
        kind:
          type: string
          enum: [text, photo, place]
          description: Verilmezse `text`.
        body:
          type: string
          minLength: 1
          maxLength: 4000
          description: Yalnızca ve zorunlu olarak `text`.
        photo_upload_id:
          type: string
          format: uuid
          description: Yalnızca ve zorunlu olarak `photo`; kendi hazır `chat_photo` yüklemeniz.
        place:
          allOf: [{ $ref: "#/components/schemas/Place" }]
          description: Yalnızca ve zorunlu olarak `place`.
        client_request_id:
          type: string
          format: uuid
          description: İstemcinin ürettiği tekrar gönderim anahtarı; mesaj kimliği sunucudadır.
    ChannelReadRequest:
      type: object
      required: [message_id]
      additionalProperties: false
      properties:
        message_id: { type: string, format: uuid }

    # --- birebir mesajlar (#95) ---
    Conversation:
      type: object
      required: [id, status, unread_count, last_message_at, created_at]
      properties:
        id: { type: string, format: uuid }
        other_user_id:
          type: string
          format: uuid
          description: Karşı tarafın hesabı silindiyse yoktur ("Silinmiş kullanıcı"; yazılamaz).
        status:
          type: string
          description: |
            `active` (serbest yazışma), `request_sent` (isteğiniz cevap
            bekliyor; reddedilse de böyle görünür), `request_received`
            (size gelen istek: cevap yazın, kabul edin ya da reddedin).
            Tanınmayan değer `unknown`.
          enum: [active, request_sent, request_received, unknown]
        unread_count: { type: integer, minimum: 0, maximum: 100 }
        last_read_message_id: { type: string, format: uuid }
        peer_last_read_message_id:
          type: string
          format: uuid
          description: Karşı tarafın okundu işareti; yalnızca aktif konuşmada.
        last_message_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
    ConversationList:
      type: object
      required: [conversations]
      properties:
        conversations:
          type: array
          items: { $ref: "#/components/schemas/Conversation" }
        next_page_token: { type: string }
    DeclinedRequest:
      type: object
      required: [conversation_id, sender_user_id, declined_at, created_at]
      properties:
        conversation_id: { type: string, format: uuid }
        sender_user_id:
          type: string
          format: uuid
          description: İsteği gönderen.
        declined_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
    DeclinedRequestList:
      type: object
      required: [declined_requests]
      properties:
        declined_requests:
          type: array
          items: { $ref: "#/components/schemas/DeclinedRequest" }
        next_page_token: { type: string }
    DirectMessage:
      type: object
      required: [id, conversation_id, deleted, created_at]
      properties:
        id: { type: string, format: uuid }
        conversation_id: { type: string, format: uuid }
        sender_user_id:
          type: string
          format: uuid
          description: Gönderenin hesabı silindiyse yoktur.
        deleted: { type: boolean }
        encryption:
          type: string
          enum: [e2e]
          description: |
            Her mesaj uçtan uca şifrelidir; içerik yalnızca zarflarda ve
            arşivdedir (`server` değeri #151 ile kalktı).
        created_at: { type: string, format: date-time }
        attachment_upload_id:
          type: string
          format: uuid
          description: |
            Şifreli ekin yüklemesi (#205); yoksa ya da mesaj silindiyse
            yoktur. Ne olduğu ve anahtarı zarfın içindedir.
    DirectMessageList:
      type: object
      required: [messages]
      properties:
        messages:
          type: array
          items: { $ref: "#/components/schemas/DirectMessage" }
        next_page_token: { type: string }
    DirectMessageCreateRequest:
      type: object
      description: Düz metin (`body`) kabul edilmez (#151).
      required: [recipient_user_id, client_request_id, envelopes]
      additionalProperties: false
      properties:
        recipient_user_id: { type: string, format: uuid }
        envelopes:
          type: array
          minItems: 1
          maxItems: 16
          items: { $ref: "#/components/schemas/OutgoingEnvelope" }
        client_request_id:
          type: string
          format: uuid
          description: İstemcinin ürettiği tekrar gönderim anahtarı.
        attachment_upload_id:
          type: string
          format: uuid
          description: İsteğe bağlı şifreli ek; kendi hazır `dm_attachment` yüklemeniz (#205).
    DirectMessageSent:
      type: object
      required: [message, conversation]
      properties:
        message: { $ref: "#/components/schemas/DirectMessage" }
        conversation: { $ref: "#/components/schemas/Conversation" }

    # --- birebir mesajda uçtan uca şifreleme (#127, ADR-0018) ---
    # Bayt alanları standart base64'tür.

    OutgoingEnvelope:
      type: object
      required: [device_id, registration_id, type, content]
      additionalProperties: false
      properties:
        device_id: { type: string, format: uuid }
        registration_id:
          type: integer
          minimum: 1
          maximum: 16380
          description: Gönderenin bu cihazla oturumundaki kayıt kimliği; değişmişse cihaz değişmiştir.
        type:
          type: string
          enum: [whisper, prekey]
          description: Signal CiphertextMessageType (2 whisper, 3 prekey).
        content:
          type: string
          format: byte
          description: Opak Signal mesajı, 1 B – 64 KiB.
    E2EPreKey:
      type: object
      required: [key_id, public_key]
      additionalProperties: false
      properties:
        key_id: { type: integer, minimum: 0, maximum: 16777215 }
        public_key: { type: string, format: byte, description: "33 bayt, 0x05 ile başlar." }
    E2ESignedPreKey:
      type: object
      required: [key_id, public_key, signature]
      additionalProperties: false
      properties:
        key_id: { type: integer, minimum: 0, maximum: 16777215 }
        public_key:
          type: string
          format: byte
          description: EC imzalı ön anahtarda 33 bayt (0x05 ile), Kyber'de 1569 bayt.
        signature: { type: string, format: byte, description: 64 bayt. }
    E2EDevice:
      type: object
      required: [id, device_number, registration_id, identity_key, paired, created_at]
      properties:
        id: { type: string, format: uuid }
        device_number: { type: integer, minimum: 1, maximum: 127, description: Signal adresindeki cihaz numarası. }
        registration_id: { type: integer }
        identity_key: { type: string, format: byte }
        paired:
          type: boolean
          description: Cihaz geçmiş anahtarını biliyor (arşive yazar ve okur).
        created_at: { type: string, format: date-time }
    E2EPreKeyCounts:
      type: object
      required: [ec, kyber, low]
      properties:
        ec: { type: integer }
        kyber: { type: integer }
        low: { type: boolean, description: Bir türden 10'dan az kaldı; yükleyin. }
    UploadPurpose:
      type: string
      enum: [avatar, log_photo, cover, event_photo, chat_photo, dm_attachment, report_evidence]
      description: |
        `cover` tayfa ya da etkinlik kapağıdır. `event_photo` etkinlik
        albümünün fotoğrafıdır (`POST .../events/{event_id}/photos`); kapak
        olarak kullanılamaz. `chat_photo` kanal mesajı fotoğrafı,
        `dm_attachment` birebir mesajın şifreli eki (tek `blob`),
        `report_evidence` birebir mesaj şikâyetinin kanıt fotoğrafıdır (#205).
    UploadStatus:
      type: string
      enum: [pending, ready, rejected, unknown]
      description: |
        `pending` (PUT ve tamamlama bekleniyor) → `ready` | `rejected`.
        `unknown`: istemciden yeni bir sunucu değeri.
    UploadRejectReason:
      type: string
      enum: [not_image, unsupported_type, metadata_present, dimension_mismatch, size_mismatch, too_large, failed, unknown]
      description: |
        `not_image`: bir varyant JPEG/WebP değil ya da bildirilen türde
        değil. `unsupported_type`: PNG, HEIC, GIF, animasyonlu WebP (istemci
        dönüştürmeli). `metadata_present`: EXIF (GPS dahil), XMP ya da IPTC
        var. `dimension_mismatch`: başlıktaki ölçü bildirilenden farklı ya
        da preview oranı tutmuyor. `size_mismatch`: saklanan boyut
        bildirilenden farklı. `too_large`: preview 400, full 1600 px'ten
        büyük. `failed`: dosyadan bağımsız nedenlerle denetlenemedi.
    UploadVariant:
      type: object
      required: [kind, content_type, size_bytes]
      additionalProperties: false
      properties:
        kind:
          type: string
          enum: [preview, full, blob]
          description: "`blob` yalnızca `dm_attachment`'ta."
        content_type:
          type: string
          enum: [image/jpeg, image/webp, application/octet-stream]
          description: "`application/octet-stream` yalnızca `blob`'da."
        size_bytes: { type: integer, format: int64, minimum: 1, maximum: 10485760, description: "Dosyanın tam boyutu." }
    UploadCreateRequest:
      type: object
      required: [purpose, variants, client_request_id]
      additionalProperties: false
      properties:
        purpose: { $ref: "#/components/schemas/UploadPurpose" }
        variants:
          type: array
          minItems: 1
          maxItems: 2
          description: Tam bir `preview` ve bir `full`; `dm_attachment`'ta yalnızca bir `blob`.
          items: { $ref: "#/components/schemas/UploadVariant" }
        tayfa_id:
          type: string
          format: uuid
          description: "`cover`, `log_photo`, `event_photo` ve `chat_photo` için zorunlu; `avatar`, `dm_attachment` ve `report_evidence`'ta verilmez."
        client_request_id:
          type: string
          format: uuid
          description: Her yükleme denemesi için bir kez üretilen, tekrar gönderimde aynen kullanılan UUID.
    UploadTarget:
      type: object
      required: [kind, method, url, headers, expires_at]
      properties:
        kind: { type: string, enum: [preview, full, blob, unknown] }
        method: { type: string, enum: [PUT] }
        url: { type: string, format: uri, description: "R2'ye imzalı PUT linki. Taşıyıcı link; log'a yazılmaz." }
        headers:
          type: object
          additionalProperties: { type: string }
          description: PUT'ta aynen gönderilecek başlıklar (`Content-Type`, `Content-Length`).
        expires_at: { type: string, format: date-time }
    UploadCompleteRequest:
      type: object
      required: [width, height]
      additionalProperties: false
      properties:
        width: { type: integer, minimum: 0, maximum: 1600, description: "Full varyantın genişliği (piksel); `dm_attachment`'ta 0." }
        height: { type: integer, minimum: 0, maximum: 1600, description: "`dm_attachment`'ta 0." }
    MediaUrls:
      type: object
      required: [upload_id, full_url, full_content_type, width, height, expires_at]
      properties:
        upload_id: { type: string, format: uuid }
        preview_url: { type: string, format: uri, description: "Taşıyıcı link; log'a yazılmaz. `dm_attachment`'ta yoktur." }
        preview_content_type: { type: string, enum: [image/jpeg, image/webp] }
        full_url: { type: string, format: uri, description: "`dm_attachment`'ta şifreli blob." }
        full_content_type: { type: string, enum: [image/jpeg, image/webp, application/octet-stream] }
        width: { type: integer, description: "Full varyantın genişliği" }
        height: { type: integer }
        expires_at: { type: string, format: date-time, description: "Linklerin geçerliliği (1 saat)." }
    Upload:
      type: object
      required: [id, purpose, status, size_bytes, created_at, attached]
      properties:
        id: { type: string, format: uuid }
        purpose: { $ref: "#/components/schemas/UploadPurpose" }
        status: { $ref: "#/components/schemas/UploadStatus" }
        reject_reason: { $ref: "#/components/schemas/UploadRejectReason" }
        tayfa_id: { type: string, format: uuid }
        size_bytes: { type: integer, format: int64, description: "İki varyantın boyutları birlikte." }
        created_at: { type: string, format: date-time }
        attached:
          type: boolean
          description: Bir içerik dosyayı kullanıyor. Hazır ama 7 gün bağlanmayan dosya silinir.
        urls:
          allOf: [{ $ref: "#/components/schemas/MediaUrls" }]
          description: Yalnızca `ready` iken.
    UploadView:
      type: object
      required: [upload]
      properties:
        upload: { $ref: "#/components/schemas/Upload" }
    UploadCreated:
      type: object
      required: [upload, targets]
      properties:
        upload: { $ref: "#/components/schemas/Upload" }
        targets:
          type: array
          description: Her varyant için bir hedef; tekrar gönderimde yükleme artık `pending` değilse boş.
          items: { $ref: "#/components/schemas/UploadTarget" }
    MediaUrlsRequest:
      type: object
      required: [upload_ids]
      additionalProperties: false
      properties:
        upload_ids:
          type: array
          minItems: 1
          maxItems: 100
          uniqueItems: true
          items: { type: string, format: uuid }
    MediaUrlsList:
      type: object
      required: [media]
      properties:
        media:
          type: array
          items: { $ref: "#/components/schemas/MediaUrls" }
    DataExportRequest:
      type: object
      required: [client_request_id]
      additionalProperties: false
      properties:
        client_request_id: { type: string, format: uuid }
    DataExport:
      type: object
      required: [id, status, requested_at]
      properties:
        id: { type: string, format: uuid }
        status:
          type: string
          description: |
            `pending` (sırada), `processing` (toplanıyor), `ready` (7 gün
            indirilebilir), `expired` (dosya ve anahtar silindi), `failed`
            (30 günlük sınıra sayılmaz; tekrar talep açılabilir).
          enum: [pending, processing, ready, expired, failed, unknown]
        failure_reason:
          type: string
          description: |
            Yalnızca `failed`: `unavailable` (bir servise ya da depolamaya
            ulaşılamadı), `too_large` (arşiv 16 MiB'ı geçti; talebiniz elle
            yanıtlanır), `timeout` (zamanında bitmedi), `failed`.
          enum: [unavailable, too_large, timeout, failed, unknown]
        requested_at: { type: string, format: date-time }
        ready_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
        downloaded_at: { type: string, format: date-time }
        size_bytes:
          type: integer
          format: int64
          description: Şifreli dosyanın boyutu, `ready` iken.
    DataExportList:
      type: object
      required: [data_exports]
      properties:
        data_exports:
          type: array
          items: { $ref: "#/components/schemas/DataExport" }
        next_request_at:
          type: string
          format: date-time
          description: Bir sonraki talebin açılabileceği an; yoksa şimdi açılabilir (süren talep yine engeller).
    DataExportDownload:
      type: object
      required: [url, expires_at, key, size_bytes, format]
      properties:
        url:
          type: string
          format: uri
          description: Şifreli dosyanın imzalı GET linki; `expires_at`'e kadar (5 dakika) taşıyan herkes indirebilir.
        expires_at: { type: string, format: date-time }
        key:
          type: string
          format: byte
          description: 32 baytlık AES-256 anahtarı (base64).
        size_bytes: { type: integer, format: int64 }
        format: { type: string, enum: [aes-256-gcm-v1] }
    AvatarRequest:
      type: object
      required: [upload_id]
      additionalProperties: false
      properties:
        upload_id: { type: string, format: uuid }
    AvatarView:
      type: object
      required: [avatar_upload_id]
      properties:
        avatar_upload_id: { type: string, format: uuid }
    PushTokenRegistration:
      type: object
      required: [token, platform]
      additionalProperties: false
      properties:
        token:
          type: string
          minLength: 1
          maxLength: 1024
          pattern: "^[A-Za-z0-9:_.-]+$"
          description: |
            `token_type`'a göre FCM kayıt token'ı (`getToken`) ya da Firebase
            Installation ID (FID; firebase_messaging 17+ `register()` /
            `onRegistered`). Log'a yazılmaz.
        platform: { type: string, enum: [android, ios] }
        token_type:
          type: string
          enum: [registration_token, fid]
          default: registration_token
          description: |
            `token`'ın türü (ADR-0036). Gönderilmezse `registration_token`
            sayılır (eski istemciler). firebase_messaging 17+ istemcileri
            `onRegistered`'ın verdiği FID'i `fid` ile kaydeder. Oturumun
            kaydı türüyle birlikte yenilenir: aynı oturumda token'dan FID'e
            geçmek için yeniden `PUT` yeterlidir.
    E2EDeviceRegistration:
      type: object
      required: [registration_id, identity_key, signed_prekey, kyber_last_resort_prekey]
      additionalProperties: false
      properties:
        registration_id: { type: integer, minimum: 1, maximum: 16380 }
        identity_key: { type: string, format: byte, description: "33 bayt, 0x05 ile başlar." }
        signed_prekey: { $ref: "#/components/schemas/E2ESignedPreKey" }
        kyber_last_resort_prekey: { $ref: "#/components/schemas/E2ESignedPreKey" }
        one_time_prekeys:
          type: array
          maxItems: 100
          items: { $ref: "#/components/schemas/E2EPreKey" }
        kyber_prekeys:
          type: array
          maxItems: 100
          items: { $ref: "#/components/schemas/E2ESignedPreKey" }
    E2EDeviceRegistered:
      type: object
      required: [device, prekey_counts]
      properties:
        device: { $ref: "#/components/schemas/E2EDevice" }
        prekey_counts: { $ref: "#/components/schemas/E2EPreKeyCounts" }
    E2EDeviceState:
      type: object
      required: [device, prekey_counts, history_key_version, rotation_needed, other_paired_device]
      properties:
        device: { $ref: "#/components/schemas/E2EDevice" }
        prekey_counts: { $ref: "#/components/schemas/E2EPreKeyCounts" }
        history_key_version:
          type: integer
          description: Hesabın geçmiş anahtarı sürümü; ilk cihaz anahtar alana kadar 0.
        rotation_needed:
          type: boolean
          description: Eşleştirilmiş bir cihaz kaldırıldı; eşleştirilmiş bir cihaz anahtarı yenilemeli.
        other_paired_device:
          type: boolean
          description: Hesabın eşleştirilmiş başka cihazı var (QR eşleştirme önerin).
    E2EPreKeyUpload:
      type: object
      additionalProperties: false
      properties:
        signed_prekey: { $ref: "#/components/schemas/E2ESignedPreKey" }
        kyber_last_resort_prekey: { $ref: "#/components/schemas/E2ESignedPreKey" }
        one_time_prekeys:
          type: array
          maxItems: 100
          items: { $ref: "#/components/schemas/E2EPreKey" }
        kyber_prekeys:
          type: array
          maxItems: 100
          items: { $ref: "#/components/schemas/E2ESignedPreKey" }
    E2EPublicDevice:
      type: object
      required: [id, device_number, registration_id, identity_key, created_at]
      properties:
        id: { type: string, format: uuid }
        device_number: { type: integer }
        registration_id: { type: integer }
        identity_key: { type: string, format: byte }
        created_at: { type: string, format: date-time }
    E2EPublicDeviceList:
      type: object
      required: [devices]
      properties:
        devices:
          type: array
          items: { $ref: "#/components/schemas/E2EPublicDevice" }
    E2EKeyEvent:
      type: object
      required: [id, device_id, device_number, type, created_at]
      properties:
        id: { type: string, format: uuid }
        device_id: { type: string, format: uuid }
        device_number: { type: integer }
        type:
          type: string
          enum: [device_added, device_removed, identity_changed]
          description: "`identity_changed` yazılmaz (yeni kimlik anahtarı yeni cihazdır); ileriye dönük."
        created_at: { type: string, format: date-time }
    E2EKeyEventList:
      type: object
      required: [events]
      properties:
        events:
          type: array
          items: { $ref: "#/components/schemas/E2EKeyEvent" }
        next_page_token: { type: string }
    E2EBundleRequest:
      type: object
      additionalProperties: false
      properties:
        device_ids:
          type: array
          maxItems: 5
          description: Yalnızca bu cihazlar; boşsa tüm cihazlar.
          items: { type: string, format: uuid }
    E2EPreKeyBundle:
      type: object
      required: [device_id, device_number, registration_id, identity_key, signed_prekey, kyber_prekey, kyber_last_resort]
      properties:
        device_id: { type: string, format: uuid }
        device_number: { type: integer }
        registration_id: { type: integer }
        identity_key: { type: string, format: byte }
        signed_prekey: { $ref: "#/components/schemas/E2ESignedPreKey" }
        one_time_prekey:
          $ref: "#/components/schemas/E2EPreKey"
        kyber_prekey: { $ref: "#/components/schemas/E2ESignedPreKey" }
        kyber_last_resort: { type: boolean }
    E2EPreKeyBundleList:
      type: object
      required: [bundles]
      properties:
        bundles:
          type: array
          items: { $ref: "#/components/schemas/E2EPreKeyBundle" }
    E2EEnvelope:
      type: object
      required: [id, message_id, conversation_id, sender_user_id, sender_device_id, sender_device_number, type, content, created_at]
      properties:
        id: { type: string, format: uuid }
        message_id: { type: string, format: uuid }
        conversation_id: { type: string, format: uuid }
        sender_user_id: { type: string, format: uuid }
        sender_device_id: { type: string, format: uuid }
        sender_device_number: { type: integer }
        type: { type: string, enum: [whisper, prekey] }
        content: { type: string, format: byte }
        created_at: { type: string, format: date-time }
    E2EEnvelopeList:
      type: object
      required: [envelopes]
      properties:
        envelopes:
          type: array
          items: { $ref: "#/components/schemas/E2EEnvelope" }
        next_page_token: { type: string }
    E2EEnvelopeAck:
      type: object
      required: [envelope_ids]
      additionalProperties: false
      properties:
        envelope_ids:
          type: array
          minItems: 1
          maxItems: 100
          items: { type: string, format: uuid }
    E2EArchiveWrite:
      type: object
      required: [history_key_version, entries]
      additionalProperties: false
      properties:
        history_key_version: { type: integer, minimum: 1, maximum: 32767 }
        entries:
          type: array
          minItems: 1
          maxItems: 50
          items:
            type: object
            required: [message_id, content]
            additionalProperties: false
            properties:
              message_id: { type: string, format: uuid }
              content: { type: string, format: byte, description: 1 B – 32 KiB. }
    E2EArchiveWritten:
      type: object
      required: [accepted_message_ids]
      properties:
        accepted_message_ids:
          type: array
          items: { type: string, format: uuid }
    E2EArchiveEntry:
      type: object
      required: [message_id, conversation_id, key_version, content, created_at]
      properties:
        message_id: { type: string, format: uuid }
        conversation_id: { type: string, format: uuid }
        key_version: { type: integer }
        content: { type: string, format: byte }
        created_at: { type: string, format: date-time }
    E2EArchiveEntryList:
      type: object
      required: [entries]
      properties:
        entries:
          type: array
          items: { $ref: "#/components/schemas/E2EArchiveEntry" }
        next_page_token: { type: string }
    E2EHistoryKeyVersion:
      type: object
      required: [history_key_version]
      properties:
        history_key_version: { type: integer }
    E2EHistoryKeyRotation:
      type: object
      required: [history_key_version, shares]
      additionalProperties: false
      properties:
        history_key_version: { type: integer, minimum: 1, maximum: 32767 }
        shares:
          type: array
          maxItems: 5
          items:
            type: object
            required: [device_id, bundle]
            additionalProperties: false
            properties:
              device_id: { type: string, format: uuid }
              bundle: { type: string, format: byte, description: 1 B – 16 KiB. }
    E2EHistoryKeyShare:
      type: object
      required: [id, sender_device_id, history_key_version, bundle, created_at]
      properties:
        id: { type: string, format: uuid }
        sender_device_id: { type: string, format: uuid }
        history_key_version: { type: integer }
        bundle: { type: string, format: byte }
        created_at: { type: string, format: date-time }
    E2EHistoryKeyShareList:
      type: object
      required: [shares]
      properties:
        shares:
          type: array
          items: { $ref: "#/components/schemas/E2EHistoryKeyShare" }
    E2EShareAck:
      type: object
      required: [share_ids]
      additionalProperties: false
      properties:
        share_ids:
          type: array
          minItems: 1
          maxItems: 100
          items: { type: string, format: uuid }
    E2ELinkRequestCreated:
      type: object
      required: [link_request_id, expires_at]
      properties:
        link_request_id: { type: string, format: uuid }
        expires_at: { type: string, format: date-time }
    E2ELinkRequest:
      type: object
      required: [link_request_id, expires_at, answered]
      properties:
        link_request_id: { type: string, format: uuid }
        expires_at: { type: string, format: date-time }
        answered: { type: boolean }
        answer: { type: string, format: byte, description: Cevaplanınca. }
        history_key_version: { type: integer, description: Cevaplanınca. }
        answered_by_device_id: { type: string, format: uuid, description: Cevaplanınca. }
    E2ELinkAnswer:
      type: object
      required: [history_key_version, answer]
      additionalProperties: false
      properties:
        history_key_version: { type: integer, minimum: 1, maximum: 32767 }
        answer: { type: string, format: byte, description: 1 B – 16 KiB. }
    E2EDevicesChangedProblem:
      description: |
        `e2e-devices-changed` (409) cevabının ek alanları; cihaz listelerini
        tazeleyip tekrar deneyin.
      allOf:
        - $ref: "#/components/schemas/Problem"
        - type: object
          required: [missing_device_ids, stale_device_ids]
          properties:
            missing_device_ids:
              type: array
              description: Zarf (ya da paylaşım) eksik cihazlar.
              items: { type: string, format: uuid }
            stale_device_ids:
              type: array
              description: Artık olmayan, değişmiş ya da iki kez verilen cihazlar.
              items: { type: string, format: uuid }

    # --- arkadaşlık, davet, profil, hesap (#71) ---

    ActivityVisibility:
      type: string
      description: Katılım geçmişinin kime görüneceği.
      enum: [private, tayfa, public]
    AboutVisibility:
      type: string
      description: |
        Profil tamamlama formundaki alanları kimin göreceği (issue #186).
        `friends_and_mutual` (varsayılan): arkadaşlar ve ortak tayfa
        üyeleri. `friends`: yalnızca arkadaşlar. `none`: kimse. Sosyal
        medya hesapları her durumda en fazla arkadaşlara görünür.
      enum: [friends_and_mutual, friends, none]
    ProfileField:
      type: string
      description: Profil tamamlama formunun bir alanı.
      enum: [interests, about, occupation, team, languages, social_accounts]
    SocialAccount:
      type: object
      description: |
        Yalnızca kullanıcı adı; bağlantıyı istemci platformun bilinen
        adresinden kurar. URL kabul edilmez. Kurallar: `instagram`
        `^[A-Za-z0-9._]{1,30}$`, `x` `^[A-Za-z0-9_]{1,15}$`, `tiktok`
        `^[A-Za-z0-9._]{2,24}$`, `youtube` `^[A-Za-z0-9._-]{3,30}$` (baştaki
        `@` atılır). Platform başına bir hesap.
      required: [platform, username]
      additionalProperties: false
      properties:
        platform: { type: string, enum: [instagram, x, tiktok, youtube] }
        username: { type: string, maxLength: 31 }
    BirthdayVisibility:
      type: string
      description: |
        Doğum gününüzün arkadaşlarınıza ne kadarının görüneceği (issue #185).
        Arkadaşınız olmayan hiç kimse görmez. `hidden`: kimse. `birthday`
        (varsayılan): gün ve ay. `full`: tarih ve yaş.
      enum: [hidden, birthday, full]
    Account:
      type: object
      required:
        - user_id
        - display_name
        - referral_code
        - activity_visibility
        - birthday_visibility
        - interests
        - languages
        - social_accounts
        - declined_profile_fields
        - about_visibility
        - profile_completion_pending
      properties:
        user_id: { type: string, format: uuid, description: Kendi kullanıcı kimliğiniz. }
        display_name: { type: string, description: Kendi görünen adınız. }
        avatar_upload_id: { type: string, format: uuid, description: "Avatar; linkleri `POST /v1/media/urls`." }
        referral_code:
          type: string
          description: Örn. `TYF-8K2M4Q`; paylaşım linki `tayfam.app/r/<kod>`.
        activity_visibility: { $ref: "#/components/schemas/ActivityVisibility" }
        birthday_visibility: { $ref: "#/components/schemas/BirthdayVisibility" }
        interests:
          type: array
          items: { $ref: "#/components/schemas/InterestKey" }
        about: { type: string, description: Boşsa alan yoktur. }
        occupation: { type: string, description: Boşsa alan yoktur. }
        team: { type: string, description: Boşsa alan yoktur. }
        languages:
          type: array
          items: { type: string }
        social_accounts:
          type: array
          items: { $ref: "#/components/schemas/SocialAccount" }
        declined_profile_fields:
          type: array
          description: '"Paylaşmak istemiyorum" denen alanlar; cevaplanmış sayılır.'
          items: { $ref: "#/components/schemas/ProfileField" }
        about_visibility: { $ref: "#/components/schemas/AboutVisibility" }
        profile_completion_pending:
          type: boolean
          description: |
            Profil tamamlama formu gösterilmeli: cevaplanmamış (boş ve
            reddedilmemiş) bir alan var ve geçerli bir erteleme yok.
    AccountUpdate:
      type: object
      description: En az bir alan bulunur; olmayan alan değişmez.
      minProperties: 1
      additionalProperties: false
      properties:
        display_name:
          type: string
          minLength: 1
          maxLength: 40
          description: |
            Yeni görünen ad; boşluklar tekleştirilip kırpıldıktan sonra 1–40
            karakter. 24 saatte en fazla 3 değişiklik.
        activity_visibility: { $ref: "#/components/schemas/ActivityVisibility" }
        birthday_visibility: { $ref: "#/components/schemas/BirthdayVisibility" }
        interests:
          type: array
          description: Katalogdaki ilgi alanlarından tekrarsız çoklu seçim.
          maxItems: 20
          uniqueItems: true
          items: { $ref: "#/components/schemas/InterestKey" }
        about:
          type: string
          maxLength: 160
          description: Hakkımda; kırpıldıktan sonra en fazla 160 karakter, satır sonu olabilir. `""` temizler.
        occupation:
          type: string
          maxLength: 60
          description: Meslek / uğraş; tek satır, en fazla 60 karakter. `""` temizler.
        team:
          type: string
          maxLength: 60
          description: Tutulan takım; tek satır, en fazla 60 karakter. `""` temizler.
        languages:
          type: array
          description: ISO 639-1 kodları (`tr`, `en`), en fazla 5, tekrarsız.
          maxItems: 5
          items: { type: string, pattern: "^[a-z]{2}$" }
        social_accounts:
          type: array
          description: Tamamı değişir; platform başına bir hesap.
          maxItems: 4
          items: { $ref: "#/components/schemas/SocialAccount" }
        declined_profile_fields:
          type: array
          description: Gönderilirse "Paylaşmak istemiyorum" listesinin tamamı olur.
          uniqueItems: true
          items: { $ref: "#/components/schemas/ProfileField" }
        about_visibility: { $ref: "#/components/schemas/AboutVisibility" }
    ReferralCode:
      type: object
      required: [referral_code]
      properties:
        referral_code: { type: string }
    ReferralLookupRequest:
      type: object
      required: [referral_code]
      additionalProperties: false
      properties:
        referral_code:
          type: string
          maxLength: 32
          description: "`TYF-` öneki ve büyük/küçük harf fark etmez."
    ReferredUser:
      type: object
      required: [user_id, display_name]
      properties:
        user_id: { type: string, format: uuid }
        display_name: { type: string }
        avatar_upload_id: { type: string, format: uuid }
    UserRef:
      type: object
      required: [user_id]
      additionalProperties: false
      properties:
        user_id: { type: string, format: uuid }
    Friend:
      type: object
      required: [user_id, display_name, state, requested_at]
      properties:
        user_id: { type: string, format: uuid }
        display_name: { type: string }
        avatar_upload_id: { type: string, format: uuid }
        state:
          type: string
          description: "`incoming`: size gelen istek; `outgoing`: sizin isteğiniz."
          enum: [friends, incoming, outgoing]
        requested_at: { type: string, format: date-time }
        accepted_at: { type: string, format: date-time }
        next_available:
          description: |
            "Boşum" rozeti (#207): arkadaşın önümüzdeki 7 takvim günündeki
            (bugün dahil, bugün … bugün+6, Europe/Istanbul) en yakın boş
            günü, not olmadan. Yalnızca `GET /v1/me/friends`'te ve bu
            pencerede boş günü varsa döner; 30 günün tamamı
            `GET /v1/users/{user_id}/availability` ile görülür.
          allOf:
            - $ref: "#/components/schemas/AvailabilitySummary"
    FriendList:
      type: object
      required: [friends]
      properties:
        friends:
          type: array
          items: { $ref: "#/components/schemas/Friend" }
        next_page_token: { type: string }
    FriendSuggestion:
      type: object
      description: Arkadaşlık puanı, ortak etkinlik sayısı ve gerekçe bilinçli olarak yoktur (ADR-0030).
      required: [user_id, display_name, suggested_at]
      additionalProperties: false
      properties:
        user_id: { type: string, format: uuid }
        display_name: { type: string }
        avatar_upload_id: { type: string, format: uuid }
        suggested_at: { type: string, format: date-time }
    FriendSuggestionList:
      type: object
      required: [suggestions]
      additionalProperties: false
      properties:
        suggestions:
          type: array
          maxItems: 10
          items: { $ref: "#/components/schemas/FriendSuggestion" }
    SocialSettings:
      type: object
      required: [profiling_enabled, hide_from_suggestions, discover_visible_to_friends]
      additionalProperties: false
      properties:
        profiling_enabled:
          type: boolean
          description: '"Profilleme": ortak katılımdan arkadaşlık puanı hesaplanır ve öneri yapılır.'
        hide_from_suggestions:
          type: boolean
          description: '"Beni önerme": kimseye önerilmezsiniz.'
        discover_visible_to_friends:
          type: boolean
          description: |
            "Keşfet'te arkadaşlarım görebilsin" (varsayılan açık): bir
            etkinliğe gideceğiniz ya da katıldığınız, arkadaşlarınıza
            Keşfet'te gösterilebilir. Katılım geçmişiniz `private` ise bu
            ayar açık olsa da gösterilmez.
    SocialSettingsUpdate:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        profiling_enabled: { type: boolean }
        hide_from_suggestions: { type: boolean }
        discover_visible_to_friends: { type: boolean }
    DaySlot:
      type: string
      description: Günün kaba bir bölümü; saat değil. `all_day` başka dilimle birlikte olmaz.
      enum: [morning, afternoon, evening, all_day]
    AvailabilitySummary:
      type: object
      required: [date, slots]
      properties:
        date: { type: string, format: date }
        slots:
          type: array
          minItems: 1
          maxItems: 3
          items: { $ref: "#/components/schemas/DaySlot" }
    AvailabilityDay:
      type: object
      required: [date, slots, updated_at]
      properties:
        date:
          type: string
          format: date
          description: Takvim günü (Europe/Istanbul).
        slots:
          type: array
          description: Sabah, öğleden sonra, akşam sırasıyla; ya da yalnızca `all_day`.
          minItems: 1
          maxItems: 3
          items: { $ref: "#/components/schemas/DaySlot" }
        note:
          type: string
          description: Not yoksa alan yoktur.
          maxLength: 60
        updated_at: { type: string, format: date-time }
    DiscoverPerson:
      type: object
      required: [user_id, display_name]
      properties:
        user_id: { type: string, format: uuid }
        display_name: { type: string }
        avatar_upload_id: { type: string, format: uuid }
    DiscoverFeed:
      type: object
      required: [items]
      properties:
        items:
          type: array
          maxItems: 50
          items: { $ref: "#/components/schemas/DiscoverItem" }
    DiscoverItem:
      type: object
      required: [event, tayfa, friends, friend_count]
      properties:
        event:
          type: object
          required: [id, type, title, starts_at, ends_at]
          description: Açıklama, buluşma noktası ve koordinat yoktur.
          properties:
            id: { type: string, format: uuid }
            type: { $ref: "#/components/schemas/EventTypeKey" }
            title: { type: string }
            starts_at: { type: string, format: date-time }
            ends_at: { type: string, format: date-time }
            city: { type: string }
            district: { type: string }
        tayfa:
          type: object
          required: [id, name, created_at, event_count, attendance_count]
          description: |
            Yalnızca olgular. `event_count` bitişinden 7 gün geçmiş, iptal
            edilmemiş etkinlikler; `attendance_count` bu etkinliklerdeki
            doğrulanmış katılımlar.
          properties:
            id: { type: string, format: uuid }
            name: { type: string }
            description: { type: string }
            city: { type: string }
            created_at: { type: string, format: date-time }
            event_count: { type: integer, minimum: 0 }
            attendance_count: { type: integer, minimum: 0 }
        friends:
          type: array
          maxItems: 3
          description: En çok 3 görünür arkadaş; yoksa boş dizi.
          items: { $ref: "#/components/schemas/DiscoverPerson" }
        friend_count:
          type: integer
          minimum: 0
          description: |
            Görünür arkadaşların tamamı (`friends` dahil); yoksa 0
            (ADR-0035; önceden en az 1'di).
    TayfaDiscover:
      type: object
      required: [state, enabled]
      properties:
        state:
          type: string
          description: |
            `off` kapalı; `pending` incelemede; `listed` açık (Keşfet'te
            görünebilir); `under_review` platform Keşfet'ten çıkardı, yeniden
            inceleniyor (neden söylenmez); `rejected` kabul edilmedi.
          enum: [off, pending, listed, under_review, rejected, unknown]
        enabled: { type: boolean, description: Yöneticilerin Keşfet isteği. }
    TayfaDiscoverInput:
      type: object
      required: [enabled]
      additionalProperties: false
      properties:
        enabled: { type: boolean }
    EventFeedback:
      type: object
      properties:
        answer: { type: string, enum: [ok, not_ok, serious, unknown] }
        updated_at: { type: string, format: date-time }
    EventFeedbackInput:
      type: object
      required: [answer]
      additionalProperties: false
      properties:
        answer: { type: string, enum: [ok, not_ok, serious] }
    SafetyContact:
      type: object
      required: [grace_minutes]
      properties:
        contact: { $ref: "#/components/schemas/DiscoverPerson" }
        grace_minutes: { type: integer, minimum: 0, maximum: 1440, description: "Seçilmemişse 0." }
        returned_at: { type: string, format: date-time }
        alert_sent_at: { type: string, format: date-time }
    SafetyContactInput:
      type: object
      required: [contact_user_id]
      additionalProperties: false
      properties:
        contact_user_id: { type: string, format: uuid }
        grace_minutes:
          type: integer
          minimum: 15
          maximum: 1440
          description: Bitişten sonra beklenecek dakika; yoksa 60.
    SafetyShare:
      type: object
      description: |
        Katılımcının güvenlik kişisiyle paylaştığı en az bilgi: kim, saat
        aralığı (başlangıç, bitiş, tolerans) ve durum. Tayfa, etkinlik
        başlığı ya da kimliği, buluşma yeri, il/ilçe ve koordinat yoktur.
      required: [participant, starts_at, ends_at, grace_minutes, state]
      additionalProperties: false
      properties:
        participant: { $ref: "#/components/schemas/DiscoverPerson" }
        starts_at: { type: string, format: date-time }
        ends_at: { type: string, format: date-time }
        grace_minutes:
          type: integer
          description: Alarm `ends_at` + bu süre sonunda gider.
        returned_at: { type: string, format: date-time }
        alert_sent_at: { type: string, format: date-time }
        state:
          type: string
          description: |
            `not_returned`: henüz dönmedi, alarm gitmedi. `returned`: "Döndüm"
            dedi (alarmdan sonra da olabilir). `alert_sent`: alarm gitti,
            "Döndüm" yok.
          enum: [not_returned, returned, alert_sent]
    SafetyShareList:
      type: object
      required: [shares]
      properties:
        shares:
          type: array
          maxItems: 50
          items: { $ref: "#/components/schemas/SafetyShare" }
    AvailabilityDayList:
      type: object
      required: [days]
      properties:
        days:
          type: array
          maxItems: 31
          items: { $ref: "#/components/schemas/AvailabilityDay" }
    AvailabilityInput:
      type: object
      required: [slots]
      additionalProperties: false
      properties:
        slots:
          type: array
          description: Tekrar eden dilim yok sayılır. `all_day` tek başına.
          minItems: 1
          maxItems: 4
          items: { $ref: "#/components/schemas/DaySlot" }
        note:
          type: string
          description: |
            İsteğe bağlı, en fazla 60 karakter. Kontrol karakteri (satır sonu
            dahil), satır/paragraf ayırıcı (U+2028, U+2029), yön kontrolü
            (U+202A–U+202E, U+2066–U+2069) ve görünmez karakter (U+200B
            gibi) içeremez; emoji dizileri (U+200D) serbesttir. Baştaki ve
            sondaki boşluk kırpılır.
          maxLength: 60
    Catalog:
      type: object
      required: [catalog_version, interests, event_types, study_tags, badges]
      properties:
        catalog_version:
          type: integer
          format: int64
          description: Kataloğun bütününün sürümü; her değişiklikte artar. `ETag` ile aynıdır.
        interests:
          type: array
          description: Bütün ilgi alanları (emekliler dahil), `position` sırasıyla.
          items: { $ref: "#/components/schemas/CatalogInterest" }
        event_types:
          type: array
          description: Aktif türlerin güncel sürümleri, listeleme sırasıyla.
          items: { $ref: "#/components/schemas/CatalogEventType" }
        study_tags:
          type: array
          description: Ders ve konu etiketleri (emekliler dahil), `position` sırasıyla; istemci `parent_key` ile gruplar.
          items: { $ref: "#/components/schemas/CatalogStudyTag" }
        badges:
          type: array
          description: Rozet tanımları (emekliler dahil), `position` sırasıyla.
          items: { $ref: "#/components/schemas/CatalogBadge" }
    CatalogStatus:
      type: string
      description: |
        `retired`: yeni etkinlikte, tayfada ya da profilde seçilemez; eski
        kayıtlar göstermeye devam eder. Katalog kaydı hiç silinmez.
      enum: [active, retired]
    CatalogLabels:
      type: object
      description: "Dil → metin (`{\"tr\": \"Doğa\"}`). `tr` her zaman vardır; her metin 1–60 karakter, tek satır."
      additionalProperties: { type: string }
    CatalogInterest:
      type: object
      required: [key, position, labels, icon, status, default_widgets]
      properties:
        key: { type: string, description: "Değişmez anahtar: `^[a-z][a-z0-9_]{1,39}$`." }
        position: { type: integer, format: int32, description: "Listeleme sırası (küçükten büyüğe)." }
        labels: { $ref: "#/components/schemas/CatalogLabels" }
        icon: { type: string, description: "İstemcinin sabit ikon setinden bir anahtar." }
        status: { $ref: "#/components/schemas/CatalogStatus" }
        default_widgets:
          type: array
          description: Bu ilgi alanını seçen tayfada varsayılan açık gelen ana sayfa bileşenleri (ADR-0027).
          items: { type: string }
    CatalogStudyTag:
      type: object
      description: |
        Eğitim modüllerinin (materyal kütüphanesi, soru havuzu) içeriği
        etiketlediği ders ve konu listesinin bir kaydı (#259, ADR-0040 §5):
        sınav/düzey → ders → konu, en fazla üç seviye. Böyle içerikte ders
        (ikinci seviye) zorunlu, konu (üçüncü seviye, o dersin altında)
        isteğe bağlıdır. Her düzeyin ve dersin altında anahtarı
        `<üst anahtar>_other` olan bir "Diğer" kaydı vardır. `retired` kayıt
        (ya da emekli bir kaydın altındaki kayıt) yeni içerikte seçilemez,
        eski içerik göstermeye devam eder. Adlar platform sahibinin
        içeriğidir ve düz metin gösterilir.
      required: [key, position, labels, status]
      properties:
        key: { type: string, description: "Değişmez, bütün listede tekil anahtar: `^[a-z][a-z0-9_]{1,39}$`." }
        parent_key: { type: string, description: "Üst kaydın anahtarı; düzeyde yoktur. Değişmez." }
        position: { type: integer, format: int32, description: "Aynı üst kaydın altındaki sıra (küçükten büyüğe)." }
        labels: { $ref: "#/components/schemas/CatalogLabels" }
        status: { $ref: "#/components/schemas/CatalogStatus" }
    CatalogBadge:
      type: object
      description: |
        Bir rozet tanımı (#258, ADR-0039 §1). Rozet katalog gibi veridir;
        adlar platform sahibinin içeriğidir ve düz metin gösterilir. `retired`
        rozet artık kazanılmaz, kazanılmışlar göstermeye devam eder. Hassas
        ölçümlerden ve katılımı hassas türlerden rozet çıkmaz. Sıralama ya da
        "en çok rozet" listesi yoktur.
      required: [key, scope, position, labels, icon, status, rule]
      properties:
        key: { type: string, description: "Değişmez anahtar: `^[a-z][a-z0-9_]{1,39}$`." }
        scope:
          type: string
          description: |
            `user` kişisel rozet (kilometre taşı ya da şampiyonluk), `tayfa`
            tayfa rozeti. Tanınmayan değer `unknown`.
          enum: [user, tayfa, unknown]
        position: { type: integer, format: int32, description: "Listeleme sırası (küçükten büyüğe)." }
        labels: { $ref: "#/components/schemas/CatalogLabels" }
        icon: { type: string, description: "İstemcinin sabit ikon setinden bir anahtar." }
        status: { $ref: "#/components/schemas/CatalogStatus" }
        rule: { $ref: "#/components/schemas/CatalogBadgeRule" }
    CatalogBadgeRule:
      type: object
      description: |
        Rozetin kazanılma kuralı; istemci rozeti açıklamak için kullanır.
        `threshold` bir metriğin toplamı `value` değerine ulaştı (`metric`,
        `value`, `period` yalnızca bunda vardır); `first` bir türde
        (`event_type`) ya da genel ilk katılım; `champion` bir etkinliğin
        kutlamasında kişi ya da takımı kazanan ilan edildi (`event_type`
        varsa yalnızca o türde). `first` ve `champion` yalnızca kişiseldir.
        Tanınmayan `kind` için istemci rozeti açıklamasız gösterir.
      required: [kind]
      properties:
        kind: { type: string, enum: [threshold, first, champion, unknown] }
        metric:
          type: string
          description: |
            Ortak metrik (`events`, `attended`, `participants`, `duration`)
            ya da `<tür anahtarı>.<anahtar>` (türün ortak metriği ya da bir
            ölçüm veya günlük bileşeni).
        value:
          type: number
          format: double
          description: Eşik, metriğin biriminde (süre dakika).
        period:
          type: string
          description: "`year` rozet her takvim yılı ayrı kazanılır."
          enum: [all_time, year, unknown]
        event_type: { type: string, description: "Kuralın türü; yoksa her tür." }
    EarnedBadge:
      type: object
      description: |
        Kazanılmış bir rozet (#258, ADR-0039 §2). Adı ve ikonu katalogdaki
        aynı anahtarlı `CatalogBadge`'dedir. Rozet geri alınmaz: etkinlik ya
        da tayfa sonradan silinse de kalır.
      required: [badge_key, earned_at]
      properties:
        badge_key: { type: string }
        year:
          type: integer
          format: int32
          description: Yalnızca yıllık rozette, kazanıldığı takvim yılı.
        tayfa_id:
          type: string
          format: uuid
          description: Yalnızca şampiyonluk rozetinde, etkinliğin tayfası (silinmiş olabilir).
        event_id:
          type: string
          format: uuid
          description: Yalnızca şampiyonluk rozetinde, etkinlik (silinmiş olabilir).
        earned_at: { type: string, format: date-time }
    CatalogEventType:
      type: object
      description: Bir etkinlik türünün bir sürümü.
      required: [key, interest_keys, labels, icon, modes, status, version, definition]
      properties:
        key: { type: string, description: "Değişmez anahtar: `^[a-z][a-z0-9_]{1,39}$`." }
        interest_keys:
          type: array
          description: 1–3 ilgi alanı; ilki ana ilgi alanıdır. Tür hepsinde listelenir.
          minItems: 1
          maxItems: 3
          items: { type: string }
        labels: { $ref: "#/components/schemas/CatalogLabels" }
        icon: { type: string, description: "İstemcinin sabit ikon setinden bir anahtar." }
        modes:
          type: array
          description: Bu türde etkinliğin alabileceği modlar.
          minItems: 1
          maxItems: 2
          items: { $ref: "#/components/schemas/EventMode" }
        status: { $ref: "#/components/schemas/CatalogStatus" }
        version: { type: integer, format: int32, minimum: 1, description: "Türün her değişikliğinde artar." }
        definition: { $ref: "#/components/schemas/CatalogDefinition" }
    CatalogDefinition:
      type: object
      description: |
        Tür tanımı (ADR-0025 §3, ADR-0037 §2). Tamamen bildirimseldir:
        çalıştırılabilir kural, ifade, şablon, HTML ya da URL içermez. Sunucu
        tanımı kapalı bir şemaya karşı doğrular (bilinmeyen anahtar
        reddedilir, en fazla 16 KiB); istemci de yalnızca bildiği anahtarları
        yorumlar. Üç anahtar da isteğe bağlıdır: boş nesne, alanı ve
        bileşeni olmayan türdür ("Genel").
      properties:
        fields:
          type: array
          description: Etkinliğin türe özel alanları (en fazla 20). Değerleri etkinliğin `fields` nesnesindedir.
          maxItems: 20
          items: { $ref: "#/components/schemas/CatalogField" }
        components:
          type: array
          description: Etkinliğin bileşenleri, gösterim sırasıyla (en fazla 20).
          maxItems: 20
          items: { $ref: "#/components/schemas/CatalogComponent" }
        flags: { $ref: "#/components/schemas/CatalogTypeFlags" }
    CatalogTypeFlags:
      type: object
      description: Tür bayrakları (ADR-0037 §1). Olmayan bayrak `false`tur.
      properties:
        sensitive_attendance:
          type: boolean
          description: Katılım kişisel geçmişe, istatistiğe ve arkadaşlık puanına girmez; katılımcı listesini yalnızca organizatör, moderatör ve yönetici görür (diğerleri `attendees-hidden`).
        album_notice:
          type: boolean
          description: Albüme yüklemeden önce izin onayı istenir; onaysız istek `album-consent-required` alır (`consent_ack`).
        personal_scope_forbidden:
          type: boolean
          description: Bu türde kişi bazında değer tutulmaz (kişisel ölçüm ve günlük tanımlanamaz).
    CatalogField:
      type: object
      description: |
        Bir alan: türün alanı ya da `log` bileşeninin kayıt alanı. `kind`
        kapalı listedir; para, URL, dosya, konum ve kişi alanı yoktur.
        İstemci tanımadığı bir `kind` görürse alanı göstermez ve o türde
        etkinlik oluşturmayı kapatır (ADR-0025 §9).

        | `kind` | Değer (JSON) | Ek anahtarlar |
        |--------|--------------|---------------|
        | `text` | metin, tek satır | `max_length` (≤ 120), `vocabulary` |
        | `long_text` | metin, çok satırlı | `max_length` (≤ 1000) |
        | `integer` | tam sayı | `min`, `max`, `unit` |
        | `decimal` | sayı | `min`, `max`, `decimals` (1–3), `unit` |
        | `choice` | `options`'tan biri | `options`, `option_labels` |
        | `multi_choice` | `options`'tan liste | `options`, `option_labels`, `max_selected` |
        | `boolean` | `true` / `false` | — |
        | `date` | `YYYY-MM-DD` | — |
        | `duration` | dakika, tam sayı | `min`, `max` |
      required: [key, kind, labels]
      properties:
        key: { type: string, description: "Tür içinde tekil: `^[a-z][a-z0-9_]{1,39}$`." }
        kind:
          type: string
          description: "`text`, `long_text`, `integer`, `decimal`, `choice`, `multi_choice`, `boolean`, `date`, `duration`."
        required: { type: boolean, description: "Etkinlik oluştururken zorunlu mu; yoksa `false`." }
        labels: { $ref: "#/components/schemas/CatalogLabels" }
        max_length: { type: integer, format: int32, description: "`text`, `long_text`: en fazla karakter." }
        min: { type: number, description: "`integer`, `decimal`, `duration`: en küçük değer; yoksa 0 (`duration`: 1)." }
        max: { type: number, description: "`integer`, `decimal`, `duration`: en büyük değer." }
        decimals: { type: integer, format: int32, description: "`decimal`: ondalık basamak sayısı; yoksa 2." }
        unit:
          type: string
          description: "`integer`, `decimal`: isteğe bağlı birim (birim listesi `CatalogComponent`'te); adı çeviri dosyasındadır."
        options:
          type: array
          description: "`choice`, `multi_choice`: seçenek anahtarları (`^[a-z0-9][a-z0-9_]{0,39}$`), en fazla 50."
          maxItems: 50
          items: { type: string }
        option_labels:
          type: object
          description: Seçenek anahtarı → adlar (dil → metin). Adı olmayan seçenek olduğu gibi gösterilir (`"1"` … `"5"`).
          additionalProperties: { $ref: "#/components/schemas/CatalogLabels" }
        max_selected: { type: integer, format: int32, description: "`multi_choice`: en fazla seçim; yoksa seçenek sayısı." }
        vocabulary: { $ref: "#/components/schemas/CatalogVocabulary" }
    CatalogVocabulary:
      type: object
      description: |
        `text` alanı tayfa sözlüğüne bağlıdır (ADR-0037 §4): serbest metin +
        tayfanın önceki değerlerinden otomatik tamamlama.
      required: [namespace]
      properties:
        namespace: { type: string, description: "Sözlüğün ad alanı; türler paylaşabilir." }
    CatalogComponentOptional:
      type: object
      description: Bileşen isteğe bağlıdır; organizatör etkinliği kurarken açıp kapatır (ADR-0037 §2).
      required: [default]
      properties:
        default: { type: boolean, description: "Varsayılan olarak açık mı." }
    CatalogComponent:
      type: object
      description: |
        Bir bileşen (ADR-0025 §4, ADR-0037 §3). `kind` kapalı listedir ve
        kodla büyür; istemci tanımadığı bir `kind` görürse o bölümde
        "uygulamayı güncelle" gösterir, etkinliğin geri kalanı çalışır
        (ADR-0025 §9). Katılım, kontenjan, check-in ve albüm her etkinliğin
        temelidir; bileşen değildir.

        `params` bileşene göre değişir; bilinmeyen parametre yok sayılır.
        "seçimli" işaretli parametre, değer yerine organizatöre bırakılan bir
        liste olabilir: `{"organizer_choice": ["elimination", "league",
        "swiss"], "default": "swiss"}` (ADR-0037 §2).

        | `kind` | `params` |
        |--------|----------|
        | `route` | — |
        | `meeting_point` | — |
        | `schedule` | `max_items` (1–100) |
        | `checklist` | `label` (`gear`, `task`, `section`, `duty`, `item`), `assignment`, `quantity` (boolean) |
        | `roll_call` | `alarm` (boolean), `return_grace_minutes` (1–1440) |
        | `vehicles` | `plate`, `seats` (boolean) |
        | `teams` | `mode` (`random`, `balanced`, `manual`; seçimli), `team_size` (1–50), `team_count` (2–50) |
        | `draw` | — |
        | `bracket` | `format` (`elimination`, `league`, `swiss`; seçimli), `best_of` (1, 3, 5; seçimli) |
        | `scoreboard` | `side` (`player`, `team`), `tables` (boolean), `presets` (ön ayar anahtarları), `rounds` (`round`, `single`, `first_to`; seçimli), `target` (1–100000), `winner` (`high`, `low`, `first`; seçimli), `result` (`points`, `wdl`), `best_of` (1, 3, 5; seçimli), `guests` (boolean) |
        | `ranking` | `source` (kişisel bir ölçümün `key`'i) ya da `metric` (`duration`, `rank`); biri zorunlu, ikisi birlikte olmaz; `direction` (`asc`, `desc`) |
        | `vote` | `source` (`free`, `participants`, `vehicles`, `album`, `route_stops`; zorunlu) |
        | `celebration` | `source` (bir `scoreboard`, `bracket`, `ranking` ya da `vote` bileşeninin `key`'i) |
        | `measure` | `unit`, `scope` (`personal`, `total`), `entered_by` (`self`, `organizer`) zorunlu; `min`, `max`, `decimals` (0–3), `showcase`, `sensitive` (boolean), `prefill_from` (bir alanın `key`'i) |
        | `goal` | `measure` (bir ölçümün `key`'i; zorunlu), `default_target` |
        | `log` | `fields` (`CatalogField` listesi, 1–8; zorunlu), `location` (boolean), `location_default` (`self`, `participants`, `tayfa`), `stat` (en fazla 3: `count`, `distinct:<alan>`, `sum:<alan>`), `max_entries` (1–500) |
        | `questions` | `anonymous` (boolean) |
        | `timer` | `mode` (`countdown`, `stopwatch`, `chess_clock`; seçimli), `presets` (saniye, en fazla 6) |
        | `pool_link` | `max_links` (1–50) |

        Birimler (`unit`, kapalı liste; adları çeviri dosyasında): `kg`,
        `piece`, `bag`, `km`, `m`, `altitude_m`, `page`, `minute`, `hour`,
        `unit`, `goal`, `point`, `night`, `nm`, `box`, `section`, `net`.
        Para birimi yoktur; hiçbir bileşende para, bahis ya da ödül
        parametresi yoktur.
      required: [kind]
      properties:
        kind: { type: string, description: "Bileşen türü (yukarıdaki tablo)." }
        key:
          type: string
          description: |
            Bileşenin tür içindeki anahtarı; yoksa `kind` ile aynıdır. Aynı
            `kind` bir türde birden fazla kez kullanılıyorsa (iki ölçüm) her
            biri kendi anahtarını taşır. `measure` ve `log` için zorunludur.
        labels: { $ref: "#/components/schemas/CatalogLabels" }
        optional: { $ref: "#/components/schemas/CatalogComponentOptional" }
        params:
          type: object
          description: Bileşenin parametreleri (yukarıdaki tablo); bileşene göre değişen serbest nesne.
          additionalProperties: true
    BlockedUser:
      type: object
      required: [user_id, blocked_at]
      properties:
        user_id: { type: string, format: uuid }
        display_name:
          type: string
          description: Hesap silinmişse yoktur.
        avatar_upload_id: { type: string, format: uuid }
        blocked_at: { type: string, format: date-time }
    BlockedUserList:
      type: object
      required: [users]
      properties:
        users:
          type: array
          items: { $ref: "#/components/schemas/BlockedUser" }
        next_page_token: { type: string }
    Invitation:
      type: object
      required: [tayfa_id, tayfa_name, user_id, invited_at, interests]
      properties:
        tayfa_id: { type: string, format: uuid }
        tayfa_name: { type: string }
        user_id:
          type: string
          format: uuid
          description: Davet edilen kişi.
        inviter_user_id:
          type: string
          format: uuid
          description: Davet edenin hesabı silinmişse yoktur.
        invited_at: { type: string, format: date-time }
        interests:
          type: array
          description: Tayfanın ilgi alanları (issue #194).
          items: { $ref: "#/components/schemas/InterestKey" }
    InvitationList:
      type: object
      required: [invitations]
      properties:
        invitations:
          type: array
          items: { $ref: "#/components/schemas/Invitation" }
        next_page_token: { type: string }
    UserProfile:
      type: object
      required: [user_id, display_name, self, mutual_tayfas, activity_visible]
      properties:
        user_id: { type: string, format: uuid }
        display_name: { type: string }
        avatar_upload_id: { type: string, format: uuid }
        self: { type: boolean }
        friend_state:
          type: string
          description: Aranızda arkadaşlık ya da istek yoksa alan yoktur.
          enum: [friends, incoming, outgoing]
        mutual_tayfas:
          type: array
          description: İkinizin de etkin üyesi olduğu tayfalar (en fazla 100); kendi profilinizde boş.
          items:
            type: object
            required: [id, name]
            properties:
              id: { type: string, format: uuid }
              name: { type: string }
        activity_visible:
          type: boolean
          description: Katılım geçmişinden size bir şey gösterilip gösterilemeyeceği.
        activity_visibility:
          $ref: "#/components/schemas/ActivityVisibility"
        badges:
          type: array
          description: |
            Kişisel rozetler, kazanılma sırasıyla (#258, ADR-0039 §3). Kendi
            profilinizde her zaman (yoksa boş liste); başkasınınkinde
            yalnızca kişinin kişisel istatistik görünürlüğü size izin
            veriyorsa döner (varsayılan kapalı), yoksa alan da yoktur.
            Şampiyonluk rozetleri tayfanın içinde ayrıca görünür.
          items: { $ref: "#/components/schemas/EarnedBadge" }
        birthday:
          $ref: "#/components/schemas/Birthday"
        interests:
          type: array
          items: { $ref: "#/components/schemas/InterestKey" }
        about: { type: string }
        occupation: { type: string }
        team: { type: string }
        languages:
          type: array
          items: { type: string, pattern: "^[a-z]{2}$" }
        social_accounts:
          type: array
          description: Yalnızca arkadaşlara (ve kendinize) döner.
          items: { $ref: "#/components/schemas/SocialAccount" }
    Birthday:
      type: object
      description: |
        Doğum gününün gösterilen kısmı. Yalnızca arkadaşlara ve ayar izin
        verdiğinde (kendi profilinizde her zaman) döner; yoksa alan da
        yoktur.
      required: [month, day]
      properties:
        month: { type: integer, minimum: 1, maximum: 12 }
        day: { type: integer, minimum: 1, maximum: 31 }
        year: { type: integer, description: "Yalnızca `full` ayarında ve kendi profilinizde." }
        age:
          type: integer
          description: "Bugünkü yaş (Türkiye saatiyle); `year` ile birlikte."
    ActivityRecord:
      type: object
      required: [event_type, mode, started_at, tayfa_member]
      properties:
        event_type: { $ref: "#/components/schemas/EventTypeKey" }
        mode: { type: string, enum: [in_person, online] }
        city: { type: string }
        district: { type: string }
        started_at: { type: string, format: date-time }
        tayfa_member:
          type: boolean
          description: Kaydın tayfasının etkin üyesisiniz; aşağıdaki alanlar yalnızca o zaman doludur.
        tayfa_id: { type: string, format: uuid }
        tayfa_name: { type: string }
        event_id:
          type: string
          format: uuid
          description: Etkinlik silinmişse yoktur.
        event_title: { type: string }
        duration_minutes: { type: integer }
    ActivityList:
      type: object
      required: [records]
      properties:
        records:
          type: array
          items: { $ref: "#/components/schemas/ActivityRecord" }
        next_page_token: { type: string }

    ReportTargetType:
      type: string
      description: |
        `dm_message` (birebir mesaj) yalnızca `POST /v1/me/reports` ile;
        diğerleri yalnızca tayfa ucuyla. `channel_message` kanal mesajıdır
        (metin, fotoğraf ya da yer; #205). `log_entry` bir günlük bileşeni
        kaydıdır (#243; eskiden `fishing_catch`). `event_question` soru
        toplama bileşenindeki bir sorudur (#256); anonim sorunun yazarı
        tayfa kuyruğunda yer almaz (`subject_user_id` yoktur), yalnızca
        platform yönetimine görünür.
      enum: [user, tayfa, announcement, event, question, answer, poll, log_entry, dm_message, event_photo, channel_message, event_question]

    BanRequest:
      type: object
      additionalProperties: false
      properties:
        reason:
          allOf: [{ $ref: "#/components/schemas/ReportReason" }]
          description: |
            İsteğe bağlı. Şikâyet nedenleriyle aynı liste; `staff_conduct`
            kabul edilmez (`validation`, alan `reason`).
    ReportReason:
      type: string
      description: |
        Topluluk Kuralları'na göre. `child_safety` (çocuk/genç güvenliği)
        kuyrukta öne geçer ve hemen platforma da gider; `staff_conduct`
        (yönetici/moderatörün yetkisini kullanımı) yalnızca platforma gider.
      enum: [harassment, hate_speech, violence, privacy, impersonation, illegal_trade, drugs, gambling, dangerous_activity, fake_event, sexual_content, child_safety, spam, copyright, staff_conduct, other]

    ReportCreateRequest:
      type: object
      additionalProperties: false
      required: [target_type, target_id, reason]
      properties:
        target_type: { $ref: "#/components/schemas/ReportTargetType" }
        target_id:
          type: string
          format: uuid
          description: "`tayfa` için yoldaki `tayfa_id` ile aynı olmalıdır."
        reason: { $ref: "#/components/schemas/ReportReason" }
        description:
          type: string
          maxLength: 1000
          description: İsteğe bağlı; baştaki ve sondaki boşluklar atılır. Satır sonu olabilir.
        evidence_text:
          type: string
          minLength: 1
          maxLength: 2000
          description: |
            Yalnızca `dm_message` için (kullanıcı şikâyetinde yoktur;
            `evidence_upload_id` yoksa zorunlu): şikâyet ettiğiniz
            mesajın kendi cihazınızdan paylaştığınız metni. Yalnızca platform
            okur; log'a ve olaylara yazılmaz, size geri dönmez.
        evidence_upload_id:
          type: string
          format: uuid
          description: |
            Yalnızca `dm_message` için (#205): şikâyet ettiğiniz fotoğrafı
            kendi cihazınızdan `report_evidence` yüklemesi olarak (metadata'sız
            iki varyant) yükleyip burada verirsiniz. Hazır, kendi ve
            kullanılmamış olmalıdır (`upload-not-found`, `upload-not-ready`,
            `upload-in-use`). Yalnızca platform paneli görür.

    MyReport:
      type: object
      description: |
        Şikâyet, şikâyet eden kişinin gördüğü haliyle. Hangi işlemin yapıldığı
        ve kimin çözdüğü gösterilmez; yalnızca sonuç (`outcome`) vardır.
      required: [id, target_type, target_id, reason, status, created_at]
      properties:
        id: { type: string, format: uuid }
        tayfa_id:
          type: string
          format: uuid
          description: Birebir mesaj şikâyetinde ve kişi profilinden yapılan kullanıcı şikâyetinde yoktur.
        target_type: { $ref: "#/components/schemas/ReportTargetType" }
        target_id: { type: string, format: uuid }
        reason: { $ref: "#/components/schemas/ReportReason" }
        description: { type: string }
        status: { type: string, enum: [open, resolved] }
        outcome:
          type: string
          description: Yalnızca çözülmüş şikâyette.
          enum: [action_taken, dismissed]
        created_at: { type: string, format: date-time }
        resolved_at: { type: string, format: date-time }

    MyReportList:
      type: object
      required: [reports]
      properties:
        reports:
          type: array
          items: { $ref: "#/components/schemas/MyReport" }
        next_page_token: { type: string }

    ModerationReport:
      type: object
      description: |
        Şikâyet, tayfa moderatörünün gördüğü haliyle. Şikâyet edenin kimliği,
        platforma yükselme ve yaş için alan yoktur. `priority:
        minor_involved` taraflardan birinin (şikâyet eden ya da şikâyet
        edilen) şikâyet anında 18 yaşından küçük olduğunu ya da bunun
        bilinmediğini söyler; hangisi olduğu ve kimsenin yaşı gösterilmez.
      required: [id, tayfa_id, target_type, target_id, reason, priority, status, created_at]
      properties:
        id: { type: string, format: uuid }
        tayfa_id: { type: string, format: uuid }
        target_type: { $ref: "#/components/schemas/ReportTargetType" }
        target_id: { type: string, format: uuid }
        subject_user_id:
          type: string
          format: uuid
          description: Şikâyet edilen üye ya da içeriğin yazarı; hesap silindiyse ve anonim etkinlik sorusunda (`event_question`) yoktur. Yazarı gizli şikâyet `member_sanctioned` ile kapatılamaz.
        reason: { $ref: "#/components/schemas/ReportReason" }
        description: { type: string }
        priority: { type: string, enum: [normal, minor_involved] }
        status: { type: string, enum: [open, resolved] }
        resolution:
          type: string
          description: Yalnızca çözülmüş şikâyette.
          enum: [content_removed, member_sanctioned, dismissed]
        handled_by_user_id:
          type: string
          format: uuid
          description: Çözen moderatör; açıkken ya da hesap silindiyse yoktur.
        created_at: { type: string, format: date-time }
        resolved_at: { type: string, format: date-time }
        channel_id:
          type: string
          format: uuid
          description: |
            Yalnızca `channel_message`: mesajın kanalı (mesajı açmak için).
            Kanalı okuyamayan moderatör (içinde olmadığı etkinlik ya da seçili
            kişi kanalı) mesajı açamaz ve gizleyemez.

    ModerationReportList:
      type: object
      required: [reports]
      properties:
        reports:
          type: array
          items: { $ref: "#/components/schemas/ModerationReport" }
        next_page_token: { type: string }

    ReportResolveRequest:
      type: object
      additionalProperties: false
      required: [resolution]
      properties:
        resolution: { type: string, enum: [content_removed, member_sanctioned, dismissed] }

security:
  - bearer: []
