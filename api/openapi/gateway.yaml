      summary: Seriyi bitirir (seriyi açan, moderatör, yönetici)
      description: |
        Yeni etkinlik açılmaz; serinin başlamamış, planlı ve ayrıca
        düzenlenmemiş etkinlikleri iptal edilir. Bitmiş seri
        `event-series-ended` alır.
      parameters:
