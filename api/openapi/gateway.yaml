        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
    delete:
      operationId: unarchiveChannel
      summary: Kanalı arşivden çıkarır
      description: Arada aynı isimde kanal açıldıysa `channel-name-taken`.
      parameters:
        - $ref: "#/components/parameters/ClientHeader"
      responses:
        "200":
          description: Kanal
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Channel" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }

  /v1/tayfas/{tayfa_id}/channels/{channel_id}/messages:
    parameters:
      - $ref: "#/components/parameters/TayfaID"
      - $ref: "#/components/parameters/ChannelID"
    get:
      operationId: listChannelMessages
      summary: Kanal mesajları
      description: |
        `after_message_id` yoksa en yeni önce, `next_page_token` eskiye
        doğru gider. `after_message_id` (elinizdeki son mesaj) verilirse
        ondan yeni mesajlar en eski önce gelir ve `next_page_token` yeniye
        doğru gider: yeniden bağlanınca eksikler böyle tamamlanır (ADR-0005).
        Silinen mesaj yerinde `deleted: true` ve metinsiz, fotoğrafsız,
        yersiz durur ("Bu mesaj silindi").
      parameters:
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/PageToken"
        - name: after_message_id
          in: query
          required: false
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Mesajlar
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChannelMessageList" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
    post:
      operationId: sendChannelMessage
      summary: Kanala mesaj yazar
      description: |
        Mesajın türü `kind` (#205, ADR-0031): `text` (varsayılan), `photo`
        ya da `place`; başka türün alanı gönderilirse `invalid-request`.
        - `text`: `body` 1–4000 karakter, yalnız boşluk olamaz; sekme ve
          satır sonu dışında kontrol karakteri içeremez.
        - `photo`: `photo_upload_id`, bu tayfa için açılmış, hazır (`ready`)
          ve başka mesajda kullanılmamış kendi `chat_photo` yüklemeniz
          (`POST /v1/uploads`). Alt yazı yoktur. Bilinmeyen, başkasının ya
          da başka amaçlı/tayfalı yükleme `upload-not-found` (404), hazır
          değilse `upload-not-ready`, başka mesajdaysa `upload-in-use`
          (409). Fotoğrafın linkini yalnızca kanalın kitlesi alır
          (`POST /v1/media/urls`).
        - `place`: haritadan seçtiğiniz yer `{latitude, longitude, name?}`
          (enlem −90..90, boylam −180..180, ad 1–120 karakter). Paylaştığınız
          içeriktir, cihaz konumu değildir (ADR-0008); metin gibi sunucu
          anahtarıyla şifreli saklanır ve log'a yazılmaz. Aynı `client_request_id` ile
        tekrar gönderim ilk mesajı döndürür, yeni mesaj yazmaz (yavaş moda da
        takılmaz); başka kanalda kullanılmış değer `invalid-request`.
        Susturulmuşsanız `muted`, kanal arşivliyse `channel-archived`. Yavaş
        modda erken gönderim `slow-mode` (429) ve `Retry-After` başlığını
        (saniye) alır; yönetici ve moderatörler muaftır. Mesaj düzenlenemez.
        Aynı kurallar WebSocket gönderiminde de geçerlidir.

        Mesaj gönderimi kullanıcı başına hız sınırlıdır: kanal ve birebir
        mesajlar, REST ve WebSocket tek sayaçtan sayılır (dakikada 30, kısa
        patlama 10; tekrar gönderim de sayılır). Aşılınca `rate-limited`
        (429). Yavaş mod ve mesaj isteği sınırı ayrıca geçerlidir.
      parameters:
        - $ref: "#/components/parameters/ClientHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChannelMessageCreateRequest" }
      responses:
        "201":
          description: Mesaj (tekrar gönderimde ilk mesaj)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChannelMessage" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "429":
          description: |
            Yavaş mod (`slow-mode`, `Retry-After` ile) ya da mesaj hız
            sınırı (`rate-limited`, başlıksız).
          headers:
            Retry-After:
              description: Tekrar denemeden önce beklenecek saniye.
              schema: { type: integer, minimum: 1, maximum: 3600 }
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "503": { $ref: "#/components/responses/Problem" }

  /v1/tayfas/{tayfa_id}/channels/{channel_id}/messages/{message_id}:
    parameters:
