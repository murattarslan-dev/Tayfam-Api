        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }

  # --- Etkinlik bileşenleri: kura (`draw`; core DrawComponentService, #249, ADR-0025 §4, §5, §6) ---
  # Etkinliğin katılımcılarını (tür bir takım bileşeni içeriyorsa ve bu
  # etkinlikte açıksa, ilk takım bileşeninin üyesi olan takımları) rastgele
  # sıraya dizer. Ardışık iki yer bir eşleşmedir (1–2, 3–4 …); tek sayıda
  # girişte son yer bay geçer. Eşleşme ağacı sırayı tohum olarak kullanır.
  # Kura bir kez çekilir ve sabittir: yeniden çekilmez, değiştirilemez;
  # kimin çektiği denetim kaydındadır. Bir yer yalnızca boşalır (kişi
  # tayfadan ayrıldı ya da hesabını sildi, takım kaldırıldı). Kurayı
  # organizatör, moderatör ve yönetici çeker; bitişten 7 gün sonrasına kadar
  # (`component-frozen`). Kura katılımdır, seri örneğine kopyalanmaz.
  # Katılımcı kurasına etkinliğin misafir oyuncuları da girer (#252,
  # `guest_id`); misafirin yeri boşalmaz.

  /v1/tayfas/{tayfa_id}/events/{event_id}/components/{component_key}/draw:
    parameters:
      - $ref: "#/components/parameters/TayfaID"
      - $ref: "#/components/parameters/EventID"
