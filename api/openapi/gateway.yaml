      parameters:
        - $ref: "#/components/parameters/ClientHeader"
      responses:
        "200":
          description: Ölçüm, güncel haliyle
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EventMeasure" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }

  /v1/tayfas/{tayfa_id}/events/{event_id}/components/{component_key}/measure/entries/{user_id}:
    parameters:
      - $ref: "#/components/parameters/TayfaID"
      - $ref: "#/components/parameters/EventID"
      - $ref: "#/components/parameters/ComponentKey"
      - $ref: "#/components/parameters/UserID"
    put:
      operationId: setEventMeasureEntry
      summary: Bir katılımcının kişisel ölçümünü yazar
      description: |
