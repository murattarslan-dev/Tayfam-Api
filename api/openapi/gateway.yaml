      - $ref: "#/components/parameters/AnnouncementID"
    post:
      operationId: restoreAnnouncement
      summary: Gizlenen duyuruyu geri alır (yönetici)
      description: |
        Moderatör ya da yöneticinin sildiği duyuru 30 gün içinde geri
        alınabilir; yazarın şu anki rolü sizinkinden düşük olmalıdır. Yazarın
        kendi sildiği ya da süresi geçen duyuru `announcement-not-found`
        alır. Görünen bir duyuru için de başarılıdır.
      parameters:
        - $ref: "#/components/parameters/ClientHeader"
      responses:
        "200":
          description: Geri alınan duyuru
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Announcement" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }

  # --- Soru-cevap (core QAService) ---
  #
  # Ortak kurallar: tayfanın soru-cevap modülü (`qa`) kapalıysa okumalar
  # dahil her uç `module-disabled` alır. Bu tayfada olmayan ya da silinmiş
  # soru `question-not-found`, cevap `answer-not-found`, etiket
  # `tag-not-found` alır; silinen sorunun cevapları da bulunmaz. Soru ve
  # cevabı her etkin üye yazar; susturulmuş üye yazamaz (`muted`), yalnızca
  # kendi soru ve cevabını silebilir. Başkasının içeriğini moderatör ve
  # yönetici, yazarın şu anki rolü kendisininkinden düşükse
  # (`role-hierarchy`) düzenler ve siler. Kendi sildiğiniz içerik hemen
  # boşaltılır; başkasının sildiği gizlenir ve yönetici 30 gün içinde geri
  # alabilir.

  /v1/tayfas/{tayfa_id}/questions:
    parameters:
      - $ref: "#/components/parameters/TayfaID"
    get:
      operationId: listQuestions
      summary: Soruları listeler ve arar
      description: |
        `q` yoksa yeniden eskiye; `q` varsa başlıkta ve gövdede Türkçe tam
        metin arama yapar (İ/ı doğru: "IŞIK" "ışık"ı, "izmir" "İzmir"i
        bulur) ve en ilgiliden başlar. `tag_id` ikisiyle de süzer. Arama
        metni gateway'de ve core'da log'a yazılmaz; `next_page_token`
        metni taşımaz ve yalnızca aynı `q` ve `tag_id` ile geçerlidir.
      parameters:
        - name: q
          in: query
          required: false
          description: Arama metni; en fazla 100 karakter, tek satır.
          schema: { type: string, maxLength: 100 }
        - name: tag_id
          in: query
          required: false
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/PageToken"
      responses:
        "200":
          description: Sorular
          content:
            application/json:
              schema: { $ref: "#/components/schemas/QuestionList" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
    post:
      operationId: createQuestion
      summary: Soru sorar
      description: |
        Etiketler adla verilir; tayfada büyük/küçük harf farkıyla (Türkçe
        kurallarla) aynı adlı etiket varsa o kullanılır, yoksa açılır.
        Tayfada en fazla 200 etiket olabilir (`tag-limit`). Aynı
        `client_request_id` ile tekrar gönderilen istek yeni soru açmaz,
        ilk soruyu döndürür.
      parameters:
        - $ref: "#/components/parameters/ClientHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/QuestionCreateRequest" }
      responses:
        "201":
          description: Sorulan soru
          headers:
            Location:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Question" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }

  /v1/tayfas/{tayfa_id}/questions/{question_id}:
    parameters:
      - $ref: "#/components/parameters/TayfaID"
      - $ref: "#/components/parameters/QuestionID"
    get:
      operationId: getQuestion
      summary: Tek bir soru
      responses:
        "200":
          description: Soru
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Question" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
    patch:
      operationId: updateQuestion
      summary: Soruyu düzenler (yazar ya da moderatör, yönetici)
      description: |
        Gövdede bulunan alanlar değişir; `tags` sorunun etiketlerini
        tümüyle değiştirir (boş dizi hepsini kaldırır).
      parameters:
        - $ref: "#/components/parameters/ClientHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/QuestionUpdateRequest" }
      responses:
        "200":
          description: Güncel soru
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Question" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
    delete:
      operationId: deleteQuestion
      summary: Soruyu siler (yazar ya da moderatör, yönetici)
      description: |
        Kendi sorunuzu silerseniz başlık, gövde ve etiketleri hemen
        kaldırılır, geri alınamaz. Başkasınınkini silmek onu gizler. Silinen
        sorunun cevapları da görünmez.
      parameters:
        - $ref: "#/components/parameters/ClientHeader"
      responses:
        "204": { description: Soru silindi }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }

  /v1/tayfas/{tayfa_id}/questions/{question_id}/restoration:
    parameters:
      - $ref: "#/components/parameters/TayfaID"
      - $ref: "#/components/parameters/QuestionID"
    post:
      operationId: restoreQuestion
      summary: Gizlenen soruyu geri alır (yönetici)
      description: |
        Moderatör ya da yöneticinin sildiği soru 30 gün içinde geri
        alınabilir; yazarın şu anki rolü sizinkinden düşük olmalıdır.
        Yazarın kendi sildiği ya da süresi geçen soru `question-not-found`
        alır. Görünen bir soru için de başarılıdır.
      parameters:
        - $ref: "#/components/parameters/ClientHeader"
      responses:
        "200":
          description: Geri alınan soru
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Question" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }

  /v1/tayfas/{tayfa_id}/questions/{question_id}/answers:
    parameters:
      - $ref: "#/components/parameters/TayfaID"
      - $ref: "#/components/parameters/QuestionID"
    get:
      operationId: listAnswers
      summary: Sorunun cevapları
      description: |
        Faydalı oyu çoktan aza, eşitlikte eskiden yeniye. `voted`
        çağıranın oyunu gösterir. Çözüm işaretleme yoktur.
      parameters:
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/PageToken"
      responses:
        "200":
          description: Cevaplar
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AnswerList" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
    post:
      operationId: createAnswer
      summary: Soruyu cevaplar
      description: |
        Aynı `client_request_id` ile tekrar gönderilen istek ilk cevabı
        döndürür. Soru sahibine bildirim gider (`answer_received`).
      parameters:
        - $ref: "#/components/parameters/ClientHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AnswerCreateRequest" }
      responses:
        "201":
          description: Yazılan cevap
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Answer" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }

  /v1/tayfas/{tayfa_id}/answers/{answer_id}:
    parameters:
      - $ref: "#/components/parameters/TayfaID"
      - $ref: "#/components/parameters/AnswerID"
    patch:
      operationId: updateAnswer
