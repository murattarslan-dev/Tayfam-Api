  # --- Etkinlik bileşenleri: misafir oyuncu (core GuestPlayerComponentService, #252, ADR-0037 §6) ---
  # Uygulamada hesabı olmayan oyuncu, yalnızca takma adla (1–24 karakter).
  # Misafir etkinliğindir (en fazla 30) ve misafir alan (`guests: true`)
  # bir yazboz bileşeni üzerinden eklenir; `component_key` o bileşendir.
  # Misafir kişi masasına oturur (`EventScorePlayerInput.guest_id`) ve
  # etkinliğin katılımcı kurasına girer (`EventDrawEntry.guest_id`), böylece
  # eşleşme ağacında da oynar. Profili, iletişim alanı, istatistiği,
  # kutlama bildirimi ve arkadaşlık puanı yoktur. Takma ad etkinliğin
  # bitiminden 30 gün sonra, ekleyen hesabını silince hemen silinir; misafir
  # adsız kalır. Takma ad log'a, denetim kaydına ve olaya yazılmaz.
  # Değişiklikler canlıdır (`event.component_changed`) ve bitişten 7 gün
  # sonrasına kadar yapılır (`component-frozen`). Bileşen misafir almıyorsa
  # bütün uçlar `guest-players-disabled`.

  /v1/tayfas/{tayfa_id}/events/{event_id}/components/{component_key}/guests:
    parameters:
      - $ref: "#/components/parameters/TayfaID"
      - $ref: "#/components/parameters/EventID"
      - $ref: "#/components/parameters/ComponentKey"
    get:
      operationId: listEventGuestPlayers
      summary: Etkinliğin misafir oyuncuları
      description: |
        Her etkin üyeye açıktır (susturulmuş üye de okur); iptal edilmiş ve
        donmuş etkinlikte de okunur. Bileşen uçlarının ortak kuralları
        geçerlidir.
      responses:
        "200":
          description: Misafirler
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EventGuestPlayers" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
    post:
      operationId: addEventGuestPlayer
      summary: Misafir oyuncu ekler (organizatör, moderatör, yönetici, hakem)
      description: |
        Etkinliğin, bileşenin ya da `table_id` masasının hakemi de ekler;
        diğerleri `permission-denied`. Bileşende olmayan masa
        `score-table-not-found`; 30 misafirde `event-limit`. Bileşen
        uçlarının ortak kuralları geçerlidir.
      parameters:
        - $ref: "#/components/parameters/ClientHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EventGuestPlayerRequest" }
      responses:
        "201":
          description: Misafirler, güncel haliyle
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EventGuestPlayers" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }

  /v1/tayfas/{tayfa_id}/events/{event_id}/components/{component_key}/guests/{guest_id}:
    parameters:
      - $ref: "#/components/parameters/TayfaID"
      - $ref: "#/components/parameters/EventID"
      - $ref: "#/components/parameters/ComponentKey"
      - $ref: "#/components/parameters/GuestPlayerID"
    delete:
