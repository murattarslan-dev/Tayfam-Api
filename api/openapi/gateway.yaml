  /v1/tayfas/{tayfa_id}/channels/{channel_id}/messages:
    parameters:
      - $ref: "#/components/parameters/TayfaID"
      - $ref: "#/components/parameters/ChannelID"
    get:
      operationId: listChannelMessages
      summary: Kanal mesajları
      description: |
        `after_message_id` yoksa en yeni önce, `next_page_token` eskiye
        doğru gider. `after_message_id` (elinizdeki son mesaj) verilirse
        ondan yeni mesajlar en eski önce gelir ve `next_page_token` yeniye
        doğru gider: yeniden bağlanınca eksikler böyle tamamlanır (ADR-0005).
        Silinen mesaj yerinde `deleted: true` ve metinsiz durur ("Bu mesaj
        silindi").
      parameters:
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/PageToken"
        - name: after_message_id
          in: query
          required: false
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Mesajlar
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChannelMessageList" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
    post:
      operationId: sendChannelMessage
      summary: Kanala mesaj yazar
      description: |
        Metin 1–4000 karakter, yalnız boşluk olamaz; sekme ve satır sonu
        dışında kontrol karakteri içeremez. Aynı `client_request_id` ile
        tekrar gönderim ilk mesajı döndürür, yeni mesaj yazmaz (yavaş moda da
        takılmaz); başka kanalda kullanılmış değer `invalid-request`.
        Susturulmuşsanız `muted`, kanal arşivliyse `channel-archived`. Yavaş
        modda erken gönderim `slow-mode` (429) ve `Retry-After` başlığını
        (saniye) alır; yönetici ve moderatörler muaftır. Mesaj düzenlenemez.
        Aynı kurallar WebSocket gönderiminde de geçerlidir.

        Mesaj gönderimi kullanıcı başına hız sınırlıdır: kanal ve birebir
        mesajlar, REST ve WebSocket tek sayaçtan sayılır (dakikada 30, kısa
        patlama 10; tekrar gönderim de sayılır). Aşılınca `rate-limited`
        (429). Yavaş mod ve mesaj isteği sınırı ayrıca geçerlidir.
      parameters:
        - $ref: "#/components/parameters/ClientHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChannelMessageCreateRequest" }
      responses:
        "201":
          description: Mesaj (tekrar gönderimde ilk mesaj)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChannelMessage" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "429":
          description: |
            Yavaş mod (`slow-mode`, `Retry-After` ile) ya da mesaj hız
            sınırı (`rate-limited`, başlıksız).
          headers:
            Retry-After:
              description: Tekrar denemeden önce beklenecek saniye.
              schema: { type: integer, minimum: 1, maximum: 3600 }
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "503": { $ref: "#/components/responses/Problem" }

  /v1/tayfas/{tayfa_id}/channels/{channel_id}/messages/{message_id}:
    parameters:
      - $ref: "#/components/parameters/TayfaID"
      - $ref: "#/components/parameters/ChannelID"
      - $ref: "#/components/parameters/MessageID"
    delete:
      operationId: deleteChannelMessage
      summary: Mesajı siler
      description: |
        Kendi mesajınızı silerseniz metin hemen ve geri alınamaz biçimde
        silinir. Yönetici ve moderatörler başkasının mesajını gizler; yazarın
        güncel rolü sizinkine eşit ya da yüksekse `role-hierarchy` (403;
        tayfadan ayrılmış yazar sınırlamaz). Yönetici 30 gün içinde geri
        alabilir, sonra kalıcı silinir. Silinmiş mesajı silmek bir şey
        değiştirmez.
      parameters:
        - $ref: "#/components/parameters/ClientHeader"
      responses:
        "204": { description: Silindi }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }

  /v1/tayfas/{tayfa_id}/channels/{channel_id}/messages/{message_id}/restoration:
    parameters:
      - $ref: "#/components/parameters/TayfaID"
      - $ref: "#/components/parameters/ChannelID"
      - $ref: "#/components/parameters/MessageID"
    post:
      operationId: restoreChannelMessage
      summary: Moderasyonla gizlenen mesajı geri alır (yönetici)
      description: |
        30 gün içinde, yazarın güncel rolünün üstündeyseniz (`role-hierarchy`).
        Yazarın kendi silmesi ve daha eskisi `message-not-found` alır. Görünür mesajı geri almak bir şey
        değiştirmez. Her geri alma kayıt altına alınır.
      parameters:
        - $ref: "#/components/parameters/ClientHeader"
      responses:
        "200":
          description: Mesaj
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChannelMessage" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }

  /v1/tayfas/{tayfa_id}/channels/{channel_id}/read:
    parameters:
      - $ref: "#/components/parameters/TayfaID"
      - $ref: "#/components/parameters/ChannelID"
    put:
      operationId: markChannelRead
      summary: Kanalı bu mesaja kadar okundu işaretler
      description: |
        Okundu işareti yalnızca ileri gider; daha eski bir mesaj bir şey
        değiştirmez. Mesaj bu kanalda olmalıdır (`message-not-found`).
        Susturulmuş üyeler de işaretleyebilir.
      parameters:
        - $ref: "#/components/parameters/ClientHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChannelReadRequest" }
      responses:
        "204": { description: Okundu }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }

  /v1/direct-messages:
    post:
      operationId: sendDirectMessage
      summary: Birebir mesaj gönderir
      description: |
        `recipient_user_id` kişisine yazar; ilk mesaj konuşmayı açar. Kim
        kime yazabilir her mesajda core'a sorulur (Notion v7): iki yönden
        biri engellediyse, ortak aktif tayfanız yoksa ve arkadaş
        değilseniz `direct-message-not-allowed` (403; hangisi olduğu
        söylenmez, bilinmeyen kullanıcı da aynı cevabı alır). Arkadaşlar ve
        ortak etkinlik geçmişi olanlar serbestçe yazışır; diğerleri **mesaj
        isteği** açar: alıcı cevap yazana ya da kabul edene kadar yalnızca
        bir mesaj (`message-request-pending`, 409; alıcı reddettiyse de aynı
        cevap, ret size söylenmez; alıcı sizi reddedilenler listesinden
        çıkarana kadar arkadaş olsanız bile yazamazsınız). Günde en fazla 20
        istek; ortak tayfaya 7 günden kısa süredir üyeyseniz 5
        (`message-request-limit`, 429; reddedilen istekler de sayılır).

        Mesaj gönderimi kullanıcı başına hız sınırlıdır: kanal ve birebir
        mesajlar, REST ve WebSocket tek sayaçtan sayılır (dakikada 30, kısa
        patlama 10; tekrar gönderim de sayılır). Aşılınca `rate-limited`
        (429). Yavaş mod ve mesaj isteği sınırı ayrıca geçerlidir.

        Metin 1–4000 karakter, yalnız boşluk olamaz; sekme ve satır sonu
        dışında kontrol karakteri içeremez. Aynı `client_request_id` ile
        tekrar gönderim ilk mesajı döndürür; başka konuşmada kullanılmış
        değer `invalid-request`. Mesaj düzenlenemez. Düz sürümde mesajlar
        sunucuda şifreli saklanır. Aynı kurallar WebSocket `dm.send`
        çerçevesinde de geçerlidir.

        **Uçtan uca şifreleme (Signal; #127, ADR-0018):** `body` yerine
        `envelopes` gönderilir: alıcının **tüm** cihazlarına ve sizin
        **diğer tüm** cihazlarınıza birer zarf (en fazla 16). Gönderen
        cihaz, token'ın oturumuna kayıtlı cihazdır
        (`POST /v1/me/e2e/device`; yoksa `e2e-device-not-registered`, 409).
        Küme birebir aynı olmalıdır: eksik, fazla, aynı cihaza iki zarf ya
        da kayıt kimliği değişmiş cihaz `e2e-devices-changed` (409,
        `missing_device_ids` ve `stale_device_ids` ile;
        `E2EDevicesChangedProblem`) döner; cihaz listelerini tazeleyip
        tekrar deneyin. Alıcının cihazı yoksa `e2e-recipient-unavailable`
        (409). Sunucu zarfları açmaz; mesaj içeriksiz saklanır
        (`encryption: e2e`, `body` yok). Zarflar hedef cihaza
        `GET /v1/me/e2e/envelopes` ve WebSocket `dm.envelope` ile gider.
        Zarflı gönderim yalnızca REST'tedir (WebSocket çerçevesi 64 KB).
        Gövde en fazla 1,5 MiB.

        **Geri düşüş yok:** sizin ya da alıcının E2E cihazı varsa `body`
        ile gönderim `e2e-required` (409) alır.
      parameters:
        - $ref: "#/components/parameters/ClientHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DirectMessageCreateRequest" }
      responses:
        "201":
          description: Mesaj ve konuşma (tekrar gönderimde ilk mesaj)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DirectMessageSent" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }

  /v1/direct-messages/conversations:
    get:
      operationId: listConversations
      summary: Birebir konuşmalarınız (son mesaja göre)
      description: |
        Okunmamış sayısıyla (en fazla 100; istemci "99+" gösterir).
        Reddettiğiniz istekler listelenmez. `peer_last_read_message_id`
