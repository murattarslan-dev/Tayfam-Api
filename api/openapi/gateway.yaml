  # --- Etkinlik bileşenleri: yazboz (`scoreboard`; core ScoreboardComponentService, #250, ADR-0025 §4–§6, ADR-0037 §5) ---
  # Oyunların el el (ya da tek maç, ilk N) skorlandığı masalar; canlı
  # güncellenir (`event.component_changed`). Bileşen en fazla 20 masa
  # taşır (`tables` parametresi kapalıysa 1). Masada katılımcılar (etkin
  # üye ve "geliyorum" demiş ya da katılımı doğrulanmış) ya da takım
  # yazbozunda etkinliğin bir takım bileşeninin takımları oturur. Masanın
  # kuralları masa kurulurken çözülüp masada saklanır: bileşen parametreleri
  # (organizatörün seçimiyle), üstüne masanın ön ayarı, hedef puanda masanın
  # kendisi. Ön ayar katalog verisidir (Batak, 101 Okey …); bileşenin
  # `presets` parametresi seçilebilenleri listeler ve böyle bileşende masa
  # bir ön ayar seçmek zorundadır. Hiçbir kuralda para, bahis ya da ödül
  # yoktur. Masa, elleri oyunu bitirdiğinde (tek maçın eli, hedefe ulaşan,
  # BO maçında yarıdan fazlasını kazanan) ya da hakem veya organizatör
  # bitirdiğinde biter; organizatör yeniden açabilir. Masayı organizatör,
  # moderatör ve yönetici yönetir ve skoru düzeltir; eli onlar ve masaya
  # (bileşene, etkinliğe) atanmış hakemler girer (`…/referees`). El,
  # etkinlik başladıktan sonra girilir (`score-not-started`); her yazma
  # bitişten 7 gün sonra kapanır (`component-frozen`). Hesabını silen
  # kişinin yeri ve skorları "Silinmiş kullanıcı" olarak kalır. Masalar
  # katılımdır, seri örneğine kopyalanmaz. Yazan her uç bileşeni güncel
  # haliyle döner. `guests` parametresi açık bileşende kişi masasına
  # misafir oyuncu da oturur (#252, `…/guests`).

  /v1/tayfas/{tayfa_id}/events/{event_id}/components/{component_key}/scoreboard:
    parameters:
      - $ref: "#/components/parameters/TayfaID"
      - $ref: "#/components/parameters/EventID"
      - $ref: "#/components/parameters/ComponentKey"
    get:
      operationId: getEventScoreboard
      summary: Etkinliğin yazbozu
      description: |
