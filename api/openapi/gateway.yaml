        "409": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
    patch:
      operationId: updateAnnouncement
      summary: Duyuruyu düzenler (moderatör, yönetici)
      description: |
        Kendi duyurunuzu, ya da yazarın şu anki rolü sizinkinden düşükse
        başkasınınkini (`role-hierarchy`). Gövdede bulunan alanlar değişir.
      parameters:
        - $ref: "#/components/parameters/ClientHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AnnouncementUpdateRequest" }
      responses:
        "200":
          description: Güncel duyuru
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Announcement" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
    delete:
      operationId: deleteAnnouncement
      summary: Duyuruyu siler (moderatör, yönetici)
      description: |
        Kendi duyurunuzu silerseniz başlık ve gövde hemen boşaltılır, geri
        alınamaz. Başkasınınkini (hiyerarşi düzenlemedeki gibi) silmek onu
        gizler; yönetici 30 gün içinde geri alabilir.
      parameters:
        - $ref: "#/components/parameters/ClientHeader"
      responses:
        "204": { description: Duyuru silindi }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }

  /v1/tayfas/{tayfa_id}/announcements/{announcement_id}/pin:
