  # --- Etkinlik bileşenleri: yoklama ve dönmeme alarmı (`roll_call`; core RollCallComponentService, #242, ADR-0025 §4, §9) ---
  # Kimin çıktığı ve döndüğü. Bileşenin `alarm` parametresi açıksa, çıkıp
  # beklenen dönüş + tolerans (`return_grace_minutes`, yoksa 30 dk) geçtiği
  # halde dönmeyen kişi için organizatöre, yöneticilere ve moderatörlere bir
  # kez `hike_overdue` bildirimi gider (kişinin kendisine gitmez; iptal
  # edilmiş etkinlikte de). Cihaz konumu alınmaz (ADR-0008). Her uç
  # bileşeni güncel haliyle döner.

  /v1/tayfas/{tayfa_id}/events/{event_id}/components/{component_key}/roll-call:
    parameters:
      - $ref: "#/components/parameters/TayfaID"
      - $ref: "#/components/parameters/EventID"
      - $ref: "#/components/parameters/ComponentKey"
    get:
      operationId: getEventRollCall
      summary: Etkinliğin yoklaması
      description: |
        Plan (beklenen dönüş), kendi kaydınız ve organizatör yetkisi
        olanlara herkesin kaydı. Her etkin üyeye açıktır (susturulmuş üye
        de okur); iptal edilmiş ve donmuş etkinlikte de okunur. Bileşen
        uçlarının ortak kuralları geçerlidir (`component-not-found`,
        `component-disabled`).
      responses:
        "200":
          description: Yoklama
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EventRollCall" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }

  /v1/tayfas/{tayfa_id}/events/{event_id}/components/{component_key}/roll-call/expected-return:
    parameters:
      - $ref: "#/components/parameters/TayfaID"
      - $ref: "#/components/parameters/EventID"
      - $ref: "#/components/parameters/ComponentKey"
    put:
      operationId: setEventRollCallExpectedReturn
      summary: Beklenen dönüşü yazar ya da kaldırır (organizatör, moderatör, yönetici)
      description: |
        `expected_return_at` etkinliğin başlangıcından sonra olmalıdır
        (`invalid-request`); alan yoksa ya da `null` ise plan kaldırılır
        (alarm kurulmaz). Olmayan
        planı kaldırmak hata değildir. Etkinlik başladıktan ve bittikten
        sonra da değişir; bitişten 7 gün sonra donar (`component-frozen`).
        Seriye ait etkinlikte yalnızca bu etkinlik değişir; serinin yeni
        örnekleri şablonun beklenen dönüşünü kendi başlangıçlarına göre
        kaydırarak alır. Bileşen uçlarının ortak kuralları geçerlidir.
      parameters:
        - $ref: "#/components/parameters/ClientHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RollCallPlanRequest" }
      responses:
        "200":
          description: Yoklama, güncel haliyle
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EventRollCall" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }

  /v1/tayfas/{tayfa_id}/events/{event_id}/components/{component_key}/roll-call/start:
    parameters:
      - $ref: "#/components/parameters/TayfaID"
      - $ref: "#/components/parameters/EventID"
      - $ref: "#/components/parameters/ComponentKey"
    post:
      operationId: startEventRollCall
      summary: Çıktığınızı kaydeder; katılım sayılır
      description: |
        Katılım `hike_start` yöntemiyle doğrulanır. `going` cevabı gerekir
        (`event-not-going`); başlangıçtan 30 dakika önceden bitişe kadar
        (`check-in-closed`). Susturulmuş üye de çıkabilir (güvenlik
        sinyali). Tekrar gönderim ilk çıkışı döndürür. Bileşen uçlarının
        ortak kuralları geçerlidir.
      parameters:
        - $ref: "#/components/parameters/ClientHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RollCallStartRequest" }
      responses:
        "200":
          description: Yoklama, güncel haliyle
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EventRollCall" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }

  /v1/tayfas/{tayfa_id}/events/{event_id}/components/{component_key}/roll-call/return:
