# Tayfam dış REST sözleşmesi (ADR-0003). Önce burası değişir, sonra kod.
openapi: 3.1.0
info:
  title: Tayfam API
  version: 0.1.0
  description: |
    gateway'in dışa açık uçları. İç servisler yalnızca gRPC konuşur.

    **Kimlik:** Mobil istemciler erişim token'ını `Authorization: Bearer`
    başlığıyla gönderir. Web istemcisinin token'ları JavaScript'in
    erişemeyeceği çerezlerdedir (ADR-0004): `tayfam_at` (erişim) ve yolu
    `/v1/auth/refresh` ile sınırlı `tayfam_rt` (refresh).

    **CSRF:** Durum değiştiren her istek (POST, PUT, PATCH, DELETE)
    `X-Tayfam-Client` başlığını taşır; değeri istemcinin adıdır (`android`,
    `ios`, `web`). Tarayıcılar bu başlığı başka bir siteden gelen formlara
    ekleyemez.

    **Hatalar:** RFC 9457 `application/problem+json`. `type` alanı makine
    tarafından okunur: `https://tayfam.app/problems/<kod>`. `title` ve
    `detail` kullanıcıya gösterilmez; istemci kodu çeviri dosyasında arar.

    **Sayfalama:** Liste uçları `page_size` (0–100; 0 = 50) ve `page_token`
    alır. `next_page_token` opaktır: istemci onu çözmez, yalnızca aynı uca
    aynı parametrelerle geri gönderir. Alan yoksa son sayfadır.

    **Tayfa kapsamı:** Etkin üyesi olmadığınız bir tayfa, var olmayan bir
    tayfa ile aynı cevabı alır (`tayfa-not-found`); tayfanın varlığı sızmaz.

    **Gizli değerler URL'de taşınmaz:** Katılım kodu ve davet token'ı yalnızca
    istek gövdesinde gönderilir; erişim log'larına, tarayıcı geçmişine ve
    `Referer` başlığına düşmez. Davet önizlemesi bu yüzden POST'tur.

    **Bilinmeyen değerler:** Yanıtlardaki enum alanlarına ileride yeni değer
    eklenebilir; gateway'in tanımadığı bir değer `unknown` olarak döner.
    İstemci tanımadığı değeri yok sayar.
servers:
  - url: https://api-dev.tayfam.app
    description: dev (ev cluster'ı)

paths:
  /v1/status:
    get:
      operationId: getStatus
      summary: Servislerin erişilebilirliği
      security: []
      responses:
        "200":
          description: Durum
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Status" }

  /v1/auth/sign-in:
    post:
      operationId: signIn
      summary: Google (ileride Apple) ID token'ı ile giriş
      description: |
        Kullanıcı yoksa oluşturulur ve kayıt bekler (`registration_pending`).
        Bu durumdaki erişim token'ı yalnızca `/v1/registration` uçlarına
        geçer (ADR-0012). `platform` `web` ise token'lar gövdede değil
        çerezlerde döner.
      security: []
      parameters:
        - $ref: "#/components/parameters/ClientHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SignInRequest" }
      responses:
        "200":
          description: Oturum açıldı
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }

  /v1/auth/refresh:
    post:
      operationId: refresh
      summary: Refresh token ile yeni token çifti
      description: |
        Refresh token her kullanımda yenilenir; eski token geçersiz olur.
        Kullanılmış bir token tekrar gelirse oturum tamamen kapanır.
        Mobil istemci token'ı gövdede, web istemcisi `tayfam_rt` çerezinde
        gönderir.
      security: []
      parameters:
        - $ref: "#/components/parameters/ClientHeader"
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RefreshRequest" }
      responses:
        "200":
          description: Yeni token'lar
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
        "401": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/Problem" }

  /v1/auth/sign-out:
    post:
      operationId: signOut
      summary: Bu cihazdaki oturumu kapatır
      parameters:
        - $ref: "#/components/parameters/ClientHeader"
      responses:
        "204": { description: Oturum kapandı; web çerezleri silindi }
        "401": { $ref: "#/components/responses/Problem" }

  /v1/registration/requirements:
    get:
      operationId: getRegistrationRequirements
      summary: Onaylanacak belge sürümleri ve yaş sınırı
      responses:
        "200":
          description: Gereksinimler
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RegistrationRequirements" }
        "401": { $ref: "#/components/responses/Problem" }

  /v1/registration:
    post:
      operationId: completeRegistration
      summary: Kaydı tamamlar (doğum tarihi, onaylar, ad)
      description: |
        Başarılı olunca istemci `/v1/auth/refresh` çağırır ve tam erişim
        token'ı alır. Yaş sınırının altındaki bir doğum tarihi hesabı kalıcı
        olarak kapatır (`age-blocked`) ve oturumları sonlandırır.
      parameters:
        - $ref: "#/components/parameters/ClientHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RegistrationRequest" }
      responses:
        "204": { description: Kayıt tamamlandı }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }

  # --- Hesap (identity AccountService, issue #75) ---

  /v1/me:
    delete:
      operationId: deleteAccount
      summary: Hesabınızı siler (KVKK)
      description: |
        **Yeniden kimlik doğrulama:** Son 10 dakika içinde Google/Apple ile
        giriş yapılmış olmalıdır; hem erişim token'ı hem de oturumu o
        girişten gelmelidir. `/v1/auth/refresh` ile yenilenmiş bir token
        yetmez. Değilse `403 reauthentication-required`: istemci kullanıcıyı
        sağlayıcıyla yeniden giriş yaptırır (`/v1/auth/sign-in`) ve yeni
        token'la tekrar dener.

        Kişisel bilgiler (ad, profil fotoğrafı, doğum tarihi, referans kodu)
        hemen silinir; tüm cihazlardaki oturumlar kapanır, tayfalardan
        çıkılır. İçerikler kalır, yazarı "Silinmiş kullanıcı" görünür. Kayıt
        30 gün sonra tamamen silinir; geri alma yoktur. Aynı Google/Apple
        hesabıyla sonraki giriş yeni bir hesap açar. Web çerezleri silinir.

        Erişim token'ı iptal edilemez (ADR-0004): kalan ömrü boyunca (en
        fazla 15 dakika) hesap uçları onu reddeder, tayfa uçları üyelik
        kalmadığı için reddeder.
      parameters:
        - $ref: "#/components/parameters/ClientHeader"
      responses:
        "204": { description: Hesap silindi; web çerezleri silindi }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }

  /v1/me/sessions:
    get:
      operationId: listSessions
      summary: Açık oturumlarınız (cihaz başına bir oturum)
      description: |
        En son kullanılan önce, en fazla 100. IP adresi ve token dönmez.
        `current` bu isteğin oturumudur. Kapatılmış bir oturumun token'ı
        oturum uçlarında `401` alır.
      responses:
        "200":
          description: Oturumlar
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeviceSessionList" }
        "401": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }

  /v1/me/sessions/{session_id}:
    parameters:
      - $ref: "#/components/parameters/SessionID"
    delete:
      operationId: revokeSession
      summary: Bir oturumu kapatır (uzaktan çıkış)
      description: |
        O cihazın refresh token'ı hemen geçersiz olur; erişim token'ı en
        fazla 15 dakika daha geçerli kalabilir (ADR-0004). Kendi oturumunuzu
        kapatmak çıkış yapmaktır (çerezler silinmez; web için
        `/v1/auth/sign-out` kullanılır). Başka kullanıcının, bilinmeyen ya da
        zaten kapalı oturum aynı cevabı alır (`session-not-found`).
      parameters:
        - $ref: "#/components/parameters/ClientHeader"
      responses:
        "204": { description: Oturum kapandı }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }

  /v1/me/sessions/sign-out-others:
    post:
      operationId: revokeOtherSessions
      summary: Bu oturum dışındaki tüm oturumları kapatır
      parameters:
        - $ref: "#/components/parameters/ClientHeader"
      responses:
        "200":
          description: Kapatılan oturum sayısı
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RevokedSessions" }
        "401": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }

  /v1/me/consents:
    get:
      operationId: getConsents
      summary: Güncel metin sürümleri ve onay durumunuz
      description: |
        Aydınlatma metni veya kullanım koşulları yeni sürümle yayınlanınca
        `consent_required` true olur (giriş ve yenileme yanıtında da döner).
        İstemci yeni metinleri gösterir ve `POST /v1/me/consents` ile onaylar.
      responses:
        "200":
          description: Onay durumu
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConsentStatus" }
        "401": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
    post:
      operationId: acceptConsents
      summary: Güncel metin sürümlerini onaylar
      description: |
        Gösterilen sürümler gönderilir; güncel değillerse `409
        consent-outdated` (ekran açıkken yeni sürüm yayınlanmış olabilir).
        Onaylar yalnızca eklenir; aynı sürüm tekrar onaylanınca bir şey
        değişmez.
      parameters:
        - $ref: "#/components/parameters/ClientHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ConsentRequest" }
      responses:
        "204": { description: Onaylandı }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }

  # --- Tayfalar (core TayfaService) ---

  /v1/tayfas:
    get:
      operationId: listMyTayfas
      summary: Etkin üyelikleriniz ve bekleyen katılım istekleriniz
      description: |
        En yeniden eskiye. Bekleyen bir istekte yalnızca `tayfa_id` ve `name`
        dolu gelir; `tayfa` alanı yalnızca etkin üyelikte vardır.
      parameters:
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/PageToken"
      responses:
        "200":
          description: Tayfalar
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MyTayfaList" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
    post:
      operationId: createTayfa
      summary: Yeni tayfa açar; açan kişi tek yöneticisidir
      description: |
        Kullanıcı başına 24 saatte 1 (`tayfa-create-limit`, core) ve IP başına
        saatte 1 (`rate-limited`, gateway). Aynı `client_request_id` ile
        tekrar gönderim ilk açılan tayfayı döndürür ve yeni tayfa açmaz;
        aynı IP'den aynı `client_request_id` ile yapılan tekrar IP sınırına
        takılmaz. Bütün modüller açık başlar.
      parameters:
        - $ref: "#/components/parameters/ClientHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TayfaCreateRequest" }
      responses:
        "201":
          description: Tayfa açıldı (ya da tekrar gönderimde ilk açılan)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Tayfa" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }

  /v1/tayfas/{tayfa_id}:
    parameters:
      - $ref: "#/components/parameters/TayfaID"
    get:
      operationId: getTayfa
      summary: Tayfanın tam görünümü ve sizin rolünüz
      description: |
        Yalnızca etkin üyelere. `caller_role` istemcinin doğru işlemleri
        göstermesi içindir; sunucu her istekte yetkiyi yeniden kontrol eder.
      responses:
        "200":
          description: Tayfa
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TayfaView" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
    patch:
      operationId: updateTayfa
      summary: Tayfa ayarlarını değiştirir (yönetici)
      description: |
        Yalnızca gövdede bulunan alanlar değişir; en az bir alan gerekir.
        `interests` gönderilirse ilgi alanlarının tamamını değiştirir.
        `members_can_create_events` etkinlik açma iznini üyelere açar ya da
        kapatır.
      parameters:
        - $ref: "#/components/parameters/ClientHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TayfaUpdateRequest" }
      responses:
        "200":
          description: Güncel tayfa
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Tayfa" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }

  /v1/tayfas/{tayfa_id}/modules/{module}:
    parameters:
      - $ref: "#/components/parameters/TayfaID"
      - name: module
        in: path
        required: true
        schema: { $ref: "#/components/schemas/Module" }
    put:
      operationId: setTayfaModule
      summary: Bir modülü açar ya da kapatır (yönetici)
      description: Mevcut değeri tekrar vermek başarılıdır ve bir şey değiştirmez.
      parameters:
        - $ref: "#/components/parameters/ClientHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ModuleUpdate" }
      responses:
        "204": { description: Modül ayarlandı }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }

  /v1/tayfas/{tayfa_id}/join-code:
    parameters:
      - $ref: "#/components/parameters/TayfaID"
    post:
      operationId: rotateJoinCode
      summary: Katılım kodunu yeniler (yönetici); eski kod hemen geçersiz olur
      description: |
        Mevcut kod `GET /v1/tayfas/{tayfa_id}` yanıtında yalnızca yöneticiye
        döner.
      parameters:
        - $ref: "#/components/parameters/ClientHeader"
      responses:
        "200":
          description: Yeni kod
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JoinCode" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }

  /v1/tayfas/{tayfa_id}/deletion:
    parameters:
      - $ref: "#/components/parameters/TayfaID"
    post:
      operationId: requestTayfaDeletion
      summary: Tayfayı 72 saat sonra silinmek üzere işaretler (yönetici)
      description: Silinene kadar tayfa salt okunurdur; herhangi bir yönetici iptal edebilir.
      parameters:
        - $ref: "#/components/parameters/ClientHeader"
      responses:
        "202":
          description: Silme planlandı
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Deletion" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
    delete:
      operationId: cancelTayfaDeletion
      summary: Bekleyen silmeyi iptal eder (yönetici)
      parameters:
        - $ref: "#/components/parameters/ClientHeader"
      responses:
        "204": { description: Silme iptal edildi }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }

  # --- Üyelik (core MembershipService) ---

  /v1/tayfas/{tayfa_id}/membership:
    parameters:
      - $ref: "#/components/parameters/TayfaID"
    delete:
      operationId: leaveTayfa
      summary: Tayfadan ayrılır ya da bekleyen katılım isteğini geri çeker
      description: |
        Salt okunur tayfada da çalışır. Son yönetici ayrılamaz
        (`last-admin`). Banlanmış üyelik bırakılamaz (`tayfa-not-found`).
      parameters:
        - $ref: "#/components/parameters/ClientHeader"
      responses:
        "204": { description: Ayrıldınız }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }

  /v1/tayfas/{tayfa_id}/members:
    parameters:
      - $ref: "#/components/parameters/TayfaID"
    get:
      operationId: listMembers
      summary: Üyeleri listeler
      description: |
        `status=active` (varsayılan) her etkin üyeye açıktır; `status=banned`
        yalnızca moderatör ve yöneticiye. Sıra: rol (yönetici önce), katılma
        zamanı. Katılım istekleri için `/join-requests`.
      parameters:
        - name: status
          in: query
          required: false
          schema: { type: string, enum: [active, banned], default: active }
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/PageToken"
      responses:
        "200":
          description: Üyeler
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MemberList" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }

  /v1/tayfas/{tayfa_id}/members/{user_id}:
    parameters:
      - $ref: "#/components/parameters/TayfaID"
      - $ref: "#/components/parameters/UserID"
    patch:
      operationId: changeMemberRole
      summary: Etkin bir üyenin rolünü değiştirir (yönetici)
      description: |
        Hedefin rolü sizinkinden düşük olmalı, yeni rol sizinkinden yüksek
        olamaz (`role-hierarchy`). Kendi rolünüzü düşürebilirsiniz; son
        yönetici düşüremez (`last-admin`).
      parameters:
        - $ref: "#/components/parameters/ClientHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RoleUpdate" }
      responses:
        "200":
          description: Güncel üyelik
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Membership" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
    delete:
      operationId: removeMember
      summary: Etkin bir üyeyi tayfadan çıkarır (moderatör, yönetici)
      description: Çıkarılan kişi daha sonra tekrar katılabilir. Kendiniz için `/membership`.
      parameters:
        - $ref: "#/components/parameters/ClientHeader"
      responses:
        "204": { description: Üye çıkarıldı }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }

  /v1/tayfas/{tayfa_id}/members/{user_id}/mute:
    parameters:
      - $ref: "#/components/parameters/TayfaID"
      - $ref: "#/components/parameters/UserID"
    put:
      operationId: muteMember
      summary: Üyeyi belirli bir zamana kadar susturur (moderatör, yönetici)
