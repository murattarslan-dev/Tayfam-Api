version: 2
# Güncellemeler ekosistem başına tek PR'da toplanır. Bütün iş PR'ları gibi
# dev'e açılır (ADR-0034); prod'a sürüm PR'ıyla gider.
updates:
  - package-ecosystem: gomod
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
    groups:
      go:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
    groups:
      docker:
        patterns: ["*"]
