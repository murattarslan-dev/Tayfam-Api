name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Biçim
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test -race -count=1 -coverprofile=coverage.out ./...

  lint:
    name: Lint (servis sınırları ve gosec dahil)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0

  security:
    name: Güvenlik
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read # gitleaks, PR'daki commit'leri listelemek için
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: govulncheck
        uses: golang/govulncheck-action@v1
        with:
          go-version-file: go.mod
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  contracts:
    name: Sözleşmeler (proto)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # proto/ henüz yokken bu adım atlanır; ilk .proto dosyasıyla devreye girer.
      - if: ${{ hashFiles('proto/**/*.proto') != '' }}
        uses: bufbuild/buf-action@v1
        with:
          breaking_against: https://github.com/${{ github.repository }}.git#branch=main
          push: false

  images:
    name: Image (${{ matrix.service }})
    runs-on: ubuntu-latest
    needs: [test, lint, security]
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service: [gateway, identity, core, chat]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: GHCR girişi
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Derle (main'de ayrıca gönder)
        uses: docker/build-push-action@v7
        with:
          context: .
          build-args: |
            SERVICE=${{ matrix.service }}
            VERSION=${{ github.sha }}
          push: ${{ github.event_name == 'push' }}
          tags: ghcr.io/${{ github.repository_owner }}/tayfam-${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  manifests:
    name: Manifestler
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Kustomize derlemesi
        run: |
          kubectl kustomize deploy/apps/dev > /dev/null
          kubectl kustomize deploy/clusters/home > /dev/null

  # main'deki her commit'ten sonra dev manifestlerini o commit'in image
  # etiketleriyle OCI artifact olarak yayınlar; ev cluster'ındaki Flux
  # "dev" etiketini izler (ADR-0006). CI'da cluster erişim yetkisi yoktur.
  deploy-dev:
    name: Dev dağıtımı
    runs-on: ubuntu-latest
    needs: [images, manifests]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    env:
      ARTIFACT: oci://ghcr.io/${{ github.repository_owner }}/tayfam-deploy
    steps:
      - uses: actions/checkout@v7
      - uses: fluxcd/flux2/action@main
      - name: Image etiketlerini commit SHA'sına ayarla
        run: |
          sed -i "s/newTag: .*/newTag: ${GITHUB_SHA}/" deploy/apps/dev/kustomization.yaml
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Artifact'ı yayınla ve dev olarak etiketle
        run: |
          flux push artifact "${ARTIFACT}:${GITHUB_SHA}" \
            --path=./deploy \
            --source="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --revision="${GITHUB_REF_NAME}@sha1:${GITHUB_SHA}"
          flux tag artifact "${ARTIFACT}:${GITHUB_SHA}" --tag dev
