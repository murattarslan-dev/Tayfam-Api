name: CI

# Tüm Actions commit SHA'sıyla sabitlenmiştir (CLAUDE.md kural 9, ADR-0011).
# Yorumdaki sürüm yalnızca okunabilirlik içindir; Dependabot ikisini birlikte günceller.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
      - name: Bağımlılıklar güncel (go.mod, go.sum)
        run: |
          go mod tidy
          if ! git diff --exit-code -- go.mod go.sum; then
            echo "::error::go.mod veya go.sum güncel değil; 'go mod tidy' çalıştırıp commit et."
            echo "----- beklenen go.mod -----"; cat go.mod
            echo "----- beklenen go.sum -----"; cat go.sum
            exit 1
          fi
      - name: Biçim
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test -race -count=1 -coverprofile=coverage.out ./...
      - name: Betik testleri
        run: ./scripts/pin-images_test.sh

  lint:
    name: Lint (servis sınırları ve gosec dahil)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0

  security:
    name: Güvenlik
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read # gitleaks, PR'daki commit'leri listelemek için
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
      - name: govulncheck
        uses: golang/govulncheck-action@032d45514ae346b1db93c04b0c90b841c370344f # v1.1.0
        with:
          go-version-file: go.mod
      - name: gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  contracts:
    name: Sözleşmeler (proto)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # main'de henüz sözleşme yoksa karşılaştırılacak bir şey de yoktur; ilk
      # proto main'e girdikten sonra breaking kontrolü kendiliğinden açılır.
      - name: main'de sözleşme var mı
        id: base
        run: |
          git fetch --quiet --depth=1 origin main
          if git cat-file -e origin/main:buf.yaml 2>/dev/null; then
            echo "has_proto=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_proto=false" >> "$GITHUB_OUTPUT"
          fi
      # lint, biçim ve main'e göre geriye uyumluluk (breaking) kontrolü
      - uses: bufbuild/buf-action@37ac33d8960807670a6e9719080e885197b09cc6 # v1.7.0
        with:
          breaking: ${{ steps.base.outputs.has_proto == 'true' && github.event_name == 'pull_request' }}
          breaking_against: https://github.com/${{ github.repository }}.git#branch=main
          push: false
          # Sonuçlar iş çıktısında; PR yorumu için yazma izni verilmez.
          pr_comment: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
      # Üretilen kod commit edilir (ADR-0003); proto ile uyumsuzsa iş kırılır.
      - name: Üretilen kod güncel mi
        run: |
          rm -rf gen
          buf generate
          if [ -n "$(git status --porcelain gen)" ]; then
            echo "::error::gen/ proto ile uyumsuz; make generate çalıştırıp commit et"
            git status --porcelain gen
            git diff gen | head -100
            exit 1
          fi

  images:
    name: Image (${{ matrix.service }})
    runs-on: ubuntu-latest
    needs: [test, lint, security]
    permissions:
      contents: read
      packages: write
      id-token: write # cosign keyless imza (yalnızca main'de kullanılır)
    strategy:
      fail-fast: false
      matrix:
        service: [gateway, identity, core, chat]
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/tayfam-${{ matrix.service }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: GHCR girişi
        if: github.event_name == 'push'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Derle (main'de ayrıca gönder)
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          build-args: |
            SERVICE=${{ matrix.service }}
            VERSION=${{ github.sha }}
          push: ${{ github.event_name == 'push' }}
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        if: github.event_name == 'push'
      - name: Image'ı imzala
        if: github.event_name == 'push'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

  manifests:
    name: Manifestler
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Kustomize derlemesi
        run: |
          kubectl kustomize deploy/apps/dev > /dev/null
          kubectl kustomize deploy/clusters/home > /dev/null

  # main'deki her commit'ten sonra dev manifestlerini, o commit'in image'larına
  # digest ile sabitleyerek OCI artifact olarak yayınlar ve imzalar. Ev
  # cluster'ındaki Flux "dev" etiketini izler ve yalnızca bu iş akışının main'de
  # attığı imzayı kabul eder (ADR-0006, ADR-0011). CI'da cluster erişim yetkisi yoktur.
  deploy-dev:
    name: Dev dağıtımı
    runs-on: ubuntu-latest
    needs: [images, manifests]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
      id-token: write # cosign keyless imza
    env:
      REGISTRY: ghcr.io/${{ github.repository_owner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: fluxcd/flux2/action@3fa784edd773d56630bb9f62645e08f70c2cff0a # v2.10.0
        with:
          version: 2.10.0
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image'ları digest ile sabitle
        run: |
          pins=()
          for s in gateway identity core chat; do
            digest=$(docker buildx imagetools inspect "${REGISTRY}/tayfam-${s}:${GITHUB_SHA}" --format '{{json .Manifest}}' | jq -r .digest)
            pins+=("${s}=${digest}")
          done
          ./scripts/pin-images.sh deploy/apps/dev/kustomization.yaml "${pins[@]}"
          sed -n '/^images:/,$p' deploy/apps/dev/kustomization.yaml
      - name: Artifact'ı yayınla, imzala ve dev olarak etiketle
        run: |
          artifact="${REGISTRY}/tayfam-deploy"
          flux push artifact "oci://${artifact}:${GITHUB_SHA}" \
            --path=./deploy \
            --source="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --revision="${GITHUB_REF_NAME}@sha1:${GITHUB_SHA}"
          # cosign etiketi digest'e çözer ve digest'i imzalar.
          cosign sign --yes "${artifact}:${GITHUB_SHA}"
          # İmza atıldıktan sonra etiketlenir; Flux imzasız bir "dev" görmez.
          flux tag artifact "oci://${artifact}:${GITHUB_SHA}" --tag dev
