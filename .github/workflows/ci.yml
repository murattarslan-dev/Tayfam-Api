name: CI

# Tüm Actions commit SHA'sıyla sabitlenmiştir (CLAUDE.md kural 9, ADR-0011).
# Yorumdaki sürüm yalnızca okunabilirlik içindir; Dependabot ikisini birlikte günceller.

# Dal modeli (ADR-0034): iş PR'ları dev'e squash ile, sürüm PR'ı dev'den
# main'e merge commit ile birleşir. dev'de yalnızca kontroller çalışır; hiçbir
# şey yayınlanmaz, imzalanmaz, dağıtılmaz. main prod'dur: image'lar ve dev
# artifact'ı yalnızca main'de yayınlanıp imzalanır, ardından sürüm etiketi
# otomatik atılır ve prod iş akışı başlatılır.
on:
  pull_request:
  push:
    branches: [dev, main]

permissions:
  contents: read

# PR'larda yeni push eski çalışmayı iptal eder. dev ve main'de iptal edilmez:
# main'de art arda birleşen sürüm PR'larında öndekinin yayını ve etiketi
# kaybolmasın; aynı gruptaki çalışmalar sırayla biter, etiketler commit
# sırasıyla artar ve en son yayınlanan paket en son commit'inkidir.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    # store testleri gerçek Postgres'e karşı çalışır (CLAUDE.md). Her test
    # kendi geçici veritabanını oluşturup siler (internal/platform/db/dbtest).
    # Parola yalnızca bu iş için açılan, iş bitince yok olan container'a aittir.
    services:
      postgres:
        image: postgres:18.6-trixie
        env:
          POSTGRES_PASSWORD: ci
          POSTGRES_INITDB_ARGS: "--locale-provider=icu --icu-locale=tr-TR --locale=C.UTF-8"
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      TEST_DATABASE_URL: postgres://postgres:ci@127.0.0.1:5432/postgres?sslmode=disable
      # Veritabanı testleri CI'da atlanamaz.
      REQUIRE_TEST_DATABASE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Bağımlılıklar güncel (go.mod, go.sum)
        run: |
          go mod tidy
          if ! git diff --exit-code -- go.mod go.sum; then
            echo "::error::go.mod veya go.sum güncel değil; 'go mod tidy' çalıştırıp commit et."
            echo "----- beklenen go.mod -----"; cat go.mod
            echo "----- beklenen go.sum -----"; cat go.sum
            exit 1
          fi
      - name: Biçim
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test -race -count=1 -coverprofile=coverage.out ./...
      - name: Betik testleri
        run: |
          ./scripts/pin-images_test.sh
          ./scripts/secrets_test.sh

  lint:
    name: Lint (servis sınırları ve gosec dahil)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0

  security:
    name: Güvenlik
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read # gitleaks, PR'daki commit'leri listelemek için
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: govulncheck
        uses: golang/govulncheck-action@032d45514ae346b1db93c04b0c90b841c370344f # v1.1.0
        with:
          go-version-file: go.mod
      - name: gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  contracts:
    name: Sözleşmeler (proto)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Geriye uyumluluk PR'ın hedef dalına göre ölçülür: iş PR'ları dev'e,
      # sürüm PR'ı main'e (prod'daki sözleşmeye) karşı (ADR-0034). Hedefte
      # henüz sözleşme yoksa karşılaştırılacak bir şey de yoktur.
      - name: Hedef dalda sözleşme var mı
        id: base
        env:
          BASE: ${{ github.base_ref || github.ref_name }}
        run: |
          git fetch --quiet --depth=1 origin "$BASE"
          if git cat-file -e FETCH_HEAD:buf.yaml 2>/dev/null; then
            echo "has_proto=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_proto=false" >> "$GITHUB_OUTPUT"
          fi
      # lint, biçim ve hedef dala göre geriye uyumluluk (breaking) kontrolü
      - uses: bufbuild/buf-action@37ac33d8960807670a6e9719080e885197b09cc6 # v1.7.0
        with:
          breaking: ${{ steps.base.outputs.has_proto == 'true' && github.event_name == 'pull_request' }}
          breaking_against: https://github.com/${{ github.repository }}.git#branch=${{ github.base_ref || 'main' }}
          push: false
          # Sonuçlar iş çıktısında; PR yorumu için yazma izni verilmez.
          pr_comment: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # sqlc sürümleri checksum yayınlamaz; ilk indirmenin sha256'sı burada
      # sabitlenir (trust on first use). Değişirse iş kırılır.
      - name: sqlc
        if: ${{ hashFiles('sqlc.yaml') != '' }}
        run: |
          curl -sSfLO https://github.com/sqlc-dev/sqlc/releases/download/v1.31.1/sqlc_1.31.1_linux_amd64.tar.gz
          echo "497ae4fcdfa64c5b0c311ffe4c2bd991e43991e82e5367792ed78bc2dca27354  sqlc_1.31.1_linux_amd64.tar.gz" | sha256sum -c -
          tar xzf sqlc_1.31.1_linux_amd64.tar.gz sqlc
          sudo install -m 0755 sqlc /usr/local/bin/sqlc
          rm -f sqlc sqlc_1.31.1_linux_amd64.tar.gz
      # Üretilen kod commit edilir (ADR-0003); proto veya SQL ile uyumsuzsa iş
      # kırılır.
      - name: Üretilen kod güncel mi
        run: |
          rm -rf gen
          buf generate
          if [ -f sqlc.yaml ]; then
            sqlc vet
            sqlc generate
          fi
          if [ -n "$(git status --porcelain gen internal/*/store)" ]; then
            echo "::error::Üretilen kod güncel değil; make generate çalıştırıp commit et"
            git status --porcelain gen internal/*/store
            git diff gen internal/*/store | head -100
            exit 1
          fi

  images:
    name: Image (${{ matrix.service }})
    runs-on: ubuntu-latest
    needs: [test, lint, security]
    permissions:
      contents: read
      packages: write
      id-token: write # cosign keyless imza (yalnızca main'de kullanılır)
    strategy:
      fail-fast: false
      matrix:
        service: [gateway, identity, core, chat]
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/tayfam-${{ matrix.service }}
      # Yalnızca main'e push'ta gönderilir ve imzalanır. PR'larda ve dev'de
      # image yalnızca derlenir (ADR-0034); imza kimliği ci.yml@refs/heads/main.
      PUBLISH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: GHCR girişi
        if: env.PUBLISH == 'true'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Derle (main'de ayrıca gönder)
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          build-args: |
            SERVICE=${{ matrix.service }}
            VERSION=${{ github.sha }}
          push: ${{ env.PUBLISH == 'true' }}
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        if: env.PUBLISH == 'true'
      - name: Image'ı imzala
        if: env.PUBLISH == 'true'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

  manifests:
    name: Manifestler
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Kustomize derlemesi
        run: |
          kubectl kustomize deploy/apps/dev > /dev/null
          kubectl kustomize deploy/apps/prod > /dev/null
          kubectl kustomize deploy/infra > /dev/null
          kubectl kustomize deploy/clusters/home > /dev/null
          kubectl kustomize deploy/clusters/vds > /dev/null

  # main'deki (prod'a giden) her commit'ten sonra dev manifestlerini, o
  # commit'in image'larına digest ile sabitleyerek OCI artifact olarak yayınlar
  # ve imzalar. Ev cluster'ındaki Flux "dev" etiketini izler ve yalnızca bu iş
  # akışının main'de attığı imzayı kabul eder (ADR-0006, ADR-0011). Yeni dal
  # modelinde dev ortamı prod'dan hemen önce aynı commit'i alır; dev dalına
  # birleşme dağıtım yapmaz (ADR-0034). CI'da cluster erişim yetkisi yoktur.
  deploy-dev:
    name: Dev dağıtımı
    runs-on: ubuntu-latest
    needs: [images, manifests]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
      id-token: write # cosign keyless imza
    env:
      REGISTRY: ghcr.io/${{ github.repository_owner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: fluxcd/flux2/action@3fa784edd773d56630bb9f62645e08f70c2cff0a # v2.10.0
        with:
          version: 2.10.0
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image'ları digest ile sabitle
        run: |
          pins=()
          for s in gateway identity core chat; do
            digest=$(docker buildx imagetools inspect "${REGISTRY}/tayfam-${s}:${GITHUB_SHA}" --format '{{json .Manifest}}' | jq -r .digest)
            pins+=("${s}=${digest}")
          done
          ./scripts/pin-images.sh deploy/apps/dev/kustomization.yaml "${pins[@]}"
          # Yayına kadar VDS de main'i izler (ADR-0006 revizyon 2026-11-12).
          ./scripts/pin-images.sh deploy/apps/prod/kustomization.yaml "${pins[@]}"
          sed -n '/^images:/,$p' deploy/apps/dev/kustomization.yaml
      - name: Artifact'ı yayınla, imzala ve dev olarak etiketle
        run: |
          artifact="${REGISTRY}/tayfam-deploy"
          flux push artifact "oci://${artifact}:${GITHUB_SHA}" \
            --path=./deploy \
            --source="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --revision="${GITHUB_REF_NAME}@sha1:${GITHUB_SHA}"
          # cosign etiketi digest'e çözer ve digest'i imzalar.
          cosign sign --yes "${artifact}:${GITHUB_SHA}"
          # İmza atıldıktan sonra etiketlenir; Flux imzasız bir "dev" görmez.
          flux tag artifact "oci://${artifact}:${GITHUB_SHA}" --tag dev

  # main'e her birleşme prod'a gider (ADR-0034). Dev dağıtımı bittikten sonra
  # bu commit'e bir sonraki vX.Y.Z etiketi atılır ve prod iş akışı o etiket
  # üzerinde workflow_dispatch ile başlatılır. GITHUB_TOKEN ile atılan etiketin
  # push olayı iş akışı tetiklemez; workflow_dispatch bu kuralın belgelenmiş
  # istisnasıdır. Etiket ref'inde çalışan prod.yml'in imza kimliği yine
  # prod.yml@refs/tags/vX.Y.Z olur: PAT, uygulama anahtarı veya yeni secret
  # gerekmez, Flux'taki doğrulama kimliği değişmez.
  #
  # Ele geçirilirse: bu iş etiket ve dal oluşturabilir, iş akışı başlatabilir.
  # dev ve main kural setleriyle korunur; v* etiketleri taşınamaz ve silinemez
  # (etiket kural seti). Rastgele bir commit'e atılan etiketi prod.yml reddeder:
  # main'in birinci ebeveyn zincirinde olmalı ve dört image o commit için main
  # CI'ınca imzalanmış olmalı. Üçüncü taraf Action kullanılmaz (yalnızca checkout).
  release-tag:
    name: Sürüm etiketi
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [deploy-dev]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write # v* etiketini oluşturmak
      actions: write # prod.yml'i workflow_dispatch ile başlatmak
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # etiketler ve geçmiş
          persist-credentials: false
      - name: Etiketi at ve prod'u başlat
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          semver='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
          # Bu commit zaten etiketliyse (platform sahibi elle attıysa, onun
          # push'u prod.yml'i zaten başlattı) yeni etiket atılmaz.
          existing=$(git tag --points-at "$GITHUB_SHA" --list 'v*' | grep -E "$semver" | sort -V | tail -n1 || true)
          if [ -n "$existing" ]; then
            echo "::notice::$GITHUB_SHA zaten $existing etiketli; etiket atılmadı, prod.yml başlatılmadı. Gerekirse Actions → Prod sürümü → Run workflow → $existing."
            exit 0
          fi
          # Sürüm numarası: en yüksek vX.Y.Z'nin yaması bir artırılır
          # (ADR-0034). minor/major artışını platform sahibi elle etiketle yapar.
          last=$(git tag --list 'v*' | grep -E "$semver" | sort -V | tail -n1 || true)
          if [ -z "$last" ]; then
            version=v0.1.0
          else
            IFS=. read -r major minor patch <<< "${last#v}"
            version="v${major}.${minor}.$((patch + 1))"
          fi
          echo "Son sürüm: ${last:-yok} → yeni: $version ($GITHUB_SHA)"
          gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
            -f "ref=refs/tags/${version}" -f "sha=${GITHUB_SHA}" > /dev/null
          gh workflow run prod.yml --repo "$GITHUB_REPOSITORY" --ref "$version"
          echo "### Sürüm $version" >> "$GITHUB_STEP_SUMMARY"
          echo "Etiket $GITHUB_SHA'ya atıldı; \"Prod sürümü\" iş akışı başlatıldı." >> "$GITHUB_STEP_SUMMARY"
