name: Prod sürümü

# vX.Y.Z git etiketi prod'a dağıtılır (ADR-0006, ADR-0010). Yeniden derleme
# yoktur: etiketin gösterdiği main commit'i için CI'ın (ci.yml) zaten üretip
# imzaladığı image'lar digest ile sabitlenir, deploy/ OCI artifact olarak
# yayınlanır, imzalanır ve "prod" olarak etiketlenir. VDS'teki Flux yalnızca bu
# iş akışının refs/tags/v* ile attığı imzayı kabul eder
# (deploy/clusters/vds/tayfam-prod.yaml). CI cluster'a erişmez.
#
# Tüm Actions commit SHA'sıyla sabitlenmiştir (CLAUDE.md kural 9).

on:
  push:
    tags: ["v*.*.*"]

permissions: {}

# Sürümler sırayla yayınlanır; yarıda kesilen yayın "prod"u yarım bırakmasın.
concurrency:
  group: prod-surumu
  cancel-in-progress: false

jobs:
  release:
    name: Prod dağıtımı
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Zorunlu onaylayıcı ve "yalnızca v* etiketleri" kuralı GitHub'daki prod
    # ortamında tanımlanır (docs/runbooks/vds-kurulumu.md, adım i).
    environment: prod
    permissions:
      contents: read
      packages: write # tayfam-deploy artifact'ı ve etiketleri
      id-token: write # cosign keyless imza
    env:
      REGISTRY: ghcr.io/${{ github.repository_owner }}
      CI_IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/ci.yml@refs/heads/main
      OIDC_ISSUER: https://token.actions.githubusercontent.com
    steps:
      - name: Etiket biçimi (vX.Y.Z)
        run: |
          if [[ ! $GITHUB_REF =~ ^refs/tags/v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Yalnızca vX.Y.Z biçimindeki etiketler dağıtılır: $GITHUB_REF"
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # main'in geçmişi: etiketin main'de olduğunu doğrulamak için
          persist-credentials: false

      - name: Etiket main'deki bir commit'i gösteriyor
        id: commit
        run: |
          commit=$(git rev-parse "${GITHUB_REF}^{commit}")
          git fetch --quiet --no-tags origin +refs/heads/main:refs/remotes/origin/main
          # Birinci ebeveyn zinciri: main'in gerçekten işaret ettiği (squash ile
          # birleşmiş, CI'ı main'de çalışmış) commit'ler. Bir dalın main'e
          # birleşmiş ara commit'leri kabul edilmez.
          if ! git rev-list --first-parent origin/main | grep -qx "$commit"; then
            echo "::error::$GITHUB_REF_NAME, main'in birinci ebeveyn zincirinde olmayan bir commit'i gösteriyor ($commit). Etiket main'deki bir commit'e atılır."
            exit 1
          fi
          echo "sha=$commit" >> "$GITHUB_OUTPUT"
          echo "$GITHUB_REF_NAME → $commit"

      - uses: fluxcd/flux2/action@3fa784edd773d56630bb9f62645e08f70c2cff0a # v2.10.0
        with:
          version: 2.10.0
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Image'lar yeniden derlenmez. Her biri, bu commit için main CI'ında
      # üretilmiş ve o çalışmanın imzasını taşıyor olmalı; yoksa sürüm durur.
      - name: Image'ları doğrula ve digest ile sabitle
        env:
          COMMIT: ${{ steps.commit.outputs.sha }}
        run: |
          pins=()
          for s in gateway identity core chat; do
            ref="${REGISTRY}/tayfam-${s}:${COMMIT}"
            if ! digest=$(docker buildx imagetools inspect "$ref" --format '{{json .Manifest}}' 2>/dev/null | jq -er .digest); then
              echo "::error::$ref bulunamadı. Bu commit için main'deki CI (Image işleri) tamamlanmamış ya da başarısız; önce onun bitmesini bekleyin."
              exit 1
            fi
            if ! cosign verify "${REGISTRY}/tayfam-${s}@${digest}" \
                --certificate-identity "$CI_IDENTITY" \
                --certificate-oidc-issuer "$OIDC_ISSUER" \
                --certificate-github-workflow-sha "$COMMIT" > /dev/null; then
              echo "::error::tayfam-${s}@${digest} bu commit'in main CI'ınca imzalanmamış."
              exit 1
            fi
            pins+=("${s}=${digest}")
          done
          ./scripts/pin-images.sh deploy/apps/prod/kustomization.yaml "${pins[@]}"
          sed -n '/^images:/,$p' deploy/apps/prod/kustomization.yaml

      - name: Manifestler ve secret'lar tam
        run: |
          kubectl kustomize deploy/apps/prod > /dev/null
          # Overlay'de olmayan bir secret'a başvuran pod prod'da başlamaz.
          ./scripts/check-secret-refs.sh prod

      - name: Artifact'ı yayınla, imzala ve prod olarak etiketle
        env:
          COMMIT: ${{ steps.commit.outputs.sha }}
        run: |
          artifact="${REGISTRY}/tayfam-deploy"
          flux push artifact "oci://${artifact}:${GITHUB_REF_NAME}" \
            --path=./deploy \
            --source="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --revision="${GITHUB_REF_NAME}@sha1:${COMMIT}"
          # cosign etiketi digest'e çözer ve digest'i imzalar.
          cosign sign --yes "${artifact}:${GITHUB_REF_NAME}"
          # İmza atıldıktan sonra etiketlenir; Flux imzasız bir "prod" görmez.
          flux tag artifact "oci://${artifact}:${GITHUB_REF_NAME}" --tag prod
